# netpol stg 환경값 — 정책이 가리키는 대상.
#
# 이 환경은 입구가 ALB 이고 MySQL·Redis 가 관리형이라 클러스터 밖에 있다.
#   셋 다 쿠버네티스 객체가 아니라 VPC 안의 ENI 라 라벨이 없다. 셀렉터는 매칭된 파드의
#   IP 목록으로 바뀌는데 그 목록이 비면 규칙이 아무것도 안 연다 — 그래서 ipBlock 으로 적는다.
#
# 대역은 노드·파드가 앉는 서브넷 둘이다. cidrsubnet(10.20.0.0/16, 4, 0)·(…, 1).
#   프라이빗 서브넷을 안 만들어서(NAT Gateway 요금) 관리형 둘도 같은 대역에 앉는다.
#   /32 로 좁히지 않은 이유는 그 주소를 만들기 전에 모르고, 재생성되면 바뀌기 때문이다.
#   좁히는 실효는 포트가 맡는다 — 이 대역에서 3306·6379 를 여는 것이 관리형 둘뿐이다.
#   ★ 무너지는 조건 — 이 환경에 그 포트를 여는 파드가 생기면 규칙이 그것까지 연다.
#
# 더 정확한 층은 보안 그룹이다. ALB 는 집 공인 IP 와 부하 발생기에서만 80 을 받고,
#   RDS·ElastiCache 는 노드 보안 그룹에서 오는 것만 받는다.
#   이 정책이 맡는 것은 그 안에서 "app 의 어느 파드가" 를 가르는 일이다 —
#   보안 그룹은 노드 단위라 같은 노드의 다른 파드를 못 가른다.

ingressSource:
  - ipBlock: {cidr: 10.20.0.0/20}
  - ipBlock: {cidr: 10.20.16.0/20}

# Grafana 전용 Ingress 가 만든 ALB. frontend 것과 다른 ALB 지만 같은 서브넷에 앉는다.
grafanaSource:
  - ipBlock: {cidr: 10.20.0.0/20}
  - ipBlock: {cidr: 10.20.16.0/20}

mysql:
  inCluster: false                                    # RDS. data 네임스페이스에 파드가 없다
  peers:
    - ipBlock: {cidr: 10.20.0.0/20}
    - ipBlock: {cidr: 10.20.16.0/20}
  ports: [3306]

redis:
  inCluster: false                                    # ElastiCache
  peers:
    - ipBlock: {cidr: 10.20.0.0/20}
    - ipBlock: {cidr: 10.20.16.0/20}
  # Sentinel 이 없다. 단일 엔드포인트라 6379 하나다 — 26379 를 열 이유가 없다.
  ports: [6379]

# 데모용 CronJob 은 이 환경에 없다. 부하 판을 돌리는 자리라 좌석을 주기적으로 비울 이유가 없다.
demoReset: false

# 알림을 안 쓰기로 해서 렌더러도 안 띄운다.
imageRenderer: false
