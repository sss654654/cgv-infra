# queue stg 환경값. dev 와 다른 값만 정의(delta).
#
# dev 와 갈리는 것이 셋이다.
#   1 연결   Redis 가 Sentinel HA(파드)에서 ElastiCache(클러스터 밖 단일 엔드포인트)로 바뀐다
#   2 스펙   노드가 m5.xlarge 라 limit 을 예상치에 안 붙인다 — 부하에서 무엇이 먼저 막히는지
#            지목하는 것이 목적이고, limit 에서 막히면 지목한 것이 시스템이 아니라 이 숫자다
#   3 동작   dev 값 일부가 공개 데모용이라 부하 스펙과 다르다(MAX_SESSIONS·PROCESSING_BATCH_SIZE)

image:
  tag: 670aac42 # 켜는 날 ECR 에 올린 커밋 해시(cgv-onprem main 186df8d7, 2026-09-12). 그 뒤로는 image-updater 가 덮는다
# 노드에 이미지를 받아오는 자격. stg 는 ECR 이고 노드 역할로 인증하므로 필요 없다.
# 빈 배열로 덮지 않으면 apps/queue 의 gitlab-registry 가 그대로 내려온다.
imagePullSecrets: []
# ALB 대상그룹 헬스체크 경로. 한 Ingress(envs/stg/frontend.yaml)가 세 서비스로 가르고,
#   Ingress 에 적은 / 는 frontend 의 준비 경로다. 대상그룹마다 자기 서비스의 준비 경로를 봐야
#   준비 안 된 파드가 빠진다 — 이 값이 없으면 queue 대상그룹도 / 로 검사한다.
#   readinessProbe 와 같은 경로라 종료 중(503)인 파드를 kubelet 과 ALB 가 같은 기준으로 뺀다.
service:
  annotations:
    alb.ingress.kubernetes.io/healthcheck-path: /health/ready
resources:
  # request 는 실사용에 맞춘다 — 5만 기준 파드당 0.39 코어.
  #   3만 판이 무너진 원인이 request(320Mi)와 실사용(1.7GB)의 괴리였다.
  # limit 은 예상치에 안 붙인다.
  #   메모리 예상은 파드당 약 190Mi(3만에서 225.6Mi)인데 1Gi 로 둔다.
  #        연결 수 예측이 크게 빗나간 적이 있어서다 — 3만 판에서 폴링 동시요청을 458 로 봤는데
  #        origin 연결이 23,000 까지 갔다. 이 파드의 메모리는 연결 수에 비례한다(연결당 33-64KB).
  # ★ CPU limit 1000m → 2000m (2026-09-12). 이유는 사용량이 아니라 병렬도다.
  #   automaxprocs 가 limit 에서 GOMAXPROCS 를 정하므로 1000m 이면 P 가 하나다.
  #   1만 명 판 오픈 순간 실측: 고루틴 213 → 10,543 · 실행 대기 고루틴 405(한 파드) ·
  #     스케줄 대기 p99 117ms · CPU 는 0.18코어.
  #   CPU 는 남는데 느리다 — P 하나가 고루틴 만 개의 TLS 핸드셰이크 · 소켓 읽기 · JSON 을
  #     순서대로 처리해서다. 실행 가능 405개가 한 바퀴 도는 데 100ms 가 넘고, 그 지연이 Redis
  #     ReadTimeout(당시 500ms)을 넘겨 커넥션 폐기 → 재dial 의 churn 을 유발했다(redis/client.go).
  #   booking 의 CPU 증설과는 근거가 다르다. 그쪽은 스로틀(한도에 닿음)이었고 여기는 스로틀 0 에
  #     실행 대기 405 다. 주범은 풀 콜드스타트(MinIdleConns)이고 이건 증폭기라, 자기 지표
  #     (go_sched_goroutines_runnable · go_sched_latencies)로 따로 판정한다.
  #   10만은 파드 수로 받는다 — 폴링이 사용자 수에 정비례하고 이 값은 파드당 바닥이다.
  requests: {cpu: 500m, memory: 250Mi}
  # ★ CPU limit 2000m → 4000m, 메모리 1Gi → 2Gi (2026-09-13). 근거는 5만 명 판이다.
  #   automaxprocs 가 limit 에서 GOMAXPROCS 를 정하므로 2000m 이면 P 가 둘이다.
  #   5만 판 오픈 창 실측: 고루틴이 파드당 8,000-10,040(1만 판 182), 스케줄 대기 p99 9ms → 90ms.
  #   그 대기가 Redis 명령 시간에 섞여 들어가 평균 명령 지연이 1.0ms → 29.6ms 가 됐다
  #   (같은 창의 명령별 p99 는 2.5-3.8ms 이고 ElastiCache 엔진 CPU 는 37% 로 여유였다 —
  #    느린 것은 Redis 가 아니라 응답을 받아 처리할 차례다).
  #   리틀의 법칙으로 필요한 풀 = 평균 지연 × 초당 명령 수 = 0.0296 × 1,832 = 54.3 이라
  #   풀 50 을 넘겼고, 커넥션 대기가 파드당 32,000건 · 평균 0.4-0.8초 났다.
  #   줄서기 1초 초과 11,931건(SLO 77.1%)이 그 결과다.
  #   P 를 넷으로 늘리면 대기가 줄어 명령 지연이 내려가고 필요한 풀도 같이 내려간다.
  #   메모리는 고루틴 8천 개 몫이다 — 같은 판에서 760Mi / 1Gi 로 74% 였다.
  #   CPU 사용량 자체는 파드당 0.63 코어라 limit 을 올려도 실제 사용은 안 늘어난다.
  limits: {cpu: 4000m, memory: 2Gi}
# ★ 2026-09-12 부하 판 동안은 오토스케일링을 끄고 4대로 고정한다.
#
# 두 가지 때문이다.
#   1. 기준이 이 서비스에 안 맞는다. CPU 70% 로 늘리게 돼 있는데 1만 명 판에서 이 파드의
#      CPU 는 limit 대비 17% 였다(스로틀 0%). 부하가 세 배가 돼도 CPU 는 기준 근처에 못 가므로
#      대수는 4 에서 안 움직인다 — maxReplicas 8 은 걸려 있지만 닿을 길이 없다.
#      이 서비스가 막히는 축은 CPU 가 아니다. 같은 판에서 순번 조회 p99 가 2.20초였고
#      CPU · 메모리 · Redis 풀 은 전부 여유였다.
#   2. 판끼리 비교가 안 된다. 판 도중에 대수가 바뀌면 앞 판과 뒤 판의 조건이 달라져
#      "스펙을 바꿨더니 나아졌다" 를 말할 수 없다.
#
# 축이 무엇인지 확정한 뒤에 그 값을 기준으로 다시 켠다. 지금은 확정할 지표가 없어서
#   이번 판에 queue_redis_command_duration_seconds 를 새로 넣었다.
autoscaling:
  enabled: false
replicaCount: 4
# ★ 앱 노드그룹(workload=app)에만 선다 (2026-09-13). booking 은 전용 노드그룹으로 갔다.
#   1만 명 판 실측: queue 파드 넷 중 booking 과 노드를 같이 쓴 하나만 Redis 명령 0.5초 초과 3,076건 ·
#     순번 조회 1초 초과 317건 · enter 1초 초과 242건이었고, 나머지 셋은 전부 0 이었다.
#   그 노드는 오픈 순간 booking 의 JIT 컴파일이 코어 1.1–2.2개를 쓰면서 4 vCPU 가 찼다 —
#     런큐 대기 4.49 스레드초/초 · CPU 압박(PSI some) 34%. queue 의 CPU 스로틀은 0 이었다.
#     한도에 닿은 것이 아니라 OS 스케줄러에서 차례를 못 받은 것이다. request 가 보장하는 것은
#     CPU 시간의 비율이지 응답 지연이 아니다 — 런큐가 차면 몫이 있어도 기다린다.
#   처음에는 booking 에 대한 podAntiAffinity 로 떼어 놓았는데, 그러면 booking 이 앉을 노드가 2c 둘뿐이라
#     단일 AZ 가 되고 같은 노드의 Kafka 브로커는 여전히 booking 과 노드를 나눴다(발행 p99 3.6초).
#     그래서 booking 쪽을 전용 노드그룹(taint)으로 빼고, 이 파드는 나머지 앱 노드에 라벨로 고정한다.
#   Kafka 브로커와 노드를 같이 쓴다 — 이 파드는 버스트가 없어(Go, 1만 0.2코어 · 5만 예상 1.0코어)
#     브로커 옆에 둘 수 있고, 브로커는 request=limit(Guaranteed, envs/stg/kafka.yaml)로 몫을 잠근다.
#   10만은 이 노드그룹의 노드 · 파드 수로 받는다(HPA 는 요청 수 기준으로 다시 켠다).
nodeSelector: { workload: app }
# 파드를 노드와 AZ 양쪽으로 흩는다. AZ 하나가 죽어도 남은 AZ 에 파드가 있게.
#   스케줄러의 기본 zone 분산은 파드가 분산 규칙을 하나라도 적으면 붙지 않아서 명시한다.
#   값 병합은 목록을 통째로 덮으므로 apps/queue 의 hostname 규칙도 다시 적는다.
#
# ★ 노드 분산은 DoNotSchedule 이다 (2026-09-13). ScheduleAnyway 였을 때 파드 넷이 노드 셋에
#   2+1+1 로 앉았고, 2.5만 명 판에서 둘이 겹친 노드의 두 파드만 enter 1초 초과를 5,055 건 ·
#   5,142 건 냈다(다른 노드의 둘은 0 건). 그 노드는 limit 합 6.45 코어 대 allocatable 3.92 였고
#   런큐 대기가 4.16 초/초였다. 같은 시각 ElastiCache 엔진 CPU 는 1.88% 로 놀고 있었다 —
#   Redis 가 느린 것이 아니라 응답이 돌아왔을 때 고루틴이 CPU 차례를 못 받은 것이다.
#   파드 수(4)와 앱 노드 수(4)를 같게 두고 하나씩 앉힌다.
#
# ★ matchLabelKeys 로 새 ReplicaSet 의 파드끼리만 센다. 없으면 롤링 중에 옛 파드까지 세어
#   분산이 이미 만족된 것으로 보고 새 파드 둘이 한 노드에 앉는다(booking 에서 실제로 났다).
#
# AZ 분산은 ScheduleAnyway 로 둔다 — 노드 넷이 AZ 셋에 2+1+1 이라 고르게 나눌 수 없다.
topologySpreadConstraints:
- maxSkew: 1
  topologyKey: kubernetes.io/hostname
  whenUnsatisfiable: DoNotSchedule
  matchLabelKeys:
  - pod-template-hash
  labelSelector:
    matchLabels:
      app.kubernetes.io/name: queue
- maxSkew: 1
  topologyKey: topology.kubernetes.io/zone
  whenUnsatisfiable: ScheduleAnyway
  labelSelector:
    matchLabels:
      app.kubernetes.io/name: queue
env:
  PORT: "8090"
  # ElastiCache — Sentinel 이 없다. REDIS_SENTINEL_ADDRS 를 안 주면 코드가 standalone 으로
  #   붙는다(queue-go/redis/client.go). REDIS_MASTER_NAME 도 같이 뺀다 — Sentinel 있을 때만 쓰인다.
  # ★ 전송 구간 암호화를 켜면 주 엔드포인트 이름이 바뀐다. 평문일 때는 <이름>.<조각>.ng.0001.<리전>…
  #   이고 암호화를 켜면 master.<이름>.<조각>.<리전>… 이 된다. ElastiCache 의 서버 인증서가
  #   *.<이름>.<조각>.<리전>… 에만 발급돼 있어, 옛 이름으로 TLS 를 맺으면 이름이 달라 검증에서 끊긴다
  #   (2026-09-12: x509: certificate is valid for *.cgv-stg.gl3ph0.apn2… , not cgv-stg.gl3ph0.ng.0001.apn2…).
  # 복제본으로 전환하면 이 이름이 새 주를 가리킨다 — 앱은 주소를 안 바꾸고 다시 붙는다.
  REDIS_HOST: master.cgv-stg.gl3ph0.apn2.cache.amazonaws.com # 켜는 날 terraform output handoff 의 redis_host
  REDIS_PORT: "6379"
  # 집에서는 Redis 가 파드라 NetworkPolicy 안쪽이었다. 여기서는 클러스터 밖의 관리형 서비스라
  #   같은 층을 지키려면 이름표가 하나 더 필요하다 — 보안 그룹은 "어디서 오는가" 만 보고
  #   "누구인가" 는 안 본다. 비밀번호(REDIS_PASSWORD)는 queue-secrets 로 들어온다(charts/apps/queue.yaml).
  # ElastiCache 는 전송 구간 암호화를 켜야 비밀번호를 받으므로 이 둘은 늘 같이 켜진다.
  #   dev 는 파드 Redis 라 평문이고 이 값이 없다 — GC 처럼 환경이 갈리는 축이다.
  REDIS_TLS: "true"
  KAFKA_BROKER: cgv-kafka-bootstrap.data.svc.cluster.local:9092
  # 파드 하나가 Redis 에 동시에 던지는 명령 수의 상한. dev 실측값 그대로.
  # ★ 50 → 100 (2026-09-13). 5만 명 판에서 리틀의 법칙상 필요한 값이 54.3 이 되어 50 을 넘겼다
  #   (평균 명령 지연 0.0296초 × 파드당 1,832 명령/초). 그 위 CPU limit 을 4000m 으로 올리면
  #   명령 지연이 내려가 필요한 값도 같이 내려가므로, 이 값은 근본 조치가 아니라 여유다.
  #   무작정 키우지 않는 이유: Redis 는 명령을 한 줄로 처리하므로 연결을 늘려도 서버가 빨라지지
  #   않고, 파드 넷이 각자 들고 있는 연결이 그대로 ElastiCache 의 연결 수가 된다(100 × 4 = 400).
  REDIS_POOL_SIZE: "100"
  # 정원. dev 는 공개 데모라 60 이지만 여기는 부하 판 값이다.
  #   5만 기준 스펙 산정이 "정원 1,000 ÷ 체류 36초 = 초당 27.8 확정" 을 전제로 계산됐다.
  #   이 값을 바꾸면 booking·MySQL 의 CPU 계수가 같이 어긋난다.
  MAX_SESSIONS: "1000"
  # 승격 리듬. 상한 = 배치 ÷ 주기.
  #   dev 의 5 는 데모값이다(정원 60 에서 순번이 잘게 흐르도록).
  # ★ 25 → 50 (초당 50 → 100). 2026-09-12 판에서 이 상한이 실측 회전과 겹쳐 있었다.
  #   승격 상한        25 ÷ 0.5초           = 초당 50.0
  #   실측 회전                              = 초당 47.5
  #   체류 기반 계산   정원 1,000 ÷ 21.1초  = 초당 47.4
  #   세 수가 거의 같아서 정원을 채우는 것이 체류인지 이 상한인지 못 가른다. 체류가 짧아지면
  #   필요 회전이 상한을 넘어(체류 15초면 초당 66) 이 값이 먼저 막고, 그러면 "정원은 체류의
  #   함수다" 를 보이려던 민감도 판이 성립하지 않는다. 상한을 걷어내 회전이 체류만의 함수가 되게 한다.
  #   ★ 올린 만큼 오픈 순간 발행이 몰린다 — 전달 지연(booking_admission_lag)을 같이 본다.
  QUEUE_PROCESS_INTERVAL: "500"
  PROCESSING_BATCH_SIZE: "50"
  # 자리를 회수하기까지 주는 시간. booking 의 ADMITTED_TTL 이 이 값보다 길어야 한다.
  SESSION_TIMEOUT: "300"
  METRICS_PORT: "9091"
  # 컨테이너 limit(1Gi)의 약 78%. Go 런타임은 cgroup limit 을 스스로 읽지 않아
  #   이 값이 없으면 GC 상한이 int64 최대가 되고 힙이 limit 을 넘긴 순간 커널이 OOMKill 한다.
  #   dev 는 limit 256Mi 에 200MiB 였다. limit 을 올렸으므로 이 값도 같이 올린다 —
  #   안 올리면 limit 만 커지고 힙은 200MiB 에 묶인 채다.
  GOMEMLIMIT: "800MiB"
  OTLP_GRPC_ENDPOINT: alloy.observability.svc.cluster.local:4317
  OTEL_TRACES_SAMPLER_ARG: "1.0"
imageUpdater:
  # ECR. dev 의 GitLab 레지스트리 주소와 다르다.
  resolvedImage: 527170477076.dkr.ecr.ap-northeast-2.amazonaws.com/cgv/cgv-onprem/queue-go
