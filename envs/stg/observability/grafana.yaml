# grafana stg 환경값 — 진입뿐이다.
#
# dev 와 갈리는 것이 셋이다.
#   진입     Traefik → ALB.  frontend 것과 묶지 않고 전용 Ingress 로 ALB 를 하나 더 만든다.
#           묶으면(IngressGroup) 애노테이션 병합이 어긋날 때 앱의 입구까지 걸린다 —
#           관측을 보려는 편의가 서비스 경로를 인질로 잡으면 안 된다.
#   알림     안 쓴다.  그래서 발송처(Discord webhook)도 알림 프로비저닝 ConfigMap 도 없다.
#           ★ 그 둘이 dev 값 파일에만 있어서 여기서는 참조가 아예 안 생긴다 —
#             없는 Secret·ConfigMap 을 참조해 FailedMount 로 안 뜨는 일이 없다.
#   렌더러   안 띄운다.  알림에 붙일 그림이 없다. 차트 기본값이 off 라 안 적어도 되지만
#           "빠뜨린 것이 아니라 뺀 것" 을 보이게 적어 둔다.

grafana.ini:
  server:
    # ALB 의 DNS 이름. 만들 때 정해지므로 그날 채운다.
    #   비워 두면 Grafana 가 내부 주소(:3000)를 링크에 써서 밖에서 눌러도 안 열린다.
    root_url: http://k8s-observab-grafana-7a716930ba-1617123753.ap-northeast-2.elb.amazonaws.com/

ingress:
  enabled: true
  ingressClassName: alb
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    # 파드 IP 를 직접 대상으로 잡는다. VPC CNI 가 파드에 VPC 주소를 준다.
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
    # Terraform 이 만든 관리용 보안 그룹을 쓴다 — 집 공인 IP 에만 80 을 연다.
    #   서비스 ALB(frontend)는 인터넷 전체에 여는 다른 보안 그룹(cgv-stg-alb-public)이다.
    #   지정하지 않으면 컨트롤러가 자기 보안 그룹을 만들어 0.0.0.0/0 으로 연다.
    #   이름(Name 태그)으로 지정한다 — 컨트롤러가 ID 와 이름을 둘 다 받는다(v2.13 문서).
    #   켜는 날 안 먹으면 terraform output expected.alb_admin_sg 의 ID 로 바꾼다.
    alb.ingress.kubernetes.io/security-groups: cgv-stg-alb-admin
    # 위에서 보안 그룹을 지정하면 컨트롤러가 노드 쪽 인바운드 규칙을 자동으로 안 붙인다.
    alb.ingress.kubernetes.io/manage-backend-security-group-rules: "true"
    # 전용 Ingress 라 대상그룹이 하나다 — frontend 쪽의 "서비스마다 헬스체크 경로가 다르다"
    #   문제와 안 얽힌다.
    alb.ingress.kubernetes.io/healthcheck-path: /api/health
  path: /
  pathType: Prefix
  # host 를 비운다. 도메인이 없고, host 가 있으면 그 이름의 Host 헤더로 온 것만 받아
  #   ALB 기본 DNS 이름으로 들어오는 접근이 끊긴다.
  # ★ 안 적는 것과 비우는 것은 다르다 — 차트 기본값이 hosts: [chart-example.local] 이라 안 적으면
  #   그 host 가 규칙에 들어가고 ALB 가 다른 Host 헤더를 전부 404 로 돌려보낸다(2026-09-12 stg 첫 기동).
  hosts: []

# 알림을 안 쓴다 → 렌더러도 안 띄운다.
imageRenderer:
  enabled: false

# 관측 노드에만 놓는다 — 노드그룹이 taint 로 앱 파드를 막고(cgv-terraform modules/eks),
#   관측 파드는 toleration 으로 들어가 nodeSelector 로 거기에만 선다. 이유는 mimir.yaml 머리말.
nodeSelector: { workload: observability }
tolerations: [{ key: workload, operator: Equal, value: observability, effect: NoSchedule }]

# ※ 80 평문이다. ACM 인증서는 도메인이 있어야 붙고 ALB 기본 DNS 이름에는 못 붙인다.
#   막는 것은 보안 그룹이고, 이 환경은 하루 뒤에 지운다.
#   prd 면 도메인 + ACM + OIDC 가 선행이다.
