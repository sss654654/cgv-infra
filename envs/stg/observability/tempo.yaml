# tempo stg 환경값 — 오브젝트 저장소 접속과 WAL 볼륨.
#
# dev 와 갈리는 것이 셋이다.
#   저장소   MinIO(클러스터 안) → S3.  주소를 안 적는다 — 리전 엔드포인트를 SDK 가 스스로 찾는다.
#           TLS 라 insecure 를 끄고, S3 는 가상 호스트 방식이 기본이라 forcepathstyle 도 끈다.
#   자격     SealedSecret → IRSA.  키를 파드에 넣지 않는다.
#           ServiceAccount 에 역할 ARN 을 달면 토큰이 STS 로 교환되고 SDK 가 그걸 쓴다.
#           그래서 extraEnvFrom 과 ${} 치환이 통째로 없어진다.
#   볼륨     정적 PV → EBS.  노드 고정도 없어진다 — 어느 노드에 떠도 볼륨이 따라온다.

tempo:
  storage:
    trace:
      s3:
        bucket: cgv-stg-tempo-527170477076
        region: ap-northeast-2
        # endpoint 를 안 적는다. 적으면 그 주소로 고정돼 리전 라우팅을 잃는다.
        insecure: false
        forcepathstyle: false

# IRSA — 역할 하나를 관측 셋이 같이 쓴다. 셋이 같은 버킷 묶음을 쓰기 때문에
#   신뢰 정책의 sub 에 observability:mimir · loki · tempo 셋을 적어 뒀다(cgv-terraform).
# ★ 역할 이름이 결정적이라 클러스터를 만들기 전에 적을 수 있다 — 역할에 path 를 안 준다.
serviceAccount:
  create: true
  name: tempo                          # 신뢰 정책의 sub 와 글자까지 같아야 한다
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::527170477076:role/cgv-stg-obs-s3

# WAL 볼륨. gp3 StorageClass 는 EBS CSI 애드온이 안 만든다 — 허브가 cluster-stg 로 넣는다.
#   그 이름이 없으면 PVC 가 영구 Pending 이고 파드가 안 뜬다.
persistence:
  enabled: true
  storageClassName: gp3
  accessModes: [ReadWriteOnce]
  size: 10Gi

# 관측 노드에만 놓는다 — 노드그룹이 taint 로 앱 파드를 막고(cgv-terraform modules/eks),
#   관측 파드는 toleration 으로 들어가 nodeSelector 로 거기에만 선다. 이유는 mimir.yaml 머리말.
nodeSelector: { workload: observability }
tolerations: [{ key: workload, operator: Equal, value: observability, effect: NoSchedule }]
