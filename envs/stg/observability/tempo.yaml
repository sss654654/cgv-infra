# tempo stg 환경값 — 오브젝트 저장소 접속과 WAL 볼륨.
#
# dev 와 갈리는 것이 셋이다.
#   저장소   MinIO(클러스터 안) → S3.  리전 엔드포인트를 적는다 — Tempo 의 S3 클라이언트(minio-go)는
#           endpoint 가 비어 있으면 "Endpoint: does not follow ip address or domain name standards" 로
#           기동을 거부한다(2026-09-12 stg 첫 기동).
#           TLS 라 insecure 를 끄고, S3 는 가상 호스트 방식이 기본이라 forcepathstyle 도 끈다.
#   자격     SealedSecret → IRSA.  키를 파드에 넣지 않는다.
#           ServiceAccount 에 역할 ARN 을 달면 토큰이 STS 로 교환되고 SDK 가 그걸 쓴다.
#           그래서 extraEnvFrom 과 ${} 치환이 통째로 없어진다.
#   볼륨     정적 PV → EBS.  노드 고정도 없어진다 — 어느 노드에 떠도 볼륨이 따라온다.

tempo:
  # 메모리 — 2026-09-12 stg 1만 명 판에서 실측하고 정했다.
  #   live traces 50,000(한도에 붙음) · 이 파드 working set 1,545MiB · 재시작 0.
  #   트레이스 하나가 메모리에서 차지하는 몫 = 1,545MiB ÷ 50,000 = 약 31KiB.
  #   request 2Gi — 실사용 1,545MiB 가 그전 request 256Mi 의 여섯 배라 스케줄러가 과소 평가했다.
  #   limit 5Gi = 트레이스 몫 약 4.5GiB(아래 한도 150,000 × 31KiB) + 런타임 · 버퍼 약 0.5GiB.
  # ★ CPU limit 500m → 2000m (2026-09-13). 2.5만 명 판에서 이 파드가 1.62 초/초 스로틀됐다.
  #   같은 시각 관측 노드는 CPU 1.17 / 3.92 코어라 막은 것은 노드가 아니라 이 한도다.
  #   트레이스가 밀리면 부하 판에서 지연 구간을 가르는 근거가 같이 밀린다.
  #   메모리는 그대로 둔다 — 실측 working set 이 limit 근처라 CPU 만 풀고 다음 판에서 다시 본다.
  resources:
    requests: { cpu: 200m, memory: 2Gi }
    limits: { cpu: 2000m, memory: 5Gi }
  # live traces 한도 10,000 → 50,000 → 150,000.
  #   50,000 은 stg 1만 명 판에서 한도에 닿았다 — 수신 1,162,948 span 중 40,895 건(3.5%)을
  #   live_traces_exceeded 로 버렸다. 버려진 구간이 오픈 직후이고, 전파 지연이 1초를 넘은 495 건이
  #   바로 그 구간이라 exemplar 를 눌러도 트레이스가 없었다(404).
  #   150,000 × 31KiB = 약 4.5GiB 로 limit 5Gi 안쪽이다. 50,000 에 붙어 있던 동안 진짜 수요는 알 수
  #   없으므로 이 값은 다시 재기 위한 값이다. 150,000 에 다시 붙으면 한도를 더 올리지 않고 트레이스 수를
  #   줄인다 — 순번 조회 폴링이 요청의 대부분인데 그 트레이스는 판단에 쓰이지 않는다.
  overrides:
    defaults:
      ingestion:
        max_traces_per_user: 150000
  storage:
    trace:
      s3:
        bucket: cgv-stg-tempo-527170477076
        region: ap-northeast-2
        # 리전 엔드포인트. 비워 두면 기동을 거부한다(위 머리말).
        endpoint: s3.ap-northeast-2.amazonaws.com
        insecure: false
        forcepathstyle: false

# IRSA — 역할 하나를 관측 셋이 같이 쓴다. 셋이 같은 버킷 묶음을 쓰기 때문에
#   신뢰 정책의 sub 에 observability:mimir · loki · tempo 셋을 적어 뒀다(cgv-terraform).
# ★ 역할 이름이 결정적이라 클러스터를 만들기 전에 적을 수 있다 — 역할에 path 를 안 준다.
serviceAccount:
  create: true
  name: tempo                          # 신뢰 정책의 sub 와 글자까지 같아야 한다
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::527170477076:role/cgv-stg-obs-s3

# WAL 볼륨. gp3 StorageClass 는 EBS CSI 애드온이 안 만든다 — 허브가 cluster-stg 로 넣는다.
#   그 이름이 없으면 PVC 가 영구 Pending 이고 파드가 안 뜬다.
persistence:
  enabled: true
  storageClassName: gp3
  accessModes: [ReadWriteOnce]
  size: 10Gi

# 관측 노드에만 놓는다 — 노드그룹이 taint 로 앱 파드를 막고(cgv-terraform modules/eks),
#   관측 파드는 toleration 으로 들어가 nodeSelector 로 거기에만 선다. 이유는 mimir.yaml 머리말.
nodeSelector: { workload: observability }
tolerations: [{ key: workload, operator: Equal, value: observability, effect: NoSchedule }]
