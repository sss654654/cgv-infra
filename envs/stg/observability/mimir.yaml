# mimir stg 환경값 — 오브젝트 저장소 접속과 ingester 배치.
#
# dev 와 갈리는 것이 셋이다.
#   저장소     MinIO(클러스터 안) → S3.  리전 엔드포인트를 적는다 — Mimir 의 S3 클라이언트(thanos objstore)는
#             endpoint 가 비어 있으면 "no s3 endpoint in config file" 로 기동을 거부한다(2026-09-12 stg 첫 기동).
#   자격       SealedSecret → IRSA.  키를 파드에 넣지 않는다 → extraEnvFrom 이 없어진다.
#   ingester   셋 → 하나, 복제 계수 3 → 1.
#
# ingester 를 하나로 내리는 근거 — 이 환경은 하루 살고 지운다. 복제는 노드가 죽었을 때
#   최근 시리즈를 지키는 장치인데, 여기서 지킬 이유가 약하고 원본은 어차피 S3 에 있다.
#   대신 같은 메모리로 시리즈를 세 배 담는다 — RF3 에서는 전역 상한이 곧 한 대가 지는 양이라
#   상한 30만이 대당 30만이었다. RF1 이면 대당 30만을 한 대가 다 진다는 뜻은 같지만
#   ingester 가 하나라 총 사용량이 3분의 1이 된다.
#   ★ 노드가 죽으면 그 순간의 WAL 을 잃는다. 부하 판 중에 노드가 죽으면 그 구간 지표가 빈다 —
#     판정 조건이 "무엇이 먼저 막히는지 지목" 이라 그 구간이 빌 수 있다는 것을 감수한다.

mimir:
  structuredConfig:
    ingester:
      ring:
        replication_factor: 1
    common:
      storage:
        s3:
          bucket_name: cgv-stg-mimir-527170477076
          region: ap-northeast-2
          # 리전 엔드포인트. 비워 두면 기동을 거부한다(위 머리말).
          endpoint: s3.ap-northeast-2.amazonaws.com
          insecure: false

# IRSA — 역할 하나를 관측 셋이 같이 쓴다(신뢰 정책의 sub 에 mimir·loki·tempo 셋).
# ★ 이름이 결정적이라 클러스터를 만들기 전에 적을 수 있다 — 역할에 path 를 안 준다.
serviceAccount:
  create: true
  name: mimir                          # 신뢰 정책의 sub 와 글자까지 같아야 한다
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::527170477076:role/cgv-stg-obs-s3

# ---------- 관측 노드에 놓는다 ----------
# 관측 노드그룹(m5.xlarge 1대)에 taint workload=observability:NoSchedule 가 걸려 있다
#   (cgv-terraform modules/eks). 앱 파드를 막는 장치라, 관측 파드는 toleration 으로 들어가고
#   nodeSelector 로 거기에만 선다. toleration 만 있으면 앱 노드에도 뜨고, nodeSelector 만 있으면
#   taint 에 막혀 Pending 이다 — 둘이 한 쌍이다.
# 가르는 이유 — 3만 판에서 앱과 한 노드에 있던 Mimir · Loki · Tempo 가 노드 메모리 압박으로 같이
#   재시작해, 무너지는 순간의 지표가 안 남았다. 재려던 그 순간이 가장 안 보이는 구조였다.
# 이 차트는 컴포넌트마다 따로 받는다. 켜 둔 여덟 전부에 준다.

distributor:
  nodeSelector: { workload: observability }
  tolerations: [{ key: workload, operator: Equal, value: observability, effect: NoSchedule }]

ingester:
  replicas: 1
  # gp3 StorageClass 는 EBS CSI 애드온이 안 만든다 — 허브가 cluster-stg 로 넣는다(manifests/storage-ebs).
  persistentVolume: { storageClass: gp3, size: 10Gi }
  # anti-affinity 를 안 건다. 대수가 하나라 흩을 대상이 없다.
  nodeSelector: { workload: observability }
  tolerations: [{ key: workload, operator: Equal, value: observability, effect: NoSchedule }]

querier:
  nodeSelector: { workload: observability }
  tolerations: [{ key: workload, operator: Equal, value: observability, effect: NoSchedule }]

query_frontend:
  nodeSelector: { workload: observability }
  tolerations: [{ key: workload, operator: Equal, value: observability, effect: NoSchedule }]

query_scheduler:
  nodeSelector: { workload: observability }
  tolerations: [{ key: workload, operator: Equal, value: observability, effect: NoSchedule }]

store_gateway:
  nodeSelector: { workload: observability }
  tolerations: [{ key: workload, operator: Equal, value: observability, effect: NoSchedule }]

compactor:
  nodeSelector: { workload: observability }
  tolerations: [{ key: workload, operator: Equal, value: observability, effect: NoSchedule }]

gateway:
  nodeSelector: { workload: observability }
  tolerations: [{ key: workload, operator: Equal, value: observability, effect: NoSchedule }]
