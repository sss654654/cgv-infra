# booking stg 환경값. dev 와 다른 값만 정의(delta).
#
# 두 대 · RollingUpdate. 스키마와 시드는 Flyway 가 DB 잠금 아래에서 한 대만 적용한다(cgv-onprem
#   booking) — 파드마다 Hibernate 가 DDL 을 돌리던 때는 둘이 부딪혀 한 대 · Recreate 에 묶여 있었다.
#   AZ 하나가 죽어도 다른 AZ 의 파드가 받고, 배포 중에도 받는다.
#   대가: 배포하는 동안 옛 파드와 새 파드가 새 스키마 위에서 같이 돈다. 스키마 변경은 옛 코드와
#   호환되게 한다(추가는 한 번에, 삭제 · 이름 변경은 배포를 나눈다).
# 두 대에서 더 늘리는 기준은 부하 판에서 정한다 — booking CPU · 풀 대기와 RDS CPU · 연결 · 쓰기 지연 중
#   무엇이 먼저 차는지를 보고.

image:
  tag: 670aac42 # 켜는 날 ECR 에 올린 커밋 해시(cgv-onprem main 186df8d7, 2026-09-12). 그 뒤로는 image-updater 가 덮는다
# stg 는 ECR 이고 노드 역할로 인증한다. 빈 배열로 덮지 않으면 apps/booking 의
# gitlab-registry 가 그대로 내려온다.
imagePullSecrets: []
# ALB 대상그룹 헬스체크 경로. 한 Ingress(envs/stg/frontend.yaml)가 세 서비스로 가르고,
#   Ingress 에 적은 / 는 frontend 의 준비 경로다. 이 값이 없으면 booking 대상그룹도 / 로 검사한다.
#   readinessProbe 와 같은 경로다 — MySQL·Redis 가 안 닿으면 not-ready 가 되고 ALB 도 이 파드를 뺀다.
service:
  annotations:
    alb.ingress.kubernetes.io/healthcheck-path: /actuator/health/readiness
replicaCount: 2
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0 # 새 파드가 Ready 가 된 뒤 옛 파드를 내린다 — 한 대만 남은 채 받는 순간이 없다
# 노드를 비울 때(드레인) 한 대는 남긴다.
podDisruptionBudget:
  enabled: true
  minAvailable: 1
# ★ booking 전용 노드에만 선다 (2026-09-13). 노드그룹은 cgv-terraform modules/eks 의 booking(AZ 마다 1대).
#   1만 명 판에서 이 파드가 다른 파드와 노드를 나눠 쓰는 것이 오픈 순간 지연의 공통 원인이었다.
#   새로 뜬 JVM 은 오픈 순간 컴파일에 코어 2.4개 + 처리 1개를 써 4 vCPU 노드를 채우고(런큐 대기 15
#   스레드초/초 · CPU 압박 66%), 같은 노드의 Kafka 브로커가 밀려 발행 p99 3.6초 · 다른 노드의 queue 까지
#   줄서기 2.5초가 됐다. 둘이 한 노드에 앉은 판(06:42 · 07:08)은 전파 SLO 78–90%, 하나만 있고 데워진
#   판(05:33)은 100%. 버스트하는 파드는 이것 하나라(queue 는 Go, 0.2코어) 이 파드만 노드를 혼자 쓴다.
#   노드에 taint 가 있어 toleration 이 같이 있어야 선다 — nodeSelector 만으로는 다른 파드가 그 노드에
#   재시작 때 옮겨 앉는 것을 못 막는다.
nodeSelector: { workload: booking }
tolerations: [{ key: workload, operator: Equal, value: booking, effect: NoSchedule }]
# 노드와 AZ 양쪽으로 흩는다(envs/stg/queue.yaml 과 같은 이유). 목록을 통째로 덮으므로 hostname 규칙도 다시 적는다.
# ★ 노드 분산은 required 이고 같은 ReplicaSet 끼리만 센다 (2026-09-13).
#   ScheduleAnyway 였을 때 롤링 업데이트에서 새 파드 둘이 한 노드에 앉았다 — 새 파드가 뜰 때 옛 파드가
#     다른 노드를 차지하고 있어 "노드마다 하나" 가 이미 만족된 것으로 계산되고, 옛 파드가 빠진 뒤에는
#     아무도 다시 옮기지 않는다(IgnoredDuringExecution). 결과: 4 vCPU 노드 하나에 limit 4000m 두 대.
#   matchLabelKeys 로 pod-template-hash 를 셀렉터에 더하면 같은 ReplicaSet 의 파드끼리만 세므로
#     새 파드 둘째는 첫째와 다른 노드로 간다. DoNotSchedule 이라 다른 노드가 없으면 Pending 이다 —
#     한 노드에 둘을 두느니 PDB(minAvailable 1)로 한 대를 지키며 기다리는 쪽을 택한다.
#   AZ 는 그대로 soft 다. 전용 노드그룹이 AZ 별로 한 대씩(2a · 2c)이라 노드 분산이 곧 AZ 분산이고,
#     노드 하나가 빠진 동안 required 면 Pending 이 된다.
topologySpreadConstraints:
- maxSkew: 1
  topologyKey: kubernetes.io/hostname
  whenUnsatisfiable: DoNotSchedule
  matchLabelKeys:
  - pod-template-hash
  labelSelector:
    matchLabels:
      app.kubernetes.io/name: booking
- maxSkew: 1
  topologyKey: topology.kubernetes.io/zone
  whenUnsatisfiable: ScheduleAnyway
  labelSelector:
    matchLabels:
      app.kubernetes.io/name: booking
resources:
  # request 는 실사용에 맞춘다 — 계수 0.72 코어(회전 27.8 확정/초 기준).
  #   이 값은 인원이 아니라 회전 속도에 비례한다. 5만이어도 정원이 1,000 이면 같다.
  #   두 대로 나누면 파드당 실사용은 절반 가까이로 줄지만, request 는 한 대가 전부 받을 때를 기준으로 둔다
  #   — 한 대가 빠진 동안(배포 · AZ 장애) 남은 한 대가 회전 전부를 받는다.
  # limit 은 예상치에 안 붙인다.
  #   메모리 dev 는 1536Mi 인데 실사용이 718Mi-1.5GB 라 98% 까지 붙는다. 1Gi 였을 때
  #        오픈 버스트에서 OOMKill 이 두 번 났고(exit 137, 재기동 25초 만에 재발) 그래서
  #        1536Mi 가 된 값이다. 5만이면 같은 자리를 다시 만난다 — 3Gi 로 둔다.
  #        이 파드가 죽으면 판이 거기서 끝나므로 여유를 크게 잡는다.
  # ★ 2026-09-12 stg 1만 명 판에서 CPU 를 올린다. limit 2000m → 4000m · request 800m → 1500m.
  #   dev 노트북에서 뽑은 2 코어가 그대로 넘어와 있었는데, 그 값이 오픈 순간에 한계였다.
  #   실측: 오픈 버스트 30초 동안 CFS 스로틀이 42.5% 로 튀었고, 정확히 그 30초에
  #     승격→인증 지연 p99 가 9.77초까지 올랐다. 그 앞뒤로는 스로틀 2% 미만 · 지연 0 이다.
  #   이 파드 안에서 HTTP 처리와 Kafka 소비가 같은 CPU 를 두고 경쟁한다. 한도에 닿으면
  #     CFS 가 컨테이너 전체를 그 주기의 남은 시간 동안 멈추므로 둘이 같이 멈춘다 —
  #     소비가 멈추면 입장 인증이 늦고, 늦으면 /api/screenings 가 403 을 주고,
  #     그 사람이 0.5초 뒤 다시 부르면서 HTTP 가 더 몰린다.
  #   request 1500m 인 근거: 버스트 때 파드당 실사용이 약 1.4 코어였다. 800m 이면 그 순간
  #     보장분을 넘겨 쓰는 상태라 같은 노드의 다른 파드와 경쟁할 때 먼저 밀린다.
  #   노드 allocatable 이 3920m 이라 limit 4000m 은 사실상 "노드 전부까지 허용" 이다.
  #     이 값은 이 파드가 노드를 혼자 쓸 때만 정당하다. 처음에는 "같은 노드의 queue 는 request 로
  #     자기 몫이 보장된다" 고 적었는데 틀렸다 — request 는 CPU 시간의 비율을 보장하지 응답 지연을
  #     보장하지 않는다. 2026-09-13 판에서 이 파드의 JIT 버스트가 노드를 채우자 같은 노드의 queue 만
  #     Redis 왕복이 0.5초를 넘겼고(다른 노드의 queue 셋은 0건), 그다음 판에서는 같은 노드의 Kafka
  #     브로커가 밀렸다. 그래서 이 파드는 전용 노드그룹(위 nodeSelector)에서 노드를 혼자 쓴다 —
  #     이 limit 의 전제가 그 노드그룹이다.
  #   ★ 이 값을 바꾸면 JVM 이 보는 코어 수가 2 에서 4 로 바뀐다. 컨테이너에서 JVM 은 limit 을
  #     읽어 availableProcessors 를 정하고, 그 수로 Tomcat 기본 스레드 · ForkJoinPool ·
  #     G1 의 병렬 스레드가 정해진다. dev(2 코어)와 조건이 달라지므로 dev 부하 판의
  #     계수(CPU 0.72 코어 · GC 멈춤)와 나란히 놓을 때 이 차이를 먼저 본다.
  requests: {cpu: 1500m, memory: 1024Mi}
  limits: {cpu: "4000m", memory: 3Gi}
env:
  PORT: "8091"
  # ★ SPRING_PROFILES_ACTIVE 를 주지 않는다.
  #   dev 는 redis-sentinel 프로파일로 Sentinel 에 붙는데 ElastiCache 에는 Sentinel 이 없다.
  #   프로파일을 안 켜면 기본 경로인 host/port 를 쓴다(application.yml 의 spring.data.redis).
  #   빈 sentinel 블록을 남기면 Spring 이 standalone 을 sentinel 모드로 오인해 깨지므로,
  #   블록을 지우는 것이 아니라 프로파일을 안 켜는 방식이어야 한다.
  # ElastiCache 가 복제본으로 전환하면 이 주소(주 엔드포인트)가 새 주를 가리킨다. 끊긴 연결은
  #   Lettuce 가 다시 붙고, 그 사이의 명령은 2초 타임아웃 뒤 503(redis_error)으로 끝난다.
  # ★ 전송 구간 암호화를 켜면 이 이름이 바뀐다 — 평문은 <이름>.<조각>.ng.0001.<리전>… 이고
  #   암호화를 켜면 master.<이름>.<조각>.<리전>… 이다. 서버 인증서가 *.<이름>.<조각>.<리전>… 에만
  #   발급돼 있어 옛 이름으로는 TLS 검증이 실패한다(2026-09-12 확인).
  REDIS_HOST: master.cgv-stg.gl3ph0.apn2.cache.amazonaws.com # 켜는 날 terraform output handoff 의 redis_host
  REDIS_PORT: "6379"
  # 관리형 Redis 라 보안 그룹만으로는 "누구인가" 를 못 가른다. 비밀번호(REDIS_PASSWORD)는
  #   booking-secrets 로 들어오고, ElastiCache 는 전송 구간 암호화를 켜야 그 비밀번호를 받는다.
  #   dev 는 파드 Redis 라 평문이고 이 값이 없다.
  REDIS_SSL: "true"
  # RDS. 마스터 계정으로 붙는다 — dev 의 cgvapp 처럼 별도 계정을 두지 않았다.
  #   전용 계정을 만들어도 Flyway 가 cgv 안에서 CREATE · ALTER 를 해야 하고, 이 RDS 에는
  #   데이터베이스가 cgv 하나 · 쓰는 앱이 booking 하나라 마스터와의 차이가 사용자 관리 같은
  #   인스턴스 단위 권한뿐이다. prd 는 앱 계정(데이터 읽기 · 쓰기)과 DDL 계정을 나눈다.
  #   MYSQL_PASSWORD 는 여기 없다. AWS 가 만들어 Secrets Manager 에 넣은 값을
  #   booking-secrets 로 옮겨 envFrom 으로 들어온다(apps/booking).
  MYSQL_HOST: cgv-stg.cv4u24c4c5g4.ap-northeast-2.rds.amazonaws.com # 켜는 날 terraform output handoff 의 mysql_host
  MYSQL_PORT: "3306"
  MYSQL_DB: cgv
  MYSQL_USER: cgv
  KAFKA_BROKER: cgv-kafka-bootstrap.data.svc.cluster.local:9092
  # 한 그룹의 컨슈머 합이 파티션 수를 넘으면 남는 스레드는 배정받을 파티션이 없다.
  #   stg 파티션 8 = 파드 두 대 × 4. 한 대가 빠지면 남은 파드의 네 스레드가 여덟 파티션을 나눠 맡는다.
  SPRING_KAFKA_LISTENER_CONCURRENCY: "4"
  SPRING_KAFKA_LISTENER_ACK_MODE: BATCH
  # ★ 컨슈머가 한 번에 집는 양을 키운다 (2026-09-12).
  #   fetch.min.bytes 기본값은 1 — 브로커에 레코드 하나라도 있으면 바로 돌려준다. 오픈 순간
  #   정원 1,000 이 한꺼번에 차서 1,000건이 1초 안에 도착해도 컨슈머는 도착한 순간의 몇 건만
  #   집는다. 1만 명 판 실측: 배치 크기 p99 9건 · 배치 하나 처리 200ms(JIT 이 덜 데워진 상태) →
  #   8컨슈머 × 9건 ÷ 0.2초 = 초당 360건 → 1,000건에 2.8초 → 뒤쪽 441건이 1초를 넘겼다.
  #   8KB 는 약 80건이다. 버스트에서는 파티션당 125건(약 12KB)이라 한 번에 다 집고,
  #   8 × 125 ÷ 0.2초 = 초당 5,000건 → 0.2초에 소화한다.
  #   평상시(초당 40건)에는 8KB 가 안 모이므로 fetch.max.wait 100ms 뒤에 있는 만큼 돌려준다 —
  #   전파 지연이 최대 100ms 늘어난다(44ms → 144ms). 목표 1초에 여유.
  #   ★ queue 의 풀 콜드스타트를 고치면(redis/client.go) enter 가 9초 → 수십 ms 가 되어 즉시 입장
  #     1,000건의 발행이 9초에 걸쳐 흩어지던 것이 1초 안에 뭉친다. 이 값이 없으면 그 변경만으로
  #     전파가 지금보다 나빠진다 — 그래서 같이 바꾼다.
  #   JIT 은 예열 판으로 못 데운다. 소비 경로는 배치당 한 번 도는데 C2 임계(메서드당 약 1만 회)에
  #     닿으려면 약 9만 명 분량이 필요하다. 그래서 배치 처리 시간을 줄이는 대신 배치 수를 줄인다.
  SPRING_KAFKA_CONSUMER_FETCH_MIN_SIZE: 8KB
  SPRING_KAFKA_CONSUMER_FETCH_MAX_WAIT: 100ms
  # 입장 인증 만료. queue 가 회수 이벤트를 놓쳤을 때의 최후 방어라
  #   queue 의 SESSION_TIMEOUT(300)보다 길어야 한다.
  ADMITTED_TTL: "600"
  SEAT_LOCK_TTL: "180"
  # 파드당 20, 두 대 합 40. 한 대 30 이던 부하 판과 합이 달라진다 —
  #   첫 판에서 풀 대기(hikaricp_connections_pending)와 RDS 연결 수 · CPU 를 같이 본다.
  DB_POOL_SIZE: "20"
  # DDL_AUTO · SEED_ON_START 는 두지 않는다. 스키마와 시드는 Flyway 가 맡고,
  #   booking 기본값 ddl-auto=validate 가 엔티티와 테이블이 맞는지만 본다.
  # dev 와 같다. 2026-09-12 stg 첫 기동에서 한 번 false 로 돌렸다가 되돌렸다 — 접근 로그의 "ms" 값을
  #   밀리초로 읽어 "동시 30 에서 8-24초" 로 잘못 봤는데, 그 값은 마이크로초였다(Tomcat %D).
  #   실제는 8-24ms 이고 ALB 가 잰 파드 응답도 11ms 였다. 플랫폼 스레드로 바꿔도 같은 값이 나왔다.
  VIRTUAL_THREADS: "true"
  # limit 3Gi 의 50% = heap 1536Mi. dev 가 이 비율을 75 에서 50 으로 내린 이유는
  #   limit 을 올리면서도 heap 을 768Mi 에 고정해 이전 판들과 GC 조건을 같게 두려던 것이었다.
  #   여기서는 그 비교가 축이 아니라 heap 이 같이 커지는 것이 의도다.
  # GC 는 G1 으로 적는다. GC 를 따로 안 주면 JVM 이 CPU 2개 이상 · 메모리 약 1,792MB 이상일 때 G1,
  #   아니면 Serial 을 스스로 고른다(컨테이너에서는 limit 을 본다). 이 limit(3Gi)이면 어차피 G1 이지만,
  #   적어 두면 limit 을 내려도 GC 가 조용히 바뀌지 않는다. prd 가 쓸 GC 로 재려는 것이다.
  # ★ dev 는 limit 1536Mi 라 Serial 로 돈다. dev 부하 판의 숫자(CPU 계수 0.72 코어 · GC 멈춤 최대 0.66초 ·
  #   메모리 718Mi-1.5GB)는 Serial 조건에서 잰 것이다. stg 값이 그와 다르면 GC 차이를 먼저 의심한다.
  # 진단 옵션 -Djdk.tracePinnedThreads 는 뺀다 — 한 줄도 안 찍혔다(붙잡힌 것이 아니라는 뜻).
  JAVA_OPTS: "-XX:+UseG1GC -XX:MaxRAMPercentage=50 -Djava.net.preferIPv4Stack=true"
  OTLP_HTTP_ENDPOINT: http://alloy.observability.svc.cluster.local:4318/v1/traces
imageUpdater:
  resolvedImage: 527170477076.dkr.ecr.ap-northeast-2.amazonaws.com/cgv/cgv-onprem/booking
