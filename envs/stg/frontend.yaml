# frontend stg 환경값. 정적 서빙 + /api/movies 캐시 프록시 + 입구 Ingress.
#
# dev 와 갈리는 것이 진입 층이다. 집은 Cloudflare → OPNsense → MetalLB → Traefik 이 받았고
#   여기는 ALB 하나가 받는다. 그래서 className 과 애노테이션이 통째로 바뀐다.
#   도메인·인증서는 안 쓴다 — ALB 기본 DNS 이름과 80 뿐이라 tls 블록도 없다.

image:
  tag: ed6eef00 # 켜는 날 ECR 에 올린 커밋 해시(cgv-onprem main 186df8d7, 2026-09-12). 그 뒤로는 image-updater 가 덮는다
imagePullSecrets: []
env:
  # nginx 설정의 resolver 에 채워진다. 이 클러스터의 CoreDNS 주소다.
  #   서비스 CIDR 172.20.0.0/16 의 열 번째. 집은 10.43.0.10 이라 값 파일에서 갈린다.
  #   이 값이 없으면 렌더 결과에 빈 자리가 남아 nginx 가 설정을 못 읽는다.
  DNS_RESOLVER: "172.20.0.10"
resources:
  # dev 와 같은 모양으로 둔다. 집에서 연결을 받아 주던 것은 Traefik 이고 여기서는 ALB 가
  #   그 자리다 — 이 nginx 가 물려받는 것은 정적 서빙과 /api/movies 프록시뿐이라
  #   연결 수에 비례해 늘어나는 몫이 없다.
  # ★ cpu request 가 00 안에서 두 값으로 적혀 있다 — 파드 스펙 표는 50m, 노드 request 합산은
  #   3×100m 이다. 노드 크기를 정한 쪽 수를 따른다.
  requests: {cpu: 100m, memory: 64Mi}
  limits: {cpu: 500m, memory: 128Mi}
autoscaling:
  enabled: true
  # 캐시가 파드마다 따로 있어 대수가 늘면 booking 으로 나가는 요청도 그만큼 는다.
  #   1대면 그 파드가 재시작할 때 첫 화면이 통째로 멈춘다.
  minReplicas: 2
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70
# 노드와 AZ 양쪽으로 흩는다(envs/stg/queue.yaml 과 같은 이유). 목록을 통째로 덮으므로 hostname 규칙도 다시 적는다.
topologySpreadConstraints:
- maxSkew: 1
  topologyKey: kubernetes.io/hostname
  whenUnsatisfiable: ScheduleAnyway
  labelSelector:
    matchLabels:
      app.kubernetes.io/name: frontend
- maxSkew: 1
  topologyKey: topology.kubernetes.io/zone
  whenUnsatisfiable: ScheduleAnyway
  labelSelector:
    matchLabels:
      app.kubernetes.io/name: frontend
ingress:
  className: alb
  annotations:
    # 인터넷에서 닿는 ALB. 노드가 퍼블릭 서브넷에 있고 서브넷에 kubernetes.io/role/elb 태그가
    #   붙어 있어 컨트롤러가 놓을 자리를 찾는다.
    alb.ingress.kubernetes.io/scheme: internet-facing
    # 파드 IP 를 직접 대상으로 잡는다. VPC CNI 가 파드에 VPC 주소를 주므로 가능하고,
    #   instance 모드처럼 NodePort 를 한 번 더 거치지 않는다.
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
    # Terraform 이 만든 서비스용 보안 그룹 — 인터넷 전체에 80 을 연다(누구나 대기열 · 예매를 쓴다).
    #   Grafana ALB 는 집 공인 IP 만 받는 다른 보안 그룹(cgv-stg-alb-admin)이다. 한 그룹을 같이 쓰면
    #   서비스를 여는 순간 Grafana 도 열린다.
    #   애노테이션이 없으면 컨트롤러가 자기 보안 그룹을 만들어 그 규칙이 안 걸린다.
    #   이름(Name 태그)으로 가리킨다 — 컨트롤러가 ID 와 이름을 둘 다 받는다(v2.13 문서).
    #   켜는 날 안 먹으면 terraform output expected.alb_public_sg 의 ID 로 바꾼다.
    alb.ingress.kubernetes.io/security-groups: cgv-stg-alb-public
    # 초기화 API 두 개를 밖에서 끊는다(dev 의 manifests/public-guard 와 같은 대상).
    #   POST /api/admin/reset(booking) · POST /api/admission/reset(queue) — 둘 다 토큰을 보지만,
    #   아래 경로 규칙의 /api · /api/admission 이 앞을 가르고 있어 인터넷에서 닿는다.
    #   초기화가 필요하면 클러스터 안에서 Service 를 직접 부른다. 403 을 돌려주는 ALB 동작이다.
    alb.ingress.kubernetes.io/actions.deny-admin: '{"type":"fixed-response","fixedResponseConfig":{"contentType":"text/plain","statusCode":"403","messageBody":"forbidden"}}'
    # 위에서 보안 그룹을 지정하면 컨트롤러가 노드 쪽 인바운드 규칙을 자동으로 안 붙인다.
    #   이 값이 있어야 ALB → 파드 경로가 열린다.
    alb.ingress.kubernetes.io/manage-backend-security-group-rules: "true"
    # 대상그룹 헬스체크 경로. 이 Ingress 가 세 서비스로 가르므로(아래 paths) 대상그룹이 셋 생기고,
    #   준비 상태를 보는 경로가 서비스마다 다르다:
    #     frontend /   ·   queue /health/ready   ·   booking /actuator/health/readiness
    #   여기 적은 / 는 frontend 몫이다. queue·booking 은 각자 Service 애노테이션으로 자기 경로를 준다
    #   (envs/stg/queue.yaml · booking.yaml). ALB Controller 는 Service 쪽을 Ingress 쪽보다 우선한다.
    alb.ingress.kubernetes.io/healthcheck-path: /
  # 경로 규칙 — apps/frontend 의 넷 앞에 초기화 API 차단 둘을 둔다. 목록은 통째로 덮으므로 넷도 다시 적는다.
  #   ALB 규칙은 적힌 순서대로 평가된다. 차단이 /api · /api/admission 보다 앞에 있어야 먼저 걸린다.
  #   service 자리의 deny-admin 은 위 actions.deny-admin 애노테이션 이름이고, 포트는 이름 use-annotation 이다.
  # host 를 비워 둔다 — 도메인이 없고, 적으면 그 이름의 Host 헤더로 온 것만 받아
  #   ALB 기본 DNS 이름으로 들어오는 접근이 끊긴다.
  paths:
  - {path: /api/admin, pathType: Prefix, service: deny-admin, portName: use-annotation}
  - {path: /api/admission/reset, pathType: Exact, service: deny-admin, portName: use-annotation}
  - {path: /api/admission, pathType: Prefix, service: queue, port: 8090}
  - {path: /api/movies, pathType: Prefix, service: frontend, port: 8080}
  - {path: /api, pathType: Prefix, service: booking, port: 8091}
  - {path: /, pathType: Prefix, service: frontend, port: 8080}
imageUpdater:
  resolvedImage: 527170477076.dkr.ecr.ap-northeast-2.amazonaws.com/cgv/cgv-onprem/frontend
