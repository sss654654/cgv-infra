# kafka stg 환경값 — 브로커 볼륨과 토픽 파티션.

# ★ 브로커 몫을 잠근다 — request = limit (Guaranteed), 2026-09-13.
#   브로커는 앱 노드에서 queue 와 노드를 나눠 쓴다. 1만 명 판에서 같은 노드의 booking 이 오픈 순간
#   4 vCPU 를 채우자 브로커가 밀려 발행 p99 3.6초 · 레코드가 브로커에 최대 6초 앉아 있었다.
#   그때 브로커 request 250m 은 경합 시 몫이 250 ÷ (1500 + 1500 + 250) = 7% 였다.
#   booking 은 전용 노드로 갔지만, 남은 이웃(queue)이 5만에서 1.0코어까지 오르므로 브로커 몫을
#   1코어로 고정한다. 실사용은 0.15코어라 낭비는 아니고, Guaranteed 는 노드 압박 때 퇴거 순서도 맨 뒤다.
#   메모리는 dev 값(768Mi 요청 · 1536Mi 상한)을 상한으로 맞춘다 — Guaranteed 는 둘 다 같아야 한다.
cluster:
  resources:
    requests: { cpu: "1", memory: 1536Mi }
    limits: { cpu: "1", memory: 1536Mi }

storage:
  # 보존 상한 최악이 51GiB 다(아래 계산). 여유를 두고 60Gi.
  #   180GB(브로커 셋)를 8시간 켜면 약 $0.16 이라 볼륨을 키우는 쪽이 싸다 —
  #   보존을 줄이면 dev 와 브로커 조건이 갈려 부하 결과에서 무엇이 달랐는지 하나 더 따져야 한다.
  size: 60Gi
  # EBS CSI 애드온은 StorageClass 를 안 만든다. 허브가 cluster-stg 로 gp3 를 넣는다(manifests/storage-ebs) —
  #   이 이름이 없으면 PVC 가 영구 Pending 이고 브로커가 안 뜬다.
  class: gp3

# 브로커를 AZ 마다 하나씩 둔다(Terraform 이 AZ 셋에 서브넷을 만든다). 어느 AZ 가 죽어도
#   브로커 둘이 남아 컨트롤러 과반과 min.insync.replicas 2 가 성립한다.
#   AZ 둘에 셋을 나누면 한쪽에 둘이 가고, 그쪽이 죽으면 발행이 멈춘다.
zoneSpread: true

# queue 의 HPA 상한이 이 환경에서 8이다(노드가 m5.xlarge 라 자리가 생겼다).
#   booking 은 파드 두 대 × SPRING_KAFKA_LISTENER_CONCURRENCY 4 = 컨슈머 8 로 짝을 맞춘다.
partitions: 8

# 보존 상한 확인 — RF3 · 브로커 셋이라 한 대가 전 토픽의 파티션을 다 든다.
#   admissions · revoked · completed 각 8파티션 × 2GiB = 48GiB
#   + admissions.DLT 2GiB + admissions-revoked.DLT 1GiB = 51GiB
#   위 volume 60Gi 아래다.
