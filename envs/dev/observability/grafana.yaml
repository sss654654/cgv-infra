# grafana dev 환경값 — 진입 · 알림 발송처 · 이미지 렌더러.

# 알림에 실려 가는 링크(대시보드·패널·무음처리)를 Grafana 가 이 값으로 만든다.
#   비워 두면 자기가 듣는 내부 주소(:3000)를 그대로 써서, 알림에서 누르면 열리지 않는다
#   — 실제 서비스는 Traefik 이 80 으로 받는다. 알림의 링크가 무용지물이면 폰에서 볼 방법이 없다.
grafana.ini:
  server:
    root_url: http://grafana.cgv.lan
  # 렌더러가 떠 있어도 이 스위치가 꺼져 있으면 알림에 그림이 안 붙는다 —
  #   Grafana 는 알림용 화면 캡처를 기본으로 하지 않는다.
  unified_alerting.screenshots:
    capture: true
    # 렌더 제한시간. 기본 10초인데 부팅 직후처럼 노드가 붐비는 구간에서 초과해
    #   그림 없이 텍스트만 나갔다. 평시 실측 5.4-7.7초의 약 4배로 잡는다.
    #   초과해도 알림 자체는 텍스트로 발송된다 - 잃는 것은 그림이고 발송이 그만큼 늦어진다.
    capture_timeout: 30s

# 이름으로 접근한다 — Traefik 이 Host 헤더를 보고 이 서비스로 보낸다.
# hosts 가 리스트인 것은 이 차트 스키마다(argo-cd 차트는 hostname 문자열 하나를 받는다).
ingress:
  enabled: true
  ingressClassName: traefik
  # 이 라우터를 web(80) 에만 붙인다. websecure(443) 에는 붙지 않는다.
  #   Traefik 은 요청의 Host 헤더로 대상을 가르는데 그 헤더는 보내는 쪽이 적는 값이라
  #   검증할 수 없다. 공유기가 443 만 인터넷에 열므로, 이 라우터를 443 에서 빼면
  #   Host 를 grafana.cgv.lan 으로 적어 보내도 매칭될 라우터가 없다.
  #   관리 접근은 WireGuard 터널을 거쳐 80 으로 들어온다.
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
  path: /
  pathType: Prefix
  hosts:
    - grafana.cgv.lan

# Discord webhook URL 을 환경변수로 넣는다. 알림 프로비저닝 파일에서 $__env{} 로 읽는다 —
#   URL 자체가 자격이라(아는 사람은 누구나 그 채널에 쓸 수 있다) 파일에 평문으로 두지 않는다.
envValueFrom:
  DISCORD_WEBHOOK_URL:
    secretKeyRef:
      name: grafana-discord-webhook
      key: url

# 알림 프로비저닝은 별도 ConfigMap 으로 둔다(manifests/alerting).
#   차트가 values 의 alerting 키에 Helm tpl 을 돌려, 알림 템플릿의 {{ }} 를 Grafana 가 아니라
#   Helm 이 먼저 해석하려다 렌더가 실패한다. ConfigMap 에 두면 문자열 그대로 전달된다.
#   ⚠️ 마운트라 이 ConfigMap 이 없으면 파드가 FailedMount 로 안 뜬다 —
#      alerting Application 이 관측 스택보다 앞 파도에 있어야 한다.
extraConfigmapMounts:
  - name: alerting
    mountPath: /etc/grafana/provisioning/alerting
    configMap: grafana-alerting
    readOnly: true

# 이미지 렌더러 — 알림에 패널 그림을 붙이는 별도 파드(헤드리스 크로미움).
#   Grafana 는 링크만 보내고 그림은 못 그린다. 렌더러가 Grafana 를 다시 호출해 화면을 찍으므로
#   두 주소를 서로 알려줘야 한다(renderingCallbackURL 이 렌더러 → Grafana).
imageRenderer:
  enabled: true
  replicas: 1
  resources:
    # limit 384Mi 로 시작했다가 렌더 요청마다 OOMKilled(exit 137) 로 죽었다 —
    #   대기 중에는 파드가 멀쩡히 살아 있고 헬스체크도 통과하는데, 화면을 그리는 순간
    #   크로미움이 뜨면서 한 번에 튄다. Grafana 쪽에는 "요청 실패(EOF·connection refused)"
    #   로만 보여서 원인이 렌더러 안에 있다는 것이 로그 밖에서는 안 드러난다.
    # 실측(2026-08-24): 대기 88Mi · 렌더 중 peak 591Mi. 옛 상한 384Mi 는 peak 의 65% 였다.
    #   request 128Mi — 대기값 88Mi 기준. 스케줄 여유가 빠듯한 노드라 안 쓰는 몫을
    #     예약해 두면 다른 파드가 못 들어온다.
    #   limit 768Mi — peak 591Mi 의 130%. 이 파드가 밀려나도 잃는 것은 알림의 그림뿐이고
    #     알림 자체는 텍스트로 계속 간다.
    #   패널 하나 렌더에 6-8초가 걸린다 — 알림이 그만큼 늦게 나간다.
    requests: { cpu: 50m, memory: 128Mi }
    limits:   { memory: 768Mi }
  renderingCallbackURL: http://grafana.observability.svc.cluster.local/
