# MetalLB 자원. controller는 네임스페이스마다 IP 풀을 reconcile해서, 네임스페이스가 늘면
# 메모리도 는다. 초기 limit 64Mi는 install.sh 직후(ns 적음)엔 버텼지만 GitOps로 ns가
# 10여 개로 늘자 OOMKilled로 반복 재시작했다(2026-07-28 실측, exit 137).
#
# ★ 2026-08-15 — frr-k8s 를 끈다. 이 클러스터는 L2 만 쓴다.
#   manifests/metallb/pool.yaml 이 IPAddressPool + L2Advertisement 둘뿐이고
#   BGPPeer·BGPAdvertisement·BFDProfile 은 저장소 전수 0건이다. L2 광고는 speaker 가
#   ARP 로 직접 하므로 BGP 백엔드가 하는 일이 없다.
#   켜져 있던 이유는 판단이 아니라 차트 기본값 frrk8s.enabled: true 이고 우리 values 에
#   그 키가 없어서다. 실측 2026-08-15 기준 컨테이너 16개 · 337 MiB 를 쓰고 있었다.
#   requests 회수는 0 이다 — frr-k8s 는 req 0 이라 스케줄러 장부에 안 잡혀 있었다.
#   이 변경이 주는 것은 실 RAM 과 파드 수다.
#   되살릴 조건: BGP 로 광고해야 하는 네트워크로 옮길 때(L2 는 VIP 를 노드 하나가 소유해
#   그 노드가 관문이 된다 — 그 제약을 벗어나려면 BGP 가 필요하다).
frrk8s:
  enabled: false
controller:
  resources:
    # request 128Mi: 평시 실측 106Mi(2026-08-17)가 이전 request 32Mi의 330%였다.
    #   평시 사용이 request를 넘는 파드는 노드 메모리 압박 시 퇴거 랭킹 앞순위로 묶인다.
    # limit 192Mi 유지 — reconcile 대상(Service·ns)이 늘 때의 버스트 몫(평시의 55%).
    # 부하 판 실측 47Mi.
    requests: { cpu: 50m, memory: 64Mi }
    limits:   { cpu: 100m, memory: 192Mi }
speaker:
  resources:
    # request 96Mi: 평시 실측 약 78Mi(2026-08-17)가 이전 request 32Mi의 245%였다.
    # limit 128→192Mi: 들고 있는 EndpointSlice가 파드 수에 비례하는데 부하 테스트에서
    #   replica를 늘린다. 여기서 OOMKill이 나면 VIP의 ARP 광고가 끊겨
    #   클러스터 진입 자체가 막히므로 한 단계 여유를 둔다.
    # 부하 판 실측 33Mi (3노드 동일).
    requests: { cpu: 50m, memory: 64Mi }
    limits:   { cpu: 100m, memory: 192Mi }
