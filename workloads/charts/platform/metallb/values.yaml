# MetalLB 자원. controller는 네임스페이스마다 IP 풀을 reconcile해서, 네임스페이스가 늘면
# 메모리도 는다. 초기 64Mi는 install.sh 직후(ns 적음)엔 버텼지만 GitOps로 ns가 10여 개로
# 늘자 OOMKilled로 반복 재시작했다(2026-07-28 실측, exit 137). request는 평소값 유지하고
# limit만 버스트 여유로 올린다.
#
# ★ 2026-08-15 — frr-k8s 를 끈다. 이 클러스터는 L2 만 쓴다.
#   manifests/metallb/pool.yaml 이 IPAddressPool + L2Advertisement 둘뿐이고
#   BGPPeer·BGPAdvertisement·BFDProfile 은 저장소 전수 0건이다. L2 광고는 speaker 가
#   ARP 로 직접 하므로 BGP 백엔드가 하는 일이 없다.
#   켜져 있던 이유는 판단이 아니라 차트 기본값 frrk8s.enabled: true 이고 우리 values 에
#   그 키가 없어서다. 실측 2026-08-15 기준 컨테이너 16개 · 337 MiB 를 쓰고 있었다.
#   requests 회수는 0 이다 — frr-k8s 는 req 0 이라 스케줄러 장부에 안 잡혀 있었다.
#   이 변경이 주는 것은 실 RAM 과 파드 수다.
#   되살릴 조건: BGP 로 광고해야 하는 네트워크로 옮길 때(L2 는 VIP 를 노드 하나가 소유해
#   그 노드가 관문이 된다 — 그 제약을 벗어나려면 BGP 가 필요하다).
frrk8s:
  enabled: false
controller:
  resources:
    requests: { cpu: 50m, memory: 32Mi }
    # 실측 peak 94-97MiB 로 128Mi 의 76%. Service·네임스페이스가 늘수록 오르므로 여유를 준다.
    limits:   { cpu: 100m, memory: 192Mi }
speaker:
  resources:
    requests: { cpu: 50m, memory: 32Mi }
    # 실측 peak 51-54MiB 로 64Mi 의 83%. 들고 있는 EndpointSlice 가 파드 수에 비례하는데
    #   부하 계단에서 파드를 늘릴 예정이라 그때 넘는다. 여기서 OOMKill 이 나면 VIP 의 ARP
    #   광고가 끊겨 클러스터 진입 자체가 막힌다.
    limits:   { cpu: 100m, memory: 128Mi }
