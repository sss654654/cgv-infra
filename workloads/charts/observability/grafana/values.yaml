# grafana/grafana 10.5.15 (Grafana 12.3.1) — 내부 접근(ClusterIP), 데이터소스 프로비저닝.
# admin 크레덴셜: grafana-admin(SealedSecret) 필요, 키 admin-user / admin-password.
# 데이터소스 URL은 각 차트 릴리스명=컴포넌트명 가정 — 배포 후 실제 서비스명 확인(특히 mimir 게이트웨이명).
replicas: 1
resources:
  # request 384Mi: 평시 실측 322Mi(2026-08-17)가 이전 request 256Mi의 126% —
  #   대시보드·패널이 늘며 상주 메모리가 따라 올랐다. limit 512Mi 유지(평시의 63%).
  requests: { cpu: 100m, memory: 384Mi }
  limits:   { cpu: 500m, memory: 512Mi }
deploymentStrategy:
  type: Recreate
admin:
  existingSecret: grafana-admin
  userKey: admin-user
  passwordKey: admin-password
service:
  enabled: true
  type: ClusterIP
  port: 80
# 이름으로 접근한다 — Traefik이 Host 헤더를 보고 이 서비스로 보낸다.
# hosts가 리스트인 것은 이 차트 스키마다(argo-cd 차트는 hostname 문자열 하나를 받는다 — 옮겨 쓰면 무시된다).
ingress:
  enabled: true
  ingressClassName: traefik
  path: /
  pathType: Prefix
  hosts:
    - grafana.cgv.lan
persistence:
  enabled: false                     # 의도적 비영속 — 대시보드·데이터소스 전부 코드로 관리해 sqlite에 보존할 상태가 없음.
                                     #   재시작하면 코드에서 재프로비저닝. (UI에서 손으로 만든 대시보드는 날아간다 — as-code 강제 장치.)
# 대시보드 배달: grafana_dashboard 라벨이 붙은 ConfigMap을 sidecar가 파일로 떨어뜨리고 Grafana가 읽는다.
#   대시보드 정본 = workloads/manifests/dashboards/ (argocd/applications/dashboards.yaml 이 배달).
#   비영속과 짝이다 — 영속 저장소가 없으므로 이 경로가 유일한 대시보드 공급원이다.
# searchNamespace를 릴리스 네임스페이스로 한정한다. ALL로 두면 클러스터 전역 ConfigMap을 감시하느라
#   RBAC이 전 네임스페이스로 넓어진다(대시보드는 observability에만 둔다).
sidecar:
  dashboards:
    enabled: true
    label: grafana_dashboard
    labelValue: "1"
    searchNamespace: observability
    folderAnnotation: grafana_folder   # ConfigMap에 이 annotation을 달면 Grafana 폴더로 분류된다
    provider:
      foldersFromFilesStructure: true
  # sidecar 자원. 명시해 두지 않으면 request 0으로 스케줄된다.
  # limit 64Mi로 잡았다가 기동 직후 OOMKilled(exit 137) 반복 — 감시만 하는 컨테이너로
  #   보이지만 쿠버네티스 watch 연결과 파이썬 런타임을 들고 있어 그보다 쓴다.
  # request 128Mi: 평시 실측 91Mi(2026-08-17)가 이전 request 64Mi의 142%였다.
  resources:
    requests: { cpu: 10m, memory: 128Mi }
    limits:   { cpu: 100m, memory: 192Mi }
datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      # 세 데이터소스를 서로 잇는다. 신호는 원래 이어져 있었다 — 로그 줄에 trace_id 가 이미 찍히고
      #   히스토그램에 exemplar 가 실려 온다. 이 설정이 없으면 그 연결을 화면에서 못 건넌다.
      #   지표 → 트레이스 → 로그 → 트레이스 왕복이 아래 세 블록으로 열린다.
      - name: Mimir
        uid: mimir
        type: prometheus
        access: proxy
        url: http://mimir-gateway.observability.svc.cluster.local/prometheus
        isDefault: true
        jsonData:
          httpMethod: POST
          # p99 그래프의 점 → 그 요청의 트레이스. name 은 exemplar 에 실려 오는 라벨 이름이라
          #   앱이 붙이는 이름과 글자까지 같아야 한다(Micrometer 기본·queue 수동 계측 모두 trace_id).
          # Mimir 쪽에 limits.max_global_exemplars_per_user 가 있어야 점 자체가 저장된다.
          exemplarTraceIdDestinations:
            - name: trace_id
              datasourceUid: tempo
      - name: Loki
        uid: loki
        type: loki
        access: proxy
        url: http://loki-gateway.observability.svc.cluster.local
        jsonData:
          # 로그 줄 → 그 트레이스. 두 서비스가 키 이름이 달라 하나의 정규식으로 받는다 —
          #   queue(slog) 는 trace_id, booking(logback MDC) 은 traceId 로 찍는다.
          # url 의 $$ 는 이스케이프다. Grafana 는 프로비저닝 파일을 읽을 때 ${...} 를
          #   환경변수 자리로 보고, 그런 변수가 없으면 빈 문자열로 바꿔서 저장한다.
          #   $ 하나로 쓰면 url 이 "" 가 되어 링크가 trace ID 없이 열린다(파일에는 원문이
          #   남아 있어 코드만 봐서는 안 보인다 — /api/datasources/uid/loki 로 확인한다).
          derivedFields:
            - name: TraceID
              matcherRegex: '"trace_?[iI]d":"([a-f0-9]+)"'
              url: '$${__value.raw}'
              datasourceUid: tempo
              urlDisplayLabel: 트레이스 열기
      - name: Tempo
        uid: tempo
        type: tempo
        access: proxy
        url: http://tempo.observability.svc.cluster.local:3200
        jsonData:
          # 트레이스의 한 span → 그 시각 로그. 라벨이 아니라 줄 내용에서 trace_id 를 찾는다
          #   (trace_id 를 라벨로 올리면 값이 무한해 카디널리티가 터진다).
          # 그래서 라벨 매칭 대신 customQuery 로 네임스페이스만 좁히고 줄 필터를 건다.
          # 시간창 ±5분 — span 시각 그대로 자르면 경계에 걸린 줄이 빠진다.
          # query 의 $$ 는 위 derivedFields 와 같은 이스케이프다. $ 하나면 필터가 |= "" 로
          #   저장되어 네임스페이스 전체 로그가 나온다 — 그 요청과 무관한 줄이 뜨는데
          #   화면에는 정상으로 보인다.
          # 여는 것은 span 하나가 아니라 그 trace 전체의 로그다. connection·query·redis span 은
          #   라이브러리가 만들어 앱 로그가 없고, 로그가 있는 자리는 Kafka 를 넘는 소비 쪽이라
          #   span 단위로 좁히면 대부분의 span 에서 0건이 된다.
          tracesToLogsV2:
            datasourceUid: loki
            spanStartTimeShift: '-5m'
            spanEndTimeShift: '5m'
            customQuery: true
            query: '{namespace="app"} |= "$${__span.traceId}"'

# Discord webhook URL을 환경변수로 넣는다. 알림 프로비저닝 파일에서 $__env{}로 읽는다 —
#   URL 자체가 자격이라(아는 사람은 누구나 그 채널에 쓸 수 있다) 파일에 평문으로 두지 않는다.
envValueFrom:
  DISCORD_WEBHOOK_URL:
    secretKeyRef:
      name: grafana-discord-webhook
      key: url

# 알림 — 발송처·라우팅·룰을 코드로 둔다.
#   persistence.enabled=false 라 UI에서 만든 룰은 파드가 재시작하면 사라진다. 이 경로가 유일한 정본이다.
#
# 무엇을 알릴지의 기준 둘: 울리면 지금 할 행동이 있나, 안 울리면 되돌릴 수 없나.
#   이 기준으로 거르면 전부 호스트 하드웨어 축이 된다 — 클러스터·앱 층은 재기동으로 회복되지만
#   물리 층(과열·전원 상실·디스크 사망)만 되돌릴 수 없다.
# 앱 지연·5xx는 넣지 않는다 — 정상 범위를 아직 모른다. 임계는 부하 실측 뒤에 정한다.
#   근거 없는 임계는 오탐이 되고, 오탐은 알림 전체를 무시하게 만든다.
#
# 데이터 없음(No Data) 처리를 나눈다: 감시 경로 끊김 룰만 발화시키고 나머지는 발화하지 않는다.
#   나머지 넷은 전부 호스트 스크레이프 하나에 매달려 있어, 그게 막히면 넷이 동시에 No Data가 된다.
#   전부 발화로 두면 알림 넷이 한꺼번에 쏟아져 원인이 묻힌다.
#
# 남는 구멍(룰로 못 메움): 호스트가 완전히 꺼지면 이 알림들도 같이 죽는다 —
#   Grafana가 그 호스트 위 클러스터에 있기 때문이다. 그 구간은 밖에서 보는 프로브가 맡는다.
# 밤 예약 종료 시간대 억제(mute timing)는 스케줄을 정한 뒤 더한다 — 안 하면 매일 밤 오발한다.
#
# ⚠️ 지금 이 파일의 룰 임계는 **발화 검증용**이다. 안 울려 본 알림은 없는 것과 같아서,
#    다섯 개가 실제로 폰까지 닿는지 먼저 확인한다. 각 조건을 지금 값에서 바로 참이 되게
#    뒤집어 뒀고(`⚠️ 발화 검증용` 표시), 지속 시간도 1분으로 줄였다.
#    확인이 끝나면 표시된 자리를 정상값으로 되돌린다.
alerting:
  contactpoints.yaml:
    apiVersion: 1
    contactPoints:
      - orgId: 1
        name: discord
        receivers:
          - uid: discord-webhook
            type: discord
            settings:
              url: $__env{DISCORD_WEBHOOK_URL}

  policies.yaml:
    apiVersion: 1
    policies:
      - orgId: 1
        receiver: discord
        # alertname으로 묶는다 — 같은 룰이 여러 인스턴스로 발화해도 알림은 하나로 온다.
        group_by: [alertname]
        group_wait: 30s        # 첫 발화를 30초 모아 보낸다(연쇄 발화를 한 번에)
        group_interval: 5m     # 같은 묶음에 새 알림이 붙으면 5분 간격으로
        repeat_interval: 4h    # 해결 안 되면 4시간마다 다시 — 자는 동안 잊히지 않게

  rules.yaml:
    apiVersion: 1
    groups:
      - orgId: 1
        name: hypervisor
        folder: 알림
        interval: 1m
        rules:
          # 1. 과열 — 이 호스트를 실제로 죽인 원인. 평시 66°C 실측(팬·뚜껑·거버너 조치 후)이라
          #    90°C는 조치가 풀렸거나 부하가 걸린 상태다. 5분 지속으로 순간 스파이크를 거른다.
          #    하드웨어 임계는 110°C — 닿으면 스스로 꺼진다.
          - uid: hv-cpu-overheat
            title: CPU 과열
            condition: B
            for: 1m                                  # ⚠️ 발화 검증용(정상값 5m)
            noDataState: OK
            execErrState: Alerting
            labels: { severity: critical }
            annotations:
              # 알림에 이 패널을 렌더해 붙인다 — 온도가 언제부터 올랐는지는 숫자가 아니라 곡선이 답한다.
              __dashboardUid__: hypervisor-overview
              __panelId__: "9"
              summary: 호스트 CPU 패키지 온도가 90°C를 5분 넘게 유지한다
              description: 호스트 하드웨어 대시보드 행1에서 온도 추이와 클럭을 본다. 클럭이 높으면 거버너가 performance로 돌아갔거나 부하가 걸린 것이고, 클럭·CPU 사용률이 정상인데 온도만 높으면 물리 냉각(팬 정지·뚜껑 닫힘)이다.
            data:
              - refId: A
                relativeTimeRange: { from: 300, to: 0 }
                datasourceUid: mimir
                model:
                  refId: A
                  instant: true
                  expr: node_hwmon_temp_celsius{job="hypervisor", chip="platform_coretemp_0", sensor="temp1"}
              - refId: B
                relativeTimeRange: { from: 300, to: 0 }
                datasourceUid: __expr__
                model:
                  refId: B
                  type: threshold
                  expression: A
                  conditions:
                    - evaluator: { type: gt, params: [60] }   # ⚠️ 발화 검증용(정상값 90)

          # 2. AC 끊김 — 노트북 배터리가 내장 UPS라 즉시 죽지 않고 유예가 있다.
          #    그 유예 안에 꽂으면 살고, 놓치면 방전으로 전부 내려간다.
          #    2분 지속 — 순간적인 어댑터 인식 흔들림을 거른다.
          - uid: hv-ac-lost
            title: AC 전원 끊김
            condition: B
            for: 1m                                  # ⚠️ 발화 검증용(정상값 2m)
            noDataState: OK
            execErrState: Alerting
            labels: { severity: critical }
            annotations:
              __dashboardUid__: hypervisor-overview
              __panelId__: "13"
              summary: 어댑터 전원이 끊겨 배터리로 돌고 있다
              description: 대시보드 행2에서 배터리 기울기로 남은 시간을 본다. 플러그·정전·어댑터를 확인한다.
            data:
              - refId: A
                relativeTimeRange: { from: 300, to: 0 }
                datasourceUid: mimir
                model:
                  refId: A
                  instant: true
                  expr: node_power_supply_online{job="hypervisor", power_supply="ADP1"}
              - refId: B
                relativeTimeRange: { from: 300, to: 0 }
                datasourceUid: __expr__
                model:
                  refId: B
                  type: threshold
                  expression: A
                  conditions:
                    - evaluator: { type: gt, params: [0] }    # ⚠️ 발화 검증용(정상값 lt 1)

          # 3. 배터리 잔량 — AC 끊김의 마지막 단계다. 행동이 다르므로 룰을 나눈다:
          #    AC 끊김은 "가서 꽂아라", 이건 "지금 정상 종료시켜라".
          #    갑자기 전원이 끊기면 etcd·MySQL이 깨진 상태로 남는다.
          - uid: hv-battery-low
            title: 배터리 잔량 부족
            condition: B
            for: 1m
            noDataState: OK
            execErrState: Alerting
            labels: { severity: critical }
            annotations:
              __dashboardUid__: hypervisor-overview
              __panelId__: "13"
              summary: 배터리가 20% 아래다 — 정상 종료를 결정할 시점
              description: AC가 아직 안 들어오면 강제 차단 전에 정상 종료시킨다.
            data:
              - refId: A
                relativeTimeRange: { from: 300, to: 0 }
                datasourceUid: mimir
                model:
                  refId: A
                  instant: true
                  expr: node_power_supply_capacity{job="hypervisor", power_supply="BAT0"}
              - refId: B
                relativeTimeRange: { from: 300, to: 0 }
                datasourceUid: __expr__
                model:
                  refId: B
                  type: threshold
                  expression: A
                  conditions:
                    - evaluator: { type: lt, params: [101] }  # ⚠️ 발화 검증용(정상값 20)

          # 4. 주 디스크 자가진단 — Proxmox와 VM 3대가 전부 이 외장 USB SSD 한 장 위에 있다.
          #    진단이 아니라 대피 신호다: 어느 속성이 넘었든 할 일은 하나 —
          #    아직 읽히는 동안 백업을 다른 매체로 빼고 교체를 준비한다.
          #    한계: 이 컨트롤러가 재할당 섹터·수명 속성을 USB 너머로 안 넘겨 판정이 좁다.
          #    그래서 정상이 안전을 보증하지 못하고, 실제 대비는 백업이 받는다.
          - uid: hv-disk-smart
            title: 주 디스크 SMART 이상
            condition: B
            for: 1m                                  # ⚠️ 발화 검증용(정상값 5m)
            noDataState: OK
            execErrState: Alerting
            labels: { severity: critical }
            annotations:
              # 판정은 넘었다는 사실만 준다. 어느 정도인지는 판정을 좌우하는 점수 패널이 답한다.
              __dashboardUid__: hypervisor-overview
              __panelId__: "24"
              summary: 주 디스크(sda)가 자가진단에서 이상을 보고했다
              description: 홈랩 전부가 이 디스크 위에 있다. 봉인 키·백업·스냅샷을 다른 매체로 옮기고 교체를 준비한다.
            data:
              - refId: A
                relativeTimeRange: { from: 600, to: 0 }
                datasourceUid: mimir
                model:
                  refId: A
                  instant: true
                  expr: smartmon_device_smart_healthy{job="hypervisor", disk="/dev/sda"}
              - refId: B
                relativeTimeRange: { from: 600, to: 0 }
                datasourceUid: __expr__
                model:
                  refId: B
                  type: threshold
                  expression: A
                  conditions:
                    - evaluator: { type: gt, params: [0] }    # ⚠️ 발화 검증용(정상값 lt 1)

          # 5. 감시 경로 끊김 — 위 넷이 전부 이 스크레이프 하나에 매달려 있다.
          #    이게 막히면 넷이 조용해지고, 그 조용함이 정상으로 읽힌다.
          #    잡는 것은 "호스트 사망"이 아니라 "호스트를 보는 눈이 막힘"이다 —
          #    node-exporter 정지, 또는 재구성 후 방화벽에 호스트 경로가 안 열린 경우.
          #    이 룰만 No Data를 발화로 둔다(Alloy 자체가 멈추면 up 계열이 통째로 사라진다).
          - uid: hv-scrape-down
            title: 호스트 감시 경로 끊김
            condition: B
            for: 1m                                  # ⚠️ 발화 검증용(정상값 5m)
            noDataState: Alerting
            execErrState: Alerting
            labels: { severity: warning }
            annotations:
              summary: 호스트 node-exporter 스크레이프가 끊겼다 — 온도·전원·디스크 감시가 멈춘 상태
              description: 관측 파이프라인 대시보드의 job별 생존에서 이 호스트만 끊겼는지 확인한다. Proxmox 웹UI(:8006)가 열리면 호스트는 살아 있고 경로나 exporter 문제다.
            data:
              - refId: A
                relativeTimeRange: { from: 300, to: 0 }
                datasourceUid: mimir
                model:
                  refId: A
                  instant: true
                  expr: up{job="hypervisor"}
              - refId: B
                relativeTimeRange: { from: 300, to: 0 }
                datasourceUid: __expr__
                model:
                  refId: B
                  type: threshold
                  expression: A
                  conditions:
                    - evaluator: { type: gt, params: [0] }    # ⚠️ 발화 검증용(정상값 lt 1)

# self-metric: Grafana 자신의 상태(데이터소스 응답·로그인·대시보드 렌더).
serviceMonitor:
  enabled: true
