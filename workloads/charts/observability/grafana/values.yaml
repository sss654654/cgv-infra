# grafana/grafana 10.5.15 (Grafana 12.3.1) — 내부 접근(ClusterIP), 데이터소스 프로비저닝.
# admin 크레덴셜: grafana-admin(SealedSecret) 필요, 키 admin-user / admin-password.
# 데이터소스 URL은 각 차트 릴리스명=컴포넌트명 가정 — 배포 후 실제 서비스명 확인(특히 mimir 게이트웨이명).
replicas: 1
resources:
  # request 384Mi: 평시 실측 322Mi(2026-08-17)가 이전 request 256Mi의 126% —
  #   대시보드·패널이 늘며 상주 메모리가 따라 올랐다. limit 512Mi 유지(평시의 63%).
  requests: { cpu: 100m, memory: 384Mi }
  limits:   { cpu: 500m, memory: 512Mi }
deploymentStrategy:
  type: Recreate
admin:
  existingSecret: grafana-admin
  userKey: admin-user
  passwordKey: admin-password
service:
  enabled: true
  type: ClusterIP
  port: 80
# 이름으로 접근한다 — Traefik이 Host 헤더를 보고 이 서비스로 보낸다.
# hosts가 리스트인 것은 이 차트 스키마다(argo-cd 차트는 hostname 문자열 하나를 받는다 — 옮겨 쓰면 무시된다).
ingress:
  enabled: true
  ingressClassName: traefik
  path: /
  pathType: Prefix
  hosts:
    - grafana.cgv.lan
persistence:
  enabled: false                     # 의도적 비영속 — 대시보드·데이터소스 전부 코드로 관리해 sqlite에 보존할 상태가 없음.
                                     #   재시작하면 코드에서 재프로비저닝. (UI에서 손으로 만든 대시보드는 날아간다 — as-code 강제 장치.)
# 대시보드 배달: grafana_dashboard 라벨이 붙은 ConfigMap을 sidecar가 파일로 떨어뜨리고 Grafana가 읽는다.
#   대시보드 정본 = workloads/manifests/dashboards/ (argocd/applications/dashboards.yaml 이 배달).
#   비영속과 짝이다 — 영속 저장소가 없으므로 이 경로가 유일한 대시보드 공급원이다.
# searchNamespace를 릴리스 네임스페이스로 한정한다. ALL로 두면 클러스터 전역 ConfigMap을 감시하느라
#   RBAC이 전 네임스페이스로 넓어진다(대시보드는 observability에만 둔다).
sidecar:
  dashboards:
    enabled: true
    label: grafana_dashboard
    labelValue: "1"
    searchNamespace: observability
    folderAnnotation: grafana_folder   # ConfigMap에 이 annotation을 달면 Grafana 폴더로 분류된다
    provider:
      foldersFromFilesStructure: true
  # sidecar 자원. 명시해 두지 않으면 request 0으로 스케줄된다.
  # limit 64Mi로 잡았다가 기동 직후 OOMKilled(exit 137) 반복 — 감시만 하는 컨테이너로
  #   보이지만 쿠버네티스 watch 연결과 파이썬 런타임을 들고 있어 그보다 쓴다.
  # request 128Mi: 평시 실측 91Mi(2026-08-17)가 이전 request 64Mi의 142%였다.
  resources:
    requests: { cpu: 10m, memory: 128Mi }
    limits:   { cpu: 100m, memory: 192Mi }
datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Mimir
        uid: mimir
        type: prometheus
        access: proxy
        url: http://mimir-gateway.observability.svc.cluster.local/prometheus
        isDefault: true
        jsonData: { httpMethod: POST }
      - name: Loki
        uid: loki
        type: loki
        access: proxy
        url: http://loki-gateway.observability.svc.cluster.local
      - name: Tempo
        uid: tempo
        type: tempo
        access: proxy
        url: http://tempo.observability.svc.cluster.local:3200

# self-metric: Grafana 자신의 상태(데이터소스 응답·로그인·대시보드 렌더).
serviceMonitor:
  enabled: true
