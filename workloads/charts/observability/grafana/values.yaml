# grafana/grafana 10.5.15 (Grafana 12.3.1) — 내부 접근(ClusterIP), 데이터소스 프로비저닝.
# admin 크레덴셜: grafana-admin(SealedSecret) 필요, 키 admin-user / admin-password.
# 데이터소스 URL은 각 차트 릴리스명=컴포넌트명 가정 — 배포 후 실제 서비스명 확인(특히 mimir 게이트웨이명).
replicas: 1
resources:
  # request 384Mi: 평시 실측 322Mi(2026-08-17)가 이전 request 256Mi의 126% —
  #   대시보드·패널이 늘며 상주 메모리가 따라 올랐다. limit 512Mi 유지(평시의 63%).
  requests: { cpu: 100m, memory: 384Mi }
  limits:   { cpu: 500m, memory: 512Mi }
deploymentStrategy:
  type: Recreate
# 알림에 실려 가는 링크(대시보드·패널·무음처리)를 Grafana 가 이 값으로 만든다.
#   비워 두면 자기가 듣는 내부 주소(:3000)를 그대로 써서, 알림에서 누르면 열리지 않는다
#   — 실제 서비스는 Traefik 이 80 으로 받는다. 알림의 링크가 무용지물이면 폰에서 볼 방법이 없다.
# 알림 렌더 이미지 — 별도 렌더러 서비스가 패널을 그려 알림에 첨부한다.
#   Grafana 는 링크만 보내고 그림은 못 그린다(헤드리스 브라우저가 필요하다).
#   렌더러가 Grafana 를 다시 호출해 화면을 찍으므로 두 주소를 서로 알려줘야 한다:
#     renderer.renderingCallbackURL  렌더러 -> Grafana (클러스터 내부 주소)
#     rendererServiceName            Grafana -> 렌더러
#   VPN 이 서면 알림의 링크만으로도 폰에서 대시보드를 열 수 있어 이미지의 값이 줄어든다.
#   그때 이 블록을 지우면 자원(헤드리스 브라우저 몫)이 돌아온다.
grafana.ini:
  server:
    root_url: http://grafana.cgv.lan
  # 렌더러가 떠 있어도 이 스위치가 꺼져 있으면 알림에 그림이 안 붙는다 —
  #   Grafana 는 알림용 화면 캡처를 기본으로 하지 않는다.
  unified_alerting.screenshots:
    capture: true
    # 렌더 제한시간. 기본 10초인데 부팅 직후처럼 노드가 붐비는 구간에서 초과해
    #   그림 없이 텍스트만 나갔다. 평시 실측 5.4-7.7초의 약 4배로 잡는다.
    #   초과해도 알림 자체는 텍스트로 발송된다 - 잃는 것은 그림이고 발송이 그만큼 늦어진다.
    capture_timeout: 30s
admin:
  existingSecret: grafana-admin
  userKey: admin-user
  passwordKey: admin-password
service:
  enabled: true
  type: ClusterIP
  port: 80
# 이름으로 접근한다 — Traefik이 Host 헤더를 보고 이 서비스로 보낸다.
# hosts가 리스트인 것은 이 차트 스키마다(argo-cd 차트는 hostname 문자열 하나를 받는다 — 옮겨 쓰면 무시된다).
ingress:
  enabled: true
  ingressClassName: traefik
  path: /
  pathType: Prefix
  hosts:
    - grafana.cgv.lan
persistence:
  enabled: false                     # 의도적 비영속 — 대시보드·데이터소스 전부 코드로 관리해 sqlite에 보존할 상태가 없음.
                                     #   재시작하면 코드에서 재프로비저닝. (UI에서 손으로 만든 대시보드는 날아간다 — as-code 강제 장치.)
# 대시보드 배달: grafana_dashboard 라벨이 붙은 ConfigMap을 sidecar가 파일로 떨어뜨리고 Grafana가 읽는다.
#   대시보드 정본 = workloads/manifests/dashboards/ (argocd/applications/dashboards.yaml 이 배달).
#   비영속과 짝이다 — 영속 저장소가 없으므로 이 경로가 유일한 대시보드 공급원이다.
# searchNamespace를 릴리스 네임스페이스로 한정한다. ALL로 두면 클러스터 전역 ConfigMap을 감시하느라
#   RBAC이 전 네임스페이스로 넓어진다(대시보드는 observability에만 둔다).
sidecar:
  dashboards:
    enabled: true
    label: grafana_dashboard
    labelValue: "1"
    searchNamespace: observability
    folderAnnotation: grafana_folder   # ConfigMap에 이 annotation을 달면 Grafana 폴더로 분류된다
    provider:
      foldersFromFilesStructure: true
  # sidecar 자원. 명시해 두지 않으면 request 0으로 스케줄된다.
  # limit 64Mi로 잡았다가 기동 직후 OOMKilled(exit 137) 반복 — 감시만 하는 컨테이너로
  #   보이지만 쿠버네티스 watch 연결과 파이썬 런타임을 들고 있어 그보다 쓴다.
  # request 128Mi: 평시 실측 91Mi(2026-08-17)가 이전 request 64Mi의 142%였다.
  resources:
    requests: { cpu: 10m, memory: 128Mi }
    limits:   { cpu: 100m, memory: 192Mi }
datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      # 세 데이터소스를 서로 잇는다. 신호는 원래 이어져 있었다 — 로그 줄에 trace_id 가 이미 찍히고
      #   히스토그램에 exemplar 가 실려 온다. 이 설정이 없으면 그 연결을 화면에서 못 건넌다.
      #   지표 → 트레이스 → 로그 → 트레이스 왕복이 아래 세 블록으로 열린다.
      - name: Mimir
        uid: mimir
        type: prometheus
        access: proxy
        url: http://mimir-gateway.observability.svc.cluster.local/prometheus
        isDefault: true
        jsonData:
          httpMethod: POST
          # p99 그래프의 점 → 그 요청의 트레이스. name 은 exemplar 에 실려 오는 라벨 이름이라
          #   앱이 붙이는 이름과 글자까지 같아야 한다(Micrometer 기본·queue 수동 계측 모두 trace_id).
          # Mimir 쪽에 limits.max_global_exemplars_per_user 가 있어야 점 자체가 저장된다.
          exemplarTraceIdDestinations:
            - name: trace_id
              datasourceUid: tempo
      - name: Loki
        uid: loki
        type: loki
        access: proxy
        url: http://loki-gateway.observability.svc.cluster.local
        jsonData:
          # 로그 줄 → 그 트레이스. 두 서비스가 키 이름이 달라 하나의 정규식으로 받는다 —
          #   queue(slog) 는 trace_id, booking(logback MDC) 은 traceId 로 찍는다.
          # url 의 $$ 는 이스케이프다. Grafana 는 프로비저닝 파일을 읽을 때 ${...} 를
          #   환경변수 자리로 보고, 그런 변수가 없으면 빈 문자열로 바꿔서 저장한다.
          #   $ 하나로 쓰면 url 이 "" 가 되어 링크가 trace ID 없이 열린다(파일에는 원문이
          #   남아 있어 코드만 봐서는 안 보인다 — /api/datasources/uid/loki 로 확인한다).
          derivedFields:
            - name: TraceID
              matcherRegex: '"trace_?[iI]d":"([a-f0-9]+)"'
              url: '$${__value.raw}'
              datasourceUid: tempo
              urlDisplayLabel: 트레이스 열기
      - name: Tempo
        uid: tempo
        type: tempo
        access: proxy
        url: http://tempo.observability.svc.cluster.local:3200
        jsonData:
          # 트레이스의 한 span → 그 시각 로그. 라벨이 아니라 줄 내용에서 trace_id 를 찾는다
          #   (trace_id 를 라벨로 올리면 값이 무한해 카디널리티가 터진다).
          # 그래서 라벨 매칭 대신 customQuery 로 네임스페이스만 좁히고 줄 필터를 건다.
          # 시간창 ±5분 — span 시각 그대로 자르면 경계에 걸린 줄이 빠진다.
          # query 의 $$ 는 위 derivedFields 와 같은 이스케이프다. $ 하나면 필터가 |= "" 로
          #   저장되어 네임스페이스 전체 로그가 나온다 — 그 요청과 무관한 줄이 뜨는데
          #   화면에는 정상으로 보인다.
          # 여는 것은 span 하나가 아니라 그 trace 전체의 로그다. connection·query·redis span 은
          #   라이브러리가 만들어 앱 로그가 없고, 로그가 있는 자리는 Kafka 를 넘는 소비 쪽이라
          #   span 단위로 좁히면 대부분의 span 에서 0건이 된다.
          tracesToLogsV2:
            datasourceUid: loki
            spanStartTimeShift: '-5m'
            spanEndTimeShift: '5m'
            customQuery: true
            query: '{namespace="app"} |= "$${__span.traceId}"'

# Discord webhook URL을 환경변수로 넣는다. 알림 프로비저닝 파일에서 $__env{}로 읽는다 —
#   URL 자체가 자격이라(아는 사람은 누구나 그 채널에 쓸 수 있다) 파일에 평문으로 두지 않는다.
envValueFrom:
  DISCORD_WEBHOOK_URL:
    secretKeyRef:
      name: grafana-discord-webhook
      key: url

# 알림 프로비저닝은 별도 ConfigMap 으로 둔다(workloads/manifests/alerting).
#   차트가 values 의 alerting 키에 Helm tpl 을 돌려, 알림 템플릿의 {{ }} 를 Grafana 가 아니라
#   Helm 이 먼저 해석하려다 렌더가 실패한다. ConfigMap 에 두면 문자열 그대로 전달된다.
#   위 데이터소스의 $$ 이스케이프와 같은 종류의 함정이고, 이쪽은 이스케이프로 못 피한다.
#   ⚠️ 마운트라 이 ConfigMap 이 없으면 파드가 FailedMount 로 안 뜬다 —
#      alerting Application 이 관측 스택보다 앞 파도(-1)에 있어야 한다.
extraConfigmapMounts:
  - name: alerting
    mountPath: /etc/grafana/provisioning/alerting
    configMap: grafana-alerting
    readOnly: true

# 이미지 렌더러 — 알림에 패널 그림을 붙이는 별도 파드(헤드리스 크로미움).
#   request 256Mi: 크로미움이 렌더할 때만 튀고 평시엔 대기한다. 스케줄 여유가 가장 큰
#   노드에 들어간다(실측 2026-08-24 기준 k3s-3 약 1.06GiB).
#   limit 384Mi: 렌더 순간 피크를 받되 노드를 밀어내지 않게. OOM 이 나면 그림만 빠지고
#   알림 자체는 텍스트로 계속 간다 — 알림 경로가 렌더러에 종속되지 않는다.
imageRenderer:
  enabled: true
  replicas: 1
  resources:
    # limit 384Mi 로 시작했다가 렌더 요청마다 OOMKilled(exit 137) 로 죽었다 —
    #   대기 중에는 파드가 멀쩡히 살아 있고 헬스체크도 통과하는데, 화면을 그리는 순간
    #   크로미움이 뜨면서 한 번에 튄다. Grafana 쪽에는 "요청 실패(EOF·connection refused)"
    #   로만 보여서 원인이 렌더러 안에 있다는 것이 로그 밖에서는 안 드러난다.
    # 실측(2026-08-24): 대기 88Mi · 렌더 중 peak 591Mi. 옛 상한 384Mi 는 peak 의 65% 였다.
    #   request 128Mi — 대기값 88Mi 기준. 스케줄 여유가 빠듯한 노드(k3s-1 약 277MiB)라
    #     안 쓰는 몫을 예약해 두면 다른 파드가 못 들어온다.
    #   limit 768Mi — peak 591Mi 의 130%. 이 파드가 밀려나도 잃는 것은 알림의 그림뿐이고
    #     알림 자체는 텍스트로 계속 간다(렌더러가 죽어 있던 동안 실제로 그렇게 동작했다).
    #   패널 하나 렌더에 6-8초가 걸린다 — 알림이 그만큼 늦게 나간다.
    requests: { cpu: 50m, memory: 128Mi }
    limits:   { memory: 768Mi }
  # 렌더러가 Grafana 를 호출해 화면을 찍는다. 서비스명은 릴리스명 기준이다.
  renderingCallbackURL: http://grafana.observability.svc.cluster.local/

# self-metric: Grafana 자신의 상태(데이터소스 응답·로그인·대시보드 렌더).
serviceMonitor:
  enabled: true
