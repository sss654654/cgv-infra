# grafana/alloy 1.10.1 (Alloy v1.17.1) — DaemonSet 수집기. 관측의 심장.
# 파이프라인: 파드 로그 → Loki / ServiceMonitor·PodMonitor 스크레이프 → Mimir remote_write / (선택)OTLP → Tempo.
# clustering ON 필수 — DaemonSet 3파드가 target을 gossip으로 샤딩(안 하면 3배 중복 수집).
# ServiceMonitor/PodMonitor CRD는 이 차트가 설치하지 않음 → bootstrap의 prometheus-operator-crds가 제공해야 함.
# push URL은 형제 차트의 게이트웨이 서비스명 가정 — 배포 후 확인(특히 mimir-gateway). SealedSecret 불필요(내부 http 무인증).
# 트레이스 블록은 선택 — 앱이 Tempo로 직접 전송하면 otelcol 블록+extraPorts 삭제.
controller:
  type: daemonset
# RBAC — 차트 기본 rules를 그대로 두면 alloy SA에 전 네임스페이스 configmaps/secrets get·list·watch가 붙는다
# (= data ns의 mysql-secret·redis-secret, app ns의 booking-secrets/queue-secrets까지 읽힌다).
# 차트가 그 규칙에 붙여둔 용도는 remote.kubernetes.* 컴포넌트인데, 아래 configMap.content에 그 컴포넌트가 없다.
# 그래서 기본 rules에서 configmaps/secrets 한 줄만 뺀 목록을 명시한다. 나머지 줄은 차트 기본과 동일.
# alloy는 노드·전 네임스페이스 파드를 발견해야 하므로 rbac.namespaces(Role 한정)로는 못 좁힌다 → ClusterRole 유지.
# 되살려야 하는 조건: ServiceMonitor/PodMonitor가 basicAuth·bearerTokenSecret·tlsConfig로 Secret을 참조하면
#   alloy가 그 Secret을 직접 Get 해서 스크레이프 설정을 만든다. 권한이 없으면 그 대상만 스크레이프에서 빠지고
#   alloy 로그에 Get 실패가 남는다(파드는 계속 뜬다). 현재 대상은 전부 무인증 http.
rbac:
  create: true
  rules:
    - apiGroups: ["", "discovery.k8s.io", "networking.k8s.io"]
      resources: ["endpoints", "endpointslices", "ingresses", "pods", "services"]
      verbs: ["get", "list", "watch"]
    - apiGroups: [""]
      resources: ["pods", "pods/log", "namespaces"]
      verbs: ["get", "list", "watch"]
    - apiGroups: ["monitoring.grafana.com"]
      resources: ["podlogs"]
      verbs: ["get", "list", "watch"]
    - apiGroups: ["monitoring.coreos.com"]
      resources: ["prometheusrules"]
      verbs: ["get", "list", "watch"]
    - apiGroups: ["monitoring.coreos.com"]
      resources: ["alertmanagerconfigs"]
      verbs: ["get", "list", "watch"]
    - apiGroups: ["monitoring.coreos.com"]
      resources: ["podmonitors", "servicemonitors", "probes", "scrapeconfigs"]
      verbs: ["get", "list", "watch"]
    - apiGroups: [""]
      resources: ["events"]
      verbs: ["get", "list", "watch"]
    - apiGroups: ["apps", "extensions"]
      resources: ["replicasets"]
      verbs: ["get", "list", "watch"]
    # kubelet·cAdvisor 직접 스크레이프용. kubelet은 노드 프로세스라 Service가 없어
    # ServiceMonitor로 가리킬 수 없다 → role=node 발견 + /metrics·/metrics/cadvisor를 직접 긁는다.
    #   nodes                : discovery.kubernetes role=node 가 노드 목록을 읽는다
    #   nodes/metrics·proxy  : kubelet 엔드포인트에 접근한다
    - apiGroups: [""]
      resources: ["nodes", "nodes/metrics", "nodes/proxy"]
      verbs: ["get", "list", "watch"]
    - nonResourceURLs: ["/metrics", "/metrics/cadvisor"]
      verbs: ["get"]
serviceAccount: { create: true }
crds: { create: false }
alloy:
  clustering: { enabled: true }
  mounts: { varlog: false, dockercontainers: false }
  resources:
    # request 128Mi 는 실사용(313-462Mi)보다 한참 낮다. 위 버킷 drop 으로 시리즈가 절반이
    #   되므로 그 뒤 재측정해서 정한다 — 지금 올리면 컷 전 값으로 굳는다.
    requests: { cpu: 100m, memory: 128Mi }
    # limit 512Mi 는 실측 peak 가 81-90% 로 이미 임박이다. 부하 판에서 로그·시리즈가 늘면
    #   여기서 OOMKill 이 나고, 그러면 그 노드의 메트릭과 로그가 통째로 끊겨 판을 다시 돌려야 한다.
    limits: { memory: 768Mi }
  extraPorts:
    - { name: otlp-grpc, port: 4317, targetPort: 4317, protocol: TCP }
    - { name: otlp-http, port: 4318, targetPort: 4318, protocol: TCP }
  configMap:
    create: true
    content: |-
      // LOGS: 파드 stdout -> Loki
      discovery.kubernetes "pods" { role = "pod" }
      // 한 블록 안의 속성은 줄을 나눠 적는다 — Alloy 문법은 속성 뒤에 줄바꿈을 요구해서
      // rule { source_labels = [...] target_label = "..." } 처럼 한 줄에 둘을 쓰면 파싱이 실패하고
      // Alloy가 기동하지 못한다(설정 오류라 파드가 CrashLoop).
      discovery.relabel "pod_logs" {
        targets = discovery.kubernetes.pods.targets
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_node_name"]
          target_label  = "node"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
          target_label  = "app"
        }
      }
      loki.source.kubernetes "pods" {
        targets    = discovery.relabel.pod_logs.output
        forward_to = [loki.write.default.receiver]
        clustering { enabled = true }
      }
      // LOGS: 쿠버네티스 이벤트 -> Loki (job="k8s-events")
      // 파드가 왜 죽었는지(OOMKilling·probe 실패·BackOff·스케줄 실패)는 컨테이너 stdout이 아니라
      // 이벤트에 남는다. 이벤트는 etcd에서 약 1시간 뒤 사라지므로 Loki에 적재해야 사후 추적이 된다.
      // clustering: 이벤트는 노드가 아니라 클러스터 단위 스트림이라 DaemonSet 3파드가 각자 읽으면
      //   같은 이벤트가 3벌 적재된다 — 샤딩으로 한 파드만 담당하게 한다.
      loki.source.kubernetes_events "cluster" {
        job_name   = "k8s-events"
        forward_to = [loki.write.default.receiver]
        clustering { enabled = true }
      }

      loki.write "default" {
        endpoint { url = "http://loki-gateway.observability.svc.cluster.local/loki/api/v1/push" }
      }

      // METRICS: ServiceMonitor + PodMonitor -> Mimir remote_write
      prometheus.operator.servicemonitors "scrape" {
        forward_to = [prometheus.remote_write.mimir.receiver]
        clustering { enabled = true }
      }
      prometheus.operator.podmonitors "scrape" {
        forward_to = [prometheus.remote_write.mimir.receiver]
        clustering { enabled = true }
      }

      // METRICS: k3s server 프로세스 + cAdvisor 직접 스크레이프
      // 노드 프로세스라 Service가 없어 ServiceMonitor 경로로는 원리적으로 못 잡는다 → 노드 주소를 직접 지목.
      //
      // ★ :6443(apiserver)을 따로 긁지 않는 이유 — k3s는 apiserver·etcd·scheduler·controller-manager·kubelet을
      //   한 프로세스(k3s server)에서 돌린다. 그래서 메트릭 레지스트리도 하나이고, :6443/metrics 와
      //   :10250/metrics 가 같은 내용을 낸다(실측: 같은 노드에서 줄 수 동일, 메트릭 이름 집합 완전 일치).
      //   둘 다 긁으면 job 라벨만 다른 사본이 두 벌 저장돼 시리즈 상한을 두 배로 먹는다.
      //   프로세스가 나뉜 배포판(kubeadm 등)에서는 포트마다 내용이 달라 둘 다 긁는 것이 정상이다 — k3s에서만 사본이 된다.
      //   :6443 대신 :10250을 남긴 이유: apiserver 인증·flowcontrol 경로를 지나지 않아 apiserver가 밀릴 때도
      //   응답하고, cAdvisor가 같은 포트의 다른 경로라 설정이 나란히 붙는다.
      //
      //   job_name = "k3s-server" — 이 레지스트리에는 apiserver·scheduler·controller-manager 지표가 전부 들어 있어
      //   "kubelet"이라 부르면 내용을 가리지 못한다. 컴포넌트 구분은 job이 아니라 메트릭 이름이 한다
      //   (apiserver_* · scheduler_* · workqueue_* · kubelet_*).
      //
      //   /metrics          -> up{job="k3s-server"} = 노드 생존을 etcd 안 거치고 보는 신호.
      //     KSM 기반 노드 상태는 apiserver·etcd를 통과하므로 쿼럼이 깨지면 값이 갱신을 멈춘 채
      //     마지막 상태로 굳는다("죽었는데 green"). 직접 스크레이프는 대상이 죽으면 up=0으로 정직하다.
      //   /metrics/cadvisor -> container_cpu_usage_seconds_total·container_memory_working_set_bytes
      //     = 컨테이너 실사용. 부하 실측으로 배포 스펙을 역산하려면 이 값이 있어야 한다.
      //     cAdvisor는 kubelet 안에 있지만 별도 레지스트리라 이 경로를 따로 긁어야 온다.
      //     kube-state-metrics는 선언값(requests/limits)만 발행하고 실사용은 모른다.
      discovery.kubernetes "nodes" { role = "node" }

      // 노드 발견 결과를 kubelet 주소(:10250)로 바꾼다. apiserver 프록시(/api/v1/nodes/<n>/proxy)를
      // 경유하지 않고 노드에 직접 붙는다 — 경유하면 apiserver가 죽을 때 노드 생존까지 같이 안 보인다.
      discovery.relabel "kubelet" {
        targets = discovery.kubernetes.nodes.targets
        rule {
          source_labels = ["__meta_kubernetes_node_name"]
          target_label  = "node"
        }
        rule {
          source_labels = ["__meta_kubernetes_node_address_InternalIP"]
          replacement   = "$1:10250"
          target_label  = "__address__"
        }
      }

      // 제어면 히스토그램의 버킷 시리즈를 버린다.
      //   apiserver_request_duration_seconds_bucket 하나가 24,816 시리즈다. 버킷은 le 라벨마다
      //   시리즈가 하나씩 생겨 이름 하나가 수만 개로 불어난다.
      //   실측(2026-08-15): k3s-server 126,219 중 버킷이 96,707 — 클러스터 전체 185,158의 52%.
      //   대시보드 4장 어디에서도 이 계열을 쓰지 않는다(전수 확인). 행0의 생존 판정은
      //   up{job="k3s-server"} · etcd_server_has_leader · kube_node_status_condition 셋이고
      //   전부 히스토그램이 아니다.
      //   _sum 과 _count 는 남긴다 — 평균과 비율은 그 둘로 계산되므로 분위수만 포기하는 것이다.
      //   되살릴 조건: 제어면 지연의 분포(p99)를 봐야 하는 일이 생기면 이 rule 을 지운다.
      prometheus.relabel "k3s_server_drop_buckets" {
        forward_to = [prometheus.remote_write.mimir.receiver]
        rule {
          source_labels = ["__name__"]
          regex         = "(apiserver|etcd|workqueue|rest_client|kubelet|scheduler)_.*_bucket"
          action        = "drop"
        }
      }

      prometheus.scrape "kubelet" {
        targets      = discovery.relabel.kubelet.output
        job_name     = "k3s-server"          // 위 주석 참고 — 이 응답은 kubelet 것이 아니라 k3s server 프로세스 전체다
        metrics_path = "/metrics"
        scheme       = "https"
        // kubelet은 서비스어카운트 토큰으로 인증한다. 인증서는 노드마다 자체 서명이라
        // 이름 검증을 끄지 않으면 x509 오류로 전부 실패한다(사설망 노드 직접 접속).
        bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"
        tls_config { insecure_skip_verify = true }
        forward_to = [prometheus.relabel.k3s_server_drop_buckets.receiver]
        clustering { enabled = true }
      }

      prometheus.scrape "cadvisor" {
        targets      = discovery.relabel.kubelet.output
        job_name     = "cadvisor"
        metrics_path = "/metrics/cadvisor"
        scheme       = "https"
        bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"
        tls_config { insecure_skip_verify = true }
        forward_to = [prometheus.remote_write.mimir.receiver]
        clustering { enabled = true }
      }

      // (apiserver :6443 직접 스크레이프는 제거했다 — 위 "k3s server" 주석의 사본 문제.
      //  되살려야 하는 조건: 컨트롤플레인이 프로세스로 나뉜 배포판으로 옮기면 :6443과 :10250이
      //  서로 다른 내용을 내므로 그때는 둘 다 긁어야 한다.)

      // METRICS: MinIO 버킷 사용량. minio 차트는 클러스터 메트릭을 ServiceMonitor가 아니라
      // Probe CRD로 내는데 이 설정은 Probe를 소비하지 않는다 → 서비스를 직접 지목한다.
      // miniodata(100G)가 유일하게 계속 차오르는 디스크라 사용량이 용량 계획의 근거가 된다.
      prometheus.scrape "minio" {
        targets = [{
          __address__ = "minio.observability.svc.cluster.local:9000",
          job         = "minio",
        }]
        metrics_path = "/minio/v2/metrics/cluster"
        forward_to   = [prometheus.remote_write.mimir.receiver]
        clustering { enabled = true }
      }
      prometheus.remote_write "mimir" {
        endpoint { url = "http://mimir-gateway.observability.svc.cluster.local/api/v1/push" }
      }

      // TRACES (선택): OTLP 수신 -> Tempo. 앱이 Tempo 직접 전송이면 이 두 블록 삭제.
      otelcol.receiver.otlp "default" {
        grpc { endpoint = "0.0.0.0:4317" }
        http { endpoint = "0.0.0.0:4318" }
        output { traces = [otelcol.exporter.otlp.tempo.input] }
      }
      otelcol.exporter.otlp "tempo" {
        client {
          endpoint = "tempo.observability.svc.cluster.local:4317"
          tls { insecure = true }
        }
      }

# self-metric: Alloy 자신의 상태(remote_write 성공·실패·큐 길이, 각 컴포넌트 건강).
# 이게 없으면 "메트릭이 안 보인다"의 원인이 수집인지 저장인지 못 가린다 — 배선 디버깅의 전제다.
serviceMonitor:
  enabled: true
