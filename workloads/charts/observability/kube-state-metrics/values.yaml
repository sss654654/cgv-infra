# prometheus-community/kube-state-metrics 7.8.1 (KSM 2.19.1) — 쿠버 오브젝트 상태 메트릭.
# ServiceMonitor로 노출 → Alloy가 발견·스크레이프 → Mimir. S3/시크릿/스토리지 해당 없음.
# Alloy가 라벨셀렉터 없이 observability 전체 ServiceMonitor를 잡으면 그대로 발견. 라벨필터 쓰면 monitor.additionalLabels 추가.
replicas: 1
autosharding: { enabled: false }     # 단일 replica Deployment(StatefulSet 아님)
resources:
  # request 96Mi: 평시 실측 71Mi(2026-08-17)가 이전 request 64Mi의 110% — 발행 시리즈가
  #   클러스터 오브젝트 수에 비례해 늘며 넘었다. limit 128Mi 유지.
  requests: { cpu: 50m, memory: 96Mi }
  limits:   { cpu: 200m, memory: 128Mi }
prometheus:
  monitor:
    enabled: true
    # kube-state-metrics는 자신이 아니라 다른 오브젝트의 상태를 발행한다. 메트릭에 실린
    # namespace/pod/container가 그 대상의 것인데, honorLabels 없이 스크레이프하면 수집 대상
    # (kube-state-metrics 파드 자신)의 라벨이 덮어쓰고 원래 값은 exported_ 접두어로 밀린다.
    # 그러면 cAdvisor의 container_* (namespace/pod 그대로)와 라벨 이름이 달라 조인이 안 된다.
    honorLabels: true
