# queue dev 환경값 — replica·리소스·연결·데모 파라미터.
# 리소스는 실측 전 추정(노드설계 기준). 부하테스트 후 확정.

image:
  tag: dev-97-e7824557
  repository: 192.168.0.167:5050/cgv/cgv-onprem/queue-go
# replicaCount 제거 — HPA가 대수를 소유(아래 autoscaling). HPA on이면 차트가 replicas 필드 생략.
resources:
  # 메모리는 동시 연결 수에 비례한다. 연결 하나가 고루틴과 읽기·쓰기 버퍼를 들고,
  # 폴링 주기(1-5초)가 IdleTimeout(60초)보다 짧아 접속해 있는 내내 끊기지 않는다.
  # 실측 연결당 33-64KB. 상주분이 고정이 아니라서 request 와 limit 을 다르게 둔다.
  #   limit 256Mi = 파드당 약 2,000 연결 × 40KB(80MiB) + 베이스 20MiB + GC 헤드룸.
  #   request 96Mi = 유휴 상주(약 20MiB)와 스케줄 여유 사이. request를 limit과 같이 두면
  #     HPA가 4대로 늘 때 노드 하나(스케줄 여유 약 200MiB)에 자리가 없어 Pending이 된다.
  # CPU limit 500m → 1000m. 사용자 10,000명 판에서 여기가 병목이 됐다.
  #   봉우리 실측: CPU 합 1.936 코어 / (0.5 × 4대) = 97% · 스로틀 82.97%
  #   결과: 오픈 순간 p99 4.87초(통과선 1초) · 커넥션 풀 포기 59건/초(그 전까지 0)
  #
  #   커널은 limit 500m을 100ms 주기마다 50ms 몫으로 바꾼다. 파드당 평균이 48.4ms 라
  #   몫에 거의 붙어 있어, 요청이 조금만 몰리면 그 조각에서 잘린다. 그래서 사용률 97%에
  #   스로틀이 83%까지 간다 — 평균이 몫에 가까워질수록 스로틀은 급하게 오른다.
  #   1000m이면 몫이 100ms가 되어 같은 평균이 48%가 된다.
  #
  #   이 변경이 바꾸는 것은 CFS 몫 하나뿐이다. 아래 둘은 따라 변하지 않는다:
  #     GOMAXPROCS  main.go의 go.uber.org/automaxprocs가 cgroup CPU quota를 내림해 정한다
  #                 (최소 1). 500m·1000m 둘 다 1이다.
  #     Redis 풀    REDIS_POOL_SIZE 미설정 → 라이브러리 기본 10 × GOMAXPROCS = 10.
  #
  #   파드를 8대로 늘려도 같은 지점에 도달한다(파드당 평균이 몫의 절반). 이쪽을 택한 이유는
  #   limit이 스케줄러 예산(requests)에 안 들어가 자리를 안 뺏기 때문이다 — 파드 4대 추가는
  #   request 250m·96Mi × 4를 예약해야 하는데 k3s-1의 memory request 여유가 181MiB다.
  #
  #   request 250m 은 HPA 스케일 기준선(70% = 175m)을 만드는 값이라 건드리지 않는다.
  requests: {cpu: 250m, memory: 96Mi}
  limits: {cpu: 1000m, memory: 256Mi}
autoscaling:
  enabled: true
  # max 4 는 Kafka 파티션 수(4)와 무관하다. 파드가 하는 일은 HTTP 폴링 처리가 거의 전부다.
  #   HTTP 요청   초당 6,021 (10,000명 봉우리)
  #   Kafka 소비  초당 0.29 (회전 속도와 같다)
  #   컨슈머 그룹에서 5번째 파드부터 파티션을 못 받지만, 못 받는 그 일이 초당 0.29건이라
  #   HTTP 부하를 나누는 데는 지장이 없다.
  #
  #   지금 max 를 4 로 두는 실제 이유는 노드 자리다 — 파드 4대를 더 앉히려면
  #   request 250m·96Mi × 4 를 예약해야 하는데 k3s-1 의 memory request 여유가 181MiB다.
  #   파드를 늘리는 대신 위 CPU limit 을 올려 같은 지점(파드당 평균 = 몫의 절반)에 도달한다.
  # 예열 — 판 하나를 위한 값이다. 판이 끝나면 2 로 되돌린다.
  # 사용자 5,000명 판에서 HPA 가 파드를 2 → 4 로 늘렸는데, 봉우리(오픈 순간 30초-1분)가
  #   지난 뒤에 도착했다. metrics-server 스크레이프 15초 + HPA 판정 주기 15초 + 파드 기동이
  #   그 안에 안 들어간다. 그래서 봉우리를 원래 2대가 통째로 받았고 스로틀이 33.28% 였다.
  #   같은 판에서 나중에 뜬 두 대는 평탄한 구간만 봐서 3.6-4.8% 였다.
  # 4 로 미리 띄우면 봉우리가 올 때 이미 4대다. 그때 스로틀이 얼마인지가 이 판의 답이고,
  #   그 값이 예매 오픈처럼 시각을 미리 아는 부하에서 예열이 필요한지를 정한다.
  minReplicas: 4
  maxReplicas: 4 # 차트 기본 6과 다름 — 명시 필수
  targetCPUUtilizationPercentage: 70 # 실사용 175m(250m×70%) 넘으면 스케일
env:
  PORT: "8090"
  # Redis Sentinel HA — master 승격 시 재조회(코드 NewFailoverClient). REDIS_PASSWORD는 queue-secrets(envFrom, apps/queue).
  REDIS_MASTER_NAME: cgvmaster
  REDIS_SENTINEL_ADDRS: redis.data.svc.cluster.local:26379
  KAFKA_BROKER: cgv-kafka-bootstrap.data.svc.cluster.local:9092
  # MAX_SESSIONS = 동시에 좌석 화면으로 들여보내는 인원. 회전 속도를 정하는 값이다.
  #   처리 속도 = 정원 ÷ 체류. 정원 500 판에서 예매 확정이 초당 8건이었으므로
  #   실제 체류는 500 ÷ 8 = 62.5초다. 부하 도구가 주는 체류 분포는 계단 내내 고정이라
  #   이 값은 안 변하고, 정원만 회전 속도를 움직인다.
  #     정원 1,000 → 초당 16건 → 좌석 4,000 이 약 250초에 소진
  # 500 → 1,000 의 근거: 정원 500 판(2026-08-30 사용자 10,000)에서 뒤가 전부 여유였다.
  #   booking 워킹셋 505/1536Mi · DB 풀 대기 0(사용 최대 2) · 5xx 0 · 재시작 0.
  #   500 이 한계보다 아래인 것은 확인됐고, 얼마나 아래인지가 이 계단의 질문이다.
  # 승격 상한(배치 25 ÷ 주기 0.5초 = 초당 50명)에 닿는 지점은 정원 3,125 다
  #   (3,125 ÷ 62.5초 = 50). 1,000 은 초당 16건이라 아직 멀다.
  # 이 판에서 볼 것: booking CPU · MySQL CPU 와 커넥션 풀 · Redis master ·
  #   입장 인증 지연 중 먼저 한계에 닿는 곳. 그 곳이 정원의 상한을 정한다.
  # 제약: 좌석이 4,000 이라 정원을 올릴수록 매진이 빨라져 재는 구간이 짧아진다.
  #   1,000 에서 약 250초. 그 위를 재려면 좌석 수를 먼저 늘려야 한다.
  # 공개 데모값 = 60. 실측 스펙은 1,000(위 근거) — 1,000이면 방문자가 대기열을
  #   볼 새 없이 통과한다. 데모의 체류는 부하 도구(62.5초)가 아니라 시뮬레이터 봇이
  #   정한다 — 승격 6-18초 뒤 예매하고 즉시 자리 반환(frontend sim.js) + 폴링 틱 3초.
  #   20이었을 때 190명 러시에서 173등이 2분 넘게 걸렸다(2026-08-31 관찰).
  #   60이면 계산상 회전 약 초당 4명 — 시뮬레이터 프리셋 100 기준 40명이 줄을 서고
  #   십수 초에 빠진다. 프리셋 100에서도 대기열이 보이려면 정원이 100 미만이어야 한다.
  #   부하 판을 다시 돌릴 때는 1,000으로 되돌린다.
  MAX_SESSIONS: "60"
  # 승격 리듬 — 기본값(배치 100 · 주기 2000ms)에서 상한을 유지한 채 뭉텅이만 4분의 1로.
  #   승격 상한 = 배치 ÷ 주기 = 100÷2초 = 25÷0.5초 = 초당 50명 — 회전·대기 시간 불변.
  # 근거와 결과 — 사용자 10,000 부하 두 판(2026-08-30). 오픈 버스트 순간의 도착량이
  #   두 판 모두 초당 33건으로 같아 배치 크기만 갈린 비교가 된다.
  #     배치 100  입장 인증 지연 p99 4.971초 · 2.5초 초과 445명 · 최대 4.97초
  #     배치  25  입장 인증 지연 p99 0.988초 · 1.0초 초과 0명 (버스트 포함 2,054건 전수)
  #   booking 의 소비를 배치화한 뒤에도 지연이 남았던 원인이 공급의 뭉텅이 크기였다 —
  #   100명이 한 번에 발행되면 소비가 아무리 빨라도 뭉텅이 맨 뒤는 앞의 99명을 기다린다.
  #   지연이 뭉텅이 크기에 비례한다(100→25 로 줄이자 4.97→0.99초).
  # 부수 효과: 대기 순번이 2초마다 100씩 → 0.5초마다 25씩 줄어 화면 리듬이 잘아지고,
  #   빈자리 공백이 최대 2초 → 0.5초. 대가는 승격 Lua 호출 4배 — 호출당 µs 라 무시 가능.
  QUEUE_PROCESS_INTERVAL: "500"
  # 공개 데모값 = 5. 부하 판 값은 25(위 근거) — 정원 60에서 배치 25면 빈자리가
  #   한두 틱에 통째로 채워져 순번이 계단으로 떨어지고(배치 2·정원 20 시절 2026-08-31
  #   데모 관찰과 같은 현상), 2면 상한 2÷0.5초 = 초당 4명이 회전(약 4명/초)과 같아져
  #   정원을 올린 효과가 상한에 깎인다. 5면 상한 초당 10명으로 여유가 생기고
  #   순번은 0.5초마다 5씩 잘게 흐른다. 부하 판을 다시 돌릴 때는 25로 되돌린다.
  PROCESSING_BATCH_SIZE: "5"
  # 자리를 회수하기까지 주는 시간. 사용자의 여정 전체보다 길어야 한다 —
  #   회차 고르기 10-30초 + 좌석 고르기 30-120초 + 결제(외부 PG) 60-180초 = 100-330초.
  #   결제 진입 시 좌석 락은 renewMine 으로 연장되지만 세션은 연장되지 않아서, 세션이
  #   결제 도중 만료되면 입장 인증이 지워져 좌석은 잡은 채 확정이 403 으로 거절된다.
  #   짧으면 고르는 중에 자리를 뺏겨 좌석 선택이 403 이 되고, 자원은 멀쩡한데 처리량만
  #   무너진다(정원 200 · 체류 90초 부하에서 확정이 12분의 1).
  # 처리 속도 = 정원 ÷ 실제 체류. 이 값은 상한이라 부하 도구(체류 약 36초)의 결과는
  #   안 바뀌고, 세션을 다 쓰고 회수되는 비중만 달라진다. 도구의 체류가 이 값을 넘으면
  #   그 측정은 버린다.
  # 바꾸면 values-booking.yaml 의 ADMITTED_TTL(이 값보다 길어야 함)도 같이 본다.
  SESSION_TIMEOUT: "300"
  METRICS_PORT: "9091"
  # 컨테이너 limit(256Mi)의 약 78%. Go 런타임은 cgroup limit을 스스로 읽지 않아
  # 이 값이 없으면 GC 상한이 int64 최대가 되고, 힙이 limit을 넘긴 순간 커널이 OOMKill한다.
  GOMEMLIMIT: "200MiB"
  OTLP_GRPC_ENDPOINT: alloy.observability.svc.cluster.local:4317
  # 트레이스 표본 비율 — **폴링 경로에만** 걸린다(position·stats·events).
  #   enter·complete·leave와 Kafka 발행/소비는 이 값과 무관하게 전부 남고,
  #   프로브(health/live·health/ready)는 비율이 아니라 아예 안 남는다.
  #   경로 목록은 queue-go/tracing.go의 pollingSpans·neverSampled.
  # 폴링이 요청의 97%다(정원 500 · 8분 부하에서 596,168건 중 578,718건). 그래서 이 값이
  #   Tempo 유입의 대부분을 정한다.
  #
  # 0.01 → 1.0 (2026-08-29). 폴링 경로의 트레이스를 전부 남긴다.
  #   앞서 0.05로 올린 판(2026-08-21, 6000 VU · 6분)에서 얻은 것이 없었다 —
  #     exemplar 수   position 302개(0.01) → 264개(0.05). 표본을 5배로 올려도 늘지 않는다.
  #                   exemplar는 스크레이프(15초)마다 히스토그램 버킷당 하나가 한도라
  #                   표본이 아니라 그 한도가 개수를 정한다.
  #     live traces   오픈 직후 1분에 1,150(0.01) → 10,000(0.05). 그때 Tempo의
  #                   max_traces_per_user가 10,000이라 span 4,527건이 버려졌다.
  #   그래서 이번에는 Tempo 쪽을 같이 올린다 — max_traces_per_user 10,000 → 50,000,
  #     memory limit 1Gi → 3Gi, GOMEMLIMIT 800MiB → 2600MiB
  #     (workloads/charts/observability/tempo/values.yaml).
  #
  # ⚠ 감수하는 것: Tempo의 memory request는 256Mi 그대로다. k3s-2의 memory request가
  #   allocatable의 90%라 올릴 자리가 없다(여유 약 480Mi). 실사용이 request를 크게 넘는 동안
  #   그 파드가 노드 퇴거 1순위가 된다.
  # ⚠ 부하 판에서 같이 볼 것: tempo_discarded_spans_total{reason="live_traces_exceeded"}와
  #   Tempo 파드 메모리. 둘 중 하나가 서면 이 값 또는 Tempo 한도를 다시 정한다.
  #
  # exemplar와 별개로, 특정 구간의 느린 요청을 훑는 것은 여전히 Tempo 검색이다:
  #   { name = "GET /api/admission/position" && duration > 1s }
  OTEL_TRACES_SAMPLER_ARG: "1.0"
