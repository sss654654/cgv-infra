# booking dev 환경값. 리소스=실측 전 추정(노드설계 기준, JVM).
# 마이그레이션: booking에 Flyway/Liquibase 없음(pom 확인) → dev는 단일 replica + DDL update로
#    스키마 부트스트랩(로컬 compose와 동일). 멀티 replica/prd는 마이그레이션 도구 도입 후
#    migration.enabled=true + DDL_AUTO=none. (= booking 코드 과제, 차트 토글은 준비됨.)

image:
  tag: dev-70-69e3628c
  repository: 192.168.0.167:5050/cgv/cgv-onprem/booking
replicaCount: 1 # DDL update 스키마 레이스 회피(단일). 마이그레이션 도구 생기면 증설.
resources:
  requests: {cpu: 250m, memory: 512Mi}
  limits: {cpu: "1000m", memory: 1Gi} # limit이 힙 크기의 분모(MaxRAMPercentage=75 → 힙 약 768Mi).
  # 측정 오염 방지용 초기 여유(DB풀·처리량 측정 전 OOM 방지) — 처리량 확정 후 768Mi로 조일 수 있으면 조임.
  # booking HPA는 켜지 않음: 대수는 처리량 실측 후 역산, DDL 레이스로 단일 replica 전제
# 비밀번호(MYSQL_PASSWORD)는 여기 없음 → booking-secrets(SealedSecret)에서 envFrom. 서비스명은 미들웨어 배포 후 확정.
env:
  PORT: "8091"
  # Redis Sentinel HA — redis-sentinel 프로파일 활성. REDIS_PASSWORD는 booking-secrets(envFrom, apps/booking).
  SPRING_PROFILES_ACTIVE: redis-sentinel
  REDIS_MASTER_NAME: cgvmaster
  REDIS_SENTINEL_NODES: redis.data.svc.cluster.local:26379
  # 입장 인증 만료. queue가 회수 이벤트를 놓쳤을 때의 최후 방어라 queue의 SESSION_TIMEOUT보다 길어야 한다.
  # 짧으면 정상 세션이 중간에 인증을 잃고 좌석선택이 403이 된다.
  # values-queue.yaml의 SESSION_TIMEOUT(60)을 바꾸면 이 값도 같이 올린다.
  ADMITTED_TTL: "180"
  MYSQL_HOST: mysql.data.svc.cluster.local
  MYSQL_PORT: "3306"
  MYSQL_DB: cgv
  MYSQL_USER: root # prd는 전용 유저 권장
  KAFKA_BROKER: cgv-kafka-bootstrap.data.svc.cluster.local:9092
  # admissions 를 소비하는 리스너 스레드 수. Spring 기본값은 1이라 파티션 4개를 한 스레드가
  #   순서대로 처리했다. 판이 시작되면 정원(500)이 비어 있어 처음 도착한 사람들이 대기 없이
  #   입장하고, 그만큼의 admissions 가 몇 초 안에 발행된다 — 그 버스트 뒤쪽 레코드의
  #   입장 인증 지연이 2026-08-23 판에서 최대 19.98초였다(정상 구간은 0.19초).
  #   그동안 사용자는 입장 응답을 받고도 좌석 선택이 403 이다.
  # 파티션 수(4)와 같게 둔다 — 그보다 크면 남는 스레드는 할당받을 파티션이 없다.
  # 레코드 처리 11.71ms 중 10.89ms 가 Redis 왕복이라, CPU 가 1코어여도 대기가 겹쳐 처리량이 는다.
  # 같은 사용자의 이벤트는 발행 쪽 Hash 키로 항상 같은 파티션에 가므로 사용자별 순서는 유지된다.
  SPRING_KAFKA_LISTENER_CONCURRENCY: "4"
  DDL_AUTO: update # dev 단일: Hibernate 스키마 생성. (prd=none + 마이그레이션 Job)
  SEED_ON_START: "true" # dev 단일: DataSeeder 데모 시드. (prd=false)
  VIRTUAL_THREADS: "true"
  DB_POOL_SIZE: "10" # 실측 후 튜닝
  JAVA_OPTS: "-XX:MaxRAMPercentage=75 -Djava.net.preferIPv4Stack=true"
  OTLP_HTTP_ENDPOINT: http://alloy.observability.svc.cluster.local:4318/v1/traces
