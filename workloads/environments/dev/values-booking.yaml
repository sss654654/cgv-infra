# booking dev 환경값. 리소스=실측 전 추정(노드설계 기준, JVM).
# 마이그레이션: booking에 Flyway/Liquibase 없음(pom 확인) → dev는 단일 replica + DDL update로
#    스키마 부트스트랩(로컬 compose와 동일). 멀티 replica/prd는 마이그레이션 도구 도입 후
#    migration.enabled=true + DDL_AUTO=none. (= booking 코드 과제, 차트 토글은 준비됨.)

image:
  tag: dev-85-c61fc1d1
  repository: 192.168.0.167:5050/cgv/cgv-onprem/booking
replicaCount: 1 # DDL update 스키마 레이스 회피(단일). 마이그레이션 도구 생기면 증설.
# 기본 RollingUpdate 는 새 파드가 Ready 가 된 뒤에 옛 파드를 내린다. replicas 가 1 이어도
#   그 사이에는 파드가 둘이고, 둘 다 Hibernate 로 같은 스키마에 DDL 을 돌린다 —
#   위 replicaCount: 1 로 막으려던 레이스가 배포할 때마다 열린다.
#   Recreate 는 옛 파드를 먼저 내리므로 겹치는 순간이 없다. 대가는 그 사이의 다운타임인데,
#   스키마가 깨지는 것보다 낫다. 마이그레이션 도구를 넣어 DDL_AUTO=none 이 되면 되돌린다.
strategy:
  type: Recreate
resources:
  requests: {cpu: 250m, memory: 512Mi}
  # cpu 1000m → 2000m: 재기 위한 상향이지 확정 스펙이 아니다.
  #   2026-08-23 판(사용자 6,000 · 체류 18.6초 · 확정 22.7건/초)에서 CPU 가 0.999/1.0 코어로
  #   상한에 붙고 스로틀이 99.7% 였다. 상한에 붙어 있으면 실제로 몇 코어를 원했는지 알 수 없다.
  #   같은 창의 JIT 컴파일이 0.535-1.454 초/초라 요청 처리 몫과 예열 몫도 안 갈렸다.
  #   여유를 준 상태에서 둘을 각각 재고, 그 값으로 limit 을 다시 정한다.
  # ⚠ JVM 은 availableProcessors() 를 이 값에서 읽어 GC·ForkJoinPool·가상 스레드 캐리어 수를
  #   정한다. 1코어 결과와 2코어 결과는 배수 관계가 아니다 — 2코어일 때의 수요만 나온다.
  # requests 는 250m 그대로 둔다. 스케줄러 회계를 안 건드려야 파드 배치가 안 바뀐다.
  limits: {cpu: "2000m", memory: 1Gi} # limit이 힙 크기의 분모(MaxRAMPercentage=75 → 힙 약 768Mi).
  # 측정 오염 방지용 초기 여유(DB풀·처리량 측정 전 OOM 방지) — 처리량 확정 후 768Mi로 조일 수 있으면 조임.
  # booking HPA는 켜지 않음: 대수는 처리량 실측 후 역산, DDL 레이스로 단일 replica 전제
# 비밀번호(MYSQL_PASSWORD)는 여기 없음 → booking-secrets(SealedSecret)에서 envFrom. 서비스명은 미들웨어 배포 후 확정.
env:
  PORT: "8091"
  # Redis Sentinel HA — redis-sentinel 프로파일 활성. REDIS_PASSWORD는 booking-secrets(envFrom, apps/booking).
  SPRING_PROFILES_ACTIVE: redis-sentinel
  REDIS_MASTER_NAME: cgvmaster
  REDIS_SENTINEL_NODES: redis.data.svc.cluster.local:26379
  # 입장 인증 만료. queue가 회수 이벤트를 놓쳤을 때의 최후 방어라 queue의 SESSION_TIMEOUT보다 길어야 한다.
  # 짧으면 정상 세션이 중간에 인증을 잃고 좌석선택이 403이 된다. 정상 흐름에서는 회수
  # 이벤트가 먼저 지우므로 이 TTL은 이벤트 유실 때만 작동한다 — 세션(300)의 2배면 넉넉하다.
  # values-queue.yaml의 SESSION_TIMEOUT(300)을 바꾸면 이 값도 같이 올린다.
  ADMITTED_TTL: "600"
  # 좌석 락 TTL. 좌석을 고른 뒤 결제 정보를 입력하는 구간(1-2분)을 덮는 값 —
  # 결제 진입 시 renewMine 이 연장하므로 결제 전체를 덮을 필요는 없다.
  # 짧으면 입력 중에 좌석을 뺏겨 환불(seat_conflict)이 나고, 길면 이탈자의 좌석이
  # 잔여 계산에서 빠진 채 남아 남들에게 매진으로 보인다. 앱 기본값은 45(application.yml).
  SEAT_LOCK_TTL: "180"
  MYSQL_HOST: mysql.data.svc.cluster.local
  MYSQL_PORT: "3306"
  MYSQL_DB: cgv
  MYSQL_USER: cgvapp # cgv 데이터베이스 안에서만 권한을 갖는 계정. root 는 전역 권한이라 안 쓴다
  KAFKA_BROKER: cgv-kafka-bootstrap.data.svc.cluster.local:9092
  # admissions 를 소비하는 리스너 스레드 수. Spring 기본값은 1이라 파티션 4개를 한 스레드가
  #   순서대로 처리했다. 판이 시작되면 정원(500)이 비어 있어 처음 도착한 사람들이 대기 없이
  #   입장하고, 그만큼의 admissions 가 몇 초 안에 발행된다 — 그 버스트 뒤쪽 레코드의
  #   입장 인증 지연이 2026-08-23 판에서 최대 19.98초였다(정상 구간은 0.19초).
  #   그동안 사용자는 입장 응답을 받고도 좌석 선택이 403 이다.
  # 파티션 수(4)와 같게 둔다 — 그보다 크면 남는 스레드는 할당받을 파티션이 없다.
  # 레코드 처리 11.71ms 중 10.89ms 가 Redis 왕복이라, CPU 가 1코어여도 대기가 겹쳐 처리량이 는다.
  # 같은 사용자의 이벤트는 발행 쪽 Hash 키로 항상 같은 파티션에 가므로 사용자별 순서는 유지된다.
  SPRING_KAFKA_LISTENER_CONCURRENCY: "4"
  # 오프셋 커밋 시점. RECORD 는 레코드 하나 처리할 때마다 커밋하고, BATCH 는 poll 한 번으로
  #   가져온 배치를 다 처리한 뒤 한 번만 커밋한다. 브로커·토픽·파티션은 안 바뀐다.
  # 근거: 커밋 지연 실측 avg 10.3ms · max 142ms. 승격 루프가 한 바퀴에 100명을 모아
  #   publish 한 번으로 보내는데 소비는 건별이라, 100건이면 커밋에만 약 1초가 든다.
  #   2026-08-23 판에서 레코드 하나의 소비 span 이 p50 16.5ms · p90 172.9ms 였고,
  #   그 대기가 쌓여 입장 인증 지연 p99 가 9.91초까지 갔다.
  # 대가: 배치 처리 도중 파드가 죽으면 그 배치 전체를 다시 받는다.
  #   admissions 소비는 Redis SADD 라 멱등이므로 재처리해도 결과가 같다(AdmissionConsumer).
  SPRING_KAFKA_LISTENER_ACK_MODE: BATCH
  DDL_AUTO: update # dev 단일: Hibernate 스키마 생성. (prd=none + 마이그레이션 Job)
  SEED_ON_START: "true" # dev 단일: DataSeeder 데모 시드. (prd=false)
  VIRTUAL_THREADS: "true"
  # 10 → 30 (2026-08-29 사용자 10,000 부하 실측).
  #   오픈 버스트에서 풀 10개가 전부 차고 대기 397이 섰다. 그 시각 MySQL CPU 는 12%로
  #   여유 — 병목이 원장이 아니라 풀 개수였다. 트레이스 실측: board 요청 5.28초 중
  #   5.11초가 커넥션 획득 대기, 질의 자체는 10.68ms.
  #   질의 약 10ms 기준 풀 30 = 초당 약 3,000질의. MySQL 1코어가 놀고 있어 받아낸다.
  #   더 키우면 처리량은 안 늘고 대기 장소만 앱(풀 지표에 보임)에서 MySQL 안(안 보임)으로
  #   옮겨간다 — 대기가 또 서는데 MySQL CPU 도 찼으면 그때는 풀이 아니라 코어를 올린다.
  DB_POOL_SIZE: "30"
  JAVA_OPTS: "-XX:MaxRAMPercentage=75 -Djava.net.preferIPv4Stack=true"
  OTLP_HTTP_ENDPOINT: http://alloy.observability.svc.cluster.local:4318/v1/traces
