# redis dev 환경값 — 서브차트(bitnami)로 전달. Sentinel HA(auth on). 리소스=실측 전 추정.
# sentinel 모드: node StatefulSet은 replica.*, sentinel 컨테이너는 sentinel.resources로 governed.
redis:
  replica:
    resources:                                  # 단일스레드 CPU 병목: limit 1000m = 부하테스트 종점(상한 도달 = 최대 처리량)
      requests: { cpu: 250m, memory: 256Mi }
      limits:   { cpu: "1", memory: 512Mi }
  sentinel:
    resources:
      requests: { cpu: 50m, memory: 64Mi }
      # CPU limit 100m 은 0.1초 조각마다 10ms 배급이다. sentinel 은 1초마다 깨어나 마스터를
      #   확인하는데 깨어난 순간엔 코어를 통째로 원해 매번 배급을 소진한다 — 유휴에서도 상시
      #   10-12% 스로틀(실측 2026-08-15, cpu.stat 의 nr_throttled/nr_periods 로 확인).
      #   묶이면 그만큼 판정이 늦어져 failover 감지가 밀린다. limit 은 예약이 아니라 공짜다.
      limits:   { cpu: 300m, memory: 128Mi }
  metrics:
    resources:                                  # exporter nano preset(128/192)이 과해 축소
      requests: { cpu: 50m, memory: 32Mi }
      # 스크레이프가 오는 순간에만 바짝 일해 그 조각에서 배급을 넘긴다 — 같은 이유로 올린다.
      limits:   { cpu: 300m, memory: 64Mi }

# sealedSecret.encryptedPassword 는 sealed-secrets 컨트롤러 up 후 kubeseal 출력값을 여기 주입:
# sealedSecret:
#   encryptedPassword: "AgB...(kubeseal 출력)"
