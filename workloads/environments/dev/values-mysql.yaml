# mysql dev 환경값 — 서브차트(bitnami)로 전달. 리소스 = 측정 시작값.
mysql:
  primary:
    resources:                        # commit CPU 병목(부하 때 1코어 burst). C++라 JVM 힙 짝 불필요
      requests: { cpu: 250m, memory: 512Mi }
      # 실측 익명 433-494MiB 에 768Mi 는 여유가 얇다. 부하 때 임시 테이블·정렬 버퍼가
      #   연결 수만큼 늘어 익명이 뛴다 — 판 도중 OOMKill 이면 그 판을 다시 돌려야 한다.
      limits:   { cpu: "1", memory: 1Gi }
  metrics:
    # mysqld_exporter 사이드카. 15초마다 SHOW 계열 질의를 몇 번 던지는 게 전부라 시작값을 작게 둔다.
    #   차트 기본(resourcesPreset nano)을 쓰지 않고 명시하는 이유는 부하 판에서 실측해 조정하기 위해서다.
    #   같은 파드 안이라 여기 적은 값이 mysql 파드의 request·limit 에 그대로 더해진다.
    resources:
      requests: { cpu: 20m, memory: 32Mi }
      limits:   { cpu: 100m, memory: 64Mi }
