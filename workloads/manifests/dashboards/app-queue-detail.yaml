        {
          "id": 9,
          "type": "timeseries",
          "title": "폴링 셋의 지연 p99 — 앱 구간 vs traefik 전 구간",
          "description": "**입장 전·대기 중인 사용자가 겪는 시간이다.** 세 경로가 여정의 세 자리에 대응하고, 한 사람이 셋을 동시에 부르지는 않는다 — 화면이 바뀌면 폴링도 갈아탄다.\n\n```\n로비 화면    board(좌석 현황판, 3초) · events(실황, 콘솔 펼쳤을 때만 3초)\n대기 화면    position(순번, 1·2·5초 계단)\n```\n\n- **board 는 booking 이 서빙한다.** 회차별 잔여 좌석 집계라 MySQL·Redis 를 봐야 해서다. 서빙 주체는 booking 이지만 **부하량을 정하는 것은 정원이 아니라 로비에 있는 사람 수**라 이 판(인원 축)에 둔다. 게이트 앞 경로여서 대기열의 보호를 못 받는 자리이기도 하다\n- **★ 2026-08-30 부터 board 응답에 CDN 엣지 캐시(5초)가 걸려 있다.** 이 선은 엣지가 답하지 못하고 origin 까지 온 요청만 잰다 — 1만 명 판에서 origin 도착이 90초에 48,500건에서 26건이 됐다. 사용자 대부분이 겪는 시간은 이 선에 안 잡히고, 여기 남는 것은 캐시가 만료된 순간의 요청이다\n- **traefik 선** 엔트리포인트 전 구간(수신-응답 완료). 앱 선과의 간격이 관문·네트워크 몫이다\n\n**읽는 법**\n- 앱 선만 오른다 → 앱·저장소 쪽 (position·events 는 queue·Redis, board 는 booking·MySQL)\n- 간격이 벌어진다 → 행1(관문)의 연결·CPU·스로틀을 본다\n\ny 축이 로그라 수치는 범례로 읽는다. 히스토그램 경계 밖은 못 잰다 — traefik 첫 칸(5ms) 아래는 평평하게 붙고, **상한 버킷에 평평하게 붙은 값은 측정값이 아니라 \"그보다 크다\"는 뜻이다.**\n\n점(exemplar)은 그 시각 그 구간에 실제 있었던 요청 하나다 — 누르면 트레이스가 열린다. 쿼리에 경로 라벨(`path`·`uri`)을 남겨야 Grafana 가 점을 어느 선의 것인지 대조해 색을 맞추고 범례 클릭 필터도 듣는다. 개수는 요청 수에 비례하지 않는다 — 스크레이프(15초)마다 히스토그램 버킷당 하나가 한도다.",
          "datasource": { "type": "prometheus", "uid": "mimir" },
          "gridPos": { "h": 12, "w": 24, "x": 0, "y": 29 },
          "targets": [
            { "refId": "A", "expr": "histogram_quantile(0.99, sum by (le, path) (rate(queue_http_request_duration_seconds_bucket{path=~\"/api/admission/(position|events)\"}[1m])))", "legendFormat": "{{path}}", "exemplar": true },
            { "refId": "B", "expr": "histogram_quantile(0.99, sum by (le, uri) (rate(http_server_requests_seconds_bucket{application=\"cgv-booking\", uri=\"/api/screenings/board\"}[1m])))", "legendFormat": "{{uri}}", "exemplar": true },
            { "refId": "D", "expr": "histogram_quantile(0.99, sum by (le) (rate(traefik_entrypoint_request_duration_seconds_bucket{entrypoint=\"websecure\"}[1m])))", "legendFormat": "traefik 전 구간" }
          ],
          "fieldConfig": {
            "defaults": {
