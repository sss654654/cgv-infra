# queue 서비스 대시보드 — 부하 계단을 굴리는 화면 (2026-08-18 계단 실측 반영)
#
# 용도는 하나다: 인원을 계단으로 올리면서 행마다 (예상 → 실측 → 스펙)을 굴린다.
#   각 패널 설명의 "계단에서" 줄이 실측이고, 값은 전부 2026-08-18 판 다섯-일곱에서 왔다.
#   그 값이 인원에 비례하면 식이 서고, 식이 서면 목표 인원에서 필요한 자원이 계산된다.
#   비례하지 않는 값은 그 자리에서 다른 것이 정하고 있다는 뜻이라, 그 다른 것을 먼저 찾는다.
#
# 행 구성 — booking 화면과 같은 리듬이다. 판정이 흐르는 순서가 곧 행 순서다.
#   행1 줄            판의 전제(파드·재시작·5xx·루프 멈춤) · 줄 상태 · 판이 유효한가 · 입장이 닿나
#                     이 판의 결론이 나오는 자리. 정원이 상한인가, 판이 유효한가, 전달이 새나
#   행2 사용자        지연 p99 — 통과선이 여기 걸린다
#   행3 뒷단 반응     queue 파드 · Redis. 정원을 올려도 안 움직이면 그것이 결론이다 —
#                     "병목은 booking 하나"의 근거가 이 행에서 나온다
#   ▸ 접힌 행         인원이 정하는 것(요청·traefik·커넥션 풀)과 계수 산출용 상세.
#                     정원 계단에서 여섯 판 내내 안 움직였다. 인원을 올리는 판에서 편다
#
# ── 계단 실측 (판5·6·7. SPREAD=3 JITTER=0.3 OPEN_AFTER=180, 판5 는 8m·판6·7 은 20m)
#   봉우리를 뺀 정상 구간 평균이다. 봉우리 값은 따로 아래에 적는다.
#
#                        1,000명   3,000명   5,000명   사람당(기울기)
#   요청/초                  201       528       874    0.17 건/초
#   앞 연결 합             1,001     2,872     4,864    1.00 개
#   traefik 고루틴 합      1,544     3,420     5,458    1.00 개
#   traefik RSS 합 MiB       161       253       373    56 KB
#   traefik CPU 합         0.087     0.210     0.375    0.075 mCPU
#   queue 고루틴 합          103       110       127    0.006 개
#   queue RSS 합 MiB          36        45        46    2.6 KB
#   queue CPU 합           0.066     0.151     0.267    0.052 mCPU
#   queue 파드 수              2         2         2
#   Redis 명령/초          1,471     3,735     6,164    1.21 건
#   Redis CPU master      0.0294    0.0636    0.1147   0.026 mCPU
#   대기 인원                951     2,822     4,806    0.96 명
#   회전 속도/초           0.267     0.278     0.278    변화 없음
#   앱 5xx · traefik 5xx       0         0         0
#
#   봉우리 (판 전체 최댓값)
#   traefik RSS 합 MiB       365       626       879    132 KB
#   queue 파드 수              2         3         4    HPA max 4 도달
#   queue 스로틀 %          1.24      9.62     10.94
#   Redis CPU master      0.0299    0.0789    0.1579   0.0395 mCPU
#   풀 총 커넥션 합             20        30        40    10 × 파드 수
#   풀 대기 ms/건          117.9     209.7     272.9    포기 기준 1,500ms
#   풀 타임아웃                 0         0         0
#
#   계단이 가른 것:
#     비례하는 것    앞 연결 · traefik RSS · traefik CPU · queue CPU · Redis 명령 · 대기 인원
#     안 비례하는 것  queue 고루틴 · queue RSS   — traefik 이 뒤 연결을 재사용해서다
#                    회전 속도                   — 정원(MAX_SESSIONS)이 정한다.
#                                                 이 계단은 정원을 2 로 고정하고 인원만 올린 판이다
#     한도로 가는 것  traefik RSS 하나뿐이다. 봉우리식 235 MiB + 132 KB × 인원 으로
#                    768Mi × 2파드 = 약 10,000명, 3파드면 약 16,000명이 상한이다.
#                    그다음 한도는 Redis master 단일 스레드로 봉우리 기준 약 25,000명이다.
#
#   계단 뒤 판8-13(10,000명)에서 확정된 것 — 위 표는 그 전(traefik 2파드·768Mi·500m,
#   queue 500m) 조건의 값이다:
#     traefik 3파드 × CPU 1500m · memory 2Gi (request 320Mi)
#     queue   4파드 × CPU 1000m · memory 256Mi — 스로틀 83% → 0%, 풀 포기 59/초 → 0
#     OPEN_SPREAD 3초 → 입장 p99 2.39s → 486ms. 통과선 6개 전부 통과(판13).
#
# ── 도구를 실물에 맞춘 과정 (판1-4. 전부 1,000명. 스펙 값으로 쓰지 않는다)
#     판1→판2  traefik limit 500m→1500m. traefik 스로틀 11.32 → 0%, queue 2.80 → 8.86%.
#              앞이 막혀 있던 동안 뒤가 덜 받고 있었다.
#     판2→판3  예매 여정 추가. 여정과 무관한 현황 조회 p99 가 5.5 → 74.3ms.
#              같은 파드에서 무거운 경로가 가벼운 경로의 CPU·풀을 나눠 쓴다.
#     판3→판4  지터만 추가(SPREAD=3 JITTER=0.3). queue 스로틀 6.45 → 0.86%,
#              풀 대기 15,109 → 1,015건. 판2·3 값의 상당 부분은 도구가 만든 요청 정렬이었다.
#     그래서 판1-4 는 부하 도구를 프론트와 같은 모양으로 맞춘 과정이고,
#              스펙 근거는 그 뒤의 계단(판5·6·7)에서만 가져온다.
#
# 계측의 한계 — 화면을 읽기 전에 알아야 하는 것:
#   지연 히스토그램의 첫 칸이 앱과 traefik 이 다르다. 앱은 1ms(0.001 부터), traefik 은
#     5ms(0.005 부터)다. 각 분위수는 첫 칸 아래로는 값이 아니라 선형보간 상수로 굳으므로,
#     앱 선의 평평한 1ms 와 traefik 선의 평평한 5ms 는 "빠르다"가 아니라 "못 쟀다"다.
#     그래서 기준선을 둘 다 그린다.
#   container_memory_working_set_bytes 에는 파일 캐시가 들어간다. 실측에서 같은
#     Deployment 의 두 파드가 38.7 vs 12.1MiB 인데 RSS 는 둘 다 11.0MiB 였다.
#     그래서 메모리 패널마다 RSS 를 같이 그린다 — limit 판정은 working_set,
#     연결당 비용 산출은 RSS 로 한다.
#   파드가 둘이라 세는 법이 갈린다. 스로틀·CPU 는 한도가 컨테이너마다 걸리므로 파드별로
#     보고, 고루틴·연결·메모리는 쥔 자원의 총량이므로 합으로 본다. 두 기준을 섞어
#     나누면 값이 틀어진다(파드 하나의 RSS 를 두 파드의 연결 수로 나누는 식).
#
# 원칙:
#   기준선(limit·HPA 임계·풀 크기·정원)은 점선으로 같이 그린다.
#   시리즈가 사라질 수 있는 쿼리에는 `or vector(0)` — 다만 그 경우 스크레이프 생존을
#     같은 패널에서 보여 준다(0 과 못 읽음을 가르기 위해).
#   rate 창은 스크레이프 간격에서 정한다 — 앱·traefik·cAdvisor 15초 → [1m],
#     Redis exporter 30초 → [2m].
#   traefik 자체의 service 라벨은 스크레이프 라벨에 밀려 exported_service 로 온다.
#   범례 표는 mean·max 둘을 준다 — mean≈정상 구간, max=봉우리. Max 만 있으면 판 밖
#     봉우리가 판의 값처럼 읽힌다(실측: MySQL 재시작 구간 92% 를 판의 값으로 오독).
#   cAdvisor 시리즈는 up 조인으로 산 파드만 남긴다 — 파드 교체 구간에 옛 ReplicaSet 이
#     범례에 쌓이는 것(실측 16줄)을 막는다
#
# booking 화면과의 연결 — 두 화면을 잇는 값은 정원 하나이고, 거기서 나머지가 파생된다.
#   확정/초 = 정원 ÷ 체류        정원 계단 여섯 판에서 오차 5% 안으로 성립
#   체류 < SESSION_TIMEOUT       넘으면 좌석을 고르는 중에 자리가 회수돼 판이 무효가 된다
#   순환 두 방향                 각 화면이 자기가 발행한 다리를 지킨다 —
#                               승격 → 입장 인증 (이 화면 행1 입장이 닿나 · 트레이스 루트 queue)
#                               확정 → 자리 반환 (booking 행1 확정이 돌아오나 · 루트 booking)
#   행2 가 그 셋을 전부 그린다. 자원(행3-6)은 이 값들이 흔들릴 때만 본다..
apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-app-queue-detail
  namespace: observability
  labels:
    grafana_dashboard: "1"
data:
  app-queue-detail.json: |
    {
      "uid": "app-queue-detail",
      "title": "queue 서비스",
      "editable": true,
      "timezone": "browser",
      "time": {
        "from": "now-15m",
        "to": "now"
      },
      "refresh": "10s",
      "schemaVersion": 39,
      "templating": {
        "list": []
      },
      "panels": [
        {
          "type": "row",
          "title": "1. 이 판의 전제와 결론 — 줄이 도나 · 승격이 닿나",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "panels": []
        },
        {
          "type": "stat",
          "title": "판의 전제 — 넷 다 맞아야 아래를 읽는다",
          "description": "**이 화면의 수치를 믿어도 되는 조건.** 하나라도 어긋나면 그 구간을 버린다.\n\n- **파드 수** HPA min·max 를 4 로 고정해 뒀다(판 목적). 4 가 아니면 그 구간을 버린다\n- **재시작** 0 이 아니면 연결·고루틴·메모리가 처음부터 다시 쌓인다\n- **5xx** queue 가 깨지면 booking 판도 같이 무효다\n- **루프 멈춤(초)** 승격·회수 배경 루프가 마지막으로 완주한 뒤 지난 시간. 주기가 승격 2초·회수 10초라 평시 10초 안이다. 30초를 넘으면 루프가 멈춘 것이고, 줄 자체가 서 있는 것이라 그 구간을 버린다\n\n정원 계단에서는 MAX_SESSIONS 를 바꿀 때마다 파드가 교체된다. 교체 직후 몇 분은 값이 안정되기를 기다린 뒤 읽는다.",
          "datasource": {
            "type": "prometheus",
            "uid": "mimir"
          },
          "gridPos": {
            "h": 10,
            "w": 4,
            "x": 0,
            "y": 1
          },
          "targets": [
            {
              "refId": "A",
              "expr": "count(up{job=\"app/queue\"} == 1) or vector(0)",
              "instant": true,
              "legendFormat": "파드 수"
            },
            {
              "refId": "B",
              "expr": "sum(increase(kube_pod_container_status_restarts_total{namespace=\"app\", container=\"queue\"}[10m])) or vector(0)",
              "instant": true,
              "legendFormat": "재시작 (10분)"
            },
            {
              "refId": "C",
              "expr": "sum(increase(queue_http_request_duration_seconds_count{path=~\"/api/.*\", status=~\"5..\"}[1m])) or vector(0)",
              "legendFormat": "5xx (1분)"
            },
            {
              "refId": "D",
              "expr": "max(time() - max by (loop) (queue_loop_last_tick_timestamp_seconds)) or vector(0)",
              "instant": true,
              "legendFormat": "루프 멈춤 (초)"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "text",
                    "value": null
                  }
                ]
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "재시작 (10분)"
                },
                "properties": [
                  {
                    "id": "thresholds",
                    "value": {
                      "mode": "absolute",
                      "steps": [
                        {
                          "color": "green",
                          "value": null
                        },
                        {
                          "color": "red",
                          "value": 1
                        }
                      ]
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "5xx (1분)"
                },
                "properties": [
                  {
                    "id": "thresholds",
                    "value": {
                      "mode": "absolute",
                      "steps": [
                        {
                          "color": "green",
                          "value": null
                        },
                        {
                          "color": "red",
                          "value": 1
                        }
                      ]
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "루프 멈춤 (초)"
                },
                "properties": [
                  {
                    "id": "thresholds",
                    "value": {
                      "mode": "absolute",
                      "steps": [
                        {
                          "color": "green",
                          "value": null
                        },
                        {
                          "color": "orange",
                          "value": 15
                        },
                        {
                          "color": "red",
                          "value": 30
                        }
                      ]
                    }
                  }
                ]
              }
            ]
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "textMode": "value_and_name",
            "colorMode": "value",
            "orientation": "auto"
          }
        },
        {
          "type": "timeseries",
          "title": "줄 — 대기 인원 · 정원 · 입장 중",
          "description": "**줄이 얼마나 길고, 문이 몇 개고, 몇 개가 차 있나.**\n\n- **대기 인원** 줄에 선 사람. 인원이 정한다\n- **정원**(점선) 동시에 들여보내는 수. 이쪽에서 정하는 값(MAX_SESSIONS)\n- **입장 중** 실제로 자리를 쥔 사람\n\n읽는 법.\n- 입장 중이 정원 점선에 붙어 있다 → **정원이 상한이다.** 계단을 올려도 된다\n- 정원을 올렸는데 입장 중이 안 따라온다 → 승격이 못 따라가거나 줄이 말랐다\n- 대기가 0 에 가까워진다 → 사람이 부족하다. 그 구간의 측정은 못 쓴다\n\n오른쪽 두 패널이 이 상태에서 나오는 결과다 — 얼마나 빨리 도는가, 그리고 순환이 닫히는가.",
          "datasource": {
            "type": "prometheus",
            "uid": "mimir"
          },
          "gridPos": {
            "h": 10,
            "w": 7,
            "x": 4,
            "y": 1
          },
          "targets": [
            {
              "refId": "A",
              "expr": "max(queue_waiting and on(pod) (up{job=\"app/queue\"} == 1)) or vector(0)",
              "legendFormat": "대기 인원"
            },
            {
              "refId": "B",
              "expr": "max(queue_capacity and on(pod) (up{job=\"app/queue\"} == 1)) or vector(0)",
              "legendFormat": "정원 (MAX_SESSIONS)"
            },
            {
              "refId": "C",
              "expr": "max(queue_active and on(pod) (up{job=\"app/queue\"} == 1)) or vector(0)",
              "legendFormat": "입장 중"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "decimals": 0,
              "min": 0,
              "custom": {
                "fillOpacity": 10,
                "lineWidth": 2
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "정원 (MAX_SESSIONS)"
                },
                "properties": [
                  {
                    "id": "custom.fillOpacity",
                    "value": 0
                  },
                  {
                    "id": "custom.lineStyle",
                    "value": {
                      "fill": "dash",
                      "dash": [
                        6,
                        6
                      ]
                    }
                  },
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "text"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "대기 인원"
                },
                "properties": [
                  {
                    "id": "custom.axisPlacement",
                    "value": "right"
                  },
                  {
                    "id": "custom.axisLabel",
                    "value": "대기 인원"
                  },
                  {
                    "id": "custom.fillOpacity",
                    "value": 0
                  }
                ]
              }
            ]
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "mean",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "type": "timeseries",
          "title": "판이 유효한가 — 체류가 타임아웃 안인가",
