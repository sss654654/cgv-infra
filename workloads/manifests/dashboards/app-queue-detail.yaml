              "description": "**Redis 로 나가는 문이 몇 개고 얼마나 쓰나.**\n\nRedis 로 명령을 보내려면 TCP 연결이 필요하다.\n미리 만들어 둔 묶음을 돌려 쓰는 것이 풀이고,\n**풀 크기 = 같은 순간에 보낼 수 있는 명령 수**다.\n넘치면 반납될 때까지 기다린다.\n\n풀 10 의 출처: `REDIS_POOL_SIZE` 미설정 →\n기본값 `10 × GOMAXPROCS` → CPU limit 1000m 이라 1 → 10.\n\n10 에 자주 붙으면 올릴 후보지만,\n**막혔는지는 `풀이 막혔나` 패널이 판정한다.**\n\n총 커넥션 선은 안 그린다 — go-redis 는 만든 연결을 안 버려서\n한 번 10 에 닿으면 계속 10 이라 아무것도 안 말한다.\n\n5,000명 — 봉우리 파드당 최대 8 / 10",
