          "description": "**느린 것과 깨진 것을 가른다.** 아래 지연 패널과 항상 같이 읽는다.\n\n- **traefik 선** 엔트리포인트 websecure 가 5xx 로 응답한 수\n- **queue 선** queue 가 스스로 5xx 를 냈다고 기록한 수\n\n**두 선의 차가 앱에 닿지도 못한 실패다** — 파드가 죽었거나, 프로브 실패로 라우팅에서 빠졌거나, 연결이 거부된 경우. traefik 은 502·503 을 돌려주는데 앱에는 기록이 없다.\n\n**읽는 법**\n- 둘 다 0 → 통과선 통과\n- 두 선이 겹쳐 오른다 → queue 가 처리하다 실패. Redis·Kafka 판으로 내려간다\n- traefik 만 오른다 → 요청이 queue 에 못 닿았다. 오른쪽 이벤트에서 파드가 어떻게 됐는지 본다\n\nbooking 5xx 는 여기서 안 본다 — 이 판은 traefik·queue 구간이고, 그쪽은 booking 판 소관이다.\n\n`/health/*` 는 뺐다 — kubelet 프로브라 사용자 요청이 아니고, 파드가 뜨는 중에 503 이 정상적으로 난다.\n\n4xx 도 넣지 않는다. 403(입장 인증 전파 전 재시도)·409(같은 좌석 경합)는 정상 흐름이고, 통과선도 5xx 기준이다. 코드별 4xx 는 공개 서비스 판에 있다.",
