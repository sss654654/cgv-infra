          "description": "파드별 CPU 사용률(사용량 ÷ limit)과 스로틀 비율을 한 축(%)에 그린다.\n\n- **실선 — CPU 사용률.** 폴링 요청마다 처리 경로를 돌므로 이 값은 초당 요청 수(≈ 동시 접속자 수)를 따라간다. 파드끼리 고르게 오르는 것이 정상이고, 하나만 높으면 분배가 안 되는 것이다\n- **빨간 선 — 스로틀.** 100ms 배급 조각에서 몫을 다 쓰고 잘린 비율. 0 이 정상\n\n평균 사용률이 낮아도 스로틀은 설 수 있다 — 뜨면 지연의 원인이 CPU limit 이라는 뜻이다. 스로틀이 서는 동안 Redis 응답을 제때 못 읽어 커넥션 반납이 늦어지고, 오른쪽 풀 포기가 따라 선다.",
