              "description": "**풀 때문에 실패가 났나.** 커넥션을 못 받아 포기한 요청이 있으면 여기서만 보인다.\n\n- **대기** — 줄을 섰다. 정상 동작\n- **포기** — 시간이 넘었다. 사용자가 실패를 받는다\n\n포기 기준 1,500ms 는 `PoolTimeout` 미설정 시\ngo-redis 기본값 `ReadTimeout(500ms) + 1초`다.\n\n기다린 시간이 올라도 포기가 0 이면 **지연이지 고장이 아니다.**\n\n전부 누적 카운터다. 순간값은 5초마다 찍는데\nRedis 왕복이 1ms 라 사건에 안 걸린다.\n\n대기의 원인은 셋이 섞인다 —\n풀이 좁다(여기) · 파드가 잘려 반납이 늦다(`queue 파드 CPU`) · Redis 가 느리다(`Redis 코어`).\n\n5,000명 — 봉우리 273ms · 정상 0.6ms · 포기 0건\n판3→판4 에서 지터만 넣었더니 누적 대기가 15,109 → 1,015건.",
