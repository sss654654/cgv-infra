          "description": "queue 파드가 지금 쥐고 있는 소켓 수와 고루틴 수(파드 합).\n\n- **소켓** 상대별로 갈리지 않는 총합이다. traefik 이 걸어온 것 + Redis 풀(파드당 최대 10) + Kafka 브로커(3) + kubelet 프로브 · Alloy 스크레이프가 모두 섞여 있다. **유휴 바닥이 두꺼우니 절대값이 아니라 그 위의 증가분으로 읽는다** — 부하에서 늘어나는 몫은 traefik 이 걸어온 연결뿐이다\n- **고루틴** Go HTTP 서버는 받은 소켓마다 고루틴을 붙인다. 배경 루프 6개 등 앱 자체 몫이 바닥에 깔려 있고, 그 위가 처리 중인 요청 몫이다\n\n**메모리로 이어지는 관계:** 소켓 × (고루틴 스택 + 버퍼) = 메모리. 왼쪽 게이지가 오른 이유가 여기 있다.\n\n**읽는 법**\n- 접속자를 몇 배 올려도 두 선이 거의 안 움직인다 → 정상. traefik 이 백엔드 연결을 풀에 넣고 재사용해 뒤로 안 넘긴다\n- 접속자를 따라 오르기 시작한다 → 재사용이 깨진 것. 왼쪽 메모리도 같이 오른다\n- 소켓은 그대로인데 고루틴만 오른다 → 응답이 나가지 못해 처리 중인 요청이 쌓이는 중\n\nRedis·Kafka 몫은 이 선에서 갈라 보지 않는다 — 풀은 한 번 만든 커넥션을 안 버려 포화 때도 수가 그대로고, Kafka 는 브로커 수만큼(3)으로 상수라 둘 다 위험 신호가 되지 못한다. 그쪽 판단(풀 대기·포기 · 다리 지연·완결)은 Redis·Kafka 판이 한다.",
