              "description": "**Redis 가 무엇을 몇 번 하는가.** 사람당 명령 수 계수의 분자가 여기서 나온다.\n\n세 노드 중 **최댓값**을 쓴다. 읽기는 master 에만 있고, 쓰기는 복제본이 같은 명령을 재생해\n세 벌로 잡힌다 — 더하면 쓰기가 3배가 된다. 최댓값이 곧 한 대분이다.\n\n**합계를 내지 마라.** `EVALSHA` 한 번 안에서 `ZSCORE`·`ZRANK`·`ZCARD`·`ZADD` 가 실행되고\n그것들도 각각 따로 세어진다(실측 총합의 18% 가 이중).\n\n**줄일 자리를 정하는 건 이 패널이다.** 호출당 시간이 아니라 호출 수가 CPU 를 쓴다 —\n호출당 1us 인 명령을 초당 5,000번 부르면 호출당 500us 를 10번 부르는 것보다 코어를 더 쓴다.\n\n큐 경로가 실제로 부르는 10개 명령 고정 목록이다 — 상위 N 을 고르는 쿼리는\n순위가 바뀔 때마다 범례에 줄이 쌓여 못 읽게 된다.\n\nEVALSHA = 서버에 미리 저장한 Lua 스크립트를 해시로 부르는 명령. 폴링 한 번이 이걸로 들어간다.",
