# 입장 전 · 대기 구간 대시보드 — traefik(관문) · queue(줄) (2026-08-29 전면 재작성)
#
# ★ 판을 컴포넌트가 아니라 사용자 여정으로 나눈다.
#     로비(board·events 폴링) → enter → 대기(position 폴링) → 승격      ← 이 판
#     좌석 고르기 → 결제 → 확정                                        ← booking 판
#     Redis·Kafka 자체의 건강(코어·명령·메모리·다리)                     ← Redis·Kafka 판
#   그래서 board 는 booking 이 서빙하지만 이 판에 있다 — 서빙 주체가 아니라 여정 위치와
#   부하 축(정원이 아니라 로비 인원)이 이 판의 것이라서다. 게이트 앞이라 대기열의 보호도 못 받는다.
#
# 행 구성 — 부하가 지나는 순서다.
#   행1 traefik   메모리 게이지 + CPU·스로틀 + 앞단 연결·고루틴
#   행2 queue     같은 구성 + 소켓·고루틴
#   행3 지연      폴링 셋(position·events·board) p99 + traefik 전 구간.  간격이 관문 몫
#   행4 수지      enter(호출 수·지연) / 앉힘·나감(건수·발행 지연)
#
# 왜 이 형태인가
#   메모리는 물리 한계라 "지금 수위"를 보는 게이지, CPU 는 시간의 사건이라 "언제 튀고 언제
#     잘렸나"가 남는 타임시리즈. CPU 를 limit 대비 % 로 두면 스로틀과 같은 축이라 한 패널에 선다.
#   행1·2 의 세 번째 패널은 왼쪽 메모리 게이지의 "왜" 를 답한다 —
#     소켓 × (고루틴 스택 + 버퍼) = 메모리. 소켓이 늘어 오른 것과 고루틴만 늘어 오른 것이 갈린다.
#   queue 소켓은 상대별로 안 갈린다(traefik 뒷단 + Redis 풀 + Kafka + 프로브의 총합).
#     Redis·Kafka 몫은 부하가 커져도 값이 안 변해(풀은 만든 커넥션을 안 버리고, Kafka 는
#     브로커 수만큼 상수) 신호가 못 되므로 갈라 그리지 않는다.
#   행4 는 자리의 수지다 — 앉힘 ≈ 예약 완료 + 회수. 셋을 같이 봐야 "앉힌 사람이 어디로
#     갔나" 가 닫힌다. 승격·회수는 배경 루프라 응답 지연이 없어서, 대신 발행 소요를 재고
#     거기 exemplar 를 붙여 두 루프의 트레이스로 들어가는 입구를 만들었다.
#
# 지운 패널의 역할이 간 곳
#   판의 전제(재시작·5xx)     인프라 판 · 공개 서비스 판
#   줄(대기·정원·입장 중)     공개 서비스 판
#   체류/타임아웃 판정        booking 판 재편 때 인증 회수와 함께 결정
#   연결당 비용(스택·힙)      삭제 — 계수의 내역을 파던 12부 전용 질문. 필요하면 사후 쿼리로
#   Redis 코어·명령·µs·풀 포기  Redis·Kafka 판
#   working_set vs RSS 구분   working_set 만 남김(커널이 OOMKill 을 판정하는 값).
#                            RSS 는 계수 추출용이라 판 사후 쿼리로 한다
#   인증/초(booking 지표)     다리 판정은 Redis·Kafka 판이 한다 — 판 경계를 넘지 않게 뺐다
#
# 앱 지표 의존: 행4-2 의 「앉힘」·「회수」·「발행 지연」은 queue 에 추가한
#   queue_kafka_published_total{topic} · queue_kafka_publish_duration_seconds{topic} 을 읽는다.
#   그 앱 버전이 배포되기 전에는 세 선이 비어 있다(승격·예약 완료 두 선은 기존 지표라 나온다).
#
# 게이지 최대값은 하드코딩하지 않는다 — kube_pod_container_resource_limits 로 나눈 % 라
#   limit 을 바꾸면 판이 따라온다(이전 판에서 상수 상한이 123.96% 를 그린 사고의 재발 방지).
#   ⚠ 단 메모리 패널 제목의 limit 절대값(2Gi·256Mi)은 표기용 하드코딩이다 — limit 을 바꾸면
#     제목도 같이 고친다. 계산에는 안 쓰여서 어긋나도 값은 안 틀리고 라벨만 낡는다.
#   CPU 타임시리즈는 axisSoftMax 1.05 로 축을 100% 까지 고정한다 — 기준선(100%=limit)이
#     항상 보이는 대신, 유휴 파형은 바닥에 붙는다. 이 패널의 질문이 limit 대비 위치라 그렇게 둔다.
#   빨간 임계 80% = 판 통과선(memory: limit 의 80% 미만)과 같은 값.
#   파드 수가 변하면 게이지 막대 수가 자동으로 따라간다(쿼리가 파드별 시리즈를 낸다).
#
# 계수 — 12부 값과 2026-08-30 재검증(1만·3만 명 판, 워킹셋은 3파드 합):
#   「연결 = 인원 × 1.00」은 깨졌다. CDN 엣지가 방문자 연결을 받아 끝내고 origin 에는 자기
#     연결만 열어서다 — 유휴 18개 · 1만 명 판 227개 · 3만 명 판 6,681개.
#   메모리는 연결 수가 아니라 인원을 따라간다.
#     연결당   1만 판 6.3MiB · 3만 판 0.65MiB     10배가 갈린다
#     사람당   1만 판 135KiB · 3만 판 148KiB      거의 같다 — 12부의 봉우리 계수 132KiB 가
#                                                엣지를 붙인 뒤에도 성립한다
#     워킹셋   유휴 263MiB · 1만 판 1,580MiB · 3만 판 4,597MiB(파드당 1,532MiB, limit 2Gi)
#   queue CPU 500m 에서 스로틀 83% → 1000m 에서 0%.  스로틀은 평균 CPU 가 낮아도 선다 —
#   CPU 게이지가 낮은데 스로틀 stat 이 빨갛면 limit(배급 간격)이 원인이다.
apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-app-queue-detail
  namespace: observability
  labels:
    grafana_dashboard: "1"
data:
  app-queue-detail.json: |
    {
      "uid": "app-queue-detail",
      "title": "queue(traefik) 서비스",
      "tags": ["cgv", "app", "queue", "traefik"],
      "editable": true,
      "timezone": "browser",
      "time": { "from": "now-1h", "to": "now" },
      "refresh": "30s",
      "schemaVersion": 39,
      "templating": { "list": [] },
      "panels": [
        {
          "type": "row",
          "title": "1. traefik — 관문. 밖에서 온 것이 먼저 닿는 자리",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 },
          "collapsed": false,
          "panels": []
        },
        {
          "id": 1,
          "type": "timeseries",
          "title": "traefik 메모리 — working_set / limit 2Gi",
          "description": "파드별 working_set ÷ memory limit. working_set 은 커널이 OOMKill 을 판정할 때 보는 값이고, **100%(점선)에 닿으면 그 파드가 OOMKill 된다.**\n\n타임시리즈인 이유 — 이 판의 용도가 부하 중 \"언제 얼마까지 올랐나\"의 사후 분석이라서다. 게이지는 마지막 값 하나만 남아 판이 끝나면 판 동안의 움직임이 사라진다. 지금 값은 범례 Last 로 읽는다.\n\n- traefik 은 클라이언트 소켓마다 고루틴 스택·버퍼를 쥔다. 다만 **이 선은 연결 수보다 처리량을 따라간다** — 2026-08-30 실측에서 연결당 몫이 1만 명 판 6.3MiB · 3만 명 판 0.65MiB 로 10배 갈렸고, 사람당으로 보면 135KiB · 148KiB 로 거의 같았다. 오른쪽 연결 수가 낮은데 이 선이 높으면 연결 하나가 나르는 요청이 많은 것이다\n- 선 하나만 높으면 부하가 그 파드에 몰려 있는 것이다\n- limit 은 지표로 읽으므로 limit 을 바꾸면 선이 따라온다",
          "datasource": { "type": "prometheus", "uid": "mimir" },
          "gridPos": { "h": 8, "w": 6, "x": 0, "y": 1 },
          "targets": [
            { "refId": "A", "expr": "container_memory_working_set_bytes{namespace=\"traefik\", container=\"traefik\"} / on(pod) group_left() kube_pod_container_resource_limits{namespace=\"traefik\", container=\"traefik\", resource=\"memory\"} and on(pod) (kube_pod_status_phase{namespace=\"traefik\", phase=\"Running\"} == 1)", "legendFormat": "{{pod}}" },
            { "refId": "B", "expr": "vector(1)", "legendFormat": "limit" }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "decimals": 1,
              "min": 0,
              "custom": { "fillOpacity": 10, "lineWidth": 2, "showPoints": "never", "axisSoftMax": 1.05 }
            },
            "overrides": [
              { "matcher": { "id": "byName", "options": "limit" }, "properties": [ { "id": "color", "value": { "mode": "fixed", "fixedColor": "text" } }, { "id": "custom.lineStyle", "value": { "fill": "dash", "dash": [10, 6] } }, { "id": "custom.lineWidth", "value": 1 }, { "id": "custom.fillOpacity", "value": 0 }, { "id": "custom.hideFrom", "value": { "legend": false, "tooltip": true, "viz": false } } ] }
            ]
          },
          "options": { "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["lastNotNull", "max"] } }
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "traefik CPU · 스로틀 — limit 1.5코어 대비 % (빨강 = 스로틀 발생)",
          "description": "파드별 CPU 사용률(사용량 ÷ limit)과 스로틀 비율을 한 축(%)에 그린다.\n\n- **실선 — CPU 사용률.** limit 에 닿아도 파드는 죽지 않고 잘린다\n- **빨간 선 — 스로틀.** 커널은 CPU 를 100ms 조각 단위로 배급한다. 그 조각에서 몫을 다 쓰고 잘린 비율이고, 0 이 정상이다\n\n평균 사용률이 낮아도 요청이 같은 찰나에 몰리면 스로틀은 선다 — 스로틀이 뜨면 지연의 원인이 CPU limit(배급 간격)이라는 뜻이고, limit 을 올리면 몫이 커진다.",
          "datasource": { "type": "prometheus", "uid": "mimir" },
          "gridPos": { "h": 8, "w": 10, "x": 6, "y": 1 },
          "targets": [
            { "refId": "A", "expr": "sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\"traefik\", container=\"traefik\"}[$__rate_interval])) / on(pod) group_left() kube_pod_container_resource_limits{namespace=\"traefik\", container=\"traefik\", resource=\"cpu\"} and on(pod) (kube_pod_status_phase{namespace=\"traefik\", phase=\"Running\"} == 1)", "legendFormat": "CPU {{pod}}" },
            { "refId": "B", "expr": "sum by (pod) (rate(container_cpu_cfs_throttled_periods_total{namespace=\"traefik\", container=\"traefik\"}[$__rate_interval])) / sum by (pod) (rate(container_cpu_cfs_periods_total{namespace=\"traefik\", container=\"traefik\"}[$__rate_interval])) and on(pod) (kube_pod_status_phase{namespace=\"traefik\", phase=\"Running\"} == 1)", "legendFormat": "스로틀 {{pod}}" },
            { "refId": "C", "expr": "vector(1)", "legendFormat": "limit" }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "decimals": 1,
              "min": 0,
              "custom": { "fillOpacity": 0, "lineWidth": 2, "showPoints": "never", "axisSoftMax": 1.05 },
              "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null } ] }
            },
            "overrides": [
              { "matcher": { "id": "byRegexp", "options": "스로틀.*" }, "properties": [ { "id": "color", "value": { "mode": "fixed", "fixedColor": "red" } }, { "id": "custom.fillOpacity", "value": 15 } ] },
              { "matcher": { "id": "byName", "options": "limit" }, "properties": [ { "id": "color", "value": { "mode": "fixed", "fixedColor": "#9e9e9e" } }, { "id": "custom.lineStyle", "value": { "fill": "dash", "dash": [10, 10] } } ] }
            ]
          },
          "options": { "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["max"] } }
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "앞단 연결 · 고루틴 — 왼쪽 메모리가 오른 이유",
          "description": "traefik 은 리버스 프록시라 앞에서는 서버, 뒤에서는 클라이언트다. 이 패널은 **앞단(받는 쪽)** 만 센다 — traefik 이 백엔드로 건 소켓 수는 지표로 내보내지 않는다.\n\n- **앞단 연결** 엔트리포인트 websecure(443)에 열려 있는 소켓 수. HTTP keep-alive 라 요청을 보내지 않는 순간에도 열려 있어, 초당 요청 수가 아니라 **동시에 붙어 있는 상대 수**를 따라간다. 세는 상대는 방문자 브라우저가 아니라 그 앞의 CDN 엣지다\n- **고루틴** 소켓 하나에 읽기·쓰기 몫이 붙어 연결 하나당 여럿이 된다. **연결과 무관한 몫이 바닥에 깔려 있다** — 유휴 실측 3파드 합 약 840(파드당 약 280). 쿠버네티스 리소스 감시(종류마다 informer 가 붙는다) · 엔트리포인트 accept 루프 · 백엔드로 맺어 둔 유휴 연결(Go 는 유휴 연결 하나에 읽기·쓰기 고루틴 둘을 붙인다) · 지표 수집 · 헬스체크가 그 몫이다. 절대값이 아니라 그 위의 증가분으로 읽는다\n\n**메모리로 이어지는 관계:** 소켓 × (고루틴 스택 + 버퍼) = 메모리. 왼쪽 게이지가 오른 이유가 여기 있다.\n\n**읽는 법**\n- 두 선이 같은 비율로 움직인다 → 정상\n- 연결은 그대로인데 고루틴만 오른다 → 요청이 끝나지 않고 쌓이는 중\n- 접속자 수보다 연결이 한참 작다 → 엣지가 방문자 소켓을 대신 들고, 오리진으로는 소수의 연결에 요청을 몰아 보내는 것이다. **요청 수가 줄어든 것이 아니라 소켓 수만 줄어든 것이다**\n\n80(web)은 세지 않는다 — 밖에서 닫혀 있어 내부 접속만 오고, 그 수로 내릴 판단이 없다.",
          "datasource": { "type": "prometheus", "uid": "mimir" },
          "gridPos": { "h": 8, "w": 8, "x": 16, "y": 1 },
          "targets": [
            { "refId": "A", "expr": "sum(traefik_open_connections{entrypoint=\"websecure\"})", "legendFormat": "앞단 연결 (443)" },
            { "refId": "B", "expr": "sum(go_goroutines{namespace=\"traefik\"})", "legendFormat": "고루틴" }
          ],
          "fieldConfig": {
            "defaults": { "unit": "short", "decimals": 0, "min": 0, "custom": { "fillOpacity": 0, "lineWidth": 2, "showPoints": "never" } },
            "overrides": [
              { "matcher": { "id": "byName", "options": "고루틴" }, "properties": [ { "id": "custom.lineStyle", "value": { "fill": "dash", "dash": [6, 4] } } ] }
            ]
          },
          "options": { "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["lastNotNull", "max"] } }
        },
        {
          "type": "row",
          "title": "2. queue — 줄을 세우는 파드",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 9 },
          "collapsed": false,
          "panels": []
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "queue 메모리 — working_set / limit 256Mi",
          "description": "파드별 working_set ÷ memory limit. **100%(점선)에 닿으면 그 파드가 OOMKill 된다.**\n\n타임시리즈인 이유 — 이 판의 용도가 부하 중 \"언제 얼마까지 올랐나\"의 사후 분석이라서다. 게이지는 마지막 값 하나만 남아 판이 끝나면 판 동안의 움직임이 사라진다. 지금 값은 범례 Last 로 읽는다.\n\n- queue 는 대기열 상태를 전부 Redis 에 두고, 백엔드 소켓은 traefik 이 풀로 재사용한다 — 그래서 이 선은 동시 접속자 수와 거의 무관하다\n- 오르면 그 순간 동시에 처리 중인 요청이 늘어난 것이다 (요청이 만든 객체는 응답이 나가야 회수된다)\n- limit 은 지표로 읽으므로 limit 을 바꾸면 선이 따라온다",
          "datasource": { "type": "prometheus", "uid": "mimir" },
          "gridPos": { "h": 8, "w": 6, "x": 0, "y": 10 },
          "targets": [
            { "refId": "A", "expr": "container_memory_working_set_bytes{namespace=\"app\", container=\"queue\"} / on(pod) group_left() kube_pod_container_resource_limits{namespace=\"app\", container=\"queue\", resource=\"memory\"} and on(pod) (kube_pod_status_phase{namespace=\"app\", phase=\"Running\"} == 1)", "legendFormat": "{{pod}}" },
            { "refId": "B", "expr": "vector(1)", "legendFormat": "limit" }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "decimals": 1,
              "min": 0,
              "custom": { "fillOpacity": 10, "lineWidth": 2, "showPoints": "never", "axisSoftMax": 1.05 }
            },
            "overrides": [
              { "matcher": { "id": "byName", "options": "limit" }, "properties": [ { "id": "color", "value": { "mode": "fixed", "fixedColor": "text" } }, { "id": "custom.lineStyle", "value": { "fill": "dash", "dash": [10, 6] } }, { "id": "custom.lineWidth", "value": 1 }, { "id": "custom.fillOpacity", "value": 0 }, { "id": "custom.hideFrom", "value": { "legend": false, "tooltip": true, "viz": false } } ] }
            ]
          },
