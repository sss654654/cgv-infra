# queue 서비스 대시보드 — traefik(관문) · queue(파드) (2026-08-29 전면 재작성)
#
# 이전 판(부하 판 21회용 판정 화면)을 백지에서 다시 짰다. 지운 패널의 역할이 간 곳:
#   판의 전제(재시작·5xx)     인프라 판(재시작·비정상 파드) · 공개 서비스 판(실패 코드별)
#   루프 멈춤                승격 루프가 서면 행4의 「승격/초」 선이 0 으로 눕는 것으로 보인다
#   줄(대기·정원·입장 중)     서비스 흐름은 공개 서비스 판 소관
#   체류/타임아웃 판정        booking 판 재편 때 인증 회수와 함께 결정
#   연결당 비용(고루틴·스택·힙)  삭제 — 계수의 내역을 파던 12부 전용 질문.  필요하면 사후 쿼리로
#   Redis 코어·명령·µs        app-redis-kafka 판으로
#   working_set vs RSS 구분   working_set 만 남김 — 커널이 OOMKill 을 판정하는 값.
#                            RSS 는 계수(기울기) 추출용이라 판 사후 쿼리로 한다
#
# 행 구성 — 부하가 지나는 순서다.
#   행1 traefik    관문.  파드별 게이지(메모리·CPU / limit %) + 스로틀 + ★동시 연결
#   행2 queue      파드.  같은 게이지 + 스로틀 + Redis 풀
#   행3 지연 p99   사용자가 겪는 것.  traefik 선과 앱 선의 간격 = 관문+네트워크 몫
#   행4 흐름       줄서기(enter) · 승격 발행 · 인증 소비
#
# 게이지 최대값은 하드코딩하지 않는다 — kube_pod_container_resource_limits 로 나눈 % 라
#   limit 을 바꾸면 판이 따라온다(이전 판에서 상수 상한이 123.96% 를 그린 사고의 재발 방지).
#   빨간 임계 80% = 판 통과선(memory: limit 의 80% 미만)과 같은 값.
#   파드 수가 변하면 게이지 막대 수가 자동으로 따라간다(쿼리가 파드별 시리즈를 낸다).
#
# 12부 실측(비교 기준): 연결 = 인원 × 1.00 · traefik RSS 사람당 56KiB(평시)/132KiB(봉우리) ·
#   queue CPU 500m 에서 스로틀 83% → 1000m 에서 0%.  스로틀은 평균 CPU 가 낮아도 선다 —
#   CPU 게이지가 낮은데 스로틀 stat 이 빨갛면 limit(배급 간격)이 원인이다.
apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-app-queue-detail
  namespace: observability
  labels:
    grafana_dashboard: "1"
data:
  app-queue-detail.json: |
    {
      "uid": "app-queue-detail",
      "title": "queue 서비스 — traefik · queue",
      "tags": ["cgv", "app", "queue"],
      "editable": true,
      "timezone": "browser",
      "time": { "from": "now-1h", "to": "now" },
      "refresh": "30s",
      "schemaVersion": 39,
      "templating": { "list": [] },
      "panels": [
        {
          "type": "row",
          "title": "1. traefik — 관문. 모든 요청이 먼저 지나는 자리",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 },
          "collapsed": false,
          "panels": []
        },
        {
          "id": 1,
          "type": "bargauge",
          "title": "traefik 메모리 — 파드별 / limit",
          "description": "**어느 파드가 위험한가, 고르게 받고 있나.** working_set(커널이 OOMKill 을 판정하는 값) ÷ limit.\n\n- 한 막대만 높다 → 연결이 그 파드에 몰렸다 (MetalLB VIP 소유 노드 확인)\n- 전부 고르게 오른다 → 인원 축 부하. 12부 계수: 사람당 56KiB(평시)·132KiB(봉우리)\n- 빨강(80%) = 판 통과선. 100% 면 죽는다\n\nlimit 을 지표로 나눠서 limit 변경 시 판이 따라온다.",
          "datasource": { "type": "prometheus", "uid": "mimir" },
          "gridPos": { "h": 8, "w": 6, "x": 0, "y": 1 },
          "targets": [
            { "refId": "A", "expr": "container_memory_working_set_bytes{namespace=\"traefik\", container=\"traefik\"} / on(pod) group_left() kube_pod_container_resource_limits{namespace=\"traefik\", container=\"traefik\", resource=\"memory\"}", "legendFormat": "{{pod}}" }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "decimals": 1,
              "min": 0,
              "max": 1,
              "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null }, { "color": "red", "value": 0.8 } ] }
            },
            "overrides": []
          },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "orientation": "horizontal", "displayMode": "basic", "showUnfilled": true }
        },
        {
          "id": 2,
          "type": "bargauge",
          "title": "traefik CPU — 파드별 / limit",
          "description": "**사용률이다 — 판정은 옆 스로틀이 한다.** CPU 는 limit 에 닿아도 죽지 않고 잘린다. 이 게이지가 낮은데 스로틀이 빨갛면, 총량이 아니라 배급 간격(100ms 조각의 몫)이 원인이다.",
          "datasource": { "type": "prometheus", "uid": "mimir" },
          "gridPos": { "h": 8, "w": 6, "x": 6, "y": 1 },
          "targets": [
            { "refId": "A", "expr": "sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\"traefik\", container=\"traefik\"}[$__rate_interval])) / on(pod) group_left() kube_pod_container_resource_limits{namespace=\"traefik\", container=\"traefik\", resource=\"cpu\"}", "legendFormat": "{{pod}}" }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "decimals": 1,
              "min": 0,
              "max": 1,
              "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null }, { "color": "red", "value": 0.8 } ] }
            },
            "overrides": []
          },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "orientation": "horizontal", "displayMode": "basic", "showUnfilled": true }
        },
        {
          "id": 3,
          "type": "stat",
          "title": "traefik 스로틀",
          "description": "**0 이 정상.** 커널이 100ms 조각마다 몫을 배급하는데, 그 조각에서 몫을 다 쓰고 잘린 비율이다. 평균 CPU 가 낮아도 요청이 몰리면 선다 — 서면 지연의 원인이 CPU limit 이라는 뜻이고, limit 상향이 손잡이다.",
          "datasource": { "type": "prometheus", "uid": "mimir" },
          "gridPos": { "h": 8, "w": 4, "x": 12, "y": 1 },
          "targets": [
            { "refId": "A", "expr": "sum by (pod) (rate(container_cpu_cfs_throttled_periods_total{namespace=\"traefik\", container=\"traefik\"}[5m])) / sum by (pod) (rate(container_cpu_cfs_periods_total{namespace=\"traefik\", container=\"traefik\"}[5m]))", "legendFormat": "{{pod}}", "instant": true }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "decimals": 1,
              "noValue": "0",
              "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null }, { "color": "red", "value": 0.01 } ] }
            },
            "overrides": []
          },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "textMode": "value_and_name", "colorMode": "value", "graphMode": "none", "orientation": "vertical" }
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "동시 연결 — 엔트리포인트별 (web=터널 · websecure=공개 경로)",
          "description": "**이 클러스터가 몇 명을 받는지를 정해 온 값이다.** 폴링 사용자는 요청을 안 보내는 순간에도 keep-alive 소켓을 쥔다 — 12부 실측: 연결 = 인원 × 1.00, 그 연결의 메모리가 traefik 상한(계산 약 25,000명)을 만들었다.\n\n**엣지 뒤 판의 판정이 여기서 난다:**\n- 공개 경로(websecure)로 인원 N 을 넣었는데 연결이 N 보다 한참 아래 → 엣지가 연결을 대신 받고 있다. traefik 메모리 축이 풀린 것\n- 연결이 여전히 N 에 비례 → 엣지가 못 받아 준 것. 12부 상한이 그대로 남는다\n\n터널 경유 판(web)은 12부와 같은 구조라 인원 × 1.00 이 재현되어야 한다.",
          "datasource": { "type": "prometheus", "uid": "mimir" },
          "gridPos": { "h": 8, "w": 8, "x": 16, "y": 1 },
          "targets": [
            { "refId": "A", "expr": "sum by (entrypoint) (traefik_open_connections{entrypoint=~\"web|websecure\"})", "legendFormat": "{{entrypoint}}" }
          ],
          "fieldConfig": {
            "defaults": { "unit": "short", "decimals": 0, "min": 0, "custom": { "fillOpacity": 10, "lineWidth": 2, "showPoints": "never" } },
            "overrides": []
          },
          "options": { "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["lastNotNull", "max"] } }
        },
        {
          "type": "row",
          "title": "2. queue — 파드",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 9 },
          "collapsed": false,
          "panels": []
        },
        {
          "id": 5,
          "type": "bargauge",
          "title": "queue 메모리 — 파드별 / limit",
          "description": "**queue 는 연결 축이 아니다** — 상태가 전부 Redis 에 있고 백엔드 소켓은 traefik 풀이 재사용한다(12부: 5,000명에 뒤 연결 127개). 인원을 올려도 이 게이지는 거의 안 움직이는 게 정상이고, **움직이면 그게 조사 대상이다** (12부 미확정: 10,000명 4파드 판에서 파드당 128MiB 로 튐 — 이번 계단에서 파드 수 고정으로 가른다).",
          "datasource": { "type": "prometheus", "uid": "mimir" },
          "gridPos": { "h": 8, "w": 6, "x": 0, "y": 10 },
          "targets": [
            { "refId": "A", "expr": "container_memory_working_set_bytes{namespace=\"app\", container=\"queue\"} / on(pod) group_left() kube_pod_container_resource_limits{namespace=\"app\", container=\"queue\", resource=\"memory\"}", "legendFormat": "{{pod}}" }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "decimals": 1,
              "min": 0,
              "max": 1,
              "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null }, { "color": "red", "value": 0.8 } ] }
            },
            "overrides": []
          },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "orientation": "horizontal", "displayMode": "basic", "showUnfilled": true }
        },
        {
          "id": 6,
          "type": "bargauge",
          "title": "queue CPU — 파드별 / limit",
          "description": "**queue 부하는 이 축으로 온다** — 폴링이 초당 수천 요청이고 요청마다 처리 경로를 돈다. 12부 계수: 사람당 0.052 mCPU. 막대가 고르게 오르면 인원 축 정상, 하나만 높으면 분배 문제다. 판정은 옆 스로틀 — limit 500m 시절 평균은 낮은데 스로틀 83% 가 났던 자리다.",
          "datasource": { "type": "prometheus", "uid": "mimir" },
          "gridPos": { "h": 8, "w": 6, "x": 6, "y": 10 },
          "targets": [
            { "refId": "A", "expr": "sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\"app\", container=\"queue\"}[$__rate_interval])) / on(pod) group_left() kube_pod_container_resource_limits{namespace=\"app\", container=\"queue\", resource=\"cpu\"}", "legendFormat": "{{pod}}" }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "decimals": 1,
              "min": 0,
              "max": 1,
              "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null }, { "color": "red", "value": 0.8 } ] }
            },
            "overrides": []
          },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "orientation": "horizontal", "displayMode": "basic", "showUnfilled": true }
        },
        {
          "id": 7,
          "type": "stat",
          "title": "queue 스로틀",
          "description": "**0 이 정상.** 12부: limit 500m 에서 82.97% → 1000m 에서 0.00%. 스로틀이 서면 풀 대기·포기(오른쪽)가 따라 선다 — CPU 를 못 받는 동안 Redis 응답을 제때 못 읽어 커넥션 반납이 늦어서다.",
          "datasource": { "type": "prometheus", "uid": "mimir" },
          "gridPos": { "h": 8, "w": 4, "x": 12, "y": 10 },
          "targets": [
            { "refId": "A", "expr": "sum by (pod) (rate(container_cpu_cfs_throttled_periods_total{namespace=\"app\", container=\"queue\"}[5m])) / sum by (pod) (rate(container_cpu_cfs_periods_total{namespace=\"app\", container=\"queue\"}[5m]))", "legendFormat": "{{pod}}", "instant": true }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "decimals": 1,
              "noValue": "0",
              "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null }, { "color": "red", "value": 0.01 } ] }
            },
            "overrides": []
          },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "textMode": "value_and_name", "colorMode": "value", "graphMode": "none", "orientation": "vertical" }
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "Redis 풀 — 기다린 시간 · 포기 / 기준 1,500ms",
          "description": "**포기가 판정이고 대기는 전조다.** 대기가 몇만 건이어도 포기 0 이면 지연이지 고장이 아니다(12부: 대기 41,829건 · 포기 0).\n\n- **포기 > 0** 사용자가 실패를 받는 중. 원인은 대개 풀이 아니라 **queue CPU** — 12부에서 limit 을 올리자 포기 59건/초 → 0 (풀 크기는 10 그대로였다)\n- 기준 1,500ms = go-redis 기본값 ReadTimeout(500ms) + 1초\n\nRedis 자체의 건강(코어·명령·메모리)은 Redis·Kafka 판에서 본다 — 이 패널은 queue 앱이 Redis 로 가는 문의 상태다.",
          "datasource": { "type": "prometheus", "uid": "mimir" },
          "gridPos": { "h": 8, "w": 8, "x": 16, "y": 10 },
          "targets": [
            { "refId": "A", "expr": "sum(rate(queue_redis_pool_wait_seconds_total[1m])) / sum(rate(queue_redis_pool_wait_count_total[1m])) * 1000", "legendFormat": "기다린 시간 (요청당 ms)" },
            { "refId": "B", "expr": "sum(rate(queue_redis_pool_timeouts_total[1m])) or vector(0)", "legendFormat": "포기 (건/초)" }
          ],
          "fieldConfig": {
            "defaults": { "unit": "ms", "decimals": 1, "min": 0, "custom": { "fillOpacity": 0, "lineWidth": 2, "showPoints": "never" } },
            "overrides": [
              {
                "matcher": { "id": "byName", "options": "포기 (건/초)" },
                "properties": [
                  { "id": "unit", "value": "reqps" },
                  { "id": "custom.axisPlacement", "value": "right" },
                  { "id": "color", "value": { "mode": "fixed", "fixedColor": "red" } }
                ]
              }
            ]
          },
          "options": { "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["mean", "max"] } }
        },
        {
          "type": "row",
          "title": "3. 지연 — 사용자가 겪는 시간",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 18 },
          "collapsed": false,
          "panels": []
        },
        {
          "id": 9,
          "type": "timeseries",
          "title": "p99 — 앱(position · events · board) vs traefik 전 구간",
          "description": "**traefik 선과 앱 선의 간격이 관문+네트워크 몫이다.**\n\n- 앱 선만 오른다 → 앱·저장소 쪽. position/events 면 queue·Redis, board 면 booking\n- traefik 선만 오르고 간격이 벌어진다 → 행1(관문)로 — 연결·CPU·스로틀\n- 전부 같이 오른다 → 노드·네트워크\n\n통과선(부하 판): position 정상 구간 500ms · 현황판(events·board) 3초. y 축이 로그라 눈대중 말고 범례 수치를 읽는다. traefik 히스토그램 첫 칸이 5ms 라 그 아래 평평한 건 빠른 게 아니라 못 잰 것이다.\n\n점(exemplar)을 누르면 그 요청의 트레이스가 열린다.",
          "datasource": { "type": "prometheus", "uid": "mimir" },
          "gridPos": { "h": 9, "w": 24, "x": 0, "y": 19 },
          "targets": [
            { "refId": "A", "expr": "histogram_quantile(0.99, sum by (le) (rate(queue_http_request_duration_seconds_bucket{path=\"/api/admission/position\"}[1m])))", "legendFormat": "앱 position p99", "exemplar": true },
            { "refId": "B", "expr": "histogram_quantile(0.99, sum by (le) (rate(queue_http_request_duration_seconds_bucket{path=\"/api/admission/events\"}[1m])))", "legendFormat": "앱 events p99", "exemplar": true },
            { "refId": "C", "expr": "histogram_quantile(0.99, sum by (le) (rate(http_server_requests_seconds_bucket{application=\"cgv-booking\", uri=\"/api/screenings/board\"}[1m])))", "legendFormat": "앱 board p99 (booking 서빙)", "exemplar": true },
            { "refId": "D", "expr": "histogram_quantile(0.99, sum by (le) (rate(traefik_entrypoint_request_duration_seconds_bucket{entrypoint=~\"web|websecure\"}[1m])))", "legendFormat": "traefik 전 구간 p99" }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": { "fillOpacity": 0, "lineWidth": 2, "showPoints": "never", "scaleDistribution": { "type": "log", "log": 10 } }
            },
            "overrides": [
              { "matcher": { "id": "byName", "options": "traefik 전 구간 p99" }, "properties": [ { "id": "custom.lineStyle", "value": { "fill": "dash", "dash": [6, 4] } }, { "id": "color", "value": { "mode": "fixed", "fixedColor": "light-blue" } } ] }
            ]
          },
          "options": { "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["mean", "max"] } }
        },
        {
          "type": "row",
          "title": "4. 흐름 — 줄에 들어오는 속도와 빠져나가는 속도",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 28 },
          "collapsed": false,
          "panels": []
        },
        {
          "id": 10,
          "type": "timeseries",
          "title": "줄서기(enter) · 승격 발행 · 인증 소비",
