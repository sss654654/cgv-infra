              "description": "**포화 신호.** 인원이 늘 때 여기가 같이 오르면 그 명령이 무거워지고 있다는 뜻이다.\n\n큐 경로의 명령만 골랐다. **호출이 드문 명령은 호출당이 커도 비용이 0 이다** —\n`del` 은 호출당 657us 로 제일 무겁지만 10초에 한 번 부른다. 넣으면 1위로 올라와 눈을 속인다.\n\n`명령별 초당 호출 수` × 여기 = 그 명령이 먹는 코어.\n\n1,000 → 5,000명에서 `zrank` 만 올랐다(2.4 → 3.8us). 줄이 길어질수록 순위 계산이 무거워진다.\n나머지가 평평한 것은 자료구조가 커져도 명령 하나의 비용은 그대로라는 뜻이다.",
              "datasource": {
