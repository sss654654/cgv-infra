        {
          "type": "timeseries",
          "id": 13,
          "title": "전원 공급 · 배터리 잔량",
          "description": "#### 지금 — 전기가 언제 끊겼고, 배터리가 얼마나 빨리 빠지나\n\n- **배터리 %** — 잔량. 기울기가 곧 방전 속도이고, AC 가 끊긴 뒤 남은 시간의 근거다\n- **AC 연결** — 100 이면 어댑터 연결, 0 이면 배터리로 도는 중. 선이 떨어진 시점이 전기가 끊긴 시각이다\n\n충전선을 뽑아 실증했다 — 값이 즉시 배터리로 바뀌고 서버는 계속 돌았다. 배터리 모드에서는 클럭이 낮아져 온도가 함께 내려가므로, 열 실측은 AC 연결 상태에서 한다.",
          "datasource": { "type": "prometheus", "uid": "mimir" },
          "gridPos": { "h": 7, "w": 16, "x": 0, "y": 16 },
          "targets": [
            { "refId": "A", "expr": "node_power_supply_capacity{job=\"hypervisor\", power_supply=\"BAT0\"}", "legendFormat": "배터리 %" },
            { "refId": "B", "expr": "node_power_supply_online{job=\"hypervisor\", power_supply=\"ADP1\"} * 100", "legendFormat": "AC 연결 (100=연결)" }
