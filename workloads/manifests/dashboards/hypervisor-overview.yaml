# 호스트 하드웨어 대시보드 — Proxmox 호스트(물리 노트북) 자체를 본다.
# 클러스터 인프라 대시보드가 VM 안(노드 OS·컨테이너·k8s)을 보는 반면, 이 판은 그 아래
# 물리 호스트 층 하나만 본다. 지표원은 호스트에 apt 로 설치한 node-exporter(job=hypervisor)다.
#
# 판의 논리 — 이 호스트가 죽거나 느려지는 물리 축에서 역산하고, 축 하나에 행 하나를 준다.
#   행0 지금 축마다 숫자 하나 → 색이 바뀐 축의 행으로 내려가면 원인이 나온다.
#
#   행0 지금    응답 · CPU온도 · 전원 · 배터리 · 주디스크 판정 · 마지막 부팅
#   행1 열      증상(CPU 온도) → 원인(클럭) → 범위(NVMe = 섀시까지 뜨거운가)
#   행2 전력    지금 공급·잔량 추이 → 과거에 끊긴 흔적(비정상 종료)
#   행3 포화    CPU → 메모리/스왑 → 그 결과(OOM) → 디스크 I/O
#   행4 저장    thin pool(VM 디스크) → 마운트(호스트 영역) → 주 디스크 온도·읽기 오류율 점수
#   각 행 안에서 왼→오른쪽이 인과 순서다.
#
# CPU 온도는 패키지 한 선 — 패키지 센서가 가장 뜨거운 코어를 따라간다(실측: 최고 코어와
#   Last·Max 완전 일치). 코어별 상세는 사고 조사 때 라벨 조인으로 직접 편다.
# CPU 클럭이 열의 원인 축이다. 실측(2026-08-24): 유휴 92°C 였던 호스트를 팬 → 뚜껑 열기 →
#   거버너 powersave 로 66°C 까지 내렸고, 팬은 섀시(NVMe 61→50)만 식히고 CPU 는 못 내렸다.
#   거버너 전환으로 유휴 평균 클럭 3.1→2.4GHz, 최고 코어는 4.3GHz 유지(부하 성능 보존).
# 팬 회전수는 이 노트북이 센서를 내놓지 않아 못 본다 — 물리 냉각 실패는 클럭·부하가
#   정상인데 온도만 높은 것으로 소거해서 판단한다.
# 임계는 차트에 선으로 그린다(thresholdsStyle line). 온도 판정선은 평시 66°C 기준의 잠정값이고,
#   부하 중 거동은 마지막 부하 실측에서 확인한 뒤 재검한다.
# 전원 공급 = 내장 UPS 감시 — 노트북은 AC 가 끊겨도 배터리로 도는 유예가 있어, 그 유예 동안
#   "배터리"로 바뀐 값이 잡힌다. 충전선을 뽑아 즉시 전환을 실증했다.
# 비정상 종료는 누적값이 아니라 화면 시간 범위 안의 증가분으로 본다 — 누적(129회)에는 이
#   프로젝트 이전 이력이 섞여 있어 판정에 못 쓴다. 밤 예약 종료를 켠 뒤 며칠 창에서 0 이어야 한다.
# OOM 은 재부팅마다 0 으로 돌아가는 카운터라 increase() 로 센다(max-min 은 재부팅에서 틀린다).
# 디스크 I/O 는 제외 방식(device!~"dm-.*|loop.*|sr.*") — dm-* 는 물리 장치 위 LVM 매핑이라
#   같은 I/O 의 사본. 이름을 하드코딩하면 USB 장치가 재부팅 후 sdb 로 잡힐 때 조용히 빠진다.
# iowait 는 CPU 별 시리즈라 avg 로 접는다 — 집계 없이 그리면 같은 이름이 CPU 수만큼 찍힌다.
# 주 디스크(sda, 외장 USB SSD)는 hwmon 에 온도가 없지만 smartctl 이 SAT 로 USB 브리지를
#   통과해 SMART 를 읽는다. 다만 이 컨트롤러는 재할당 섹터·수명 속성을 노출하지 않아
#   healthy 판정이 읽기 오류율 하나에 걸린다 — 판정 근거가 그만큼 좁다는 것을 알고 쓰고,
#   디스크 손실 대비는 알림이 아니라 백업이 받는다.
#   그 하나가 판정을 좌우하므로 점수(100 시작, 합격선 50)를 행4 에 따로 둔다 —
#   종합 판정은 이미 넘은 뒤의 신호이고, 점수는 그 전에 움직인다. SMART 알림이 이 패널로 이어진다.
# 패널 id 는 명시한다 — 알림이 __panelId__ 로 특정 패널을 지목해 이미지를 렌더하므로
#   id 가 없으면 그 연결이 성립하지 않는다(9=CPU 온도 추이 · 13=전원·배터리 · 24=읽기 오류율 점수).
# smartmon·nvme·thinpool 지표는 타이머·cron 이 textfile 로 쓰는 것이라 갱신이 느리다
#   (스크레이프 주기가 아님) — 연속 추이가 아니라 저속 상태값으로 읽는다.
# thin pool(local-lvm)은 VM 디스크가 사는 곳이고 마운트가 아니라 node_filesystem 에 안 나온다.
#   /usr/local/bin/thinpool-textfile.sh 가 lvs 를 읽어 textfile 로 낸다(cron 5분).
#   실측(2026-08-24): 약속 355GB / 실사용 66GB / 풀 815GB = 8.1%. metadata 가 먼저 차도
#   풀 전체가 쓰기를 거부하므로 둘을 같이 본다.
# 마운트 사용률은 ext4 가 root 용으로 떼어두는 예약분(기본 5%)을 사용으로 계산한다
#   (avail 은 예약분을 뺀 값이라). 그래서 Proxmox 화면보다 약 5%p 높게 보인다 — 더 보수적인 쪽.
# 인과 역전 주의 — 이 판(최하층)의 데이터가 자기 위층(VM 안 Alloy→Mimir→Grafana)을 지나온다.
#   그래서 관측 스택이 멈춰도 호스트가 멀쩡한 채 판이 공백이 된다. Proxmox 웹UI(:8006)가
#   관측과 독립인 확인 경로다 — 웹UI 가 열리면 호스트 생존, 그러면 관측 쪽이 죽은 것.
# 호스트가 완전히 꺼지면 이 판도 알림도 침묵한다 — 그 구간은 밖에서 보는 프로브가 잡는다.
# NIC(e1000e) 상태는 "안에서는 되는데 밖에서만 안 되는" 사건이라 이 판으로 못 잡는다 —
#   외부 프로브 몫으로 남긴다.
apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-hypervisor-overview
  namespace: observability
  labels:
    grafana_dashboard: "1"
data:
  hypervisor-overview.json: |
    {
      "uid": "hypervisor-overview",
      "title": "호스트 하드웨어",
      "tags": ["cgv", "infra"],
      "editable": true,
      "timezone": "browser",
      "time": { "from": "now-3h", "to": "now" },
      "refresh": "30s",
      "schemaVersion": 39,
      "templating": { "list": [] },
      "panels": [
        {
          "type": "row",
          "id": 1,
          "title": "0. 지금 — 축마다 숫자 하나. 색이 바뀐 축의 행으로 내려간다",
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 }
        },
        {
          "type": "stat",
          "id": 2,
          "title": "호스트 응답",
          "description": "#### 이 판의 값들이 살아 있는 값인가\n\n`up{job=\"hypervisor\"}` — Alloy 가 호스트 :9100 을 긁고 있나. 끊김이면 이 판의 다른 값이 전부 갱신을 멈춘 상태다.\n\n판 전체가 No data 면 두 갈래다 — 호스트가 죽었거나, 이 판을 그리는 관측(클러스터 안)이 죽었거나. **Proxmox 웹UI(:8006)** 는 관측과 독립이라 그걸로 가른다.",
          "datasource": { "type": "prometheus", "uid": "mimir" },
          "gridPos": { "h": 4, "w": 3, "x": 0, "y": 1 },
          "targets": [ { "refId": "A", "expr": "up{job=\"hypervisor\"}", "instant": true } ],
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "textMode": "value", "graphMode": "none" },
          "fieldConfig": {
            "defaults": {
              "unit": "none", "decimals": 0,
              "mappings": [
                { "type": "value", "options": { "0": { "text": "끊김", "color": "red" }, "1": { "text": "응답", "color": "green" } } }
              ],
              "thresholds": { "mode": "absolute", "steps": [ { "color": "red", "value": null }, { "color": "green", "value": 1 } ] }
            },
            "overrides": []
          }
        },
        {
          "type": "stat",
          "id": 3,
          "title": "CPU 온도 (패키지)",
          "description": "#### 열 축 — 지금 칩이 몇 도인가\n\ncoretemp `Package id 0`, 칩 대표값(가장 뜨거운 코어를 따라간다). 하드웨어 임계 110 — 닿으면 스스로 꺼진다. 과열로 예고 없이 꺼진 이력이 있어 이 숫자가 판의 중심이다.\n\n**왜 이 온도인지는 행1(클럭)이 답한다.** 평시 66°C 기준의 잠정 판정선 — 주황 85 · 빨강 95.",
          "datasource": { "type": "prometheus", "uid": "mimir" },
          "gridPos": { "h": 4, "w": 5, "x": 3, "y": 1 },
          "targets": [ { "refId": "A", "expr": "node_hwmon_temp_celsius{job=\"hypervisor\", chip=\"platform_coretemp_0\", sensor=\"temp1\"}" } ],
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "textMode": "value", "graphMode": "none", "colorMode": "background" },
          "fieldConfig": {
            "defaults": {
              "unit": "celsius", "decimals": 0,
              "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null }, { "color": "orange", "value": 85 }, { "color": "red", "value": 95 } ] }
            },
            "overrides": []
          }
        },
        {
          "type": "stat",
          "id": 4,
          "title": "전원 공급",
          "description": "#### 전력 축 — AC 인가, 배터리로 버티는 중인가\n\n노트북 배터리가 내장 UPS 다 — AC 가 끊겨도 즉시 꺼지지 않고 배터리로 도는 유예가 있고, 그 유예 동안 이 값이 `배터리` 로 바뀐다. 그 창에서 알리고 조치한다.\n\n**추이와 방전 속도는 행2에서 본다.**",
          "datasource": { "type": "prometheus", "uid": "mimir" },
          "gridPos": { "h": 4, "w": 4, "x": 8, "y": 1 },
          "targets": [ { "refId": "A", "expr": "node_power_supply_online{job=\"hypervisor\", power_supply=\"ADP1\"}", "instant": true } ],
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "textMode": "value", "graphMode": "none" },
          "fieldConfig": {
            "defaults": {
              "unit": "none", "decimals": 0,
              "mappings": [
                { "type": "value", "options": { "0": { "text": "배터리", "color": "red" }, "1": { "text": "AC", "color": "green" } } }
              ],
              "thresholds": { "mode": "absolute", "steps": [ { "color": "red", "value": null }, { "color": "green", "value": 1 } ] }
            },
            "overrides": []
          }
        },
        {
          "type": "stat",
          "id": 5,
          "title": "배터리",
          "description": "#### 전력 축 — AC 가 끊기면 얼마나 버티나\n\n`BAT0` 잔량. 전원 공급이 `배터리` 로 바뀐 순간부터 이 숫자가 카운트다운이다. 20% 아래면 정상 종료를 결정한다 — 갑자기 전원이 끊기면 etcd·MySQL 이 깨진 상태로 남는다.",
          "datasource": { "type": "prometheus", "uid": "mimir" },
          "gridPos": { "h": 4, "w": 4, "x": 12, "y": 1 },
          "targets": [ { "refId": "A", "expr": "node_power_supply_capacity{job=\"hypervisor\", power_supply=\"BAT0\"}", "instant": true } ],
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "textMode": "value", "graphMode": "none" },
          "fieldConfig": {
            "defaults": {
              "unit": "percent", "decimals": 0, "min": 0, "max": 100,
              "thresholds": { "mode": "absolute", "steps": [ { "color": "red", "value": null }, { "color": "orange", "value": 20 }, { "color": "green", "value": 50 } ] }
            },
            "overrides": []
          }
        },
        {
          "type": "stat",
          "id": 6,
          "title": "주 디스크 SMART 판정",
          "description": "#### 저장 축 — 홈랩 전부가 사는 디스크의 자가진단\n\nProxmox·VM 3대가 전부 외장 USB SSD(sda) 위에 있다. 디스크가 자기 항목들을 제조사 합격선과 비교해 낸 종합 한 비트다 — `이상` 이면 아직 읽히는 동안 백업부터 빼고 교체 준비.\n\n**한계** — 이 컨트롤러는 재할당 섹터·수명 속성을 USB 너머로 안 넘겨, 판정이 읽기 오류율 하나에 걸린다. `정상` 이 안전을 보증하지 못하므로 실제 대비는 백업이다.",
          "datasource": { "type": "prometheus", "uid": "mimir" },
          "gridPos": { "h": 4, "w": 4, "x": 16, "y": 1 },
          "targets": [ { "refId": "A", "expr": "smartmon_device_smart_healthy{job=\"hypervisor\", disk=\"/dev/sda\"}", "instant": true } ],
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "textMode": "value", "graphMode": "none" },
          "fieldConfig": {
            "defaults": {
              "unit": "none", "decimals": 0,
              "mappings": [
                { "type": "value", "options": { "0": { "text": "이상", "color": "red" }, "1": { "text": "정상", "color": "green" } } }
              ],
              "thresholds": { "mode": "absolute", "steps": [ { "color": "red", "value": null }, { "color": "green", "value": 1 } ] }
            },
            "overrides": []
          }
        },
        {
          "type": "stat",
          "id": 7,
          "title": "마지막 부팅",
          "description": "#### 언제 켜졌나\n\n예정 종료(자정)→아침 기동이면 아침 시각이 찍힌다. 예정 밖 시각이면 조사 대상이다 — 사고인지 수동 재부팅인지는 그 직전의 온도·전원 추이(행1·행2)가 가른다.\n\n**종료가 깨끗했는지는 행2의 비정상 종료 패널이 답한다.**",
          "datasource": { "type": "prometheus", "uid": "mimir" },
          "gridPos": { "h": 4, "w": 4, "x": 20, "y": 1 },
          "targets": [ { "refId": "A", "expr": "node_boot_time_seconds{job=\"hypervisor\"} * 1000", "instant": true } ],
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "textMode": "value", "graphMode": "none" },
          "fieldConfig": {
            "defaults": {
              "unit": "dateTimeAsIso",
              "thresholds": { "mode": "absolute", "steps": [ { "color": "text", "value": null } ] }
            },
            "overrides": []
          }
        },
        {
          "type": "row",
          "id": 8,
          "title": "1. 열 — 뜨거운가, 왜",
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 5 }
        },
        {
          "type": "timeseries",
          "id": 9,
          "title": "CPU 온도 — 패키지 / 임계 110",
          "description": "#### 증상 — 임계까지 얼마나 남았고, 언제부터 이랬나\n\n패키지 한 선. 패키지 센서가 가장 뜨거운 코어를 따라가서(실측 확인) 이 선 하나로 판정이 된다.\n\n주황 85 · 빨강 95 선이 차트에 그려져 있다. 평시 66°C 기준의 잠정선이고, 부하 중 거동은 마지막 부하 실측에서 재검한다. 110 이 하드웨어 임계 — 닿으면 스스로 꺼진다.",
          "datasource": { "type": "prometheus", "uid": "mimir" },
          "gridPos": { "h": 9, "w": 10, "x": 0, "y": 6 },
          "targets": [
            { "refId": "A", "expr": "node_hwmon_temp_celsius{job=\"hypervisor\", chip=\"platform_coretemp_0\", sensor=\"temp1\"}", "legendFormat": "패키지" }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "celsius", "decimals": 0, "min": 40, "max": 110,
              "custom": { "drawStyle": "line", "lineWidth": 2, "fillOpacity": 0, "showPoints": "never", "thresholdsStyle": { "mode": "line" } },
              "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null }, { "color": "orange", "value": 85 }, { "color": "red", "value": 95 } ] }
            },
            "overrides": []
          },
          "options": { "tooltip": { "mode": "multi", "sort": "desc" }, "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["lastNotNull", "max"] } }
        },
        {
          "type": "timeseries",
          "id": 10,
          "title": "CPU 클럭 — 온도의 원인 축",
          "description": "#### 원인 — 유휴인데 왜 뜨겁나를 가르는 판\n\n`scaling_frequency` 평균·최고.\n\n- 클럭이 높게 유지 → 터보·거버너가 열원 (거버너가 performance 로 돌아갔는지 본다)\n- 클럭·CPU 사용률이 정상인데 온도만 높음 → 물리 냉각(팬 정지·뚜껑 닫힘·먼지). **팬 회전수는 이 노트북이 센서를 안 내놔 직접 확인이 안 되고 소거로 판단한다**\n\n실측(2026-08-24): performance 에서 유휴 평균 3.1GHz → powersave 로 2.4GHz, 최고 코어는 4.3GHz 유지(부하 성능은 그대로).",
          "datasource": { "type": "prometheus", "uid": "mimir" },
          "gridPos": { "h": 9, "w": 8, "x": 10, "y": 6 },
          "targets": [
