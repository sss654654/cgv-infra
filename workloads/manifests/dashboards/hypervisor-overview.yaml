        {
          "type": "timeseries",
          "id": 16,
          "title": "CPU 사용률 / 80%",
          "description": "#### 하이퍼바이저 자체가 포화인가\n\n`1 - idle` 전체 평균 — VM 3대와 호스트 프로세스를 합친 물리 CPU 사용률이다. 여기가 포화면 그 위 VM 전부가 느려진다.\n\n온도가 높을 때 이 값이 함께 높으면 실제 부하가 원인이고, 낮은데 온도만 높으면 클럭이나 냉각 쪽이다(행1).",
          "datasource": { "type": "prometheus", "uid": "mimir" },
          "gridPos": { "h": 7, "w": 6, "x": 0, "y": 24 },
          "targets": [ { "refId": "A", "expr": "100 - (avg(rate(node_cpu_seconds_total{job=\"hypervisor\", mode=\"idle\"}[5m])) * 100)", "legendFormat": "사용률" } ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent", "decimals": 0, "min": 0, "max": 100,
              "custom": { "drawStyle": "line", "lineWidth": 2, "fillOpacity": 10, "showPoints": "never", "thresholdsStyle": { "mode": "line" } },
              "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null }, { "color": "orange", "value": 80 } ] }
            },
            "overrides": []
          },
          "options": { "tooltip": { "mode": "single" }, "legend": { "displayMode": "list", "placement": "bottom" } }
