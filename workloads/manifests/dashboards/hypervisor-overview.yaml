        {
          "type": "timeseries",
          "id": 11,
          "title": "NVMe 온도 — 섀시까지 뜨거운가 / 임계 86.8",
          "description": "#### 범위 — 냉각이 몸통에 닿고 있나\n\n내장 NVMe(윈도우 디스크, 서버는 안 씀)의 `Composite`. CPU 패키지는 내부 히트파이프에 붙어 섀시가 식는지 안 보이는데, 이 디스크는 섀시에 붙어 있어 섀시 열을 따라간다.\n\n실측에서 이 값이 판정을 갈랐다 — 외부 팬을 켜자 이 값만 61→50°C 로 내려가고 CPU 는 그대로여서, 팬이 섀시까지만 닿는다는 것이 확인됐다.\n\n주황 70 · 빨강 82 (잠정).",
          "datasource": { "type": "prometheus", "uid": "mimir" },
          "gridPos": { "h": 9, "w": 6, "x": 18, "y": 6 },
          "targets": [ { "refId": "A", "expr": "node_hwmon_temp_celsius{job=\"hypervisor\", chip=\"nvme_nvme0\", sensor=\"temp1\"}", "legendFormat": "Composite" } ],
          "fieldConfig": {
