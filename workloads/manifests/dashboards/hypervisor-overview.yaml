          "description": "#### VM 디스크 공간이 남아 있나\n\nProxmox 화면의 `local-lvm` 스토리지가 이 저장고다 — thin pool 하나에 VM 201·202·203 의 디스크 이미지가 전부 산다. **마운트된 파일시스템이 아니라 `node_filesystem` 에 안 나와**, `lvs` 를 읽어 textfile 로 내보낸다(cron 5분 주기라 갱신이 느리다).\n\n- **한도(점선)에 닿으면 VM 3대가 동시에 쓰기를 못 한다** — 클러스터 정지\n- VM 별 선은 그 VM 디스크들의 합이다. 총 사용에는 스냅샷 몫이 더 들어가 VM 합보다 크다\n- VM 안에서 파일을 지워도 이 값은 잘 안 내려간다(블록 반환이 보장되지 않는다) — **VM 안은 널널한데 풀이 차는 상황이 성립하고, 그건 클러스터 대시보드로는 못 본다**\n- metadata 사용률은 판에서 뺐다(수년 여유) — 확인은 `lvs` 로 한다. 데이터가 여유여도 metadata 가 차면 풀 전체가 쓰기를 거부한다",
          "datasource": { "type": "prometheus", "uid": "mimir" },
          "gridPos": { "h": 7, "w": 7, "x": 6, "y": 32 },
          "targets": [
            { "refId": "A", "expr": "pve_thin_vm_used_bytes{job=\"hypervisor\"}", "legendFormat": "VM {{vm}}" },
            { "refId": "B", "expr": "pve_thinpool_used_bytes{job=\"hypervisor\"}", "legendFormat": "총 사용" },
            { "refId": "C", "expr": "pve_thinpool_size_bytes{job=\"hypervisor\"}", "legendFormat": "한도" }
          ],
          "fieldConfig": {
