            { "refId": "A", "expr": "rate(node_disk_io_time_seconds_total{job=\"hypervisor\", device!~\"dm-.*|loop.*|sr.*\"}[5m]) * 100", "legendFormat": "{{device}} util" },
            { "refId": "B", "expr": "avg(rate(node_cpu_seconds_total{job=\"hypervisor\", mode=\"iowait\"}[5m])) * 100", "legendFormat": "iowait" }
          ],
          "fieldConfig": {
