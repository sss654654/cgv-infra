        {
          "type": "stat",
          "id": 14,
          "title": "비정상 종료 — 이 기간 발생",
          "description": "#### 과거 — 전기가 인사 없이 끊긴 적이 있나\n\n화면 오른쪽 위 **시간 범위 안에서** 몇 번 일어났는지를 센다(30분 창이면 30분치, 7일 창이면 7일치). 누적값은 이 프로젝트 이전 이력이 섞여 있어 판정에 못 쓴다(참고: 누적 129회 / 전원 사이클 759회).\n\nSSD 는 캐시에 담아 두었다가 저장 셀에 옮기는데, 종료 신호 없이 전원이 끊기면 그 캐시가 사라진다 — 파일시스템·etcd·MySQL 이 깨질 수 있다.\n\n**카운터가 오르는 것** — 과열 자동 차단 · 전원 버튼 길게 눌러 강제 차단 · 배터리 방전 · USB 선 빠짐이나 버스 리셋(외장이라 이것이 크다) · 정전\n**안 오르는 것** — 전원 버튼 짧게 누름(ACPI 종료 절차) · `shutdown`·`reboot` · 정상 동작 중인 예약 종료\n\n**밤 예약 종료를 켠 뒤 며칠 창에서 0 이어야 스케줄이 깨끗한 것이다.**",
          "datasource": { "type": "prometheus", "uid": "mimir" },
          "gridPos": { "h": 7, "w": 8, "x": 16, "y": 16 },
          "targets": [ { "refId": "A", "expr": "max_over_time(smartmon_unsafe_shutdown_count_raw_value{job=\"hypervisor\", disk=\"/dev/sda\"}[$__range]) - min_over_time(smartmon_unsafe_shutdown_count_raw_value{job=\"hypervisor\", disk=\"/dev/sda\"}[$__range])", "instant": true } ],
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "textMode": "value", "graphMode": "none", "colorMode": "background" },
          "fieldConfig": {
            "defaults": {
              "unit": "none", "decimals": 0,
              "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null }, { "color": "red", "value": 1 } ] }
            },
            "overrides": []
          }
        },
        {
          "type": "row",
          "id": 15,
          "title": "3. 포화 — 막혔나, 뭐가 죽었나",
