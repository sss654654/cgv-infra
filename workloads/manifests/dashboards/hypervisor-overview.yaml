        {
          "type": "timeseries",
          "id": 17,
          "title": "메모리 · 스왑 / 85%",
          "description": "#### 호스트 메모리가 모자라지나\n\n물리 32GB 중 VM 3대에 24GB 를 줬고, 남은 몫으로 호스트 자신과 앞으로 올릴 방화벽 VM 이 돈다. **클러스터 대시보드는 이 남은 몫을 원리적으로 못 본다** — 여기가 모자라면 커널이 VM 프로세스를 죽인다(오른쪽 OOM 패널).\n\n스왑이 0 에서 오르는 순간이 신호다 — 단일 SSD 에서 스왑이 돌면 전 VM 이 느려진다.",
          "datasource": { "type": "prometheus", "uid": "mimir" },
          "gridPos": { "h": 7, "w": 6, "x": 6, "y": 24 },
          "targets": [
            { "refId": "A", "expr": "(1 - node_memory_MemAvailable_bytes{job=\"hypervisor\"} / node_memory_MemTotal_bytes{job=\"hypervisor\"}) * 100", "legendFormat": "메모리" },
            { "refId": "B", "expr": "(node_memory_SwapTotal_bytes{job=\"hypervisor\"} - node_memory_SwapFree_bytes{job=\"hypervisor\"}) / node_memory_SwapTotal_bytes{job=\"hypervisor\"} * 100", "legendFormat": "스왑" }
          ],
          "fieldConfig": {
