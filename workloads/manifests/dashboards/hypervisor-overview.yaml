              "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null }, { "color": "orange", "value": 85 } ] }
            },
            "overrides": []
          },
          "options": { "tooltip": { "mode": "multi" }, "legend": { "displayMode": "list", "placement": "bottom" } }
        },
        {
          "type": "stat",
          "id": 18,
          "title": "OOM — 이 기간 커널이 죽인 프로세스",
          "description": "#### 메모리 압박의 결과 — VM 이 죽었나\n\n호스트 메모리가 모자라면 커널이 프로세스를 골라 죽인다. 이 호스트에서 가장 큰 프로세스는 VM(QEMU) 이라, **OOM 이 나면 VM 한 대가 그 자리에서 사라진다** — 클러스터에서는 노드가 갑자기 없어진 것으로 보인다.\n\n왼쪽 메모리 사용률은 지나가면 회복돼 보이지만 OOM 은 실제로 벌어진 사건이다. 화면 시간 범위 안의 발생 건수를 센다(재부팅으로 카운터가 0 이 되는 것을 감안해 increase 로).",
          "datasource": { "type": "prometheus", "uid": "mimir" },
          "gridPos": { "h": 7, "w": 6, "x": 12, "y": 24 },
          "targets": [ { "refId": "A", "expr": "increase(node_vmstat_oom_kill{job=\"hypervisor\"}[$__range])", "instant": true } ],
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "textMode": "value", "graphMode": "none", "colorMode": "background" },
          "fieldConfig": {
            "defaults": {
              "unit": "none", "decimals": 0,
              "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null }, { "color": "red", "value": 1 } ] }
            },
            "overrides": []
          }
        },
        {
          "type": "timeseries",
          "id": 19,
          "title": "디스크 I/O — 물리 장치 util · iowait",
          "description": "#### 단일 SSD 가 병목인가\n\n물리 장치만 그린다 — `dm-*` 는 그 위 LVM 매핑이라 같은 I/O 의 사본이다. 이름 하드코딩 대신 제외 방식이라 USB 장치가 재부팅 후 다른 이름으로 잡혀도 놓치지 않는다.\n\n`iowait` 는 CPU 전체 평균 — 오르면 CPU 가 디스크를 기다리는 중이다. Proxmox·VM 3대가 이 디스크 하나를 공유하므로, 여기가 막히면 전부가 함께 느려진다.",
          "datasource": { "type": "prometheus", "uid": "mimir" },
          "gridPos": { "h": 7, "w": 6, "x": 18, "y": 24 },
