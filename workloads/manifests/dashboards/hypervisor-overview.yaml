        {
          "type": "bargauge",
          "id": 22,
          "title": "local — Proxmox 시스템 영역(/) · 96G 중 사용",
          "description": "#### 호스트 영역이 차고 있나\n\nProxmox 화면의 `local` 스토리지가 이 영역이다 — `/` 위에서 Proxmox 시스템과 ISO·백업·템플릿이 함께 쓰는 96GB. 차면 로그·이미지·백업이 못 쓰인다. VM 디스크는 여기가 아니라 왼쪽 thin pool 에 있다.\n\n**Proxmox 화면보다 약 5% 크게 보인다** — 이 계산은 ext4 가 root 전용으로 떼어두는 예약분(기본 5%)을 사용으로 친다(`avail` 이 예약분을 뺀 값이라). 더 보수적인 쪽이라 그대로 둔다.\n\n게이지 끝(96GiB)과 임계선은 정적이다 — 파티션을 바꾸면 같이 고친다. `/boot/efi` 는 설치 후 변하지 않아 뺐다.",
          "datasource": { "type": "prometheus", "uid": "mimir" },
          "gridPos": { "h": 7, "w": 6, "x": 0, "y": 32 },
          "targets": [ { "refId": "A", "expr": "node_filesystem_size_bytes{job=\"hypervisor\", mountpoint=\"/\"} - node_filesystem_avail_bytes{job=\"hypervisor\", mountpoint=\"/\"}", "legendFormat": "{{mountpoint}}", "instant": true } ],
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"] },
            "orientation": "horizontal",
            "displayMode": "basic",
            "showUnfilled": true
          },
          "fieldConfig": {
            "defaults": {
              "unit": "bytes", "decimals": 1, "min": 0, "max": 103079215104,
              "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null }, { "color": "orange", "value": 82463372083 }, { "color": "red", "value": 92771293594 } ] }
            },
            "overrides": []
          }
        },
        {
          "type": "stat",
          "id": 23,
          "title": "주 디스크(외장 SSD · sda) 온도",
          "description": "#### 매체가 뜨겁나\n\nSMART 194 번 속성의 실측값. hwmon 이 못 뚫는 USB 브리지를 SMART/SAT 경로가 통과한다. 타이머 주기로 갱신되는 저속 상태값이다.\n\n외장이라 섀시 열을 덜 받아 평시 38°C 근처다. 고온은 SSD 수명을 직접 깎으므로 주황 55 · 빨강 65 로 둔다(잠정).",
          "datasource": { "type": "prometheus", "uid": "mimir" },
          "gridPos": { "h": 7, "w": 4, "x": 13, "y": 32 },
          "targets": [ { "refId": "A", "expr": "smartmon_temperature_celsius_raw_value{job=\"hypervisor\", disk=\"/dev/sda\"}", "instant": true } ],
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "textMode": "value", "graphMode": "none" },
          "fieldConfig": {
