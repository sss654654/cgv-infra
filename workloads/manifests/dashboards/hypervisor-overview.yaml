# 하이퍼바이저 대시보드 — Proxmox 호스트(노트북) 자체를 본다.
# 클러스터 인프라 대시보드가 VM 안(노드 OS·컨테이너·k8s)을 보는 반면, 이 판은 그 아래
# 물리 호스트 층 하나만 본다. 지표원은 호스트에 apt 로 설치한 node-exporter(job=hypervisor)다.
#
#   행0 살아있나·언제 켜졌나  가동 · 부팅 후 경과 · 마지막 부팅 시각
#   행1 온도                 CPU 코어·패키지 · NVMe
#   행2 전원                 AC 연결 · 배터리
#   행3 자원                 CPU 사용률 · 메모리·스왑 · 디스크 I/O · 마운트 용량
#
# 온도를 판의 앞에 둔다 — 과열(유휴에 가까운 상태에서도 CPU 90°C대, 임계 110°C)로 호스트가
#   예고 없이 꺼진 이력이 있고, 그때 온도 기록이 없어 원인을 확정하지 못했다.
# 부팅 시각 두 패널은 예정 종료(자정)와 사고 재부팅을 가른다 — 밤에 꺼서 아침에 켜는 스케줄과 짝이다.
# 온도 라벨(Package id 0 · Core N · Composite)은 node_hwmon_sensor_label 을 조인해 붙인다.
#   node_hwmon_temp_celsius 는 sensor=temp1 처럼 번호만 있어 그대로는 무엇인지 못 읽는다.
# 호스트가 완전히 꺼지거나 네트워크에서 사라지면 이 판은 수집이 끊겨 공백이 된다.
#   그 순간은 안에서 못 잡고 밖에서 보는 프로브가 잡는다.
# SMART(디스크 수명)·NIC 상태는 지표 이름을 확인한 뒤 행으로 추가한다.
apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-hypervisor-overview
  namespace: observability
  labels:
    grafana_dashboard: "1"
data:
  hypervisor-overview.json: |
    {
      "uid": "hypervisor-overview",
      "title": "하이퍼바이저",
      "editable": true,
      "timezone": "browser",
      "time": { "from": "now-3h", "to": "now" },
      "refresh": "30s",
      "schemaVersion": 39,
      "templating": { "list": [] },
      "panels": [
        {
          "type": "row",
          "title": "0. 살아있나 · 언제 켜졌나",
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 }
        },
        {
          "type": "stat",
          "title": "가동",
          "description": "#### 호스트 수집이 살아 있나\n\n`up{job=\"hypervisor\"}`. 1 이면 Alloy 가 호스트 `:9100` 을 긁고 있다. 0 이면 호스트가 꺼졌거나 네트워크에서 사라진 것이다 — 그 순간의 원인(온도·전원)은 이 판이 아니라 밖에서 보는 프로브가 잡는다.",
          "datasource": { "type": "prometheus", "uid": "mimir" },
          "gridPos": { "h": 4, "w": 4, "x": 0, "y": 1 },
          "targets": [ { "refId": "A", "expr": "up{job=\"hypervisor\"}", "instant": true } ],
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "textMode": "value" },
          "fieldConfig": {
            "defaults": {
              "unit": "none", "decimals": 0,
              "mappings": [
                { "type": "value", "options": { "0": { "text": "끊김", "color": "red" }, "1": { "text": "수집", "color": "green" } } }
              ],
              "thresholds": { "mode": "absolute", "steps": [ { "color": "red", "value": null }, { "color": "green", "value": 1 } ] }
            },
            "overrides": []
          }
        },
        {
          "type": "stat",
          "title": "부팅 후 경과",
          "description": "#### 마지막 부팅 이후 지난 시간\n\n`time() - node_boot_time_seconds`. 밤 예약 종료 뒤 아침에 켜지면 여기서 리셋된다. 값이 예고 없이 짧아지면 예정 종료가 아니라 사고 재부팅이다 — 옆 `마지막 부팅 시각` 과 같이 본다.",
          "datasource": { "type": "prometheus", "uid": "mimir" },
          "gridPos": { "h": 4, "w": 6, "x": 4, "y": 1 },
          "targets": [ { "refId": "A", "expr": "time() - node_boot_time_seconds{job=\"hypervisor\"}", "instant": true } ],
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "textMode": "value" },
          "fieldConfig": {
            "defaults": {
              "unit": "dtdurations", "decimals": 0,
              "thresholds": { "mode": "absolute", "steps": [ { "color": "text", "value": null } ] }
            },
            "overrides": []
          }
        },
        {
          "type": "stat",
          "title": "마지막 부팅 시각",
          "description": "#### 호스트가 마지막으로 켜진 시각\n\n`node_boot_time_seconds`. 예정 종료(자정)→아침 기동이면 아침 시각이 찍힌다. 낮 시간대 값이 찍히면 사고로 꺼졌다 다시 켜진 것이다.",
          "datasource": { "type": "prometheus", "uid": "mimir" },
          "gridPos": { "h": 4, "w": 6, "x": 10, "y": 1 },
          "targets": [ { "refId": "A", "expr": "node_boot_time_seconds{job=\"hypervisor\"} * 1000", "instant": true } ],
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "textMode": "value" },
          "fieldConfig": {
            "defaults": {
              "unit": "dateTimeAsIso",
              "thresholds": { "mode": "absolute", "steps": [ { "color": "text", "value": null } ] }
            },
            "overrides": []
          }
        },
        {
          "type": "row",
          "title": "1. 온도",
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 5 }
        },
        {
          "type": "timeseries",
          "title": "CPU 온도 — 코어 · 패키지",
          "description": "#### CPU 온도\n\n`Package id 0` 이 칩 전체 대표값이고, `Core N` 은 코어별이다. 임계 110°C. 유휴에 가까운 상태에서도 90°C대가 관측됐다 — 과열 셧다운 이력이 있어 이 판이 먼저 본다.\n\n주황 85 · 빨강 100 (임계 110 앞).\n\n라벨은 `node_hwmon_sensor_label` 을 조인해 붙인다(원본은 `temp1` 처럼 번호만 있다).",
          "datasource": { "type": "prometheus", "uid": "mimir" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 6 },
          "targets": [ { "refId": "A", "expr": "node_hwmon_temp_celsius{job=\"hypervisor\", chip=\"platform_coretemp_0\"} * on(chip, sensor) group_left(label) node_hwmon_sensor_label{job=\"hypervisor\", chip=\"platform_coretemp_0\"}", "legendFormat": "{{label}}" } ],
          "fieldConfig": {
            "defaults": {
              "unit": "celsius", "decimals": 0,
              "custom": { "drawStyle": "line", "fillOpacity": 0, "showPoints": "never" },
              "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null }, { "color": "orange", "value": 85 }, { "color": "red", "value": 100 } ] }
            },
            "overrides": []
          },
          "options": { "tooltip": { "mode": "multi", "sort": "desc" }, "legend": { "displayMode": "table", "calcs": ["lastNotNull", "max"], "placement": "right" } }
        },
        {
          "type": "timeseries",
          "title": "NVMe 온도",
          "description": "#### 부팅 디스크(NVMe) 온도\n\n`Composite` 가 대표값, `Sensor N` 은 개별 센서다. 임계 약 86.8°C.\n\n주황 70 · 빨강 82.",
          "datasource": { "type": "prometheus", "uid": "mimir" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 6 },
          "targets": [ { "refId": "A", "expr": "node_hwmon_temp_celsius{job=\"hypervisor\", chip=\"nvme_nvme0\"} * on(chip, sensor) group_left(label) node_hwmon_sensor_label{job=\"hypervisor\", chip=\"nvme_nvme0\"}", "legendFormat": "{{label}}" } ],
          "fieldConfig": {
            "defaults": {
              "unit": "celsius", "decimals": 0,
              "custom": { "drawStyle": "line", "fillOpacity": 0, "showPoints": "never" },
              "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null }, { "color": "orange", "value": 70 }, { "color": "red", "value": 82 } ] }
            },
            "overrides": []
          },
          "options": { "tooltip": { "mode": "multi", "sort": "desc" }, "legend": { "displayMode": "table", "calcs": ["lastNotNull", "max"], "placement": "right" } }
        },
        {
          "type": "row",
          "title": "2. 전원",
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 14 }
        },
        {
          "type": "stat",
          "title": "AC 연결",
          "description": "#### 전원 어댑터가 붙어 있나\n\n`node_power_supply_online{power_supply=\"ADP1\"}`. 1=AC, 0=배터리. 노트북 서버라 AC 가 끊기면 배터리로 버티다 꺼진다 — 0 이 되는 순간이 신호다.",
          "datasource": { "type": "prometheus", "uid": "mimir" },
          "gridPos": { "h": 4, "w": 6, "x": 0, "y": 15 },
          "targets": [ { "refId": "A", "expr": "node_power_supply_online{job=\"hypervisor\", power_supply=\"ADP1\"}", "instant": true } ],
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "textMode": "value" },
          "fieldConfig": {
            "defaults": {
              "unit": "none", "decimals": 0,
              "mappings": [
                { "type": "value", "options": { "0": { "text": "배터리", "color": "red" }, "1": { "text": "AC 연결", "color": "green" } } }
              ],
              "thresholds": { "mode": "absolute", "steps": [ { "color": "red", "value": null }, { "color": "green", "value": 1 } ] }
            },
            "overrides": []
          }
        },
        {
          "type": "gauge",
          "title": "배터리 잔량",
          "description": "#### 배터리 잔량\n\n`node_power_supply_capacity{power_supply=\"BAT0\"}`. AC 가 끊겼을 때 남은 시간의 근거다. AC 연결 중엔 충전 상태라 보통 높게 유지된다.",
          "datasource": { "type": "prometheus", "uid": "mimir" },
          "gridPos": { "h": 4, "w": 6, "x": 6, "y": 15 },
          "targets": [ { "refId": "A", "expr": "node_power_supply_capacity{job=\"hypervisor\", power_supply=\"BAT0\"}", "instant": true } ],
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "showThresholdLabels": false, "showThresholdMarkers": true },
          "fieldConfig": {
            "defaults": {
              "unit": "percent", "decimals": 0, "min": 0, "max": 100,
              "thresholds": { "mode": "absolute", "steps": [ { "color": "red", "value": null }, { "color": "orange", "value": 20 }, { "color": "green", "value": 50 } ] }
            },
            "overrides": []
          }
        },
        {
          "type": "row",
          "title": "3. 자원",
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 19 }
        },
        {
          "type": "timeseries",
          "title": "CPU 사용률",
          "description": "#### 호스트 전체 CPU 사용률\n\n`1 - idle`. 하이퍼바이저 자체가 포화면 그 위 VM 전부가 느려진다.\n\n주황 80%.",
          "datasource": { "type": "prometheus", "uid": "mimir" },
          "gridPos": { "h": 7, "w": 12, "x": 0, "y": 20 },
          "targets": [ { "refId": "A", "expr": "100 - (avg(rate(node_cpu_seconds_total{job=\"hypervisor\", mode=\"idle\"}[5m])) * 100)", "legendFormat": "CPU %" } ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent", "decimals": 0, "min": 0, "max": 100,
              "custom": { "drawStyle": "line", "fillOpacity": 10, "showPoints": "never" },
              "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null }, { "color": "orange", "value": 80 } ] }
            },
            "overrides": []
          },
          "options": { "tooltip": { "mode": "single" }, "legend": { "displayMode": "list", "placement": "bottom" } }
        },
        {
          "type": "timeseries",
          "title": "메모리 · 스왑 사용률",
          "description": "#### 호스트 메모리·스왑 사용률\n\nVM 3대(합 20GB)를 올린 호스트라 메모리가 차면 스왑을 쓰기 시작한다. 단일 SSD 에서 스왑이 돌면 전 VM 이 느려진다 — 스왑 사용이 0 에서 오르는 순간이 신호다.",
          "datasource": { "type": "prometheus", "uid": "mimir" },
          "gridPos": { "h": 7, "w": 12, "x": 12, "y": 20 },
          "targets": [
            { "refId": "A", "expr": "(1 - node_memory_MemAvailable_bytes{job=\"hypervisor\"} / node_memory_MemTotal_bytes{job=\"hypervisor\"}) * 100", "legendFormat": "메모리" },
            { "refId": "B", "expr": "(node_memory_SwapTotal_bytes{job=\"hypervisor\"} - node_memory_SwapFree_bytes{job=\"hypervisor\"}) / node_memory_SwapTotal_bytes{job=\"hypervisor\"} * 100", "legendFormat": "스왑" }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent", "decimals": 0, "min": 0, "max": 100,
              "custom": { "drawStyle": "line", "fillOpacity": 10, "showPoints": "never" },
              "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null }, { "color": "orange", "value": 85 } ] }
            },
            "overrides": []
          },
          "options": { "tooltip": { "mode": "multi" }, "legend": { "displayMode": "list", "placement": "bottom" } }
        },
        {
          "type": "timeseries",
          "title": "디스크 I/O — util · iowait",
          "description": "#### 디스크 사용률(util)과 iowait\n\n단일 SSD 를 호스트와 VM 이 공유한다. `util` 이 100% 에 붙으면 I/O 가 병목이고, `iowait` 가 오르면 CPU 가 디스크를 기다리는 중이다.",
          "datasource": { "type": "prometheus", "uid": "mimir" },
          "gridPos": { "h": 7, "w": 12, "x": 0, "y": 27 },
          "targets": [
            { "refId": "A", "expr": "rate(node_disk_io_time_seconds_total{job=\"hypervisor\"}[5m]) * 100", "legendFormat": "util {{device}}" },
            { "refId": "B", "expr": "rate(node_cpu_seconds_total{job=\"hypervisor\", mode=\"iowait\"}[5m]) * 100", "legendFormat": "iowait" }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent", "decimals": 0, "min": 0,
              "custom": { "drawStyle": "line", "fillOpacity": 10, "showPoints": "never" },
              "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null }, { "color": "orange", "value": 80 } ] }
            },
            "overrides": []
          },
          "options": { "tooltip": { "mode": "multi" }, "legend": { "displayMode": "list", "placement": "bottom" } }
        },
        {
          "type": "timeseries",
          "title": "마운트별 용량 사용률",
          "description": "#### 마운트별 사용률\n\n루트가 차면 로그·이미지가 못 쓰인다. `tmpfs·overlay·squashfs` 는 뺀다.\n\n주황 80% · 빨강 90%.",
          "datasource": { "type": "prometheus", "uid": "mimir" },
          "gridPos": { "h": 7, "w": 12, "x": 12, "y": 27 },
          "targets": [ { "refId": "A", "expr": "(1 - node_filesystem_avail_bytes{job=\"hypervisor\", fstype!~\"tmpfs|overlay|squashfs\"} / node_filesystem_size_bytes{job=\"hypervisor\", fstype!~\"tmpfs|overlay|squashfs\"}) * 100", "legendFormat": "{{mountpoint}}" } ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent", "decimals": 0, "min": 0, "max": 100,
              "custom": { "drawStyle": "line", "fillOpacity": 10, "showPoints": "never" },
              "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null }, { "color": "orange", "value": 80 }, { "color": "red", "value": 90 } ] }
            },
            "overrides": []
          },
          "options": { "tooltip": { "mode": "multi" }, "legend": { "displayMode": "list", "placement": "bottom" } }
        }
      ]
    }
