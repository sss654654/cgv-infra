# booking 서비스 대시보드 — 정원 계단 판을 돌리는 화면.
#
# 이 화면이 답할 질문은 하나다:
#   X = 정원(MAX_SESSIONS)을 올려도 확정/초가 더는 안 오르는 지점의 정원.
#   booking 은 1파드 고정(DDL update, 마이그레이션 도구 없음)이라 "몇 대"가 아니라
#   "한 대의 한계"를 잰다. 계단 = 2 → 30 → 60 → 200 → 500 (일곱 판).
#   ⚠ X 는 "동시에 처리 중인 요청 수"가 아니다 — 입장한 사람 대부분은 화면에서
#     회차·좌석을 고르는 중이라 그 순간 요청을 보내지 않는다. 처리 중 요청 수의
#     상한은 커넥션 풀 크기(10)고 그것은 접힌 풀 행에서 본다.
#
# 행 구성 — queue 화면과 같은 리듬이다. 판정이 흐르는 순서가 곧 행 순서다.
#   행1 이 판의 결론   여정 통과(승격→확정 여섯 계단) · 확정이 돌아오나(자리 반환) · 판의 상태(정원·0 넷·좌석·매진 예상)
#                      어느 계단에서 떨어지는지가 곧 원인이다
#   행2 사용자         지연 p99 · 거절(4xx) 엔드포인트·코드별
#   행3 얼마나 드나    자원 여섯을 상한 대비 % 로. 스펙의 근거가 여기서 나온다
#   ▸ 접힌 행 셋       MySQL 커넥션 풀 / booking 파드(워밍업 포함) / MySQL
#                      행 제목이 "언제 여는지"를 적는다. 행3 에서 오른 선이 가리키는 행만 연다
#
# queue 화면과 짝: 각 화면이 자기가 발행한 다리를 지킨다 — 이 화면은 확정→반환, queue 는 승격→인증.
#   여기 여정 통과의 "승격 → 입장 인증"  = queue 가 보낸 것이 닿았나
#   queue 순환 패널의 "확정 → 자리 반환"  = booking 이 끝낸 것이 닿았나
#
# 여정 통과 패널이 이 화면의 진단 축이다. 자원 지표는 원인을 못 잡는 사건이 있다 —
#   정원 200·체류 90초 판에서 처리량이 12분의 1로 떨어졌는데 자원은 전부 10% 미만이었고
#   "0 이어야 하는 값"도 전부 0이었다. 실제로는 세션 타임아웃(60초)보다 체류가 길어
#   좌석 선택 직전에 입장 인증이 회수되고 있었다. 승격부터 확정까지 단계별 건/초를 겹쳐
#   보면 어느 계단에서 떨어졌는지가 그 자리에서 보인다.
#
# 이 화면에 없는 것 — 두 서비스가 공유하는 자원은 queue 대시보드 한 곳에서만 본다:
#   traefik(관문)·Redis 커넥션 풀 → queue 화면의 접힌 "인원이 정하는 것" 행.
#   Redis 자원 → queue 화면의 "뒷단이 정원에 반응하나" 행.
#   booking 도 Redis 를 쓴다(입장 인증 admitted:* · 좌석 잠금 seat:*) — 같은 Sentinel,
#   같은 master 다. 정원 계단은 좌석 선점 동시성을 올리는 판이라 booking 발 Redis 부하가
#   여기서 처음 커진다. Redis 지표에는 호출한 서비스를 가르는 라벨이 없으므로, 계단 중
#   queue 화면의 Redis 명령 수가 오르면 그 증가분이 booking 몫이다.
#
# 규약 (queue 화면과 동일):
#   기준선(limit·정원·풀 크기)은 점선. 빨강은 실패에만 쓴다.
#   범례 표는 mean·max — mean≈정상 구간, max=봉우리. 판 밖 봉우리를 판의 값으로 읽지 않게.
#   게이지·cAdvisor 시리즈는 up 조인으로 산 파드만 남긴다(파드 교체 구간의 유령 시리즈 제거).
#   rate 창 [1m] — booking ServiceMonitor·cAdvisor·mysqld_exporter 전부 15초라 창에 표본 4개.
#   실패 결과 라벨(seat_conflict 등)은 범례에서 한국어 별칭으로 바꾼다 — 원 라벨은 쿼리에 있다.
#
# 실측 조건 표기: 설명의 수치는 그 값을 낸 판의 조건(정원·체류)을 같이 적는다.
#   정원이나 체류가 다른 계단에서는 다른 값이 나오는 것이 정상이다.
#
# 판 설계의 제약 하나: 체류 시간 < SESSION_TIMEOUT(60초).
#   넘으면 좌석을 고르는 중에 자리가 회수돼 판이 무효가 된다(정원 200·체류 90초 판에서 겪음).
#   실제 서비스 스펙을 낼 때는 반대 방향이다 — 사용자가 걸리는 시간보다 타임아웃이 길어야 한다.
#
# 계측의 한계:
#   p99 는 버킷 경계(…100·250·500ms·1s…) 사이 직선 보간이라 성긴 구간에서 추정 폭을 갖는다.
#   Kafka 지연은 발행 파드의 시계로 찍혀 노드 간 시계 차이(NTP 수 ms)가 오차로 섞인다.
#   부하 도구(k6) 쪽 지표는 이 화면에 없다 — 도구 한계 배제는 run.sh 로그·노트북 CPU 로 한다.
apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-app-booking-detail
  namespace: observability
  labels:
    grafana_dashboard: "1"
data:
  app-booking-detail.json: |
    {
      "uid": "app-booking-detail",
      "title": "booking 서비스",
      "tags": [
        "cgv",
        "app"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "refresh": "10s",
      "time": {
        "from": "now-30m",
        "to": "now"
      },
      "panels": [
        {
          "type": "row",
          "title": "1. 이 판의 결론 — 정원을 올려도 확정이 안 늘면 직전 계단이 이 파드의 상한이다",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "panels": []
        },
        {
          "type": "timeseries",
          "title": "여정 통과 — 어느 계단에서 떨어지나 (건/초)",
          "description": "**사람이 줄에서 예매까지 가는 여섯 계단.** 위에서 아래로 내려가는 계단 모양이 정상이다.\n\n- **승격** queue 가 자리를 내준 수\n- **입장 인증** booking 이 그 사람을 받아들인 수\n- **회차 조회 200 · 좌석 조회 200 · 좌석 선점 200** 각 단계를 통과한 수\n- **확정** 예매를 끝낸 수\n\n**어느 계단에서 뚝 떨어지는지가 곧 원인이다.**\n- 승격 대비 인증이 낮다 → 전달이 늦다. 지연과 트레이스는 queue 화면의 「입장이 닿나」가 든다\n- 인증은 높은데 좌석 선점이 낮다 → 인증이 지워졌거나 좌석이 없다. 오른쪽 4xx 패널이 코드로 답한다\n- 좌석 선점은 높은데 확정이 낮다 → 트랜잭션이 막혔다. ▸MySQL 커넥션 풀 행\n\n정원 200 · 체류 90초 판에서 승격 4.4 · 인증 4.4 인데 확정이 0.18 이었다. 세션 타임아웃(60초)보다 체류가 길어 좌석 선택 직전에 인증이 회수된 것이다 — 자원 지표는 전부 10% 미만이라 그 화면으로는 못 잡았다.",
          "datasource": {
            "type": "prometheus",
            "uid": "mimir"
          },
          "gridPos": {
            "h": 11,
            "w": 9,
            "x": 0,
            "y": 1
          },
          "targets": [
            {
              "refId": "A",
              "expr": "max(queue_promotion_rate) or vector(0)",
              "legendFormat": "1 승격"
            },
            {
              "refId": "B",
              "expr": "sum(rate(booking_admissions_total{application=\"cgv-booking\", result=\"ok\"}[1m])) or vector(0)",
              "legendFormat": "2 입장 인증"
            },
            {
              "refId": "C",
              "expr": "sum(rate(http_server_requests_seconds_count{application=\"cgv-booking\", uri=~\".*screenings\", status=\"200\"}[1m])) or vector(0)",
              "legendFormat": "3 회차 조회"
            },
            {
              "refId": "D",
              "expr": "sum(rate(http_server_requests_seconds_count{application=\"cgv-booking\", uri=~\".*/seats\", status=\"200\"}[1m])) or vector(0)",
              "legendFormat": "4 좌석 조회"
            },
            {
              "refId": "E",
              "expr": "sum(rate(http_server_requests_seconds_count{application=\"cgv-booking\", uri=~\".*seats/select\", status=\"200\"}[1m])) or vector(0)",
              "legendFormat": "5 좌석 선점"
            },
            {
              "refId": "F",
              "expr": "sum(rate(booking_confirm_total{application=\"cgv-booking\", result=\"success\"}[1m])) or vector(0)",
              "legendFormat": "6 확정"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "decimals": 2,
              "min": 0,
              "custom": {
                "fillOpacity": 0,
                "lineWidth": 2
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "6 확정"
                },
                "properties": [
                  {
                    "id": "custom.lineWidth",
                    "value": 3
                  },
                  {
                    "id": "custom.fillOpacity",
                    "value": 15
                  }
                ]
              }
            ]
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "mean",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "type": "stat",
          "title": "판의 상태 — 넷은 0, 좌석은 남아 있어야 한다",
          "description": "**이 판의 조건과, 판을 세우는 값들.** 그래프가 아니라 숫자로 둔다 — \"0인가 아닌가\"를 선에서 찾게 하지 않는다.\n\n- **정원** 이 계단의 값(MAX_SESSIONS). 판 내내 상수다\n- **5xx** 서버가 깨졌다\n- **풀 포기** 커넥션을 30초 기다리다 실패했다. 한 건이라도 있으면 이미 무너진 뒤다\n- **재시작** 그 구간의 모든 수치를 버린다 — 워밍업·풀이 처음부터 다시 시작된다\n- **인증 회수** 세션 타임아웃으로 자리를 뺏긴 수. **승격보다 크면 체류가 타임아웃(60초)을 넘고 있다** — queue 화면의 체류 패널과 짝이다\n- **남은 좌석** booking 이 5초마다 좌석 행을 직접 세어 낸 값이다(전체 − 팔린 수). 0 이 되면 그 뒤 구간은 전원이 매진을 확인하고 퇴장하는 구간이라 측정에서 뺀다\n- **이 속도면 매진까지** 남은 좌석 ÷ 지금 확정/초. 이 정원이 내는 결과값이고, 스펙에서 M(매진 목표 시간)에 대응한다",
          "datasource": {
            "type": "prometheus",
            "uid": "mimir"
          },
          "gridPos": {
            "h": 11,
            "w": 8,
            "x": 16,
            "y": 1
          },
          "targets": [
            {
              "refId": "Z",
              "expr": "max(queue_capacity and on(pod) (up{job=\"app/queue\"} == 1)) or vector(0)",
              "legendFormat": "정원 (MAX_SESSIONS)"
            },
            {
              "refId": "A",
              "expr": "sum(increase(http_server_requests_seconds_count{application=\"cgv-booking\", uri!~\"/actuator.*|/api/admin.*\", status=~\"5..\"}[1m])) or vector(0)",
              "legendFormat": "5xx (1분)"
            },
            {
              "refId": "B",
              "expr": "sum(increase(hikaricp_connections_timeout_total{application=\"cgv-booking\"}[1m])) or vector(0)",
              "legendFormat": "풀 포기 (1분)"
            },
            {
              "refId": "C",
              "expr": "sum(increase(kube_pod_container_status_restarts_total{namespace=\"app\", container=\"booking\"}[10m])) or vector(0)",
              "legendFormat": "재시작 (10분)"
            },
            {
              "refId": "D",
              "expr": "sum(rate(booking_admission_revoked_total{application=\"cgv-booking\"}[1m])) or vector(0)",
              "legendFormat": "인증 회수 (건/초)"
            },
            {
              "refId": "E",
              "expr": "max(booking_seats_remaining{application=\"cgv-booking\"})",
              "legendFormat": "남은 좌석"
            },
            {
              "refId": "F",
              "expr": "max(booking_seats_remaining{application=\"cgv-booking\"}) / (sum(rate(booking_confirm_total{application=\"cgv-booking\", result=\"success\"}[1m])) > 0)",
              "legendFormat": "이 속도면 매진까지"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "정원 (MAX_SESSIONS)"
                },
                "properties": [
                  {
                    "id": "thresholds",
                    "value": {
                      "mode": "absolute",
                      "steps": [
                        {
                          "color": "text",
                          "value": null
                        }
                      ]
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "인증 회수 (건/초)"
                },
                "properties": [
                  {
                    "id": "decimals",
                    "value": 2
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "남은 좌석"
                },
                "properties": [
                  {
                    "id": "thresholds",
                    "value": {
                      "mode": "absolute",
                      "steps": [
                        {
                          "color": "red",
                          "value": null
                        },
                        {
                          "color": "orange",
                          "value": 1
                        },
                        {
                          "color": "green",
                          "value": 200
                        }
                      ]
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "이 속도면 매진까지"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "s"
                  },
                  {
                    "id": "decimals",
                    "value": 0
                  },
                  {
                    "id": "thresholds",
                    "value": {
                      "mode": "absolute",
                      "steps": [
                        {
                          "color": "text",
                          "value": null
                        }
                      ]
                    }
                  }
                ]
              }
            ]
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "textMode": "value_and_name",
            "colorMode": "value",
            "orientation": "auto"
          }
        },
        {
          "type": "timeseries",
          "title": "확정이 돌아오나 — 확정 vs 자리 반환",
          "description": "**booking 이 보낸 확정이 queue 에 닿아 자리가 비었나.** 예매가 끝나면 booking 이 Kafka 로 알리고 queue 가 그 자리를 회수한다 — 이게 돌아와야 다음 사람이 승격된다. 왼쪽 「여정 통과」의 확정 계단이 이 패널의 입력이다.\n\n- **확정/초** 예매가 끝난 수\n- **자리 반환/초** queue 가 실제로 자리를 비운 수. 소비 성공마다 오르는 카운터(`queue_completed_total`)라 노드 간 시계 차이와 무관하다 — 확정/초 와 직접 대조된다\n- **반환 지연 p99**(왼쪽 축 — exemplar 점이 이 선 위에 얹힌다) 확정부터 자리가 빌 때까지. **점을 누르면 booking 이 시작한 트레이스**(/api/bookings → Kafka → queue 반환)가 열린다\n- **queue 소비 실패** 0 이라 안 보이는 것이 정상. 선이 서면 메시지는 닿았는데 queue 가 처리하지 못하는 중이다(미커밋 재시도)\n\n**두 선이 겹쳐야 정상이고, 벌어지면 자리가 안 돌아오는 중이다.** 확정보다 반환이 적으면 소비 실패 카운터와 Loki 의 `예매완료 수신` 로그 수를 같이 본다 — 로그 수가 확정과 같으면 처리는 됐고 지표만 안 온 것이다. 지연만 오르면 전달은 되는데 늦는 것이다.\n\n⚠ **반환 지연 p99 는 반환 건수보다 적은 표본에서 나온다.** p99 는 지연 히스토그램에서 뽑는데, 그 히스토그램은 음수 지연을 버린다 — 발행 시각이 booking 파드의 시계라 queue 노드가 뒤에 있으면 음수가 된다(노드 간 약 11ms). 그래서 p99 는 시계가 역전되지 않은 관측만의 분포다. 2026-08-23 판 실측: 확정 3,400 · 히스토그램 관측 1,685 · Loki 소비 로그 3,505. 버킷 경계 사이는 보간 추정이다.\n\n⚠ `queue_completed_total` 은 2026-08-23 배포(dev-68)부터 있다. 그 이전 구간에서는 반환 선이 그려지지 않는다.",
          "datasource": {
            "type": "prometheus",
            "uid": "mimir"
          },
          "gridPos": {
