              "description": "**같은 좌석을 노린 뒤 트랜잭션이 앞 트랜잭션의 커밋을 기다린다.**\nRedis(한 번에 한 명령)에는 없던 종류의 대기고, **정원에 비례해 오르는 것이 이 판의 핵심 신호다.**\n\n- **대기 발생** 잠금을 기다린 트랜잭션 (건/초)\n- **평균 대기 시간** 한 번 기다릴 때 몇 ms (오른쪽 축).\n  기동 후 누적 평균(time_avg)이 아니라 1분 창의 시간÷건수다 —\n  누적 평균은 계단을 거듭할수록 앞 계단이 분모에 쌓여 변화가 안 보인다\n\n이 선이 오르면 `확정이 안 된 이유` 의 잠금 경쟁도 같이 오른다 — 같은 사건의 DB 쪽 집계라,\n둘이 어긋나면 하나를 잘못 읽고 있는 것이다.\n\n**커넥션을 늘려도 안 풀린다.** 같은 행을 노리는 트랜잭션만 늘어 더 나빠진다.",
