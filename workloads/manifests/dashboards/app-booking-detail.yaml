          "title": "거절 (4xx) — 엔드포인트·코드별 (건/초)",
          "description": "**깨진 것(5xx)과 거절된 것(4xx)을 가른다.** 5xx 는 `판의 상태` stat 이 센다.\n\n비율 하나로 묶으면 원인이 안 갈려서 코드별로 나눈다. 뜻이 전혀 다르다.\n\n- **409 on seats/select** 같은 좌석을 둘이 골랐다. 정원이 커지거나 남은 좌석이 줄면 오르는 것이 설계대로다\n- **403 on seats/select** 입장 인증이 없다. **세션 타임아웃으로 회수된 것이다** — `판의 상태` 의 인증 회수와 짝이다. 체류가 60초를 넘고 있다는 신호\n- **403 on screenings** 승격 직후 인증이 아직 안 왔다. 부하 도구가 재시도하므로 **성공 수와 나란히 읽어야 뜻이 나온다** — 200 이 승격 수와 같으면 결국 다 들어간 것이고, 403 이 그 몇 배인지가 곧 몇 번 튕겼는지다. **이 비율은 booking 스로틀의 대리 지표다.** 2026-08-21 같은 부하(6000 VU · 6분) 두 판을 나란히 놓으면 그대로 보인다.\n\n```\n            booking 스로틀   403 : 200      인증 지연 p50   확정/초\n건강한 판        5.85%      13.7 : 14.0        0.22초       8.77\n스로틀 판       52.88%     172.9 :  6.6         10초+       1.99\n```\n\n스로틀이 걸리면 Kafka 소비가 밀려 인증이 늦고, 그 사이 재시도가 403 으로 쌓이고, 그 거절을 처리하는 데 CPU 가 다시 쓰인다. **여기가 26배로 벌어져 있으면 원인은 이 패널이 아니라 자원 행의 스로틀이다.**\n- **404·400** 부하 스크립트가 잘못 보낸 요청이다. 서버가 아니라 스크립트를 본다\n\n`> 0` 이라 안 난 조합은 범례에 없다.",
