# booking 서비스 대시보드 — 정원 축 (2026-08-29 재설계)
#
# 행·패널을 백지에서 다시 정했다. 기준 = "그 패널이 없으면 못 하는 판단이 있나".
#   행1 booking 파드   메모리 게이지 · CPU·스로틀+GC 정지 · heap/nonheap
#   행2 MySQL          풀 · CPU·스로틀
#   행3 여정           단계별 통과 수 · 단계별 지연 p99
#
# 판 경계
#   이 판의 부하 축은 정원(MAX_SESSIONS)이다. 대기열이 앞에서 인원을 정원으로 깎아
#   주므로, 부하 인원을 올려도 이 판의 값은 안 변하고 정원을 바꿔야 변한다.
#   로비 폴링(board)·승격·대기열은 queue(traefik) 판 / Redis·Kafka 는 공유 계층 판.
#   MySQL 은 booking 만 쓰는 저장소라 이 판 소관이다.
#
# 읽는 방향 — 행3 지연이 오르면 위로 올라가며 원인을 찾는다.
#   어느 단계가 느린가(행3) → bookings 만 = MySQL 쪽(행2: 풀 대기? CPU?)
#                          → 전부 균일 = 파드 쪽(행1: 스로틀? GC?)
#   행1·2 가 다 무죄면 파드 밖(노드·디스크)이다 — 인프라 판으로 간다.
#
# 뺀 것과 이유 (2026-08-29 판정)
#   행 잠금            결과가 행3 지연과 사후 쿼리로 보인다. 실측 전 판에서 전부 0
#   확정 종착점 카운터   판이 끝난 뒤 사후 쿼리로 확인한다:
#                      sum by (result) (increase(booking_confirm_total{result!~"success|replay"}[판 길이]))
#   좌석 소진           이것만 있어야 가능한 판단이 없다
#   MySQL 메모리        버퍼풀 고정 할당(실측 553MiB/1Gi 정지). 신호 없음
#   질의 수             내리는 판단을 못 댔다
#   Redis(EVALSHA 등)   공유 계층 판 — queue 것과 나란히 봐야 의미가 있다
#
# 한도는 지표로 읽는다 — kube_pod_container_resource_limits · hikaricp_connections_max ·
#   jvm_memory_max_bytes. 설정을 바꾸면 판이 따라온다.
#   ⚠ 패널 제목의 절대값(1536Mi·2코어·1코어·768Mi)은 표기용 — limit 을 바꾸면 제목도 같이 고친다.
#
# 기준선 실측: 유휴 working_set 약 710MiB · heap 사용 200MiB · heap 상한 768MiB ·
#   nonheap 222MiB · Hikari 풀 30 중 0 · MySQL CPU 1.3% · GC 정지 0.005%.
#   (2026-08-30 개정: limit 1Gi→1536Mi·비율 75→50 — 오픈 버스트 OOMKill 2회의 조치.
#    같은 날 버스트 실측 working_set 최고 1,121Mi.)
apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-app-booking-detail
  namespace: observability
  labels:
    grafana_dashboard: "1"
data:
  app-booking-detail.json: |
    {
      "uid": "app-booking-detail",
      "title": "booking 서비스",
      "tags": ["cgv", "app", "booking", "mysql"],
      "editable": true,
      "timezone": "browser",
      "time": { "from": "now-1h", "to": "now" },
      "refresh": "30s",
      "schemaVersion": 39,
      "templating": { "list": [] },
      "panels": [
        {
          "type": "row",
          "title": "1. booking 파드",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 },
          "collapsed": false,
          "panels": []
        },
        {
          "id": 1,
          "type": "timeseries",
          "title": "메모리 — working_set / limit 1536Mi · 넘으면 OOMKill",
          "description": "커널이 잰 \"지금 쥐고 있는 메모리\" ÷ memory limit. **100%(점선)에 닿으면 커널이 파드를 죽인다(OOMKill).**\n\n2026-08-30 사용자 10,000 부하에서 실제로 일어났다 — limit 1Gi 시절 여유가 24Mi 뿐이라 오픈 버스트에 OOMKill 2회. limit 을 1536Mi 로 올리고 heap 상한은 그대로(768Mi) 둬서 여유를 546Mi 로 만들었다. 같은 날 버스트 실측 최고 1,121Mi — 옛 limit 이면 죽는 값이다.\n\n타임시리즈인 이유 — 이 판의 용도가 부하 중 \"언제 얼마까지 올랐나\"의 사후 분석이라서다. 게이지는 마지막 값 하나만 남아 판이 끝나면 판 동안의 움직임이 사라진다. 지금 값은 범례 Last 로 읽는다.\n\nJVM 은 메모리를 미리 예약해서 쓰므로 이 선은 유휴에서도 낮지 않다(유휴 실측 약 710Mi — 그때 heap 실사용은 200Mi). GC 가 heap 을 비워도 JVM 은 OS 에 반환하지 않아서, 이 선은 오르기만 하고 거의 안 내려온다.\n\n**이 선 혼자서는 판정이 안 끝난다** — 높은 것이 예약분인지 진짜 부족인지는 오른쪽 heap 패널이 가른다. heap 이 낮은데 이 선만 높으면 예약분이고, heap 도 상한에 붙었으면 진짜 부족이다.\n\nlimit 은 지표로 읽으므로 limit 을 바꾸면 선이 따라온다.",
          "datasource": { "type": "prometheus", "uid": "mimir" },
          "gridPos": { "h": 8, "w": 6, "x": 0, "y": 1 },
          "targets": [
            { "refId": "A", "expr": "container_memory_working_set_bytes{namespace=\"app\", container=\"booking\"} / on(pod) group_left() kube_pod_container_resource_limits{namespace=\"app\", container=\"booking\", resource=\"memory\"} and on(pod) (kube_pod_status_phase{namespace=\"app\", phase=\"Running\"} == 1)", "legendFormat": "{{pod}}" },
            { "refId": "B", "expr": "vector(1)", "legendFormat": "limit" }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "decimals": 1,
              "min": 0,
              "custom": { "fillOpacity": 10, "lineWidth": 2, "showPoints": "never", "axisSoftMax": 1.05 }
            },
            "overrides": [
              { "matcher": { "id": "byName", "options": "limit" }, "properties": [ { "id": "color", "value": { "mode": "fixed", "fixedColor": "text" } }, { "id": "custom.lineStyle", "value": { "fill": "dash", "dash": [10, 6] } }, { "id": "custom.lineWidth", "value": 1 }, { "id": "custom.fillOpacity", "value": 0 }, { "id": "custom.hideFrom", "value": { "legend": false, "tooltip": true, "viz": false } } ] }
            ]
          },
          "options": { "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["lastNotNull", "max"] } }
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "CPU · 스로틀 · GC 정지 — limit 2코어 대비 %",
          "description": "선 셋이 각각 다른 사건이다. 전부 비율이라 한 축에 선다.\n\n- **CPU** 사용량 ÷ limit. 일을 얼마나 하나\n- **스로틀(빨강)** 커널은 CPU 를 100ms 조각으로 배급한다. 몫을 다 쓰고 잘린 비율. 0 이 정상\n- **GC 정지(주황)** 1초당 GC 로 멈춘 시간. GC 는 heap 을 치우는 동안 애플리케이션을 세우고, 멈춘 시간은 진행 중이던 모든 요청에 더해진다. 0.05 = 시간의 5% 를 멈춘 것\n\n**행3 지연이 올랐을 때 판정이 이 패널에서 끝난다.**\n\n```\nCPU 높다              일이 많다 — limit 상향 검토\nCPU 낮다 + 스로틀 섰다  배급 간격이 원인\nCPU 낮다 + GC 섰다     청소가 원인 — 오른쪽 heap 패널에서 heap 이 찼는지 본다\n셋 다 아니다           파드 무죄 — 행2(MySQL)로 내려간다\n```\n\nGC 자체도 CPU 를 쓴다 — heap 이 차서 GC 가 잦아지면 CPU 선도 같이 오른다.",
          "datasource": { "type": "prometheus", "uid": "mimir" },
          "gridPos": { "h": 8, "w": 10, "x": 6, "y": 1 },
          "targets": [
            { "refId": "A", "expr": "sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\"app\", container=\"booking\"}[$__rate_interval])) / on(pod) group_left() kube_pod_container_resource_limits{namespace=\"app\", container=\"booking\", resource=\"cpu\"} and on(pod) (kube_pod_status_phase{namespace=\"app\", phase=\"Running\"} == 1)", "legendFormat": "CPU {{pod}}" },
            { "refId": "B", "expr": "sum by (pod) (rate(container_cpu_cfs_throttled_periods_total{namespace=\"app\", container=\"booking\"}[$__rate_interval])) / sum by (pod) (rate(container_cpu_cfs_periods_total{namespace=\"app\", container=\"booking\"}[$__rate_interval])) and on(pod) (kube_pod_status_phase{namespace=\"app\", phase=\"Running\"} == 1)", "legendFormat": "스로틀 {{pod}}" },
            { "refId": "C", "expr": "sum(rate(jvm_gc_pause_seconds_sum{application=\"cgv-booking\"}[$__rate_interval]))", "legendFormat": "GC 정지" },
            { "refId": "D", "expr": "vector(1)", "legendFormat": "limit" }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "decimals": 1,
              "min": 0,
              "custom": { "fillOpacity": 0, "lineWidth": 2, "showPoints": "never", "axisSoftMax": 1.05 }
            },
            "overrides": [
              { "matcher": { "id": "byRegexp", "options": "스로틀.*" }, "properties": [ { "id": "color", "value": { "mode": "fixed", "fixedColor": "red" } } ] },
              { "matcher": { "id": "byName", "options": "GC 정지" }, "properties": [ { "id": "color", "value": { "mode": "fixed", "fixedColor": "orange" } } ] },
              { "matcher": { "id": "byName", "options": "limit" }, "properties": [ { "id": "color", "value": { "mode": "fixed", "fixedColor": "text" } }, { "id": "custom.lineStyle", "value": { "fill": "dash", "dash": [10, 6] } }, { "id": "custom.lineWidth", "value": 1 }, { "id": "custom.hideFrom", "value": { "legend": false, "tooltip": true, "viz": false } } ] }
            ]
          },
          "options": { "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["mean", "max"] } }
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "heap · nonheap — 힙 상한 768Mi · JVM이 지키는 선",
          "description": "JVM 안쪽의 메모리. queue 로 치면 \"힙이 GOMEMLIMIT 에 붙었나\"와 같은 판정이다.\n\n- **heap 사용** 요청을 처리하며 만드는 객체가 실제로 쓰는 양. 톱니 모양(오르고, GC 가 비우고)이 정상\n- **heap 상한(점선)** limit 1536Mi × 50%(MaxRAMPercentage) = 768Mi. JVM 이 강제하는 선 — heap 은 이 값을 넘지 못한다\n- **nonheap** JVM 자신의 살림 — 클래스 정보 · 컴파일된 코드 · 스레드 스택. 기동 후 거의 고정(222Mi)이고, 움직이는 순간이 사건이다\n\n**죽음 두 종류가 갈리는 자리다.**\n```\nheap 이 상한에 붙고 GC 가 못 비운다   JVM 스스로 죽음 (OutOfMemoryError)\nworking_set 이 limit 에 닿는다        커널이 죽임 (OOMKill) — 왼쪽 패널이 그 감시\n```\n이전 설정(1Gi×75%)은 heap 768 + nonheap 222 ≈ limit 이라 여유가 24Mi 뿐이었고, 2026-08-30 오픈 버스트에서 실제로 OOMKill 이 났다. 지금은 heap 상한을 그대로 두고 limit 만 올려 커널 쪽 여유가 546Mi 다 — heap 밖 메모리(커넥션 버퍼·JIT 작업분·소켓)가 사는 자리.\n\n부하 중 heap 최고점이 \"heap 상한 768Mi 가 충분한가\" 판정의 실측 근거다 — 상한에 붙으면 그때 limit·비율을 같이 재산정한다.",
          "datasource": { "type": "prometheus", "uid": "mimir" },
          "gridPos": { "h": 8, "w": 8, "x": 16, "y": 1 },
          "targets": [
            { "refId": "A", "expr": "sum(jvm_memory_used_bytes{application=\"cgv-booking\", area=\"heap\"})", "legendFormat": "heap 사용" },
            { "refId": "B", "expr": "sum(jvm_memory_max_bytes{application=\"cgv-booking\", area=\"heap\"})", "legendFormat": "heap 상한" },
            { "refId": "C", "expr": "sum(jvm_memory_used_bytes{application=\"cgv-booking\", area=\"nonheap\"})", "legendFormat": "nonheap" }
          ],
          "fieldConfig": {
            "defaults": { "unit": "bytes", "min": 0, "custom": { "fillOpacity": 10, "lineWidth": 2, "showPoints": "never" } },
            "overrides": [
              { "matcher": { "id": "byName", "options": "heap 상한" }, "properties": [ { "id": "color", "value": { "mode": "fixed", "fixedColor": "text" } }, { "id": "custom.lineStyle", "value": { "fill": "dash", "dash": [10, 6] } }, { "id": "custom.lineWidth", "value": 1 }, { "id": "custom.fillOpacity", "value": 0 } ] },
              { "matcher": { "id": "byName", "options": "nonheap" }, "properties": [ { "id": "color", "value": { "mode": "fixed", "fixedColor": "purple" } }, { "id": "custom.fillOpacity", "value": 0 } ] }
            ]
          },
          "options": { "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["mean", "max"] } }
        },
        {
          "type": "row",
          "title": "2. MySQL — 확정이 적히는 곳. booking 이 기다리는 시간의 대부분",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 9 },
          "collapsed": false,
          "panels": []
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "커넥션 풀 — 동시에 MySQL 에 던질 수 있는 질의 수의 상한",
          "description": "MySQL(JDBC)은 커넥션 하나가 한 번에 질의 하나다 — 답이 올 때까지 그 커넥션은 묶인다. 그래서 **풀 크기 = 동시 질의 수의 상한**이다. (Redis 는 커넥션 하나에 명령을 줄줄이 밀어넣어 이 상한이 없다.)\n\n- **사용 중** 지금 질의를 실행 중인 커넥션 수\n- **상한(점선)** `hikaricp_connections_max`. 지표로 읽으므로 DB_POOL_SIZE 를 바꾸면 선이 따라온다\n- **대기(빨강)** 커넥션을 못 얻어 기다리는 요청 수. **0 이 아니게 되는 순간이 사건** — 그 대기 시간이 행3 지연에 그대로 더해진다\n\n**오른쪽 MySQL CPU 와 짝으로 읽는다.**\n```\n대기 섰다 + MySQL CPU 놀고 있다   풀이 작다 — 늘린다\n대기 섰다 + MySQL CPU 꽉 찼다     풀을 늘려도 소용없다 — 코어가 부족하다\n```\n`DB_POOL_SIZE: 10  # 실측 후 튜닝` 의 그 실측이 이 패널이다 — 대기가 서는 정원이 답이다.",
          "datasource": { "type": "prometheus", "uid": "mimir" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 10 },
          "targets": [
            { "refId": "A", "expr": "sum(hikaricp_connections_active{application=\"cgv-booking\"})", "legendFormat": "사용 중" },
            { "refId": "B", "expr": "sum(hikaricp_connections_pending{application=\"cgv-booking\"})", "legendFormat": "대기" },
            { "refId": "C", "expr": "max(hikaricp_connections_max{application=\"cgv-booking\"})", "legendFormat": "상한" }
          ],
          "fieldConfig": {
            "defaults": { "unit": "short", "decimals": 0, "min": 0, "custom": { "fillOpacity": 10, "lineWidth": 2, "showPoints": "never" } },
            "overrides": [
              { "matcher": { "id": "byName", "options": "대기" }, "properties": [ { "id": "color", "value": { "mode": "fixed", "fixedColor": "red" } } ] },
              { "matcher": { "id": "byName", "options": "상한" }, "properties": [ { "id": "color", "value": { "mode": "fixed", "fixedColor": "text" } }, { "id": "custom.lineStyle", "value": { "fill": "dash", "dash": [10, 6] } }, { "id": "custom.lineWidth", "value": 1 }, { "id": "custom.fillOpacity", "value": 0 } ] }
            ]
          },
          "options": { "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["mean", "max"] } }
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "MySQL CPU · 스로틀 — limit 1코어 대비 %",
          "description": "MySQL 컨테이너의 CPU 사용률(사용량 ÷ limit)과 스로틀 비율.\n\n**MySQL 은 1코어다.** booking 이 2코어라 앱은 여유가 있어도 원장이 먼저 걸릴 수 있고, 그때 앱 CPU 는 낮은 채 행3 의 지연만 오른다 — 특히 원장에 쓰는 유일한 경로인 `/api/bookings` 가.\n\n- **실선** CPU 사용률\n- **빨간 선** 스로틀. 0 이 정상\n\n왼쪽 풀 패널과 짝으로 읽는다(그쪽 설명의 판정 표).\n\n확정 커밋은 디스크 쓰기를 기다린다 — 여기(CPU)가 놀고 풀도 여유인데 확정만 느리면 원인은 디스크 쪽이고, 그 판정은 노드 지표(인프라 판) 몫이다.\n\nmysqld_exporter 컨테이너(0.1코어)는 이 패널에 없다 — 원장 자신의 부하가 아니다.",
          "datasource": { "type": "prometheus", "uid": "mimir" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 10 },
          "targets": [
            { "refId": "A", "expr": "sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\"data\", container=\"mysql\"}[$__rate_interval])) / on(pod) group_left() kube_pod_container_resource_limits{namespace=\"data\", container=\"mysql\", resource=\"cpu\"} and on(pod) (kube_pod_status_phase{namespace=\"data\", phase=\"Running\"} == 1)", "legendFormat": "CPU {{pod}}" },
            { "refId": "B", "expr": "sum by (pod) (rate(container_cpu_cfs_throttled_periods_total{namespace=\"data\", container=\"mysql\"}[$__rate_interval])) / sum by (pod) (rate(container_cpu_cfs_periods_total{namespace=\"data\", container=\"mysql\"}[$__rate_interval])) and on(pod) (kube_pod_status_phase{namespace=\"data\", phase=\"Running\"} == 1)", "legendFormat": "스로틀 {{pod}}" },
            { "refId": "C", "expr": "vector(1)", "legendFormat": "limit" }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "decimals": 1,
              "min": 0,
              "custom": { "fillOpacity": 0, "lineWidth": 2, "showPoints": "never", "axisSoftMax": 1.05 }
            },
            "overrides": [
              { "matcher": { "id": "byRegexp", "options": "스로틀.*" }, "properties": [ { "id": "color", "value": { "mode": "fixed", "fixedColor": "red" } } ] },
              { "matcher": { "id": "byName", "options": "limit" }, "properties": [ { "id": "color", "value": { "mode": "fixed", "fixedColor": "text" } }, { "id": "custom.lineStyle", "value": { "fill": "dash", "dash": [10, 6] } }, { "id": "custom.lineWidth", "value": 1 }, { "id": "custom.hideFrom", "value": { "legend": false, "tooltip": true, "viz": false } } ] }
            ]
          },
