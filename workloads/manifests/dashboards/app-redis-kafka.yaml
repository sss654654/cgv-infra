# Redis · Kafka 대시보드 — 두 앱이 공유하는 계층 (2026-08-29 신설)
#
# 목적이 기존 두 판과 다르다.
#   queue · booking 판    각 파드의 스펙 판정.  거기서 Redis·Kafka 는 "탓인지 배제"하는 조연이었다
#   ★ 이 판              Redis·Kafka 자체가 주인공.  질문 둘 —
#                         Redis: 명령 처리가 포화하나 (단일 스레드 1코어가 인원 상한을 정한다)
#                         Kafka: 다리가 빠르고 완결되나 (회전 한 바퀴가 다리를 두 번 지난다)
#
# 행 구성 — 행 하나가 질문 하나다.
#   행1 Redis    수요(명령별 호출) · 공급(master CPU)과 품질(호출당 µs) · 메모리
#   행2 Kafka    다리 지연 p99 둘 · 보낸 vs 받은 넷 · 0이어야 하는 값
#   ▸행3        원인 파기 — 명령별 호출당 µs.  행1이 포화를 가리킬 때만 연다
#
# 실물 확인 (2026-08-29, CONFIG GET · INFO 로 직접 읽음):
#   maxmemory 0 · maxmemory-policy noeviction   → eviction 은 일어나지 않는다.
#     메모리의 실제 경계는 컨테이너 limit 512Mi (닿으면 OOMKill = 대기열 전체 소실 + failover)
#   persistence 없음(PVC 없음, 차트에 명시: "큐 상태=운영성. durable 기록은 MySQL")
#   appendonly yes — PVC 가 없어 파드가 지워지면 AOF 도 같이 사라진다.  쓰기 비용만 남는 상태
#   master = redis-node-1 (0번이 아니다.  failover 로 자리가 바뀔 수 있어 이름으로 못박지 않는다)
#
# 12부 실측 계수 (이 판이 재검증할 기준값):
#   Redis 명령 사람당 1.21건/초 · master CPU 사람당 0.0395 mCPU (봉우리) → 1코어 = 약 25,300명
#   회전 = 확정/초 = 정원 ÷ 체류.  최대 실측 10.5건/초 (Kafka 로는 약 21 msg/초 — 브로커 부하 아님)
#
# 여기 없는 것과 이유
#   Redis 커넥션 풀        queue 판에 있다.  풀 포기의 원인이 Redis 가 아니라 queue 파드 CPU 였다
#                         (12부: limit 500m→1000m 에 포기 59건/초 → 0).  앱 건강 지표라 앱 판에 둔다
#   히트율                여기서 Redis 는 캐시가 아니라 정본이다.  히트율로 내릴 판단이 없다
#   복제 지연             읽기를 replica 로 안 보낸다(position Lua 안에 생존 도장 쓰기가 있어 못 보낸다).
#                         읽기 분리를 하면 그때 이 판에 추가한다
#   Kafka 스루풋 · ISR    최대 회전에서도 수십 msg/초라 스루풋은 판단을 만들지 않는다.
#                         브로커 생존은 인프라 판 소관
#   브로커 lag (건수)      kafkaExporter 미설치.  "줄이 브로커에 있나 컨슈머 안에 있나"는
#                         지금 트레이스로만 가른다 — 설치 여부는 별도 결정
#   admissions-revoked    회수 다리는 발행측 카운터가 없어 완결 판정을 못 세운다.
#                         새면 booking_kafka_dlt_total{topic="admissions-revoked"} 로 드러난다
#
# 구조가 바뀌면: 샤딩(Cluster) → master 선이 늘 뿐 뼈대 유지, "샤드 균형" 패널을 추가.
#   읽기 분리 → replica CPU 가 판단 대상이 되고 "복제 지연" 패널을 추가.
apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-app-redis-kafka
  namespace: observability
  labels:
    grafana_dashboard: "1"
data:
  app-redis-kafka.json: |
    {
      "uid": "app-redis-kafka",
      "title": "Redis · Kafka — 공유 계층",
      "tags": ["cgv", "app", "middleware"],
      "editable": true,
      "timezone": "browser",
      "time": { "from": "now-1h", "to": "now" },
      "refresh": "30s",
      "schemaVersion": 39,
      "templating": { "list": [] },
      "panels": [
        {
          "type": "row",
          "title": "1. Redis — 명령 처리가 포화하나 (인원 축)",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 },
          "collapsed": false,
          "panels": []
        },
        {
          "id": 1,
          "type": "timeseries",
          "title": "master CPU / 상한 1코어 · 호출당 µs",
          "description": "**단일 스레드의 포화를 쌍으로 판정한다.** Redis 는 명령을 한 번에 하나씩 실행한다 — 유한한 것은 master 의 1코어 하나이고, 코어를 더 줘도 안 는다.\n\n- **실선 셋(파드별 CPU)** 크게 오르는 하나가 master 다. 읽기·쓰기 전부 그리로 간다. 선이 갑자기 자리를 바꾸면 failover 가 일어난 것 — **그 구간의 판은 버린다**\n- **점선(호출당 µs, 오른쪽 축)** 명령 하나가 걸린 평균 시간. 관리·복제 명령은 뺐다\n\n**판정:**\n- CPU 오르는데 µs 평평 → 여유. 계단을 더 올려도 된다\n- CPU 높고 µs 도 오르기 시작 → **단일 스레드 포화 진입. 이 인원이 이 클러스터의 Redis 상한이다.** limit 상향은 무효 — 명령 수를 줄인다. 어디를 줄일지는 오른쪽 「명령별」이 답한다\n- CPU 평평한데 µs 만 오름 → Redis 탓이 아니다. 네트워크·앱 쪽 — queue 판으로\n\n기준선은 1.0 하나만 긋는다. 무릎이 어디서 서는지가 이 판이 재는 값이라, 경고선을 미리 그으면 그 선을 믿게 된다.\n\n12부 실측: 사람당 0.0395 mCPU(봉우리) → 1코어 = 약 25,300명. 10,000명에서 0.337 코어.",
          "datasource": { "type": "prometheus", "uid": "mimir" },
          "gridPos": { "h": 9, "w": 12, "x": 0, "y": 1 },
          "targets": [
            { "refId": "A", "expr": "sum by (pod) (rate(redis_cpu_user_seconds_total{job=\"redis-metrics\"}[$__rate_interval]) + rate(redis_cpu_sys_seconds_total{job=\"redis-metrics\"}[$__rate_interval]))", "legendFormat": "{{pod}}" },
            { "refId": "B", "expr": "sum(max by (cmd) (rate(redis_commands_duration_seconds_total{job=\"redis-metrics\", cmd!~\"ping|publish|replconf|auth|info|subscribe|psync|hello|client.*|slowlog.*|config.*|latency.*|memory.*|command.*\"}[$__rate_interval]))) / sum(max by (cmd) (rate(redis_commands_total{job=\"redis-metrics\", cmd!~\"ping|publish|replconf|auth|info|subscribe|psync|hello|client.*|slowlog.*|config.*|latency.*|memory.*|command.*\"}[$__rate_interval]))) * 1e6", "legendFormat": "호출당 µs (master)" }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "decimals": 2,
              "min": 0,
              "custom": { "fillOpacity": 8, "lineWidth": 2, "showPoints": "never", "thresholdsStyle": { "mode": "line" } },
              "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null }, { "color": "red", "value": 1 } ] }
            },
            "overrides": [
              {
                "matcher": { "id": "byName", "options": "호출당 µs (master)" },
                "properties": [
                  { "id": "unit", "value": "µs" },
                  { "id": "decimals", "value": 0 },
                  { "id": "custom.axisPlacement", "value": "right" },
                  { "id": "custom.lineStyle", "value": { "fill": "dash", "dash": [6, 4] } },
                  { "id": "custom.thresholdsStyle", "value": { "mode": "off" } },
                  { "id": "color", "value": { "mode": "fixed", "fixedColor": "orange" } }
                ]
              }
            ]
          },
          "options": { "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["mean", "max"] } }
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "명령별 초당 호출 — master 한 대분",
          "description": "**수요의 내역이다 — 명령 종류가 곧 코드 경로다.**\n\n- `zadd` 대부분이 폴링마다 찍는 생존 도장 (12부 실측 42%)\n- `evalsha` 폴링·입장·승격 Lua\n- `get`·`exists` 처리율 캐시·게이트\n- `zrank`·`zcard`·`zscore` 순번·인원 (Lua 안에서 실행된 것도 각각 따로 세어진다)\n\n파드별 최댓값을 쓴다 — 쓰기는 복제본이 재생해 합치면 3배가 된다.\n\n**판정:**\n- 인원 N 을 넣으면 총량 ≈ N × 1.21 (12부 계수). 크게 벗어나면 어느 명령이 초과인지가 새는 코드 경로를 지목한다\n- 왼쪽 패널이 포화를 가리키면 **여기서 무엇을 깎을지 정한다** — zadd(도장을 N 회에 1회로)가 제일 싸고, 그다음이 순번 조회를 카운터로 바꾸는 구조 변경이다. 깎을 크기가 이 패널에 실측으로 있다",
          "datasource": { "type": "prometheus", "uid": "mimir" },
          "gridPos": { "h": 9, "w": 6, "x": 12, "y": 1 },
          "targets": [
            { "refId": "A", "expr": "max by (cmd) (rate(redis_commands_total{job=\"redis-metrics\", cmd=~\"evalsha|zadd|zcard|zrank|zscore|get|lrange|mget|exists|smembers|set|del|incrby\"}[$__rate_interval]))", "legendFormat": "{{cmd}}" }
          ],
          "fieldConfig": {
            "defaults": { "unit": "reqps", "decimals": 1, "min": 0, "custom": { "fillOpacity": 0, "lineWidth": 2, "showPoints": "never" } },
            "overrides": []
          },
          "options": { "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["mean", "max"] } }
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "메모리 — 파드별 / 컨테이너 limit 512Mi",
          "description": "**대기열·인증·좌석 선점의 정본이 전부 이 메모리에 있다.**\n\n- **실선 `used`** Redis 가 데이터에 쓰는 양. 인원을 올리면 대기열 크기가 처음으로 실측된다 (추정: 10만 명 약 5MB — 데이터가 아니라 클라이언트·복제 버퍼가 큰 쪽이다)\n- **점선 `컨테이너`** 커널이 OOMKill 을 판정하는 값. **닿으면 파드가 죽고 대기열 전체가 사라진 채 failover 한다**\n\n실물 확인(2026-08-29): maxmemory 0 · noeviction — **eviction 은 일어나지 않는다.** 경계는 이 512Mi 하나다. persistence 도 없다(의도된 결정 — 큐 상태는 운영성, durable 기록은 MySQL).\n\n**판정:** 점선이 512Mi 로 접근하면 그 인원이 메모리 기준 상한이다 — limit 재산정 재료.",
          "datasource": { "type": "prometheus", "uid": "mimir" },
          "gridPos": { "h": 9, "w": 6, "x": 18, "y": 1 },
          "targets": [
            { "refId": "A", "expr": "redis_memory_used_bytes{job=\"redis-metrics\"}", "legendFormat": "used {{pod}}" },
            { "refId": "B", "expr": "container_memory_working_set_bytes{namespace=\"data\", pod=~\"redis-node-.*\", container=\"redis\"}", "legendFormat": "컨테이너 {{pod}}" }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "min": 0,
              "custom": { "fillOpacity": 0, "lineWidth": 2, "showPoints": "never", "thresholdsStyle": { "mode": "line" } },
              "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null }, { "color": "red", "value": 536870912 } ] }
            },
            "overrides": [
              {
                "matcher": { "id": "byRegexp", "options": "컨테이너.*" },
                "properties": [
                  { "id": "custom.lineStyle", "value": { "fill": "dash", "dash": [6, 4] } }
                ]
              }
            ]
          },
          "options": { "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["max"] } }
        },
        {
          "type": "row",
          "title": "2. Kafka — 다리가 빠르고 완결되나 (회전 축)",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 10 },
          "collapsed": false,
          "panels": []
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "다리 지연 p99 — 승격→인증 · 확정→반환 / 통과선 2초",
          "description": "**회전 한 바퀴가 Kafka 를 두 번 지난다.** 승격 → [admissions] → 인증 → 좌석·결제 → 확정 → [bookings-completed] → 자리 반환 → 다음 승격. 다리가 느리면 회전이 느려지고 줄이 안 준다.\n\n**통과선 2초의 근거:** 프론트 재시도 예산이 12회 × 0.3초 = 3.6초다. 인증이 그보다 늦으면 입장한 사용자가 \"입장 중…\"에서 튕겨 첫 화면으로 돌아간다 — 자리는 쥔 채로.\n\n**판정:**\n- 평시 ms 대 · 오픈 봉우리에서 튀었다 수십 초 안에 수렴 → 정상. **이 모양이 \"버퍼가 폭주를 흡수한다\"다**\n- 수렴 않고 계속 오름 → 소비가 생산을 못 따라간다. 브로커가 아니라 **컨슈머부터** — booking 스로틀 · 리스너 스레드 · 커밋 방식 (12부: 이 셋으로 29.7초 → 0.81초)\n- 평시부터 높음 → 몰림이 아니라 상시 문제. 점(exemplar)을 눌러 트레이스를 연다\n\n⚠ 지연은 발행 파드의 시계로 찍혀 노드 간 시계 차가 오차로 섞인다. 인증 지연의 버킷 상한은 60초 — 선이 거기 평평하게 붙으면 측정값이 아니라 \"그보다 크다\"는 뜻이다. 메시지가 없는 구간은 선이 비는 것이 정상이다 — 지연을 잴 대상이 없다.",
          "datasource": { "type": "prometheus", "uid": "mimir" },
          "gridPos": { "h": 9, "w": 9, "x": 0, "y": 11 },
          "targets": [
            { "refId": "A", "expr": "histogram_quantile(0.99, sum by (le) (rate(booking_admission_lag_seconds_bucket{application=\"cgv-booking\"}[1m])))", "legendFormat": "승격→인증 p99", "exemplar": true },
            { "refId": "B", "expr": "histogram_quantile(0.99, sum by (le) (rate(queue_completed_lag_seconds_bucket[1m])))", "legendFormat": "확정→반환 p99", "exemplar": true }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "min": 0,
              "custom": { "fillOpacity": 8, "lineWidth": 2, "showPoints": "never", "thresholdsStyle": { "mode": "line" } },
              "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null }, { "color": "red", "value": 2 } ] }
            },
            "overrides": []
          },
          "options": { "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["mean", "max"] } }
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "다리 완결 — 보낸 vs 받은 (쌍끼리 겹쳐야 정상)",
          "description": "**\"발행하고 끝\"이 성립하려면 보낸 수와 받은 수가 같아야 한다.** 네 선이 두 쌍이다 — 전부 회전값이라 눈금이 같다.\n\n- **승격/초 vs 인증/초** admissions 다리. queue 가 자리를 내준 수와 booking 이 인증을 만든 수\n- **확정/초 vs 반환/초** bookings-completed 다리. booking 이 확정한 수와 queue 가 자리를 비운 수\n\n**판정:** 쌍이 벌어지면 그 다리가 새는 중이다 — 위치는 오른쪽 「0이어야 하는 값」이 지목한다.\n\n받치는 사슬: 발행 실패는 저널(pending)에 남아 sweep 이 재발행하고, 소비는 처리 성공 후 커밋하며, booking 처리 실패는 재시도 소진 뒤 DLT 로 격리된다. 같은 메시지가 두 번 올 수 있는데(at-least-once) 인증 SET 은 덮어쓰기, 반환 ZREM 은 없는 것 지우기라 **두 번 처리돼도 결과가 같다.**\n\n회수 다리(admissions-revoked)는 발행측 카운터가 없어 여기 없다 — 새면 DLT{topic} 로 드러난다.",
          "datasource": { "type": "prometheus", "uid": "mimir" },
          "gridPos": { "h": 9, "w": 9, "x": 9, "y": 11 },
          "targets": [
            { "refId": "A", "expr": "max(queue_promotion_rate and on(pod) (up{job=\"app/queue\"} == 1)) or vector(0)", "legendFormat": "승격/초 — queue 발행측" },
            { "refId": "B", "expr": "sum(rate(booking_admissions_total{application=\"cgv-booking\", result=\"ok\"}[1m])) or vector(0)", "legendFormat": "인증/초 — booking 소비측" },
            { "refId": "C", "expr": "sum(rate(booking_confirm_total{application=\"cgv-booking\", result=\"success\"}[1m])) or vector(0)", "legendFormat": "확정/초 — booking 발행측" },
            { "refId": "D", "expr": "sum(rate(queue_completed_total[1m])) or vector(0)", "legendFormat": "반환/초 — queue 소비측" }
          ],
          "fieldConfig": {
            "defaults": { "unit": "reqps", "decimals": 2, "min": 0, "custom": { "fillOpacity": 0, "lineWidth": 2, "showPoints": "never" } },
            "overrides": [
              { "matcher": { "id": "byName", "options": "인증/초 — booking 소비측" }, "properties": [ { "id": "custom.lineStyle", "value": { "fill": "dash", "dash": [4, 4] } } ] },
              { "matcher": { "id": "byName", "options": "반환/초 — queue 소비측" }, "properties": [ { "id": "custom.lineStyle", "value": { "fill": "dash", "dash": [4, 4] } } ] }
            ]
          },
          "options": { "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["mean"] } }
        },
        {
          "id": 6,
          "type": "stat",
          "title": "0이어야 하는 값 — 어느 칸이 서느냐가 새는 위치다",
