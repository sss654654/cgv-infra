# Redis · Kafka 대시보드 — 두 앱이 공유하는 계층 (2026-08-29 신설)
#
# 목적이 기존 두 판과 다르다.
#   queue · booking 판    각 파드의 스펙 판정.  거기서 Redis·Kafka 는 원인에서 배제하는 대상이었다
#   ★ 이 판              Redis·Kafka 자체가 판정 대상.  질문 둘 —
#                         Redis: 명령 처리가 포화하나 (단일 스레드 1코어가 인원 상한을 정한다)
#                         Kafka: 전달이 빠르고 완결되나 (회전 한 바퀴가 Kafka 를 두 번 지난다)
#
# 행 구성 — 행 하나가 질문 하나다.
#   행1 Redis    수요(명령별 호출) · 공급(master CPU)과 품질(호출당 µs) · 메모리
#   행2 Kafka    전달 지연 p99 둘 · 발행 vs 소비 넷
#   ▸행3        원인 — 명령별 호출당 µs.  행1이 포화를 가리킬 때만 연다
#
# 「0이어야 하는 값」 stat 은 뺐다(2026-08-29 판정) — 판이 끝난 뒤 사후 쿼리로 확인한다:
#   sum(increase(queue_redis_pool_timeouts_total[판 길이]))                 풀 포기
#   sum(increase(redis_commands_failed_calls_total{job="redis-metrics"}[…])) Redis 실패
#   sum(increase(queue_kafka_publish_failures_total[…]))                     발행 실패
#   sum(increase(queue_kafka_consume_failures_total[…]))                     소비 실패
#   sum(increase(booking_kafka_dlt_total[…]))                                DLT
#     ⚠ booking_kafka_dlt_total 은 지금 없다(2026-08-30, 지표 이름 전수 대조). DLT 카운터가
#       구현되면 이 줄이 성립한다.
#
# 실물 확인 (2026-08-29, CONFIG GET · INFO 로 직접 읽음):
#   maxmemory 0 · maxmemory-policy noeviction   → eviction 은 일어나지 않는다.
#     메모리의 실제 경계는 컨테이너 limit 512Mi (닿으면 OOMKill = 대기열 전체 소실 + failover)
#   persistence 없음(PVC 없음, 차트에 명시: "큐 상태=운영성. durable 기록은 MySQL")
#   appendonly yes — PVC 가 없어 파드가 지워지면 AOF 도 같이 사라진다.  쓰기 비용만 남는 상태
#   master = redis-node-1 (0번이 아니다.  failover 로 자리가 바뀔 수 있어 이름으로 못박지 않는다)
#
# 계수 — 12부 값과 2026-08-30 재검증 결과:
#   12부는 인원에 정비례한다고 봤다: 명령 사람당 1.21건/초 · master CPU 사람당 0.0395 mCPU(봉우리)
#     → 그 계수로는 1코어가 약 25,300명이다.
#   3만 명 판 실측은 명령 초당 19,885건 · master CPU 0.439/1코어(44%)다.
#     정비례 예측(명령 36,300건/초 · CPU 1.185코어)의 각각 55% · 37%.
#   차이의 원인은 폴링 주기다 — 순번이 깊을수록 길다(100번 밖 5초 · 20번 밖 2초 · 그 안 1초).
#     인원이 늘수록 깊은 순번의 비중이 커져 사람당 명령 수가 내려간다.
#     그래서 사람당 계수로 인원 상한을 역산하면 실제보다 낮게 나온다.
#   1만 명 판 실측(정원 1,000): master CPU 0.406/1코어(41%)
#   회전 = 확정/초 = 정원 ÷ 체류.  최대 실측 15.58건/초(정원 1,000)
#
# 여기 없는 것과 이유
#   Redis 커넥션 풀        queue 판에 있다.  풀 포기의 원인이 Redis 가 아니라 queue 파드 CPU 였다
#                         (12부: limit 500m→1000m 에 포기 59건/초 → 0).  앱 건강 지표라 앱 판에 둔다
#   히트율                여기서 Redis 는 캐시가 아니라 정본이다.  히트율로 내릴 판단이 없다
#   복제 지연             읽기를 replica 로 안 보낸다(position Lua 안에 생존 도장 쓰기가 있어 못 보낸다).
#                         읽기 분리를 하면 그때 이 판에 추가한다
#   Kafka 스루풋 · ISR    최대 회전에서도 수십 msg/초라 스루풋은 판단을 만들지 않는다.
#                         브로커 생존은 인프라 판 소관
#   브로커 lag (건수)      kafkaExporter 미설치.  "줄이 브로커에 있나 컨슈머 안에 있나"는
#                         지금 트레이스로만 가른다 — 설치 여부는 별도 결정
#   admissions-revoked    회수 경로는 발행측 카운터가 없어 완결 판정을 못 세운다.
#                         DLT 카운터도 없어(위 참조) 지금은 새는 것을 지표로 잡을 수단이 없다
#
# 구조가 바뀌면: 샤딩(Cluster) → master 선이 늘 뿐 행 구성 유지, "샤드 균형" 패널을 추가.
#   읽기 분리 → replica CPU 가 판단 대상이 되고 "복제 지연" 패널을 추가.
apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-app-redis-kafka
  namespace: observability
  labels:
    grafana_dashboard: "1"
data:
  app-redis-kafka.json: |
    {
      "uid": "app-redis-kafka",
      "title": "Redis · Kafka — 공유 계층",
      "tags": ["cgv", "app", "middleware"],
      "editable": true,
      "timezone": "browser",
      "time": { "from": "now-1h", "to": "now" },
      "refresh": "30s",
      "schemaVersion": 39,
      "templating": { "list": [] },
      "panels": [
        {
          "type": "row",
          "title": "1. Redis — 명령 처리가 포화하나 (인원 축)",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 },
          "collapsed": false,
          "panels": []
        },
        {
          "id": 1,
          "type": "timeseries",
          "title": "master CPU / 상한 1코어 · 호출당 µs",
          "description": "**단일 스레드의 포화를 쌍으로 판정한다.** Redis 는 명령을 한 번에 하나씩 실행한다 — 유한한 것은 master 의 1코어 하나이고, 코어를 더 줘도 안 는다.\n\n- **실선 셋(파드별 CPU)** 크게 오르는 하나가 master 다. 읽기·쓰기 전부 그리로 간다. 선이 갑자기 자리를 바꾸면 failover 가 일어난 것 — **그 구간의 판은 버린다**\n- **점선(호출당 µs, 오른쪽 축)** 명령 하나가 걸린 평균 시간. 관리·복제 명령은 뺐다\n\n**판정:**\n- CPU 오르는데 µs 평평 → 명령 하나가 걸린 시간이 안 늘었다. 인원을 더 올릴 수 있다\n- CPU 높고 µs 도 오르기 시작 → **단일 스레드 포화 진입. 이 인원이 이 클러스터의 Redis 상한이다.** limit 상향은 효과가 없다 — 명령 수를 줄인다. 어디를 줄일지는 오른쪽 「명령별」이 답한다\n- CPU 평평한데 µs 만 오름 → 원인이 Redis 밖이다. 네트워크·앱 쪽 — queue 판으로\n\n상한선은 1.0(단일 스레드 = 1코어) 점선 하나만 긋는다. 무릎이 어디서 서는지가 이 판이 재는 값이라, 경고선을 미리 그으면 그 선을 믿게 된다.\n\n**사람당 계수로 인원 상한을 역산하면 실제보다 낮게 나온다.** 12부 계수(사람당 0.0395 mCPU 봉우리)로는 1코어가 약 25,300명인데, 2026-08-30 3만 명 판 실측은 0.439코어(44%)다. 순번이 깊을수록 폴링 주기가 길어(100번 밖 5초 · 20번 밖 2초 · 그 안 1초) 인원이 늘수록 사람당 명령 수가 내려간다. 1만 명 판(정원 1,000)은 0.406코어.",
          "datasource": { "type": "prometheus", "uid": "mimir" },
          "gridPos": { "h": 9, "w": 12, "x": 0, "y": 1 },
          "targets": [
            { "refId": "A", "expr": "sum by (pod) (rate(redis_cpu_user_seconds_total{job=\"redis-metrics\"}[$__rate_interval]) + rate(redis_cpu_sys_seconds_total{job=\"redis-metrics\"}[$__rate_interval]))", "legendFormat": "{{pod}}" },
            { "refId": "B", "expr": "sum(max by (cmd) (rate(redis_commands_duration_seconds_total{job=\"redis-metrics\", cmd!~\"ping|publish|replconf|auth|info|subscribe|psync|hello|client.*|slowlog.*|config.*|latency.*|memory.*|command.*\"}[$__rate_interval]))) / sum(max by (cmd) (rate(redis_commands_total{job=\"redis-metrics\", cmd!~\"ping|publish|replconf|auth|info|subscribe|psync|hello|client.*|slowlog.*|config.*|latency.*|memory.*|command.*\"}[$__rate_interval]))) * 1e6", "legendFormat": "호출당 µs (master)" },
            { "refId": "C", "expr": "vector(1)", "legendFormat": "limit (1코어)" }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "decimals": 2,
              "min": 0,
              "custom": { "fillOpacity": 8, "lineWidth": 2, "showPoints": "never" }
            },
            "overrides": [
              { "matcher": { "id": "byName", "options": "limit (1코어)" }, "properties": [ { "id": "color", "value": { "mode": "fixed", "fixedColor": "text" } }, { "id": "custom.lineStyle", "value": { "fill": "dash", "dash": [10, 6] } }, { "id": "custom.lineWidth", "value": 1 }, { "id": "custom.fillOpacity", "value": 0 }, { "id": "custom.hideFrom", "value": { "legend": false, "tooltip": true, "viz": false } } ] },
              {
                "matcher": { "id": "byName", "options": "호출당 µs (master)" },
                "properties": [
                  { "id": "unit", "value": "µs" },
                  { "id": "decimals", "value": 0 },
                  { "id": "custom.axisPlacement", "value": "right" },
                  { "id": "custom.lineStyle", "value": { "fill": "dash", "dash": [6, 4] } },
                  { "id": "custom.thresholdsStyle", "value": { "mode": "off" } },
                  { "id": "color", "value": { "mode": "fixed", "fixedColor": "orange" } }
                ]
              }
            ]
          },
          "options": { "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["mean", "max"] } }
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "명령별 초당 호출 — master 한 대분",
          "description": "**수요의 내역이다 — 명령 종류가 곧 코드 경로다.**\n\n- `zadd` 대부분이 폴링마다 찍는 생존 도장 (12부 실측 42%)\n- `evalsha` 폴링·입장·승격 Lua\n- `get`·`exists` 처리율 캐시·게이트\n- `zrank`·`zcard`·`zscore` 순번·인원 (Lua 안에서 실행된 것도 각각 따로 세어진다)\n\n파드별 최댓값을 쓴다 — 쓰기는 복제본이 재생해 합치면 3배가 된다.\n\n**판정:**\n- 12부 계수는 인원 N × 1.21 이었다. 3만 명 판 실측은 19,885건/초로 그 계수 예측(36,300)의 55% 다(2026-08-30) — 순번이 깊을수록 폴링 주기가 길어 인원에 정비례하지 않는다. **같은 인원에서 이전 판보다 총량이 크면** 어느 명령이 늘었는지가 그 코드 경로를 지목한다\n- 왼쪽 패널이 포화를 가리키면 **여기서 무엇을 깎을지 정한다** — zadd(도장을 N 회에 1회로)가 코드 변경 범위가 가장 작고, 그다음이 순번 조회를 카운터로 바꾸는 구조 변경이다. 깎을 크기가 이 패널에 실측으로 있다",
          "datasource": { "type": "prometheus", "uid": "mimir" },
          "gridPos": { "h": 9, "w": 6, "x": 12, "y": 1 },
          "targets": [
            { "refId": "A", "expr": "max by (cmd) (rate(redis_commands_total{job=\"redis-metrics\", cmd=~\"evalsha|zadd|zcard|zrank|zscore|get|lrange|mget|exists|smembers|set|del|incrby\"}[$__rate_interval]))", "legendFormat": "{{cmd}}" }
          ],
          "fieldConfig": {
            "defaults": { "unit": "reqps", "decimals": 1, "min": 0, "custom": { "fillOpacity": 0, "lineWidth": 2, "showPoints": "never" } },
            "overrides": []
          },
          "options": { "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["mean", "max"] } }
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "메모리 — working_set / limit 512Mi",
          "description": "**대기열·인증·좌석 선점의 정본이 전부 이 메모리에 있다.** queue·booking 판과 같은 문법 — limit 대비 %, 100%(점선)에 닿으면 OOMKill.\n\n- **실선 `컨테이너`** working_set ÷ limit. 커널이 OOMKill 을 판정하는 값. **닿으면 파드가 OOMKill 되고, PVC 가 없어 대기열이 사라진 채 failover 한다**\n- **가는 선 `used`** Redis 가 데이터에 쓰는 양 ÷ limit. 인원을 올리면 대기열 크기가 처음으로 실측된다 — 컨테이너 선과의 간격이 버퍼·오버헤드 몫이다\n\n실물 확인(2026-08-29): maxmemory 0 · noeviction — **eviction 은 일어나지 않는다.** 경계는 limit 하나다. persistence 도 없다(의도된 결정 — 큐 상태는 운영성, durable 기록은 MySQL).\n\n**판정:** 컨테이너 선이 100% 로 접근하는 인원이 메모리 기준 상한이다 — limit 재산정 재료. limit 은 지표로 읽으므로 바꾸면 선이 따라온다.",
          "datasource": { "type": "prometheus", "uid": "mimir" },
          "gridPos": { "h": 9, "w": 6, "x": 18, "y": 1 },
          "targets": [
            { "refId": "A", "expr": "redis_memory_used_bytes{job=\"redis-metrics\"} / on(pod) group_left() kube_pod_container_resource_limits{namespace=\"data\", pod=~\"redis-node-.*\", container=\"redis\", resource=\"memory\"}", "legendFormat": "used {{pod}}" },
            { "refId": "B", "expr": "container_memory_working_set_bytes{namespace=\"data\", pod=~\"redis-node-.*\", container=\"redis\"} / on(pod) group_left() kube_pod_container_resource_limits{namespace=\"data\", pod=~\"redis-node-.*\", container=\"redis\", resource=\"memory\"}", "legendFormat": "컨테이너 {{pod}}" },
            { "refId": "C", "expr": "vector(1)", "legendFormat": "limit" }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "decimals": 1,
              "min": 0,
              "custom": { "fillOpacity": 0, "lineWidth": 2, "showPoints": "never", "axisSoftMax": 1.05 }
            },
            "overrides": [
              {
                "matcher": { "id": "byRegexp", "options": "used.*" },
                "properties": [
                  { "id": "custom.lineWidth", "value": 1 }
                ]
              },
              { "matcher": { "id": "byName", "options": "limit" }, "properties": [ { "id": "color", "value": { "mode": "fixed", "fixedColor": "text" } }, { "id": "custom.lineStyle", "value": { "fill": "dash", "dash": [10, 6] } }, { "id": "custom.lineWidth", "value": 1 }, { "id": "custom.hideFrom", "value": { "legend": false, "tooltip": true, "viz": false } } ] }
            ]
          },
          "options": { "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["lastNotNull", "max"] } }
        },
        {
          "type": "row",
          "title": "2. Kafka — 두 서비스 사이 전달이 빠르고 완결되나 (회전 축)",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 10 },
          "collapsed": false,
          "panels": []
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "전달 지연 p99 — 승격→인증 · 확정→반환 / 통과선 2초",
          "description": "**회전 한 바퀴가 Kafka 를 두 번 지난다.** 승격 → [admissions] → 인증 → 좌석·결제 → 확정 → [bookings-completed] → 자리 반환 → 다음 승격. 다리가 느리면 회전이 느려지고 줄이 안 준다.\n\n**통과선 2초의 근거:** 프론트 재시도 예산이 12회 × 0.3초 = 3.6초다. 인증이 그보다 늦으면 입장한 사용자가 \"입장 중…\"에서 튕겨 첫 화면으로 돌아간다 — 자리는 쥔 채로.\n\n**판정:**\n- 평시 ms 대 · 오픈 봉우리에서 튀었다 수십 초 안에 수렴 → 정상. **발행이 몰린 구간을 토픽이 받아 두고 소비가 뒤따라 처리한 모양이다**\n- 수렴 않고 계속 오름 → 소비가 생산을 못 따라간다. 브로커가 아니라 **컨슈머부터** — booking 스로틀 · 리스너 스레드 · 커밋 방식 (12부: 이 셋으로 29.7초 → 0.81초)\n- 평시부터 높음 → 몰림이 아니라 상시 문제. 점(exemplar)을 눌러 트레이스를 연다\n\n⚠ 지연은 발행 파드의 시계로 찍혀 노드 간 시계 차가 오차로 섞인다. 인증 지연의 버킷 상한은 60초 — 선이 거기 평평하게 붙으면 측정값이 아니라 \"그보다 크다\"는 뜻이다. 메시지가 없는 구간은 선이 비는 것이 정상이다 — 지연을 잴 대상이 없다.",
          "datasource": { "type": "prometheus", "uid": "mimir" },
          "gridPos": { "h": 9, "w": 12, "x": 0, "y": 11 },
          "targets": [
            { "refId": "A", "expr": "histogram_quantile(0.99, sum by (le, application) (rate(booking_admission_lag_seconds_bucket{application=\"cgv-booking\"}[1m])))", "legendFormat": "승격→인증 p99", "exemplar": true },
