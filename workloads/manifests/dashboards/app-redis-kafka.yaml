          "description": "**\"발행하고 끝\"이 성립하려면 보낸 수와 받은 수가 같아야 한다.** 네 선이 두 쌍이다 — 전부 회전값이라 눈금이 같다.\n\n- **승격/초 vs 인증/초** admissions 다리. queue 가 자리를 내준 수와 booking 이 인증을 만든 수\n- **확정/초 vs 반환/초** bookings-completed 다리. booking 이 확정한 수와 queue 가 자리를 비운 수\n\n**판정:** 쌍이 벌어지면 그 다리가 새는 중이다 — 위치는 오른쪽 「0이어야 하는 값」이 지목한다.\n\n**⚠ 오픈 직후에는 인증이 승격보다 큰 것이 정상이다.** 정원이 비어 있을 때 enter 로 들어온 사람은 promote 루프 없이 직접 입장하고(2026-08-29 판 실측: 인증 13.9/s vs 승격 7.6/s) 그 몫도 admissions 발행·인증에 잡힌다. 겹침 판정은 줄이 차 있는 정상 구간에서만 한다. 승격/초는 게이지가 아니라 카운터 rate(1분 창)다 — 인증/초와 같은 창이라야 비교가 된다.\n\n받치는 구조: 발행 실패는 저널(pending)에 남아 sweep 이 재발행하고, 소비는 처리 성공 후 커밋하며, booking 처리 실패는 재시도 소진 뒤 DLT 로 격리된다. 같은 메시지가 두 번 올 수 있는데(at-least-once) 인증 SET 은 덮어쓰기, 반환 ZREM 은 없는 것 지우기라 **두 번 처리돼도 결과가 같다.**\n\n회수 다리(admissions-revoked)는 발행측 카운터가 없어 여기 없다 — 새면 DLT{topic} 로 드러난다.",
