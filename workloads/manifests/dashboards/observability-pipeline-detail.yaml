          "description": "- **역할**: 넷 다 최근 데이터를 메모리에 들고 주기적으로 내리는 구조라, 들어오는 양이 늘면 메모리가 늘고 상한에 닿으면 죽는다. 이 스택에서 지금까지 문제가 된 것은 항상 메모리였다\n- **패널**: 막대 끝이 그 컨테이너의 limit 이고 숫자는 실제 사용량이다. 이름 옆 괄호가 limit. Alloy는 노드마다 한 대라 그중 최대를 본다\n- **읽는 법**: 100%에 닿기 전에도 영향이 난다 — 상한에 붙으면 GC가 계속 돌아 응답이 늦어지고, 죽기 전에 프로브가 먼저 실패한다\n- **그래서**: limit을 올리거나 들어오는 양을 줄인다. 트레이스 유입량은 앱 샘플링 비율이 정한다 — booking 1.0, queue 폴링 0.01. 2026-08-21 판에서 폴링을 0.05로 올렸을 때 Alloy 최대가 571→766MiB로 올랐다(한도 1Gi)",
          "datasource": {
            "type": "prometheus",
            "uid": "mimir"
          },
          "gridPos": {
            "h": 9,
            "w": 8,
            "x": 0,
            "y": 44
          },
