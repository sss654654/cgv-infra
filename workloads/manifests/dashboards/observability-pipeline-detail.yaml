# 관측 파이프라인 대시보드 — Mimir 공식 관측 3축(쓰기·읽기·저장 여정)에 이 환경의 사건 신호를 더한 구성.
# 패널 제목 = "컴포넌트 — 신호" 형식. 설명(ⓘ) = 역할 / 패널 / 읽는 법 3줄 리스트.
# 패널 12개로 유지한다 — 아쉬운 신호가 생기면 그날 추가(이전 26패널 판은 git 히스토리에 있다).
# 쿼리는 저장소 전체를 훑지 않는 것만 쓴다(무거운 패널 쿼리가 30초마다 돌며 querier를 OOM시킨 전례).
# 시리즈 상한(300000)을 바꾸면: 생산 시리즈 bargauge의 max, 보유·활성 패널의 threshold 두 곳을 같이 고친다.
apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-observability-pipeline-detail
  namespace: observability
  labels:
    grafana_dashboard: "1"
data:
  observability-pipeline-detail.json: |
    {
      "uid": "obs-pipeline-detail",
      "title": "관측 파이프라인",
      "editable": true,
      "timezone": "browser",
      "time": { "from": "now-3h", "to": "now" },
      "refresh": "",
      "schemaVersion": 39,
      "templating": { "list": [] },
      "panels": [
        {
          "type": "row", "title": "쓰기 — 받아지는가: Alloy → distributor → ingester", "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 }, "panels": []
        },
        {
          "type": "state-timeline",
          "title": "Alloy 수집 — job별 생존 이력",
          "description": "- **역할**: Alloy는 노드마다 하나(DaemonSet)로 타깃을 나눠 긁는 수집기. up은 수집기가 스크레이프 성공(1)·실패(0)를 판정해 직접 만드는 값 — 대상이 죽어도 남는 유일한 신호\n- **패널**: min by (job)이라 그 job의 타깃이 하나라도 죽으면 줄이 빨강. 켜짐/꺼짐의 이산 상태 → 색 블록(state timeline)\n- **읽는 법**: 빨간 구간 = 그때 그 job을 못 긁었다. 어느 타깃인지는 Explore에서 up == 0",
          "datasource": { "type": "prometheus", "uid": "mimir" },
          "gridPos": { "h": 8, "w": 10, "x": 0, "y": 1 },
          "targets": [
            { "refId": "A", "expr": "min by (job) (up)", "legendFormat": "{{job}}" }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": { "lineWidth": 0, "fillOpacity": 70 },
              "mappings": [
                { "type": "value", "options": { "1": { "text": "OK", "color": "green" }, "0": { "text": "DOWN", "color": "red" } } }
              ]
            },
            "overrides": []
          },
          "options": {
            "mergeValues": true, "showValue": "never", "rowHeight": 0.8,
            "legend": { "showLegend": false }, "tooltip": { "mode": "single" }
          }
        },
        {
          "type": "timeseries",
          "title": "distributor·ingester — 거절 (샘플/초, 사유별)",
          "description": "- **역할**: distributor는 쓰기의 관문, ingester는 최근 값을 메모리에 드는 저장부 — 둘이 한도·유효성 검사에서 샘플을 거절한다\n- **패널**: 거절된 샘플의 초당 속도를 reason(사유)별 선으로. 누적 카운터라 rate[5m]로 기울기\n- **읽는 법**: 0이 정상. per_user_series_limit = 시리즈 상한 도달 — 늦게 온 시리즈부터 선착순으로 밀린다",
          "datasource": { "type": "prometheus", "uid": "mimir" },
          "gridPos": { "h": 8, "w": 7, "x": 10, "y": 1 },
          "targets": [
            { "refId": "A", "expr": "sum by (reason) (rate(cortex_discarded_samples_total[5m]))", "legendFormat": "{{reason}}" }
          ],
          "fieldConfig": { "defaults": { "unit": "short", "min": 0, "custom": { "fillOpacity": 10 } }, "overrides": [] },
          "options": { "legend": { "showLegend": true, "displayMode": "list", "placement": "bottom" }, "tooltip": { "mode": "multi" } }
        },
        {
          "type": "timeseries",
          "title": "Alloy remote_write — 전송 실패 · 재시도 (샘플/초)",
          "description": "- **역할**: Alloy는 긁은 값을 자기 WAL에 적고 배치로 Mimir에 민다(remote_write) — 긁기와 보내기는 별개 단계\n- **패널**: 실패 = 재시도 없이 버려짐(4xx) = 곧 유실 / 재시도 = 일시 오류(5xx·네트워크)로 재전송 중\n- **읽는 법**: 둘 다 0이 정상. 옆 거절 패널과 같은 사건의 양면이고, Mimir가 통째로 죽어 거절 카운터가 침묵해도 여기는 뜬다 — 백업 신호",
          "datasource": { "type": "prometheus", "uid": "mimir" },
          "gridPos": { "h": 8, "w": 7, "x": 17, "y": 1 },
          "targets": [
            { "refId": "A", "expr": "sum by (pod) (rate(prometheus_remote_storage_samples_failed_total[5m]))", "legendFormat": "실패 {{pod}}" },
            { "refId": "B", "expr": "sum by (pod) (rate(prometheus_remote_storage_samples_retried_total[5m]))", "legendFormat": "재시도 {{pod}}" }
          ],
          "fieldConfig": { "defaults": { "unit": "short", "min": 0, "custom": { "fillOpacity": 10 } }, "overrides": [] },
          "options": { "legend": { "showLegend": true, "displayMode": "list", "placement": "bottom" }, "tooltip": { "mode": "multi" } }
        },
        {
          "type": "timeseries",
          "title": "distributor — 유입 (샘플/초)",
          "description": "- **역할**: distributor는 모든 쓰기가 처음 닿는 관문 — 시리즈마다 해시를 내 해시 링에서 담당 인제스터를 찾아 RF3로 복제 전송\n- **패널**: 관문이 받은 초당 샘플의 경위(time series)\n- **읽는 법**: Alloy 전송 처리량 합과 같아야 정상 — 유실 0의 교차 증거. 꺼지면 상류(수집·전송)가 멈춘 것",
          "datasource": { "type": "prometheus", "uid": "mimir" },
          "gridPos": { "h": 8, "w": 7, "x": 0, "y": 9 },
          "targets": [
            { "refId": "A", "expr": "sum(rate(cortex_distributor_received_samples_total[5m]))", "legendFormat": "유입" }
          ],
          "fieldConfig": { "defaults": { "unit": "short", "min": 0, "custom": { "fillOpacity": 10 } }, "overrides": [] },
          "options": { "legend": { "showLegend": false }, "tooltip": { "mode": "single" } }
        },
        {
          "type": "timeseries",
          "title": "ingester — 시리즈 보유·활성 vs 상한 300,000",
          "description": "- **역할**: ingester는 최근 약 2시간을 메모리에 드는 유일한 지점 — 시리즈 상한이 이 메모리 보유량에 걸린다\n- **패널**: 보유(memory_series) 파드별 세 선 — RF3 복제라 셋이 같아야 한다. 활성(최근 샘플이 온 것)은 max 한 선. 빨간 선 = 상한\n- **읽는 법**: 보유−활성 간격 = 잔존(샘플이 끊겼는데 자리 차지 — 라벨 변경 뒤 최대 두 절단 주기 약 4시간까지 정상). 세 선이 갈라지면 복제 이상",
          "datasource": { "type": "prometheus", "uid": "mimir" },
          "gridPos": { "h": 8, "w": 10, "x": 7, "y": 9 },
          "targets": [
            { "refId": "A", "expr": "cortex_ingester_memory_series", "legendFormat": "보유 {{pod}}" },
            { "refId": "B", "expr": "max(cortex_ingester_active_series)", "legendFormat": "활성 (최대)" }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short", "min": 0,
              "custom": { "fillOpacity": 5, "thresholdsStyle": { "mode": "line" } },
              "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null }, { "color": "red", "value": 300000 } ] }
            },
            "overrides": []
          },
          "options": { "legend": { "showLegend": true, "displayMode": "list", "placement": "bottom" }, "tooltip": { "mode": "multi" } }
        },
        {
          "type": "bargauge",
          "title": "Alloy 수집 — job별 생산 시리즈 (막대 전체 = 상한 300,000)",
          "description": "- **역할**: 타깃이 내놓는 시리즈 수를 수집기가 스크레이프마다 센다(scrape_samples_scraped) — 저장소를 훑지 않고 아는 방법\n- **패널**: 숫자 = 절대치, 막대 배경 전체 폭 = 상한 300,000 (bar gauge — 나란한 비교)\n- **읽는 법**: 누가 상한을 먹는지 — 상한 튜닝의 근거. k3s-server 하나가 절반 가까이",
          "datasource": { "type": "prometheus", "uid": "mimir" },
          "gridPos": { "h": 8, "w": 7, "x": 17, "y": 9 },
          "targets": [
            { "refId": "A", "expr": "topk(12, sum by (job) (scrape_samples_scraped))", "instant": true, "legendFormat": "{{job}}" }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "locale", "decimals": 0, "min": 0, "max": 300000,
              "color": { "mode": "fixed", "fixedColor": "blue" },
              "thresholds": { "mode": "absolute", "steps": [ { "color": "blue", "value": null } ] }
            },
            "overrides": []
          },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "orientation": "horizontal", "displayMode": "basic", "showUnfilled": true }
        },
        {
          "type": "row", "title": "읽기 — 답하는가: query-frontend → querier", "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 17 }, "panels": []
        },
        {
          "type": "timeseries",
          "title": "query-frontend — 조회 요청 (상태코드)",
          "description": "- **역할**: query-frontend는 조회의 입구 — 쿼리를 쪼개고 줄 세워 querier에게 나눠 준다\n- **패널**: 조회 API(route=prometheus_api.*) 요청의 초당 속도를 상태코드별로\n- **읽는 법**: 499 = 기다리다 취소(느림의 증상), 5xx = 고장. 이 대시보드의 패널 쿼리도 여기로 들어온다",
          "datasource": { "type": "prometheus", "uid": "mimir" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 18 },
          "targets": [
            { "refId": "A", "expr": "sum by (status_code) (rate(cortex_request_duration_seconds_count{job=\"observability/query-frontend\", route=~\"prometheus_api.*\"}[5m]))", "legendFormat": "{{status_code}}" }
          ],
          "fieldConfig": { "defaults": { "unit": "short", "min": 0, "custom": { "fillOpacity": 10 } }, "overrides": [] },
          "options": { "legend": { "showLegend": true, "displayMode": "list", "placement": "bottom" }, "tooltip": { "mode": "multi" } }
        },
        {
          "type": "timeseries",
          "title": "query-frontend — 조회 지연 p99",
          "description": "- **역할**: 조회 지연 히스토그램(_bucket)에서 백분위를 역산 — 100건 중 99건이 이 시간 안에 끝났다는 값\n- **패널**: 체감 속도의 경위(time series)\n- **읽는 법**: 오르면 화면이 먼저 느려진다. 최근 조회만 느리면 ingester 쪽, 과거 구간 조회가 느리면 store-gateway(MinIO) 쪽",
          "datasource": { "type": "prometheus", "uid": "mimir" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 18 },
          "targets": [
            { "refId": "A", "expr": "histogram_quantile(0.99, sum by (le) (rate(cortex_request_duration_seconds_bucket{job=\"observability/query-frontend\", route=~\"prometheus_api.*\"}[5m])))", "legendFormat": "p99" }
          ],
          "fieldConfig": { "defaults": { "unit": "s", "min": 0, "custom": { "fillOpacity": 10 } }, "overrides": [] },
          "options": { "legend": { "showLegend": false }, "tooltip": { "mode": "single" } }
        },
        {
          "type": "row", "title": "저장 여정·상태 — 내려가는가: ingester → MinIO / ring · 메모리", "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 26 }, "panels": []
        },
        {
          "type": "stat",
          "title": "ingester shipper — 마지막 블록 업로드 후 경과",
          "description": "- **역할**: ingester는 2시간마다 메모리 구간(head)을 블록으로 떠 MinIO에 올린다 — 그 업로드 담당이 shipper\n- **패널**: time() − 마지막 성공 시각 = 경과 초 (stat, 파드별)\n- **읽는 법**: 평시 2시간 미만. 4시간(빨강) = 공식 알림 기준 — 블록이 안 나가면 WAL 디스크만 차고, 끝은 쓰기 정지",
          "datasource": { "type": "prometheus", "uid": "mimir" },
          "gridPos": { "h": 8, "w": 5, "x": 0, "y": 27 },
          "targets": [
            { "refId": "A", "expr": "time() - cortex_ingester_shipper_last_successful_upload_timestamp_seconds", "legendFormat": "{{pod}}" }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null }, { "color": "yellow", "value": 10800 }, { "color": "red", "value": 14400 } ] }
            },
            "overrides": []
          },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "value", "graphMode": "none", "textMode": "value_and_name" }
        },
        {
          "type": "stat",
          "title": "compactor — 마지막 병합 성공 후 경과",
          "description": "- **역할**: RF3라 같은 구간 블록이 3벌 올라간다 — compactor가 MinIO에서 하나로 병합한다\n- **패널**: time() − 마지막 성공 시각 = 경과 초 (stat)\n- **읽는 법**: 24시간(빨강) = 공식 알림 기준. 멈추면 같은 데이터가 세 벌씩 쌓여 저장·조회 비용이 계속 는다",
          "datasource": { "type": "prometheus", "uid": "mimir" },
          "gridPos": { "h": 8, "w": 5, "x": 5, "y": 27 },
          "targets": [
            { "refId": "A", "expr": "time() - cortex_compactor_last_successful_run_timestamp_seconds", "legendFormat": "{{pod}}" }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null }, { "color": "yellow", "value": 43200 }, { "color": "red", "value": 86400 } ] }
            },
            "overrides": []
          },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "value", "graphMode": "none", "textMode": "value" }
        },
        {
          "type": "stat",
          "title": "ingester ring — ACTIVE 수",
          "description": "- **역할**: 해시 링은 인제스터들이 자기 위치를 등록한 원형 명단 — distributor가 여기서 담당자를 찾는다\n- **패널**: ACTIVE 상태 멤버 수. 링을 지켜보는 컴포넌트마다 각자 보고하므로 sum이 아니라 max로 센다\n- **읽는 법**: 3 = 초록. 하나 빠지면 쓰기 quorum(2/3)의 여유가 사라진 상태",
          "datasource": { "type": "prometheus", "uid": "mimir" },
          "gridPos": { "h": 8, "w": 4, "x": 10, "y": 27 },
          "targets": [
            { "refId": "A", "expr": "max(cortex_ring_members{name=\"ingester\", state=\"ACTIVE\"})", "legendFormat": "ACTIVE" }
          ],
          "fieldConfig": {
            "defaults": {
              "thresholds": { "mode": "absolute", "steps": [ { "color": "red", "value": null }, { "color": "green", "value": 3 } ] }
            },
            "overrides": []
          },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "value", "graphMode": "none", "textMode": "value" }
        },
        {
          "type": "timeseries",
          "title": "ingester — 메모리 vs limit 2Gi",
          "description": "- **역할**: 시리즈를 메모리에 드는 대가 — 시리즈당 실측 약 4.2KiB, 30만 만재 시 약 1.2GiB\n- **패널**: 실제 점유 메모리(RSS) 파드별 + limit 2Gi 빨간 선\n- **읽는 법**: 닿으면 OOMKilled — WAL 재생으로 복구되지만 그동안 조회가 빈다. 시리즈 상한(거절)이 이 OOM을 막는 가드레일",
          "datasource": { "type": "prometheus", "uid": "mimir" },
          "gridPos": { "h": 8, "w": 10, "x": 14, "y": 27 },
          "targets": [
            { "refId": "A", "expr": "process_resident_memory_bytes{job=\"observability/ingester\"}", "legendFormat": "{{pod}}" }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes", "min": 0,
              "custom": { "fillOpacity": 10, "thresholdsStyle": { "mode": "line" } },
              "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null }, { "color": "red", "value": 2147483648 } ] }
            },
            "overrides": []
          },
          "options": { "legend": { "showLegend": true, "displayMode": "list", "placement": "bottom" }, "tooltip": { "mode": "multi" } }
        }
      ]
    }
