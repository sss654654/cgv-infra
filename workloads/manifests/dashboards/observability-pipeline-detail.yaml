        {
          "type": "timeseries",
          "title": "재시작 — 언제 몇 번 죽었나",
          "description": "- **역할**: 저장소가 죽으면 그 신호가 통째로 끊긴다. 누적값은 총수만 말하고 언제인지를 말하지 않는다\n- **패널**: 5분 구간마다 늘어난 재시작 수. 죽지 않은 구간도 0으로 그린다 — 바닥에 0이 깔려 있으면 \"안 죽었다\", 화면이 비면 \"못 읽었다\"로 갈린다. 총수는 범례의 Sum\n- **읽는 법**: 1 이상이면 빨강. 막대가 계속 서 있으면 지금도 죽는 중이고, 오래전 한 번이면 그 시각에만 하나 서 있다\n- **그래서**: 막대가 선 시각을 오른쪽 기록에서 찾는다",
          "datasource": {
            "type": "prometheus",
            "uid": "mimir"
          },
          "gridPos": {
            "h": 9,
            "w": 7,
            "x": 8,
            "y": 44
