        {
          "type": "logs",
          "title": "죽음 기록 — 왜 죽었나",
          "description": "- **역할**: 왼쪽 막대가 선 그 순간에 쿠버네티스가 남긴 기록. 왜 죽었는지는 여기에만 있다\n- **패널**: 원문은 objectRV 같은 내부 값이 줄의 대부분이라 필요한 넷만 남겨 다시 썼다 — 대상 · 왜 · 몇 번째 · 무슨 일\n- **읽는 법**: `OOMKilling` = 메모리 상한 초과, 커널이 죽였다 · `Killing` = 프로브 실패로 kubelet이 죽였다 · `Unhealthy` = 프로브가 실패했지만 아직 안 죽인 상태 · `BackOff` = 재시작이 반복돼 간격을 벌리는 중. x 뒤의 수가 크면 오래 반복된 것이다\n- **그래서**: OOMKilling이면 왼쪽 메모리를 보고 limit을 올린다. Killing이면 프로브가 왜 안 답하는지를 본다 — 메모리가 상한에 붙으면 GC가 계속 돌아 응답이 늦어지고, 죽기 전에 프로브가 먼저 실패한다. 종료 코드는 둘 다 137이라 코드만으로는 안 갈린다",
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "gridPos": {
            "h": 9,
            "w": 9,
            "x": 15,
            "y": 44
