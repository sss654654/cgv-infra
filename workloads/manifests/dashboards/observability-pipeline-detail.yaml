              "expr": "{job=\"k8s-events\", namespace=\"observability\"} |~ \"name=(mimir-ingester|loki|tempo)-?[0-9]\" |~ \"reason=(OOMKilling|Killing|BackOff|Unhealthy|Failed|Evicted|FailedScheduling)\" | pattern \"name=<obj> <_> reason=<reason> <_> count=<count> msg=\\\"<msg>\\\"\" | line_format \"{{.obj}}   {{.reason}}   x{{.count}}   {{.msg}}\""
            }
