# 관측 파이프라인 대시보드 — 이 화면이 답하는 질문은 하나다.
#   "지금 다른 대시보드에 뜨는 값을 믿어도 되나"
# 앱을 보는 화면이 아니라 앱을 보는 눈이 살아 있는지를 보는 화면이다.
#
# 구성은 Mimir mixin(operations/mimir-mixin)의 Writes 대시보드 패턴을 따른다.
#   그쪽은 컴포넌트(distributor → ingester)마다 같은 세 패널을 반복한다.
#   흐름 순서가 곧 행 순서이고, 행마다 형태가 같아 위치만 보고 읽는다.
#   여기서는 컴포넌트 자리에 신호 셋(메트릭·로그·트레이스)을 넣는다 —
#   Mimir 하나를 깊게 보는 것이 목적이 아니라 셋 중 무엇이 끊겼는지가 목적이라서다.
#
#   행0 한눈             지금 이 스택이 얼마나 받고 있나. instant 값
#   행1 메트릭 → Mimir   보낸 양·실패 / 받는 데 걸린 시간 / 버려진 것
#   행2 로그 → Loki      같은 셋
#   행3 트레이스 → Tempo 같은 셋
#   행4 수집 → Alloy     대상이 살아 있나 · 값이 갱신되고 있나 · 긁는 데 걸린 시간
#   행5 저장소 자원·사건 메모리 / 재시작 / 죽음 기록
#   행6 더 깊이          접어 둔다
#
# 행1·2·3 이 같은 모양이라 한 행만 빨간 것이 한눈에 보인다.
# 각 행은 보내는 쪽(Alloy)과 받는 쪽(저장소)을 같이 둔다 — 저장소가 죽으면 받는 쪽
#   지표가 통째로 비는데, 그때도 보내는 쪽은 남아 무엇이 버려지는지 보인다.
#
# 패널 설명(ⓘ)은 역할 / 패널 / 읽는 법 / 그래서 무엇을 하나 네 줄이다.
# 쿼리는 저장소 전체를 훑지 않는 것만 쓴다(무거운 패널 쿼리가 30초마다 돌며 querier를 OOM시킨 전례).
apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-observability-pipeline-detail
  namespace: observability
  labels:
    grafana_dashboard: "1"
data:
  observability-pipeline-detail.json: |
    {
      "uid": "obs-pipeline-detail",
      "title": "관측 파이프라인",
      "editable": true,
      "timezone": "browser",
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "refresh": "30s",
      "schemaVersion": 39,
      "templating": {
        "list": []
      },
      "panels": [
        {
          "type": "row",
          "title": "0. 한눈 — 셋이 다 흐르고 있나",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "panels": []
        },
        {
          "type": "stat",
          "title": "메트릭 (샘플/초)",
          "description": "- **역할**: Alloy가 Mimir로 보내는 양. 이 스택이 지금 얼마나 큰지를 자릿수로 보여준다\n- **패널**: remote_write가 보낸 샘플의 초당 속도\n- **읽는 법**: 0이면 메트릭이 끊긴 것이다. 평소 값의 절반으로 떨어져도 어딘가 빠진 것이다\n- **그래서**: 아래 메트릭 행으로 내려간다",
          "datasource": {
            "type": "prometheus",
            "uid": "mimir"
          },
          "gridPos": {
            "h": 5,
            "w": 5,
            "x": 0,
            "y": 1
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate(prometheus_remote_storage_samples_total[5m]))"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          }
        },
        {
          "type": "stat",
          "title": "로그 (줄/초)",
          "description": "- **역할**: Alloy가 Loki로 보내는 양\n- **패널**: loki.write가 보낸 줄의 초당 속도\n- **읽는 법**: 0이면 로그가 끊긴 것이다\n- **그래서**: 아래 로그 행으로 내려간다",
          "datasource": {
            "type": "prometheus",
            "uid": "mimir"
          },
          "gridPos": {
            "h": 5,
            "w": 5,
            "x": 5,
            "y": 1
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate(loki_write_sent_entries_total[5m]))"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "decimals": 1,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 0.1
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          }
        },
        {
          "type": "stat",
          "title": "트레이스 (스팬/초)",
          "description": "- **역할**: Alloy가 Tempo로 보내는 양\n- **패널**: OTLP exporter가 보낸 스팬의 초당 속도\n- **읽는 법**: 앱마다 샘플링 비율이 달라 요청 수에 그대로 비례하지는 않는다 — booking 은 전 요청(1.0), queue 폴링은 0.01 이다. 0이면 앱이 안 보내거나 Tempo가 죽은 것이다\n- **그래서**: 아래 트레이스 행에서 버림과 한도를 본다",
          "datasource": {
            "type": "prometheus",
            "uid": "mimir"
          },
          "gridPos": {
            "h": 5,
            "w": 5,
            "x": 10,
            "y": 1
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate(otelcol_exporter_sent_spans_total[5m]))"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "decimals": 2,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 0.01
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          }
        },
        {
          "type": "stat",
          "title": "고유 시리즈 / 300,000",
          "description": "- **역할**: Mimir가 메모리에 들고 있는 시리즈 수. 상한에 닿으면 새 시리즈를 거절한다\n- **패널**: ingester 한 대가 보유한 수. 셋의 합이 아니다 — 복제 계수 3이라 합치면 세 배로 읽힌다\n- **읽는 법**: 240,000(80%)을 넘으면 대비할 시점이다\n- **그래서**: 접힌 행의 job별 막대에서 큰 것부터 줄인다",
          "datasource": {
            "type": "prometheus",
            "uid": "mimir"
          },
          "gridPos": {
            "h": 5,
            "w": 5,
            "x": 15,
            "y": 1
          },
          "targets": [
            {
              "refId": "A",
              "expr": "max(cortex_ingester_memory_series)"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "decimals": 0,
              "max": 300000,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 240000
                  },
                  {
                    "color": "red",
                    "value": 285000
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          }
        },
        {
          "type": "stat",
          "title": "수집 실패",
          "description": "- **역할**: Alloy 가 긁으러 갔다가 실패한 대상이 몇 개인가. 대상 수 자체(2026-08 기준 37)는 앱이 늘고 줄면 같이 바뀌어 판정 기준이 못 된다\n- **패널**: up == 0 인 job 의 개수. 0이면 초록, 1 이상이면 빨강\n- **읽는 법**: 0이 정상이다. 1이면 어딘가 한 곳을 못 긁고 있다는 뜻이고, 어느 것인지는 아래 수집 행의 표에서 up 열이 DOWN 인 줄을 찾으면 된다\n- **그래서**: 그 대상의 파드가 떠 있는지부터 본다. `kubectl get pods -n <ns>`",
          "datasource": {
            "type": "prometheus",
            "uid": "mimir"
          },
          "gridPos": {
            "h": 5,
            "w": 4,
            "x": 20,
            "y": 1
          },
          "targets": [
            {
              "refId": "A",
              "expr": "count(up == 0) or vector(0)"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "justifyMode": "center"
          }
        },
        {
          "type": "row",
          "title": "1. 메트릭 → Mimir",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 6
          },
          "panels": []
        },
        {
          "type": "timeseries",
          "title": "메트릭 — 보낸 양 · 실패 (초당)",
          "description": "- **역할**: 보내는 쪽(Alloy)에서 본 그림. 저장소가 죽어도 이 패널은 남는다\n- **패널**: remote_write가 보낸 샘플과 실패한 샘플. 실패는 채워서 그린다\n- **읽는 법**: 보낸 양이 0으로 떨어지면 Alloy가 못 보내는 것이고, 실패가 오르면 저장소가 안 받는 것이다\n- **그래서**: 오른쪽 지연과 버려진 것을 같이 본다",
          "datasource": {
            "type": "prometheus",
            "uid": "mimir"
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 0,
            "y": 7
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate(prometheus_remote_storage_samples_total[5m]))",
              "legendFormat": "보냄"
            },
            {
              "refId": "B",
              "expr": "sum(rate(prometheus_remote_storage_samples_failed_total[5m]))",
              "legendFormat": "실패"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "custom": {
                "fillOpacity": 10,
                "lineWidth": 2
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "실패"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "red"
                    }
                  },
                  {
                    "id": "custom.fillOpacity",
                    "value": 40
                  }
                ]
              }
            ]
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "mean",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "type": "timeseries",
          "title": "메트릭 — 받는 데 걸린 시간",
          "description": "- **역할**: Mimir가 쓰기 요청을 처리하는 데 걸리는 시간. 죽기 전에 여기가 먼저 오른다\n- **패널**: push 경로의 p99와 p50. 둘이 벌어지면 일부만 느린 것이다\n- **읽는 법**: p99가 오르는데 p50이 그대로면 소수의 요청만 밀린다 — 대개 특정 ingester 하나다. 둘 다 오르면 전체가 밀린다\n- **그래서**: 자원 행에서 그 저장소의 메모리를 본다. 상한에 붙으면 GC가 돌아 응답이 늦어진다",
          "datasource": {
            "type": "prometheus",
            "uid": "mimir"
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 8,
            "y": 7
          },
          "targets": [
            {
              "refId": "A",
              "expr": "histogram_quantile(0.99, sum by (le) (rate(cortex_request_duration_seconds_bucket{route=~\".*push.*\"}[5m])))",
              "legendFormat": "p99"
            },
            {
              "refId": "B",
              "expr": "histogram_quantile(0.50, sum by (le) (rate(cortex_request_duration_seconds_bucket{route=~\".*push.*\"}[5m])))",
              "legendFormat": "p50"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": {
                "fillOpacity": 0,
                "lineWidth": 2
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "mean",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "type": "timeseries",
          "title": "메트릭 — 버려진 것 · 전송 대기",
          "description": "- **역할**: 왼쪽 둘은 버려진 것이고 오른쪽 축 하나는 아직 안 보낸 것이다. 성격이 달라 축을 나눴다\n- **패널**: 사유별 초당 거절 수(왼쪽 축, 0이면 안 그림) + 전송 대기 샘플 수(오른쪽 축, 점선)\n- **읽는 법**: **전송 대기는 오류가 아니다.** Alloy 가 WAL 에서 읽어 아직 안 보낸 양이라 정상 동작에서도 수천 건이 늘 있다. 이 값이 계속 커지기만 하면 보내는 속도가 들어오는 속도를 못 따라가는 것이고, 일정하게 유지되면 정상이다. 거절은 0이 정상이다 — 거절 선이 하나라도 보이면 그만큼이 화면에서 사라진다\n- **그래서**: 거절이 있으면 사유를 본다. `per_user_series_limit` = 시리즈 상한 · `sample-out-of-order` = 같은 시리즈에 과거 시각 값 도착 · `rate_limited` = 초당 유입 상한",
          "datasource": {
            "type": "prometheus",
            "uid": "mimir"
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 16,
            "y": 7
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (reason) (rate(cortex_discarded_samples_total[5m])) > 0",
              "legendFormat": "거절 · {{reason}}"
            },
            {
              "refId": "B",
              "expr": "sum(prometheus_remote_storage_samples_pending)",
              "legendFormat": "전송 대기"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "min": 0,
              "custom": {
                "fillOpacity": 20,
                "lineWidth": 2
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "전송 대기"
                },
                "properties": [
                  {
                    "id": "custom.axisPlacement",
                    "value": "right"
                  },
                  {
                    "id": "custom.fillOpacity",
                    "value": 0
                  },
                  {
                    "id": "custom.lineStyle",
                    "value": {
                      "fill": "dash",
                      "dash": [
                        8,
                        8
                      ]
                    }
                  }
                ]
              }
            ]
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "mean",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "type": "row",
          "title": "2. 로그 → Loki",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 15
          },
          "panels": []
        },
        {
          "type": "timeseries",
          "title": "로그 — 보낸 양 · 버린 양 (초당)",
          "description": "- **역할**: 보내는 쪽(Alloy)에서 본 그림. 저장소가 죽어도 이 패널은 남는다\n- **패널**: loki.write가 보낸 줄과 버린 줄\n- **읽는 법**: 버린 양이 0이 아니면 재시도해도 안 되어 포기한 것이다\n- **그래서**: 오른쪽 지연과 버려진 것을 같이 본다",
          "datasource": {
            "type": "prometheus",
            "uid": "mimir"
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 0,
            "y": 16
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate(loki_write_sent_entries_total[5m]))",
              "legendFormat": "보냄"
            },
            {
              "refId": "B",
              "expr": "sum(rate(loki_write_dropped_entries_total[5m]))",
              "legendFormat": "버림"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "custom": {
                "fillOpacity": 10,
                "lineWidth": 2
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "버림"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "red"
                    }
                  },
                  {
                    "id": "custom.fillOpacity",
                    "value": 40
                  }
                ]
              }
            ]
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "mean",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "type": "timeseries",
          "title": "로그 — 받는 데 걸린 시간",
