# 관측 파이프라인 상세 대시보드 — 데이터가 흐르는 순서(수집→전송→쓰기→플러시→읽기, 공유 스토리지)대로
# 행을 배치한다. 행 하나씩 채워 넣으며 검증 중 — 현재 행1(수집)까지.
# 쿼리는 저장소 전체를 훑지 않는 것만 쓴다(무거운 패널 쿼리가 30초마다 돌며 querier를 OOM시킨 전례).
apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-observability-pipeline-detail
  namespace: observability
  labels:
    grafana_dashboard: "1"
data:
  observability-pipeline-detail.json: |
    {
      "uid": "obs-pipeline-detail",
      "title": "관측 파이프라인 — 상세",
      "editable": true,
      "timezone": "browser",
      "time": { "from": "now-3h", "to": "now" },
      "refresh": "",
      "schemaVersion": 39,
      "templating": {
        "list": [
          {
            "name": "limit",
            "label": "시리즈 상한",
            "type": "constant",
            "query": "300000",
            "current": { "text": "300000", "value": "300000" },
            "hide": 2
          }
        ]
      },
      "panels": [
        {
          "type": "row", "title": "행1 — 수집 (scrape): Alloy → 타깃", "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 }, "panels": []
        },
        {
          "type": "state-timeline",
          "title": "job별 생존 이력",
          "description": "min(up)이라 그 job의 타깃 중 하나라도 죽으면 줄이 빨개진다.",
          "datasource": { "type": "prometheus", "uid": "mimir" },
          "gridPos": { "h": 10, "w": 10, "x": 0, "y": 1 },
          "targets": [
            {
              "refId": "A",
              "expr": "min by (job) (up)",
              "legendFormat": "{{job}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": { "lineWidth": 0, "fillOpacity": 70 },
              "mappings": [
                { "type": "value", "options": { "1": { "text": "OK", "color": "green" }, "0": { "text": "DOWN", "color": "red" } } }
              ]
            },
            "overrides": []
          },
          "options": {
            "mergeValues": true,
            "showValue": "never",
            "rowHeight": 0.8,
            "legend": { "showLegend": false },
            "tooltip": { "mode": "single" }
          }
        },
        {
          "type": "table",
          "title": "지금 죽은 타깃",
          "description": "비어 있는 것이 정상. 값이 뜨면 그 이름이 곧 조치 대상이다.",
          "datasource": { "type": "prometheus", "uid": "mimir" },
          "gridPos": { "h": 10, "w": 6, "x": 10, "y": 1 },
          "targets": [
            {
              "refId": "A",
              "expr": "up == 0",
              "instant": true,
              "format": "table"
            }
          ],
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": { "Time": true, "Value": true, "__name__": true, "container": true, "endpoint": true, "namespace": true, "service": true },
                "renameByName": { "job": "job", "instance": "주소", "pod": "파드" }
              }
            }
          ],
          "options": { "showHeader": true },
          "fieldConfig": { "defaults": {}, "overrides": [] }
        },
        {
          "type": "stat",
          "title": "Alloy 분담 — 동료 수",
          "description": "셋 다 3이어야 한다. 2가 되면 타깃 분배가 재편되는 중이거나 분열 — 사본·구멍이 생기는 조건.",
          "datasource": { "type": "prometheus", "uid": "mimir" },
          "gridPos": { "h": 4, "w": 8, "x": 16, "y": 1 },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (pod) (cluster_node_peers)",
              "legendFormat": "{{pod}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "green", "value": 3 }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"] },
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "value_and_name"
          }
        },
        {
          "type": "bargauge",
          "title": "job별 생산 시리즈 — 막대 배경 전체 = 상한 300,000",
          "description": "숫자는 그 job의 생산 시리즈 수, 막대 길이는 상한 300,000 대비 그 job의 위치. job 간 비율도 막대끼리 그대로 비교된다. 총합 대 상한은 쓰기 경로 행이 저장량 기준으로 본다. 상한을 바꾸면 이 패널의 max도 같이 고친다.",
          "datasource": { "type": "prometheus", "uid": "mimir" },
          "gridPos": { "h": 6, "w": 8, "x": 16, "y": 5 },
          "targets": [
            {
              "refId": "A",
              "expr": "topk(12, sum by (job) (scrape_samples_scraped))",
              "instant": true,
              "legendFormat": "{{job}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "locale",
              "decimals": 0,
              "min": 0,
              "max": 300000,
              "color": { "mode": "fixed", "fixedColor": "blue" },
              "thresholds": { "mode": "absolute", "steps": [ { "color": "blue", "value": null } ] }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"] },
            "orientation": "horizontal",
            "displayMode": "basic",
            "showUnfilled": true
          }
        },
        {
          "type": "row", "title": "행2 — 전송 (remote_write): Alloy → Mimir", "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 11 }, "panels": []
        },
        {
          "type": "timeseries",
          "title": "전송 실패 · 재시도 (샘플/초)",
          "description": "실패 = 재시도 없이 버려진 샘플(4xx 거절 포함) — 곧 유실. 재시도 = 일시 오류(5xx·네트워크)로 다시 보내는 중. 둘 다 0이 정상.",
          "datasource": { "type": "prometheus", "uid": "mimir" },
          "gridPos": { "h": 8, "w": 8, "x": 0, "y": 12 },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (pod) (rate(prometheus_remote_storage_samples_failed_total[5m]))",
              "legendFormat": "실패 {{pod}}"
            },
            {
              "refId": "B",
              "expr": "sum by (pod) (rate(prometheus_remote_storage_samples_retried_total[5m]))",
              "legendFormat": "재시도 {{pod}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "min": 0,
              "custom": { "fillOpacity": 10 }
            },
            "overrides": []
          },
          "options": {
            "legend": { "showLegend": true, "displayMode": "list", "placement": "bottom" },
            "tooltip": { "mode": "multi" }
          }
        },
        {
          "type": "timeseries",
          "title": "전송 지연 (수집 시각 − 전송 완료 시각)",
          "description": "WAL에 적힌 최신 샘플 시각과 Mimir로 전송 완료된 최신 샘플 시각의 차. 평시 0–10초(전송 배치 주기). 계속 커지면 전송이 생산을 못 따라가는 것 — 120초 선은 prometheus-mixin의 밀림(RemoteWriteBehind) 알림 기준.",
          "datasource": { "type": "prometheus", "uid": "mimir" },
          "gridPos": { "h": 8, "w": 8, "x": 8, "y": 12 },
          "targets": [
            {
              "refId": "A",
              "expr": "prometheus_remote_storage_highest_timestamp_in_seconds - ignoring(remote_name, url) group_right prometheus_remote_storage_queue_highest_sent_timestamp_seconds",
              "legendFormat": "{{pod}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "min": 0,
              "custom": {
                "fillOpacity": 10,
                "thresholdsStyle": { "mode": "line" }
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "red", "value": 120 }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "legend": { "showLegend": true, "displayMode": "list", "placement": "bottom" },
            "tooltip": { "mode": "multi" }
          }
        },
        {
          "type": "timeseries",
          "title": "전송 처리량 (샘플/초)",
          "description": "Alloy별로 Mimir에 보내는 샘플 속도. 한 선이 꺼지면 그 Alloy의 수집·전송이 멈춘 것 — 수집 행의 동료 수 패널과 같이 본다.",
          "datasource": { "type": "prometheus", "uid": "mimir" },
          "gridPos": { "h": 8, "w": 8, "x": 16, "y": 12 },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (pod) (rate(prometheus_remote_storage_samples_total[5m]))",
              "legendFormat": "{{pod}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "min": 0,
              "custom": { "fillOpacity": 10 }
            },
            "overrides": []
          },
          "options": {
            "legend": { "showLegend": true, "displayMode": "list", "placement": "bottom" },
            "tooltip": { "mode": "multi" }
          }
        },
        {
          "type": "row", "title": "행3 — 쓰기 경로: distributor · ingester", "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 20 }, "panels": []
        },
        {
          "type": "timeseries",
          "title": "거절 (샘플/초, 사유별)",
          "description": "저장소가 받기를 거부한 샘플. 0이 정상. per_user_series_limit = 시리즈 상한 도달 — 새 시리즈만 선착순으로 밀려난다.",
          "datasource": { "type": "prometheus", "uid": "mimir" },
          "gridPos": { "h": 8, "w": 8, "x": 0, "y": 21 },
          "targets": [
            { "refId": "A", "expr": "sum by (reason) (rate(cortex_discarded_samples_total[5m]))", "legendFormat": "{{reason}}" }
          ],
          "fieldConfig": { "defaults": { "unit": "short", "min": 0, "custom": { "fillOpacity": 10 } }, "overrides": [] },
          "options": { "legend": { "showLegend": true, "displayMode": "list", "placement": "bottom" }, "tooltip": { "mode": "multi" } }
        },
        {
          "type": "timeseries",
          "title": "시리즈 보유·활성 vs 상한 300,000",
          "description": "보유(memory_series) = 메모리에 든 것 — 상한이 세는 대상. 활성(active) = 최근 샘플이 온 것. 둘의 간격 = 샘플이 끊겼는데 자리를 잡고 있는 잔존 — 라벨을 바꾸면 최대 두 절단 주기(약 4시간) 동안 벌어진다.",
          "datasource": { "type": "prometheus", "uid": "mimir" },
          "gridPos": { "h": 8, "w": 10, "x": 8, "y": 21 },
          "targets": [
            { "refId": "A", "expr": "cortex_ingester_memory_series", "legendFormat": "보유 {{pod}}" },
            { "refId": "B", "expr": "max(cortex_ingester_active_series)", "legendFormat": "활성 (최대)" }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short", "min": 0,
              "custom": { "fillOpacity": 5, "thresholdsStyle": { "mode": "line" } },
              "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null }, { "color": "red", "value": 300000 } ] }
            },
            "overrides": []
          },
          "options": { "legend": { "showLegend": true, "displayMode": "list", "placement": "bottom" }, "tooltip": { "mode": "multi" } }
        },
        {
          "type": "stat",
          "title": "링 ACTIVE 인제스터",
          "description": "해시 링에 ACTIVE로 등록된 인제스터 수. 3이어야 한다 — 하나가 빠지면 쓰기 quorum(2/3)의 여유가 사라진 상태다.",
          "datasource": { "type": "prometheus", "uid": "mimir" },
          "gridPos": { "h": 8, "w": 6, "x": 18, "y": 21 },
          "targets": [
            { "refId": "A", "expr": "max(cortex_ring_members{name=\"ingester\", state=\"ACTIVE\"})", "legendFormat": "ACTIVE" }
          ],
          "fieldConfig": {
            "defaults": {
              "thresholds": { "mode": "absolute", "steps": [ { "color": "red", "value": null }, { "color": "green", "value": 3 } ] }
            },
            "overrides": []
          },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "value", "graphMode": "none", "textMode": "value" }
        },
        {
          "type": "timeseries",
          "title": "쓰기 요청 (route · 상태코드)",
          "description": "api_v1_push = 게이트웨이→distributor(HTTP), /cortex.Ingester/Push = distributor→인제스터(gRPC). 400·FailedPrecondition 상승 = 거절 재개, 5xx = 컴포넌트 고장.",
          "datasource": { "type": "prometheus", "uid": "mimir" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 29 },
          "targets": [
            { "refId": "A", "expr": "sum by (route, status_code) (rate(cortex_request_duration_seconds_count{route=~\"api_v1_push|/cortex.Ingester/Push\"}[5m]))", "legendFormat": "{{route}} · {{status_code}}" }
          ],
          "fieldConfig": { "defaults": { "unit": "short", "min": 0, "custom": { "fillOpacity": 10 } }, "overrides": [] },
          "options": { "legend": { "showLegend": true, "displayMode": "list", "placement": "bottom" }, "tooltip": { "mode": "multi" } }
        },
        {
          "type": "timeseries",
          "title": "인제스터 메모리 vs limit 2Gi",
          "description": "시리즈를 메모리에 드는 컴포넌트 — 시리즈당 실측 약 4.2KiB, 30만을 다 채우면 약 1.2GiB. 이 선이 limit에 닿으면 OOMKilled로 최근 구간을 잃는다(WAL 재생으로 복구되지만 그동안 조회 불가).",
          "datasource": { "type": "prometheus", "uid": "mimir" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 29 },
          "targets": [
            { "refId": "A", "expr": "process_resident_memory_bytes{job=\"observability/ingester\"}", "legendFormat": "{{pod}}" }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes", "min": 0,
              "custom": { "fillOpacity": 10, "thresholdsStyle": { "mode": "line" } },
              "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null }, { "color": "red", "value": 2147483648 } ] }
            },
            "overrides": []
          },
          "options": { "legend": { "showLegend": true, "displayMode": "list", "placement": "bottom" }, "tooltip": { "mode": "multi" } }
        },
        {
          "type": "row", "title": "행4 — 플러시: ingester → MinIO (블록 · 컴팩터 · WAL)", "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 37 }, "panels": []
        },
        {
          "type": "stat",
          "title": "마지막 블록 업로드 후 경과",
          "description": "인제스터가 MinIO에 블록을 마지막으로 올린 뒤 지난 시간. 2시간 주기라 평시 2시간 미만. 4시간(빨강) = 블록이 안 나가 로컬 디스크만 차는 중 — 공식 알림 기준.",
          "datasource": { "type": "prometheus", "uid": "mimir" },
          "gridPos": { "h": 8, "w": 6, "x": 0, "y": 38 },
          "targets": [
            { "refId": "A", "expr": "time() - cortex_ingester_shipper_last_successful_upload_timestamp_seconds", "legendFormat": "{{pod}}" }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null }, { "color": "yellow", "value": 10800 }, { "color": "red", "value": 14400 } ] }
            },
            "overrides": []
          },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "value", "graphMode": "none", "textMode": "value_and_name" }
        },
        {
          "type": "stat",
          "title": "컴팩터 마지막 성공 후 경과",
          "description": "RF3라 같은 구간의 블록이 3벌 올라간다 — 컴팩터가 병합해 하나로 줄인다. 멈추면 저장 공간과 조회 비용이 계속 는다. 24시간(빨강) = 공식 알림 기준.",
          "datasource": { "type": "prometheus", "uid": "mimir" },
          "gridPos": { "h": 8, "w": 5, "x": 6, "y": 38 },
          "targets": [
            { "refId": "A", "expr": "time() - cortex_compactor_last_successful_run_timestamp_seconds", "legendFormat": "{{pod}}" }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null }, { "color": "yellow", "value": 43200 }, { "color": "red", "value": 86400 } ] }
            },
            "overrides": []
          },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "value", "graphMode": "none", "textMode": "value" }
        },
        {
          "type": "timeseries",
          "title": "head 압축 (1시간 증가분)",
          "description": "메모리(head)를 블록으로 뜨는 동작 — 2시간마다 1씩 뛰는 게 정상 리듬. 시리즈 제거(head 절단)도 이 주기에 묶여 돈다. 실패는 0이어야 한다.",
          "datasource": { "type": "prometheus", "uid": "mimir" },
          "gridPos": { "h": 8, "w": 6, "x": 11, "y": 38 },
          "targets": [
            { "refId": "A", "expr": "sum by (pod) (increase(cortex_ingester_tsdb_compactions_total[1h]))", "legendFormat": "{{pod}}" },
            { "refId": "B", "expr": "sum(increase(cortex_ingester_tsdb_compactions_failed_total[1h]))", "legendFormat": "실패" }
          ],
          "fieldConfig": { "defaults": { "unit": "short", "min": 0, "custom": { "fillOpacity": 10 } }, "overrides": [] },
          "options": { "legend": { "showLegend": true, "displayMode": "list", "placement": "bottom" }, "tooltip": { "mode": "multi" } }
        },
        {
          "type": "timeseries",
          "title": "WAL 이상 (손상 · 절단 실패)",
          "description": "0이 정상. 손상 = 재시작 시 그 구간을 복구 못 한다 — 복제(RF3)가 남은 두 대로 메우는 상황. 단일 USB SSD라 디스크 이상의 조기 신호이기도 하다.",
          "datasource": { "type": "prometheus", "uid": "mimir" },
          "gridPos": { "h": 8, "w": 7, "x": 17, "y": 38 },
          "targets": [
            { "refId": "A", "expr": "sum(rate(cortex_ingester_tsdb_wal_corruptions_total[5m]))", "legendFormat": "손상" },
            { "refId": "B", "expr": "sum(rate(cortex_ingester_tsdb_wal_truncations_failed_total[5m]))", "legendFormat": "절단 실패" }
          ],
          "fieldConfig": { "defaults": { "unit": "short", "min": 0, "custom": { "fillOpacity": 10 } }, "overrides": [] },
          "options": { "legend": { "showLegend": true, "displayMode": "list", "placement": "bottom" }, "tooltip": { "mode": "multi" } }
        },
        {
          "type": "row", "title": "행5 — 읽기 경로: query-frontend · querier · store-gateway", "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 46 }, "panels": []
        },
        {
          "type": "timeseries",
          "title": "조회 요청 (상태코드)",
          "description": "조회 입구(query-frontend)의 응답 분포. 499 = 기다리다 취소된 것(느림의 증상), 5xx = 고장. 계기판 자신의 쿼리도 여기로 들어온다.",
          "datasource": { "type": "prometheus", "uid": "mimir" },
          "gridPos": { "h": 8, "w": 6, "x": 0, "y": 47 },
          "targets": [
