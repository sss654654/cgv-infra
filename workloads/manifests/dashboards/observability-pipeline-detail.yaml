# 관측 파이프라인 상세 대시보드 — 데이터가 흐르는 순서(수집→전송→쓰기→플러시→읽기, 공유 스토리지)대로
# 행을 배치한다. 행 하나씩 채워 넣으며 검증 중 — 현재 행1(수집)까지.
# 쿼리는 저장소 전체를 훑지 않는 것만 쓴다(무거운 패널 쿼리가 30초마다 돌며 querier를 OOM시킨 전례).
apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-observability-pipeline-detail
  namespace: observability
  labels:
    grafana_dashboard: "1"
data:
  observability-pipeline-detail.json: |
    {
      "uid": "obs-pipeline-detail",
      "title": "관측 파이프라인 — 상세",
      "editable": true,
      "timezone": "browser",
      "time": { "from": "now-3h", "to": "now" },
      "refresh": "",
      "schemaVersion": 39,
      "templating": {
        "list": [
          {
            "name": "limit",
            "label": "시리즈 상한",
            "type": "constant",
            "query": "300000",
            "current": { "text": "300000", "value": "300000" },
            "hide": 2
          }
        ]
      },
      "panels": [
        {
          "type": "row", "title": "행1 — 수집 (scrape): Alloy → 타깃", "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 }, "panels": []
        },
        {
          "type": "state-timeline",
          "title": "job별 생존 이력",
          "description": "min(up)이라 그 job의 타깃 중 하나라도 죽으면 줄이 빨개진다.",
          "datasource": { "type": "prometheus", "uid": "mimir" },
          "gridPos": { "h": 10, "w": 10, "x": 0, "y": 1 },
          "targets": [
            {
              "refId": "A",
              "expr": "min by (job) (up)",
              "legendFormat": "{{job}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": { "lineWidth": 0, "fillOpacity": 70 },
              "mappings": [
                { "type": "value", "options": { "1": { "text": "OK", "color": "green" }, "0": { "text": "DOWN", "color": "red" } } }
              ]
            },
            "overrides": []
          },
          "options": {
            "mergeValues": true,
            "showValue": "never",
            "rowHeight": 0.8,
            "legend": { "showLegend": false },
            "tooltip": { "mode": "single" }
          }
        },
        {
          "type": "table",
          "title": "지금 죽은 타깃",
          "description": "비어 있는 것이 정상. 값이 뜨면 그 이름이 곧 조치 대상이다.",
          "datasource": { "type": "prometheus", "uid": "mimir" },
          "gridPos": { "h": 10, "w": 6, "x": 10, "y": 1 },
          "targets": [
            {
              "refId": "A",
              "expr": "up == 0",
              "instant": true,
              "format": "table"
            }
          ],
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": { "Time": true, "Value": true, "__name__": true, "container": true, "endpoint": true, "namespace": true, "service": true },
                "renameByName": { "job": "job", "instance": "주소", "pod": "파드" }
              }
            }
          ],
          "options": { "showHeader": true },
          "fieldConfig": { "defaults": {}, "overrides": [] }
        },
        {
          "type": "stat",
          "title": "Alloy 분담 — 동료 수",
          "description": "셋 다 3이어야 한다. 2가 되면 타깃 분배가 재편되는 중이거나 분열 — 사본·구멍이 생기는 조건.",
          "datasource": { "type": "prometheus", "uid": "mimir" },
          "gridPos": { "h": 4, "w": 8, "x": 16, "y": 1 },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (pod) (cluster_node_peers)",
              "legendFormat": "{{pod}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "green", "value": 3 }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"] },
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "value_and_name"
          }
        },
        {
          "type": "bargauge",
          "title": "job별 생산 시리즈 — 막대 배경 전체 = 상한 300,000",
          "description": "숫자는 그 job의 생산 시리즈 수, 막대 길이는 상한 300,000 대비 그 job의 위치. job 간 비율도 막대끼리 그대로 비교된다. 총합 대 상한은 쓰기 경로 행이 저장량 기준으로 본다. 상한을 바꾸면 이 패널의 max도 같이 고친다.",
          "datasource": { "type": "prometheus", "uid": "mimir" },
          "gridPos": { "h": 6, "w": 8, "x": 16, "y": 5 },
          "targets": [
            {
              "refId": "A",
              "expr": "topk(12, sum by (job) (scrape_samples_scraped))",
              "instant": true,
              "legendFormat": "{{job}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "locale",
              "decimals": 0,
              "min": 0,
              "max": 300000,
              "color": { "mode": "fixed", "fixedColor": "blue" },
              "thresholds": { "mode": "absolute", "steps": [ { "color": "blue", "value": null } ] }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"] },
            "orientation": "horizontal",
            "displayMode": "basic",
            "showUnfilled": true
          }
        },
        {
          "type": "row", "title": "행2 — 전송 (remote_write): Alloy → Mimir", "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 11 }, "panels": []
        },
        {
          "type": "timeseries",
          "title": "전송 실패 · 재시도 (샘플/초)",
          "description": "실패 = 재시도 없이 버려진 샘플(4xx 거절 포함) — 곧 유실. 재시도 = 일시 오류(5xx·네트워크)로 다시 보내는 중. 둘 다 0이 정상.",
          "datasource": { "type": "prometheus", "uid": "mimir" },
          "gridPos": { "h": 8, "w": 8, "x": 0, "y": 12 },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (pod) (rate(prometheus_remote_storage_samples_failed_total[5m]))",
              "legendFormat": "실패 {{pod}}"
            },
            {
              "refId": "B",
              "expr": "sum by (pod) (rate(prometheus_remote_storage_samples_retried_total[5m]))",
              "legendFormat": "재시도 {{pod}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "min": 0,
              "custom": { "fillOpacity": 10 }
            },
            "overrides": []
          },
          "options": {
            "legend": { "showLegend": true, "displayMode": "list", "placement": "bottom" },
            "tooltip": { "mode": "multi" }
          }
        },
        {
          "type": "timeseries",
          "title": "전송 지연 (수집 시각 − 전송 완료 시각)",
          "description": "WAL에 적힌 최신 샘플 시각과 Mimir로 전송 완료된 최신 샘플 시각의 차. 평시 0–10초(전송 배치 주기). 계속 커지면 전송이 생산을 못 따라가는 것 — 120초 선은 prometheus-mixin의 밀림(RemoteWriteBehind) 알림 기준.",
          "datasource": { "type": "prometheus", "uid": "mimir" },
          "gridPos": { "h": 8, "w": 8, "x": 8, "y": 12 },
          "targets": [
            {
              "refId": "A",
              "expr": "prometheus_remote_storage_highest_timestamp_in_seconds - ignoring(remote_name, url) group_right prometheus_remote_storage_queue_highest_sent_timestamp_seconds",
              "legendFormat": "{{pod}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "min": 0,
              "custom": {
                "fillOpacity": 10,
                "thresholdsStyle": { "mode": "line" }
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "red", "value": 120 }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "legend": { "showLegend": true, "displayMode": "list", "placement": "bottom" },
            "tooltip": { "mode": "multi" }
          }
        },
        {
          "type": "timeseries",
          "title": "전송 처리량 (샘플/초)",
          "description": "Alloy별로 Mimir에 보내는 샘플 속도. 한 선이 꺼지면 그 Alloy의 수집·전송이 멈춘 것 — 수집 행의 동료 수 패널과 같이 본다.",
          "datasource": { "type": "prometheus", "uid": "mimir" },
          "gridPos": { "h": 8, "w": 8, "x": 16, "y": 12 },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (pod) (rate(prometheus_remote_storage_samples_total[5m]))",
              "legendFormat": "{{pod}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "min": 0,
              "custom": { "fillOpacity": 10 }
            },
            "overrides": []
          },
          "options": {
            "legend": { "showLegend": true, "displayMode": "list", "placement": "bottom" },
            "tooltip": { "mode": "multi" }
          }
        },
        {
          "type": "row", "title": "행3 — 쓰기 경로: distributor · ingester", "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 20 }, "panels": []
        },
        {
          "type": "row", "title": "행4 — 플러시: ingester → MinIO (블록 · 컴팩터 · WAL)", "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 21 }, "panels": []
        },
        {
          "type": "row", "title": "행5 — 읽기 경로: query-frontend · querier · store-gateway", "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 22 }, "panels": []
        },
        {
          "type": "row", "title": "행6 — 공유 스토리지: MinIO · WAL 디스크", "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 23 }, "panels": []
        }
      ]
    }
