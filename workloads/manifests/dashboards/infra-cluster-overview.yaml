        {
          "type": "table",
          "title": "선언 — 스케줄러 기준",
          "description": "#### 새 파드가 붙을 자리가 있나\n\n**스케줄러는 실사용을 보지 않고 requests 만 본다.**\n\n```\nallocatable   4.96 GiB = 전체 RAM 7.76 − 예약 2.5 − eviction 임계 0.29\nrequests      파드들이 선언한 예약의 합\n스케줄 여유    allocatable − requests.  0 이면 그 노드엔 못 붙는다\n```\n\nPending 파드가 생기면 여기를 본다. **limit 을 올려도 이 값은 안 움직인다.**\n\n이 표는 실사용을 한 칸도 쓰지 않는다. 오른쪽 실사용 표와 기준이 달라 두 표로 나눠 두었다 — allocatable 4.96 은 스케줄러만 쓰는 값이고, 커널이 강제하는 선은 그것과 다른 5.26(`memory.max`)이다.\n\nlimits 합은 두지 않는다 — 노드 단위 합은 오버커밋이라는 사실만 알려 주고, 개별 컨테이너가 limit 에 닿는 것은 행4 에서 잡는다.",
