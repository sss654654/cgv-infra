        {
          "type": "table",
          "title": "스펙 장부 — CPU (컨테이너 전수, millicore)",
          "description": "#### 선언한 CPU 가 실사용과 맞나\n\n읽는 법은 위 메모리 장부와 같다 — 빨강 = 사용이 req 초과, 파랑 = req 의 절반도 안 씀.\n\n**뜻은 메모리와 다르다.** CPU 는 req 를 넘어도 죽지 않는다.\n\n```\n빨강 (사용 > req)   노드 CPU 가 경합할 때 req 비율만큼만 보장받는다 — 지금처럼\n                   한가할 땐 차이가 없고, 부하 판에서 느려지는 원인이 된다\n파랑 (req 과대)    행2 스케줄 여유가 줄어든다.  메모리와 같은 회수 후보\nlimit             넘으려는 순간마다 잘리는 선\n스로틀 비율        잘림의 커널 실측.  주황(5% 초과)이면 limit 이 일 패턴에 비해\n                  낮다는 뜻 — 사고는 아니고, limit 값을 다듬을 때 보는 재료\n```\n\n주의 — 사용은 유휴값이다. 확정은 부하 계단에서 한다.",
          "datasource": {
            "type": "prometheus",
            "uid": "mimir"
          },
          "gridPos": {
            "h": 11,
            "w": 24,
            "x": 0,
            "y": 94
          },
          "targets": [
            {
              "refId": "A",
              "expr": "label_join((max by (node, namespace, pod, container) (kube_pod_container_resource_requests{resource=\"cpu\"}) * 1000), \"위치\", \"   \", \"node\", \"namespace\", \"pod\", \"container\")",
              "format": "table",
              "instant": true
            },
            {
              "refId": "B",
              "expr": "label_join((max by (node, namespace, pod, container) (rate(container_cpu_usage_seconds_total{container!=\"\", pod!=\"\"}[5m])) * 1000) * on(namespace, pod) group_left(qos_class) max by (namespace, pod, qos_class) (kube_pod_status_qos_class == 1), \"위치\", \"   \", \"node\", \"namespace\", \"pod\", \"container\")",
              "format": "table",
              "instant": true
            },
            {
              "refId": "C",
              "expr": "label_join((max by (node, namespace, pod, container) (rate(container_cpu_usage_seconds_total{container!=\"\", pod!=\"\"}[5m])) / on(node, namespace, pod, container) max by (node, namespace, pod, container) (kube_pod_container_resource_requests{resource=\"cpu\"}) * 100), \"위치\", \"   \", \"node\", \"namespace\", \"pod\", \"container\")",
              "format": "table",
              "instant": true
            },
            {
              "refId": "D",
              "expr": "label_join((max by (node, namespace, pod, container) (kube_pod_container_resource_limits{resource=\"cpu\"}) * 1000), \"위치\", \"   \", \"node\", \"namespace\", \"pod\", \"container\")",
