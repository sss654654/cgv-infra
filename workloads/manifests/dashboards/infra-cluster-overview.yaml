          "description": "#### 오래 두고 반복해서 죽은 것이 있나\n\n지금 살아 있는 컨테이너 중 **재시작 횟수가 가장 많은 것의 횟수**다. 왼쪽 `재시작 burst` 는 10분 안에 몰린 것만 세므로, 며칠에 걸쳐 조금씩 쌓인 것은 그쪽에 안 잡힌다.\n\n2026-08-21 실측 — frontend 11회 · loki 31회 · minio 31회 · strimzi-operator 33회. 전부 burst 가 아니라 누적이라 다른 패널에는 하나도 안 보였다.\n\n**0 이 아닌 것 자체는 정상일 수 있다.** 클러스터를 껐다 켠 횟수만큼 오르기 때문이다. 보는 법은 절대값이 아니라 **같은 기간 다른 파드와의 격차**다 — 혼자 튀면 그 파드만 반복해서 죽는 이유가 있다.\n\n어느 파드인지: `kubectl get pods -A --sort-by=.status.containerStatuses[0].restartCount`\n왜 죽었는지: 그 파드의 이전 컨테이너 로그(`--previous`)",
