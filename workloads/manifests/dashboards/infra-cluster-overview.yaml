          "type": "table",
          "title": "실사용 — 커널 기준",
          "description": "#### 얼마나 더 쓸 수 있고 어디서 먼저 막히나\n\n**kubelet 이 물리 메모리를 두 몫으로 갈라 놓았다. 파드는 파드 몫 안에서만 쓴다.**\n\n```\n물리 7.76 = 파드 자리 5.26 (memory.max) + 시스템 자리 2.5 (예약)\n```\n\n```\n파드 사용    파드 자리를 얼마나 채웠나.  꽉 차면 cgroup OOM\n시스템 사용   루트 − 파드.  k3s.service 가 대부분이다\n노드 여유    파드 여유 + 시스템 여유\n파드 여유    기존 파드가 더 쓸 수 있는 양   ← 커널이 강제하는 한계\n시스템 여유   비어 있어도 파드는 못 쓰는 자리.  크면 회수 후보\n```\n\n**여섯 열이 전부 cgroup 기준(cAdvisor working_set)이다.** 노드 전체는 `{id=\"/\"}`, 파드 전부는 `{id=\"/kubepods.slice\"}`, 시스템은 그 차이다. 기준이 같아야 뺄셈이 성립한다 — MemAvailable 은 페이지 캐시를 여유로 세고 working_set 은 active 캐시를 사용으로 세어, 섞으면 그 몫이 두 번 빠진다.\n\n**파드 여유의 기준은 5.26(`memory.max`)이지 4.96(allocatable)이 아니다.** 커널이 OOM 을 판정할 때 견주는 선이 앞의 값이다. 새 파드를 앉힐 자리는 왼쪽 표의 스케줄 여유가 답한다.\n\n`/system.slice` 에는 상한이 없다. 시스템 사용이 예약 2.5 를 넘어가도 막는 것이 없고, 넘으면 노드 여유가 줄어 행0 `eviction 임박 노드` 에 먼저 잡힌다.",
