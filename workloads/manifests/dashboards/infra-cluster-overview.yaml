          "description": "#### 무엇이 언제 비정상이었나 (회복한 것 포함)\n\n지금 정상이어도 시간 범위 안에 한 번이라도 Ready=false 였으면 줄이 남는다.\n\n```\n지금        비어 있으면 회복한 것\n마지막 발화  마지막으로 비정상이던 시각\n이유        그때 쿠버네티스가 붙인 이름\n              CrashLoopBackOff · ImagePullBackOff   컨테이너가 못 뜨는 이유\n              ContainerCreating                     배포 중이던 것 — 사고 아님\n              Evicted                               노드 여유 부족으로 내보내진 것 → 행1 노드 여유\n```\n\n이유가 비어 있으면 probe 실패처럼 상태 이름이 안 붙는 유형이다 — 파드 이름을 눌러 이벤트를 본다.\n\n**파드 이름을 누르면 그 파드의 쿠버네티스 이벤트 / 컨테이너 로그가 열린다** (Loki, 새 탭, 대시보드와 같은 시간 범위). 이벤트에는 probe 실패 메시지 · OOMKilling · BackOff 같은 원인이 남아 있다.",
