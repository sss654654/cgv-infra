          "description": "#### 자리가 없어 못 붙은 파드가 있나\n\n0 이 아니면 **어느 노드에도 requests 만큼의 자리가 없다.**\n\n```\n어느 파드인지   → 아래 비정상 흔적 표 (Pending 도 Ready=false 라 이름이 남는다)\n왜 없는지      → 행1 스케줄 여유.  0 에 가까운 노드가 원인이다\n누가 자리를    → 행5 스펙 장부.  격차가 큰 컨테이너가 자리를 잡고 안 쓰는 것이다\n```\n\n주의 — **limit 을 올려도 이 값은 안 움직인다.** 스케줄러는 requests 만 본다.",
