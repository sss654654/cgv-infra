          "description": "#### 얼마나 쓰고 어디에 몰리나 (CPU)\n\n메모리 쪽과 같은 분해다.\n\n```\n물리 4,000m = 파드 사용 + 시스템 사용 + 노드 여유\n노드 여유   = 파드 여유 + 시스템 여유\n```\n\n**읽는 뜻은 다르다.** 메모리는 파드 여유가 0 이 되면 컨테이너가 OOMKill 되지만, CPU 는 죽지 않고 스로틀이 걸린다 — 여유가 0 에 가까워지면 응답이 느려지기 시작한다.\n\n```\n파드 사용    /kubepods.slice cgroup.  개별 컨테이너 합이 아니다\n시스템 사용   노드 전체(node-exporter non-idle) − 파드\n파드 여유    allocatable − 파드 사용\n```\n\n**노드 전체만 메모리와 달리 node-exporter 로 잰다.** 인터럽트(irq·softirq)와 steal 은 어느 cgroup 에도 안 잡히는데 노드가 실제로 태우는 CPU 에는 포함이라, 시스템 사용 쪽에 남긴다. 그만큼 cgroup 합보다 15퍼센트쯤 크다.\n\n**파드 여유는 allocatable 기준이다.** 메모리는 cgroup 상한과 견주지만 CPU 는 넘어도 죽지 않고 스로틀만 걸려, 스케줄러가 보는 선을 그대로 쓴다.",
          "datasource": {
