          "description": "#### 어느 디스크가 차고 있나\n\n```\n/                OS · 컨테이너 이미지 · 컨테이너 쓰기 계층\n                 차면 이미지를 못 받아 파드가 안 뜬다\n/mnt/disks/*     PV 로 내준 파티션.  하나에 PVC 하나가 통째로 올라간다\n```\n\n부하 판마다 새 이미지를 받으면 `/` 가 먼저 찬다. **디스크는 메모리·CPU 와 달리 되돌아오지 않는다.**\n\nPVC 별 표를 따로 두지 않는다 — 파티션과 1:1 이라 같은 값이 되고, 이 표에만 `/` 가 있다.\n\n주의 — 사용량에 ext4 예약(파티션의 약 5%)이 포함돼 볼륨 안 데이터보다 크게 나온다.",
