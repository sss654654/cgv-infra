# 클러스터 인프라 대시보드 — 노드가 살아 있나에서 시작해 파드 하나까지 좁혀 내려간다.
#
#   행0 클러스터    노드 Ready · k3s 응답 · etcd 쿼럼 · eviction 임박 + 사고 흔적
#   행1 노드 메모리  선언(스케줄러가 보는 세계) · 실사용(커널이 보는 세계) · 추이
#   행2 노드 CPU     메모리와 같은 구조 — 선언 · 실사용 · 추이
#   행3 노드 디스크  마운트별 byte · 마운트별 inode
#   행4 파드         stat 4 → 흔적 표 둘 → 임박 stat+표 쌍
#     행0-3 은 노드 단위, 행4 는 파드·컨테이너 단위로 겹치지 않는다.
#     흐름은 설명으로 잇는다 — Pending 은 행1 스케줄 여유로, 메모리 임박은 행1 파드 여유로.
#
# 패널마다 답하는 질문이 하나씩 다르게 유지한다. 같은 값을 두 곳에 두지 않는다.
#   행0 에 사용률 게이지를 두지 않는 이유: 이 행의 질문은 "살아 있나" 이고 사용률은 그 답이 아니다.
#     사용률은 행1 첫 표에 게이지 셀로 있다. eviction 임박만 여기 두는 것은 그것이 사용률이 아니라 kubelet 이 파드를 내보내기 시작하는 임계여서다.
#   행1 을 두 표로 가르는 이유: 스케줄러는 requests 만 보고 커널은 실사용만 본다. 두 기준의 한계가
#     서로 다른 값이라(k3s-1 실측 2026-08-22 무부하 — 스케줄 여유 181 MiB vs 노드 여유 1,587 MiB)
#     한 표에 섞으면 무엇이 무엇의 한계인지 흐려진다.
#   행2 는 행1 과 같은 구조다. 다만 CPU 는 여유가 0 이 되어도 죽지 않고 스로틀만 걸린다 —
#     같은 표를 읽되 위험이 아니라 느려짐의 신호로 읽는다.
#   limit 임박은 크기 순이 아니라 limit 까지의 거리 순이다. 많이 쓰는 것과 limit 에 닿은 것은 다르다.
#   Traefik 에 전용 자리를 두지 않는다 — limit 에 닿으면 임박 표에 올라오고, 연결이 어떻게
#     쌓여 메모리가 오르는지는 queue 대시보드에서 앱과 나란히 봐야 의미가 있다.
#
# 사고 흔적·비정상 흔적·재시작 burst 는 같은 관용구를 쓴다. stat 은 지금만 보므로 잠깐 죽었다
# 살아난 사고를 놓친다.
#     흔적  max_over_time(조건[range:15s]) == 1
#     지금  조건 * on(...) group_left() (흔적)
#     발화  max_over_time((time() * 조건)[range:15s]) * 1000
#
# 노드 생존은 KSM 이 아니라 직접 스크레이프로 본다. kube_node_status_condition 은 apiserver·etcd 를
# 거쳐 오므로 쿼럼이 깨지면 갱신을 멈춘 채 마지막 상태로 남는다. 둘을 나란히 두어 갈리는 순간이 보이게 한다.
#
# 모든 표는 열 순서가 같다:  식별자 → 기준(총량) → 그 안에서 쓰는 값들 → 남은 것 / 비율.
# 기준이 맨 앞에 있어야 뒤의 숫자들이 무엇의 조각인지 읽힌다.
#
# 자원은 컨테이너 단위로 본다. limit 이 컨테이너에 걸리고 OOMKill 도 컨테이너에서 난다.
#
# 표 조인은 label_join 합성 키를 쓴다. mountpoint 는 `/` 처럼 세 노드에 같은 값이 있어 키가 못 된다.
# merge 도 단독으로는 안 쓴다 — 필드값이 겹치는 행을 합쳐 13행이 7행이 된다(실측).
#
# 게이지 눈금 끝은 정적이다(memory.max 5.26 GiB · CPU allocatable 3,300m). Grafana 는 max 를 쿼리 결과로 못 정한다.
# 실사용 표의 열 이름에 적힌 5.26 / 2.5 도 같은 이유로 정적이다 — kube-reserved 를 바꾸면 같이 고친다.
# 메모리 실사용 여섯 열은 전부 cgroup 기준이다. node-exporter(MemAvailable)와 섞으면 페이지 캐시가 두 번 빠진다.
# Loki 변수 allValue 는 .+ 다. .* 는 빈 문자열과도 맞아 Loki 가 질의를 거부한다.
apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-infra-cluster-overview
  namespace: observability
  labels:
    grafana_dashboard: "1"
data:
  infra-cluster-overview.json: |
    {
      "uid": "infra-cluster-overview",
      "title": "클러스터 인프라",
      "editable": true,
      "timezone": "browser",
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "refresh": "30s",
      "schemaVersion": 39,
      "templating": {
        "list": []
      },
      "panels": [
        {
          "type": "row",
          "title": "0. 클러스터 — 노드가 살아 있나",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "panels": []
        },
        {
          "type": "stat",
          "title": "노드 Ready",
          "description": "#### 쿠버네티스가 이 노드를 쓸 수 있다고 보나\n\n3 대 중 몇 대인가. 옆의 `k3s 응답`과 **갈리는 순간이 신호**다.\n\n```\nReady 2 · k3s 응답 3   노드는 살았는데 못 쓴다고 본다\n                      DiskPressure · MemoryPressure · 네트워크 플러그인 미준비\n                      BestEffort 인 calico-node 가 evict 되면 이 모양이 된다\n```\n\n주의 — kubelet → apiserver → KSM 을 거쳐 오는 값이라 **셋 중 가장 늦게 바뀐다.** 노드 하나를 실제로 멈춰 재보니 직접 스크레이프가 0 이 된 뒤에도 한동안 정상으로 남아 있었다. 그 사이 이 노드의 다른 패널 값도 마지막 값 그대로 떠 있다.",
          "datasource": {
            "type": "prometheus",
            "uid": "mimir"
          },
          "gridPos": {
            "h": 5,
            "w": 3,
            "x": 0,
            "y": 1
          },
          "targets": [
            {
              "refId": "A",
              "expr": "count(kube_node_status_condition{condition=\"Ready\", status=\"true\"} == 1) or vector(0)",
              "instant": true
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "textMode": "value"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 2
                  },
                  {
                    "color": "green",
                    "value": 3
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "type": "stat",
          "title": "k3s 응답",
          "description": "#### 노드의 k3s 프로세스가 응답하나\n\n3 대 중 몇 대인가. 노드 :10250 에 직접 붙어 잰다.\n\n**apiserver·etcd 를 안 거친다.** 쿼럼이 깨져 KSM 값이 갱신을 멈춰도 이 값은 따라 멈추지 않는다.\n\n```\nk3s 응답 2 · Ready 3   프로세스는 죽었는데 상태가 갱신을 멈췄다\n```\n\nk3s 는 apiserver·scheduler·controller-manager·kubelet 이 한 프로세스다. 그래서 이 하나가 넷을 겸한다.\n\n한계 — 프로세스가 살아서 :10250 이 응답하는 한 1 이다. **apiserver 만 밀리는 상황은 이걸로 안 잡힌다.**",
          "datasource": {
            "type": "prometheus",
            "uid": "mimir"
          },
          "gridPos": {
            "h": 5,
            "w": 3,
            "x": 3,
            "y": 1
          },
          "targets": [
            {
              "refId": "A",
              "expr": "count(up{job=\"k3s-server\"} == 1) or vector(0)",
              "instant": true
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "textMode": "value"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 2
                  },
                  {
                    "color": "green",
                    "value": 3
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "type": "stat",
          "title": "etcd 합의",
          "description": "#### 클러스터 상태를 쓸 수 있나\n\n응답하면서 리더를 인지하는 etcd 멤버 수다. **쿼럼이 아니다** — 3 멤버의 쿼럼은 항상 2 로 고정이다.\n\n```\n3   정상\n2   쓰기는 되지만 한 대 더 잃으면 멈춘다\n1   쿼럼 손실. 상태 변경이 전부 멈추고 KSM 기반 지표(Ready 포함)도 갱신을 멈춘다\n```\n\n`up` 과 `has_leader` 를 함께 본다. **프로세스 생존과 합의는 다른 축**이라 네트워크가 갈리면 셋 다 살아 있는데 이 값만 떨어진다.",
          "datasource": {
            "type": "prometheus",
            "uid": "mimir"
          },
          "gridPos": {
            "h": 5,
            "w": 3,
            "x": 6,
            "y": 1
          },
          "targets": [
            {
              "refId": "A",
              "expr": "count((etcd_server_has_leader == 1) and (up{job=\"k3s-etcd\"} == 1)) or vector(0)",
              "instant": true
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "textMode": "value"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 2
                  },
                  {
                    "color": "green",
                    "value": 3
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "type": "stat",
          "title": "eviction 임박 노드",
          "description": "#### 메모리가 모자라 kubelet 이 파드를 내보낼 노드가 있나\n\n**노드 여유가 300Mi 아래로 내려간 노드 수**다. 노드 여유 = 전체 RAM − 노드 전체 사용(루트 cgroup working_set)이고, kubelet 이 `memory.available` 을 재는 방식과 같다. 300Mi 는 노드에 설정한 `eviction-hard: memory.available<300Mi` 이고, 이 아래로 내려가면 kubelet 이 파드를 골라 내보낸다.\n\n```\n전체 RAM 7.76 GiB\n  − 예약 2.5   (kube-reserved 2Gi + system-reserved 512Mi)  →  파드 cgroup 상한 5.26 GiB\n  − eviction 임계 300Mi                                      →  스케줄러 allocatable 4.96 GiB\n```\n\n0 이 정상이다. 1 이상이면 그 노드에서 파드가 내보내진다 — 부하 판 도중이면 그 판은 버린다.\n\n원인은 행1 `실사용` 표에서 갈린다. 파드 여유가 0 쪽이면 파드가 자기 상한 5.26 GiB 를 다 쓴 것이고, 시스템 여유가 0 쪽이면 k3s.service 가 예약 2.5 GiB 를 넘긴 것이다.",
          "datasource": {
            "type": "prometheus",
            "uid": "mimir"
          },
          "gridPos": {
            "h": 5,
            "w": 3,
            "x": 9,
            "y": 1
          },
          "targets": [
            {
              "refId": "A",
              "expr": "count((sum by (node) (kube_node_status_capacity{resource=\"memory\"}) - max by (node) (container_memory_working_set_bytes{id=\"/\"})) < 300 * 1024 * 1024) or vector(0)",
              "instant": true
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "textMode": "value"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  },
                  {
                    "color": "red",
                    "value": 3
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "type": "table",
          "title": "사고 흔적 — 시간 범위 안에 비정상이었던 것",
          "description": "#### 잠깐 죽었다 살아난 것이 있나\n\n왼쪽 셋은 **지금**만 본다. 회복한 사고는 여기서만 보인다.\n\n```\n분류        k3s 응답 · 노드 Ready · etcd 응답 · etcd 합의\n노드        어느 노드인가\n지금        회복 / 비정상\n마지막 발화  마지막으로 비정상이던 시각\n```\n\n**표가 비어 있는 것이 정상이다.** 시간 범위를 넓히면 더 오래된 사고가 올라온다.\n\n`etcd 합의` 는 프로세스가 죽으면 메트릭 자체가 사라져 줄이 남지 않는다. 그 경우는 `etcd 응답` 이 잡는다.\n\n**여기서 로그로 넘어가는 링크는 없다.** 노드가 내려간 이유는 클러스터 안에 남지 않는다 — 기록하는 kubelet 이 함께 내려간다. 그 기록은 노드의 journald 에 있다(`journalctl -u k3s`).",
          "datasource": {
            "type": "prometheus",
            "uid": "mimir"
          },
          "gridPos": {
            "h": 6,
            "w": 12,
            "x": 12,
            "y": 1
          },
          "targets": [
            {
              "refId": "A",
              "expr": "label_replace((1 - max by (node) (up{job=\"k3s-server\"})) and on(node) (max_over_time(((1 - max by (node) (up{job=\"k3s-server\"})))[${__range_s}s:15s]) > 0), \"분류\", \"k3s 응답\", \"\", \"\")\nor\nlabel_replace((1 - max by (node) (kube_node_status_condition{condition=\"Ready\", status=\"true\"})) and on(node) (max_over_time(((1 - max by (node) (kube_node_status_condition{condition=\"Ready\", status=\"true\"})))[${__range_s}s:15s]) > 0), \"분류\", \"노드 Ready\", \"\", \"\")\nor\nlabel_replace((1 - max by (node) (up{job=\"k3s-etcd\"})) and on(node) (max_over_time(((1 - max by (node) (up{job=\"k3s-etcd\"})))[${__range_s}s:15s]) > 0), \"분류\", \"etcd 응답\", \"\", \"\")\nor\nlabel_replace((1 - max by (node) (etcd_server_has_leader)) and on(node) (max_over_time(((1 - max by (node) (etcd_server_has_leader)))[${__range_s}s:15s]) > 0), \"분류\", \"etcd 합의\", \"\", \"\")",
              "format": "table",
              "instant": true
            },
            {
              "refId": "B",
              "expr": "label_replace(max_over_time((time() * ((1 - max by (node) (up{job=\"k3s-server\"}))))[${__range_s}s:15s]) * 1000 > 0, \"분류\", \"k3s 응답\", \"\", \"\")\nor\nlabel_replace(max_over_time((time() * ((1 - max by (node) (kube_node_status_condition{condition=\"Ready\", status=\"true\"}))))[${__range_s}s:15s]) * 1000 > 0, \"분류\", \"노드 Ready\", \"\", \"\")\nor\nlabel_replace(max_over_time((time() * ((1 - max by (node) (up{job=\"k3s-etcd\"}))))[${__range_s}s:15s]) * 1000 > 0, \"분류\", \"etcd 응답\", \"\", \"\")\nor\nlabel_replace(max_over_time((time() * ((1 - max by (node) (etcd_server_has_leader))))[${__range_s}s:15s]) * 1000 > 0, \"분류\", \"etcd 합의\", \"\", \"\")",
              "format": "table",
              "instant": true
            }
          ],
          "transformations": [
            {
              "id": "filterFieldsByName",
              "options": {
                "include": {
                  "pattern": "^(분류|node|Value #A|Value #B)$"
                }
              }
            },
            {
              "id": "merge",
              "options": {}
            },
            {
              "id": "organize",
              "options": {
                "excludeByName": {},
                "indexByName": {
                  "분류": 0,
                  "node": 1,
                  "Value #A": 2,
                  "Value #B": 3
                },
                "renameByName": {
                  "node": "노드",
                  "Value #A": "지금",
                  "Value #B": "마지막 발화"
                }
              }
            },
            {
              "id": "sortBy",
              "options": {
                "fields": {},
                "sort": [
                  {
                    "field": "마지막 발화",
                    "desc": true
                  }
                ]
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "noValue": "이상 없음",
              "custom": {
                "align": "left"
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "분류"
                },
                "properties": [
                  {
                    "id": "custom.minWidth",
                    "value": 110
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "노드"
                },
                "properties": [
                  {
                    "id": "custom.minWidth",
                    "value": 90
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "지금"
                },
                "properties": [
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "color-background"
                    }
                  },
                  {
                    "id": "mappings",
                    "value": [
                      {
                        "type": "value",
                        "options": {
                          "0": {
                            "color": "green",
                            "text": "회복",
                            "index": 0
                          },
                          "1": {
                            "color": "red",
                            "text": "비정상",
                            "index": 1
                          }
                        }
                      }
                    ]
                  },
                  {
                    "id": "custom.width",
                    "value": 90
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "마지막 발화"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "dateTimeAsIso"
                  },
                  {
                    "id": "custom.width",
                    "value": 190
                  }
                ]
              }
