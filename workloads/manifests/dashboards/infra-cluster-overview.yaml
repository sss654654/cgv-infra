          "description": "#### 부하가 어느 노드로 몰리나\n\n**노드 간 편차가 이 패널의 전부다.** MetalLB layer2 는 VIP 를 노드 하나가 소유하므로 외부 트래픽이 그 노드로 먼저 들어오고 그 노드만 오른다 — 부하 판에서 VIP 를 가진 노드가 어느 것인지 여기서 보인다.\n\n선은 `/kubepods.slice` 의 사용량이고 빨간 점선이 `allocatable`(3,300m)이다.\n\n**응답이 느린데 이 선이 멀리 있으면** 원인은 노드 CPU 총량이 아니라 파드 개별 limit 이거나 다른 자리다.",
