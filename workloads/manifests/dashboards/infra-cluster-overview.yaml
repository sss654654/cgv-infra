          "description": "#### 반복해서 죽는 컨테이너가 몇 개인가\n\n시간 범위 안에서 **10분에 2회 이상** 재시작한 컨테이너 수. **옆 burst 표의 행 수와 정확히 같다** — 같은 조건이다.\n\n임계 2회는 이 규모에 맞춘 값이다 — 파드 70개에 24시간 재시작 2건이라, 3회로는 안 걸린다.\n\n한 번 재시작은 배포·드레인으로도 생기니 세지 않는다. 롤링 배포의 새 파드는 카운터가 0 에서 시작해 여기 안 걸린다.",
