# Grafana 알림 프로비저닝 — 발송처·라우팅·룰.
# 차트 values 의 alerting 키가 아니라 ConfigMap 으로 두는 이유: 차트가 그 값에 Helm tpl 을 돌려,
#   알림 템플릿의 {{ }} 를 Grafana 가 아니라 Helm 이 먼저 해석하려다 렌더가 실패한다
#   (nil pointer evaluating .CommonLabels). 여기 있으면 문자열 그대로 파드에 전달된다.
# grafana values 의 extraConfigmapMounts 가 이 ConfigMap 을 provisioning/alerting 에 마운트한다.
#
# 알림 — 발송처·라우팅·룰을 코드로 둔다.
#   persistence.enabled=false 라 UI에서 만든 룰은 파드가 재시작하면 사라진다. 이 경로가 유일한 정본이다.
#
# 무엇을 알릴지의 기준 둘: 울리면 지금 할 행동이 있나, 안 울리면 되돌릴 수 없나.
#   이 기준으로 거르면 전부 호스트 하드웨어 축이 된다 — 클러스터·앱 층은 재기동으로 회복되지만
#   물리 층(과열·전원 상실·디스크 사망)만 되돌릴 수 없다.
# 앱 지연·5xx는 넣지 않는다 — 정상 범위를 아직 모른다. 임계는 부하 실측 뒤에 정한다.
#   근거 없는 임계는 오탐이 되고, 오탐은 알림 전체를 무시하게 만든다.
#
# 데이터 없음(No Data) 처리를 나눈다: 감시 경로 끊김 룰만 발화시키고 나머지는 발화하지 않는다.
#   나머지 넷은 전부 호스트 스크레이프 하나에 매달려 있어, 그게 막히면 넷이 동시에 No Data가 된다.
#   전부 발화로 두면 알림 넷이 한꺼번에 쏟아져 원인이 묻힌다.
#
# 남는 구멍(룰로 못 메움): 호스트가 완전히 꺼지면 이 알림들도 같이 죽는다 —
#   Grafana가 그 호스트 위 클러스터에 있기 때문이다. 그 구간은 밖에서 보는 프로브가 맡는다.
# 밤 예약 종료 시간대 억제(mute timing)는 스케줄을 정한 뒤 더한다 — 안 하면 매일 밤 오발한다.
#
# 발화 검증(2026-08-24): 안 울려 본 알림은 없는 것과 같아서, 임계를 지금 값에서 바로 참이
#   되게 뒤집은 판을 한 번 올려 다섯이 전부 폰까지 닿는 것을 확인하고 이 값으로 되돌렸다.
#   그 과정에서 세 가지가 드러났다 — Grafana 가 자기 외부 주소를 몰라 링크가 안 열렸고,
#   기본 메시지 형식이 라벨 덤프라 읽히지 않았고, 화면 캡처 스위치가 꺼져 있어 그림이 없었다.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-alerting
  namespace: observability
data:
  contactpoints.yaml: |
    apiVersion: 1
    contactPoints:
      - orgId: 1
        name: discord
        receivers:
          - uid: discord-webhook
            type: discord
            settings:
              url: $__env{DISCORD_WEBHOOK_URL}
              # 기본 형식은 라벨을 통째로 늘어놓고 링크를 네 줄 붙여 사람이 읽기 어렵다.
              #   폰 알림에서 필요한 것은 셋뿐이다 — 무슨 일이 났나 / 무엇을 하나 / 어디를 보나.
              title: '{{ if eq .Status "firing" }}발생{{ else }}해소{{ end }} · {{ .CommonLabels.alertname }}'
              # 패널 주소는 __dashboardUid__ 로 조립하지 않는다 — Grafana 가 그 애노테이션을
              #   내부용으로 걷어내 템플릿에서 안 보이고, 대신 완성된 .PanelURL 을 준다.
              message: |-
                {{ range .Alerts }}{{ .Annotations.summary }}

                조치 — {{ .Annotations.description }}
                {{ if .PanelURL }}패널 — {{ .PanelURL }}
                {{ end }}{{ if .DashboardURL }}대시보드 — {{ .DashboardURL }}
                {{ end }}{{ end }}

  policies.yaml: |
    apiVersion: 1
    policies:
      - orgId: 1
        receiver: discord
        # alertname으로 묶는다 — 같은 룰이 여러 인스턴스로 발화해도 알림은 하나로 온다.
        group_by: [alertname]
        group_wait: 30s        # 첫 발화를 30초 모아 보낸다(연쇄 발화를 한 번에)
        group_interval: 5m     # 같은 묶음에 새 알림이 붙으면 5분 간격으로
        repeat_interval: 4h    # 해결 안 되면 4시간마다 다시 — 자는 동안 잊히지 않게

  rules.yaml: |
    apiVersion: 1
    groups:
      - orgId: 1
        name: hypervisor
        folder: 알림
        interval: 1m
        rules:
          # 1. 과열 — 이 호스트를 실제로 죽인 원인. 평시 66°C 실측(팬·뚜껑·거버너 조치 후)이라
          #    90°C는 조치가 풀렸거나 부하가 걸린 상태다. 5분 지속으로 순간 스파이크를 거른다.
          #    하드웨어 임계는 110°C — 닿으면 스스로 꺼진다.
          - uid: hv-cpu-overheat
            title: CPU 과열
            condition: B
            for: 5m
            noDataState: OK
            execErrState: Alerting
            labels: { severity: critical }
            annotations:
              # 알림에 이 패널을 렌더해 붙인다 — 온도가 언제부터 올랐는지는 숫자가 아니라 곡선이 답한다.
              __dashboardUid__: hypervisor-overview
              __panelId__: "9"
              # 지금 값을 제목 줄에 넣는다 — 몇 도인지 모르고 받으면 급한지 아닌지 못 가른다.
              summary: 'CPU 패키지 {{ printf "%.0f" $values.A.Value }}°C — 기준 90°C 를 5분 넘게 넘었다 (하드웨어 임계 110)'
              description: 호스트 하드웨어 대시보드 행1에서 온도 추이와 클럭을 본다. 클럭이 높으면 거버너가 performance로 돌아갔거나 부하가 걸린 것이고, 클럭·CPU 사용률이 정상인데 온도만 높으면 물리 냉각(팬 정지·뚜껑 닫힘)이다.
            data:
              - refId: A
                relativeTimeRange: { from: 300, to: 0 }
                datasourceUid: mimir
                model:
                  refId: A
                  instant: true
                  expr: node_hwmon_temp_celsius{job="hypervisor", chip="platform_coretemp_0", sensor="temp1"}
              - refId: B
                relativeTimeRange: { from: 300, to: 0 }
                datasourceUid: __expr__
                model:
                  refId: B
                  type: threshold
                  expression: A
                  conditions:
                    - evaluator: { type: gt, params: [90] }

          # 2. AC 끊김 — 노트북 배터리가 내장 UPS라 즉시 죽지 않고 유예가 있다.
          #    그 유예 안에 꽂으면 살고, 놓치면 방전으로 전부 내려간다.
          #    2분 지속 — 순간적인 어댑터 인식 흔들림을 거른다.
          - uid: hv-ac-lost
            title: AC 전원 끊김
            condition: B
            for: 2m
            noDataState: OK
            execErrState: Alerting
            labels: { severity: critical }
            annotations:
              __dashboardUid__: hypervisor-overview
              __panelId__: "13"
              summary: 어댑터 전원이 끊겨 배터리로 돌고 있다
              description: 대시보드 행2에서 배터리 기울기로 남은 시간을 본다. 플러그·정전·어댑터를 확인한다.
            data:
              - refId: A
                relativeTimeRange: { from: 300, to: 0 }
                datasourceUid: mimir
                model:
                  refId: A
                  instant: true
                  expr: node_power_supply_online{job="hypervisor", power_supply="ADP1"}
              - refId: B
                relativeTimeRange: { from: 300, to: 0 }
                datasourceUid: __expr__
                model:
                  refId: B
                  type: threshold
                  expression: A
                  conditions:
                    - evaluator: { type: lt, params: [1] }

          # 3. 배터리 잔량 — AC 끊김의 마지막 단계다. 행동이 다르므로 룰을 나눈다:
          #    AC 끊김은 "가서 꽂아라", 이건 "지금 정상 종료시켜라".
          #    갑자기 전원이 끊기면 etcd·MySQL이 깨진 상태로 남는다.
          - uid: hv-battery-low
            title: 배터리 잔량 부족
            condition: B
            for: 1m
            noDataState: OK
            execErrState: Alerting
            labels: { severity: critical }
            annotations:
              __dashboardUid__: hypervisor-overview
              __panelId__: "13"
              summary: '배터리 잔량 {{ printf "%.0f" $values.A.Value }}% — 20% 아래, 정상 종료를 결정할 시점'
              description: AC가 아직 안 들어오면 강제 차단 전에 정상 종료시킨다.
            data:
              - refId: A
                relativeTimeRange: { from: 300, to: 0 }
                datasourceUid: mimir
                model:
                  refId: A
                  instant: true
                  expr: node_power_supply_capacity{job="hypervisor", power_supply="BAT0"}
              - refId: B
                relativeTimeRange: { from: 300, to: 0 }
                datasourceUid: __expr__
                model:
                  refId: B
                  type: threshold
                  expression: A
                  conditions:
                    - evaluator: { type: lt, params: [20] }

          # 4. 주 디스크 자가진단 — Proxmox와 VM 3대가 전부 이 외장 USB SSD 한 장 위에 있다.
          #    진단이 아니라 대피 신호다: 어느 속성이 넘었든 할 일은 하나 —
          #    아직 읽히는 동안 백업을 다른 매체로 빼고 교체를 준비한다.
          #    한계: 이 컨트롤러가 재할당 섹터·수명 속성을 USB 너머로 안 넘겨 판정이 좁다.
          #    그래서 정상이 안전을 보증하지 못하고, 실제 대비는 백업이 받는다.
          - uid: hv-disk-smart
            title: 주 디스크 SMART 이상
            condition: B
            for: 5m
            noDataState: OK
            execErrState: Alerting
            labels: { severity: critical }
            annotations:
              # 판정은 넘었다는 사실만 준다. 어느 정도인지는 판정을 좌우하는 점수 패널이 답한다.
              __dashboardUid__: hypervisor-overview
              __panelId__: "24"
              summary: 주 디스크(sda)가 자가진단에서 이상을 보고했다 — 홈랩 전부가 이 디스크 위에 있다
              description: 아직 읽히는 동안 봉인 키·백업·스냅샷을 다른 매체로 옮기고 교체를 준비한다. 어느 항목이 넘었는지는 읽기 오류율 점수로 본다.
            data:
              - refId: A
                relativeTimeRange: { from: 600, to: 0 }
                datasourceUid: mimir
                model:
                  refId: A
                  instant: true
                  expr: smartmon_device_smart_healthy{job="hypervisor", disk="/dev/sda"}
              - refId: B
                relativeTimeRange: { from: 600, to: 0 }
                datasourceUid: __expr__
                model:
                  refId: B
                  type: threshold
                  expression: A
                  conditions:
                    - evaluator: { type: lt, params: [1] }

          # 5. 감시 경로 끊김 — 위 넷이 전부 이 스크레이프 하나에 매달려 있다.
          #    이게 막히면 넷이 조용해지고, 그 조용함이 정상으로 읽힌다.
          #    잡는 것은 "호스트 사망"이 아니라 "호스트를 보는 눈이 막힘"이다 —
          #    node-exporter 정지, 또는 재구성 후 방화벽에 호스트 경로가 안 열린 경우.
          #    이 룰만 No Data를 발화로 둔다(Alloy 자체가 멈추면 up 계열이 통째로 사라진다).
          - uid: hv-scrape-down
            title: 호스트 감시 경로 끊김
            condition: B
            for: 5m
            noDataState: Alerting
            execErrState: Alerting
            labels: { severity: warning }
            annotations:
              # 이 알림의 지표가 곧 행0 "호스트 응답" 패널이다 — 끊기면 빨간 상태가 그려진다.
              __dashboardUid__: hypervisor-overview
              __panelId__: "2"
              summary: 호스트 감시가 끊겼다 — 온도·전원·디스크 값이 전부 갱신을 멈췄고, 나머지 알림 넷도 함께 조용해진다
              description: 조용한 것이 정상이 아니라는 신호다. 관측 파이프라인 대시보드의 job별 생존에서 이 호스트만 끊겼는지 본다. Proxmox 웹UI(:8006)는 관측과 독립이라, 열리면 호스트는 살아 있고 경로나 exporter 문제다.
            data:
              - refId: A
                relativeTimeRange: { from: 300, to: 0 }
                datasourceUid: mimir
                model:
                  refId: A
                  instant: true
                  expr: up{job="hypervisor"}
              - refId: B
                relativeTimeRange: { from: 300, to: 0 }
                datasourceUid: __expr__
                model:
                  refId: B
                  type: threshold
                  expression: A
                  conditions:
                    - evaluator: { type: lt, params: [1] }

          # 6. 데이터 디스크 차오름 — 위 다섯은 하이퍼바이저 하드웨어를 보고, 이건 안쪽 저장을 본다.
          #    miniodata(100G)는 관측 원본(Mimir·Loki·Tempo 블록)이 쌓이는 유일하게 계속 차는 곳이고,
          #    kafkadata·mysqldata도 트래픽에 따라 는다. 차면 관측이 먼저 멈추는데, 그때는
          #    "무엇이 문제인지 보는 수단"이 함께 사라져 원인을 못 쫓는다.
          #    보존 기간(Mimir 15일·Loki 7일)이 상한을 잡지만, 유입이 늘면 그 기간 안에도 찬다.
          #    85%는 남은 15%로 손 쓸 시간을 두려는 값이다 — 보존 기간을 줄이거나 디스크를 늘린다.
          - uid: node-disk-filling
            title: 데이터 디스크 차오름
            condition: B
            for: 15m
            noDataState: OK
            execErrState: Alerting
            labels: { severity: warning }
            annotations:
              # 대시보드 링크를 걸지 않는다 — infra-cluster-overview 패널에는 고정 id가 없어
              #   (가져올 때 Grafana가 부여) __panelId__를 지정할 수 없고, __dashboardUid__만
              #   적으면 Grafana가 규칙 전체를 거부해 기동이 실패한다(둘은 짝으로만 유효).
              summary: 노드의 데이터 디스크 하나가 85%를 넘었다 — 차면 관측이 먼저 멈춘다
              description: 어느 노드의 어느 마운트인지는 인프라 대시보드의 디스크 사용률에서 본다. miniodata면 보존 기간(Mimir 15일·Loki 7일)을 줄이는 것이 첫 수단이고, kafkadata면 토픽 보존을, mysqldata면 데모 데이터 초기화를 본다.
            data:
              - refId: A
                relativeTimeRange: { from: 900, to: 0 }
                datasourceUid: mimir
                model:
                  refId: A
                  instant: true
                  # 노드 디스크만 본다. tmpfs 같은 메모리 파일시스템은 제외한다.
                  #   max()로 뭉쳐 마운트마다 알림이 갈라지지 않게 한다 — 어느 것인지는 대시보드가 답한다.
                  expr: max((1 - node_filesystem_avail_bytes{job="prometheus-node-exporter", fstype!~"tmpfs|overlay|squashfs|ramfs"} / node_filesystem_size_bytes{job="prometheus-node-exporter", fstype!~"tmpfs|overlay|squashfs|ramfs"}) * 100)
              - refId: B
                relativeTimeRange: { from: 900, to: 0 }
                datasourceUid: __expr__
                model:
                  refId: B
                  type: threshold
                  expression: A
                  conditions:
                    - evaluator: { type: gt, params: [85] }
