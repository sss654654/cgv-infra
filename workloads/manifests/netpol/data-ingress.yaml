# data 네임스페이스로 들어오는 접속의 출처를 제한한다.
#
# NetworkPolicy는 정책이 고른 파드만 판정 대상으로 삼는다. 고르는 순간 그 파드로 들어오는
#   접속이 전부 막히고 ingress에 적은 것만 통과한다. 거부 규칙은 문법에 없다.
# 여러 정책이 같은 파드를 고르면 허용의 합집합이 된다 → 출처 없는 넓은 정책(차트 생성분)이
#   남아 있으면 여기서 좁혀도 효과가 없다. cgv-mysql·cgv-redis values의 networkPolicy.enabled를
#   함께 꺼야 한다.
# Kafka 9092는 이 파일이 아니라 Kafka CR 리스너의 networkPolicyPeers로 좁힌다 —
#   Strimzi가 자기 정책을 계속 재생성하므로 여기서 적어도 덮인다.
#
# kubelet의 httpGet 프로브는 ipBlock으로 적지 않는다. 정책이 강제되는 상태에서 프로브가
#   통과하는 것을 확인했다(app 네임스페이스에서 노드 IP 없이 정책을 걸고 70초 관찰 —
#   재시작·NotReady 0건, 같은 시점 data 파드에서 그 앱으로 접속은 차단됨). CNI는 Calico다.
#   전에는 노드 IP 세 개를 적어 두고 있었으나, 노드 주소를 옮긴 뒤 그 값이 존재하지 않는
#   주소가 된 동안에도 파드가 계속 Ready였다 — 그 줄이 통과의 근거가 아니었다.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: data
spec:
  podSelector: {}          # data의 모든 파드를 판정 대상으로 만든다
  policyTypes: [Ingress]
  ingress: []              # 규칙 0개 = 이 정책만 놓고 보면 통과할 조건이 없다
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mysql-ingress
  namespace: data
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mysql
  policyTypes: [Ingress]
  ingress:
    # MySQL을 쓰는 것은 booking 하나다.
    - from:
        - namespaceSelector:                              # 한 원소 안의 셀렉터 둘 = AND
            matchLabels:
              kubernetes.io/metadata.name: app            # 쿠버네티스가 모든 ns에 자동으로 다는 라벨
          podSelector:
            matchLabels:
              app.kubernetes.io/name: booking
      ports:
        - port: 3306
    # 9104는 mysql 파드의 지표 노출 사이드카(mysqld_exporter). redis 9121과 출처가 같다.
    #   Alloy는 hostNetwork를 쓰지 않아 출발지가 파드 IP → 셀렉터로 잡힌다.
    #   kubelet 프로브는 위 주석대로 여기에 적지 않는다.
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: observability}
          podSelector:
            matchLabels: {app.kubernetes.io/name: alloy}
      ports:
        - port: 9104
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-ingress
  namespace: data
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: redis
  policyTypes: [Ingress]
  ingress:
    # 클라이언트는 26379(Sentinel)로 마스터 주소를 받고 그 주소로 6379에 다시 접속한다.
    #   26379만 열면 마스터 조회는 되고 다음 명령에서 멈춘다.
    - from:                                               # 원소가 여럿 = OR
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: app}
          podSelector:
            matchLabels: {app.kubernetes.io/name: queue}
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: app}
          podSelector:
            matchLabels: {app.kubernetes.io/name: booking}
        - podSelector:                                    # ns 지정 없음 = 같은 ns(data) 안
            matchLabels: {app.kubernetes.io/name: redis}  # 복제·Sentinel 투표
      ports:
        - port: 6379
        - port: 26379
    # 9121은 redis 파드의 지표 노출 사이드카. 출처가 둘이다.
    #   Alloy는 hostNetwork를 쓰지 않아 출발지가 파드 IP → 셀렉터로 잡힌다.
    #   kubelet 프로브는 위 주석대로 여기에 적지 않는다.
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: observability}
          podSelector:
            matchLabels: {app.kubernetes.io/name: alloy}
      ports:
        - port: 9121
---
