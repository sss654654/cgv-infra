# observability 네임스페이스로 들어오는 접속의 출처를 제한한다.
#
# 여기에는 Mimir(지표)·Loki(로그)·Tempo(트레이스)와 그 셋의 오브젝트 원본인 MinIO가 있다.
#   정책이 없으면 클러스터 안 어느 파드에서든 읽고 쓸 수 있다.
#
# 범위 — 네임스페이스 안은 열고, 밖에서 들어오는 것만 좁힌다.
#   Mimir는 마이크로서비스 여덟 종이고 gossip(7946)·gRPC(9095)·HTTP(8080)·MinIO(9000)로
#   서로 얽혀 있다. 그 그래프를 규칙으로 옮기다 틀리면 관측이 멈추고, 관측이 멈춰서
#   원인 추적도 막힌다. 반면 좁혀서 얻는 것은 같은 네임스페이스 안의 격리뿐이라
#   비용이 이득보다 크다. 다른 네임스페이스에서 오는 접속을 막는 것이 이득의 대부분이다.
#
# kubelet 프로브용 ipBlock은 적지 않는다. 정책이 강제되는 상태에서 프로브가 통과하는 것을
#   app 네임스페이스에서 확인했다(workloads/manifests/netpol-app/app-ingress.yaml 주석).
#
# observability-host의 node-exporter는 여기에 없다. hostNetwork: true라 파드 네트워크를
#   쓰지 않아 NetworkPolicy의 판정 대상이 아니다.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: observability
spec:
  podSelector: {}          # observability의 모든 파드를 판정 대상으로 만든다
  policyTypes: [Ingress]
  ingress: []              # 규칙 0개 = 이 정책만 놓고 보면 통과할 조건이 없다
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-same-namespace
  namespace: observability
spec:
  # grafana-image-renderer만 뺀다. 그 파드는 grafana에서만 닿게 하는 정책
  #   grafana-image-renderer-ingress(차트 생성분)가 이미 있고, 여기서 전체를 허용하면
  #   합집합이 되어 그 정책이 무의미해진다.
  # NotIn은 그 라벨이 아예 없는 파드도 고른다 — minio가 그 경우다.
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: NotIn
        values: [grafana-image-renderer]
  policyTypes: [Ingress]
  ingress:
    # namespaceSelector 없이 podSelector만 = 이 정책이 있는 네임스페이스 안
    - from:
        - podSelector: {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: grafana-ingress
  namespace: observability
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: grafana
  policyTypes: [Ingress]
  ingress:
    # Ingress "grafana"(host grafana.cgv.lan)가 이 서비스로 온다.
    # ports에 적는 것은 파드가 여는 포트다. Service는 80이지만 파드는 3000을 열고
    #   Service가 80 -> targetPort grafana(=3000)로 옮긴다. NetworkPolicy는 파드에서
    #   판정하므로 Service 포트를 적으면 아무것도 통과하지 못한다.
    - from:
        - namespaceSelector:                              # 한 원소 안의 셀렉터 둘 = AND
            matchLabels: {kubernetes.io/metadata.name: traefik}
          podSelector:
            matchLabels: {app.kubernetes.io/name: traefik}
      ports:
        - port: 3000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: alloy-otlp-ingress
  namespace: observability
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: alloy
  policyTypes: [Ingress]
  ingress:
    # 두 앱이 트레이스를 Alloy로 보낸다. 포트가 갈리는 이유는 프로토콜이 달라서다.
    #   booking  OTEL_EXPORTER_OTLP_ENDPOINT = http://alloy...:4318/v1/traces   (HTTP)
    #   queue    OTEL_EXPORTER_OTLP_ENDPOINT = alloy...:4317                    (gRPC)
    # 앱의 이 환경변수를 바꾸면 여기도 같이 바꿔야 한다. 안 맞으면 트레이스만 조용히 끊긴다.
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: app}
          podSelector:
            matchLabels: {app.kubernetes.io/name: booking}
      ports:
        - port: 4318
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: app}
          podSelector:
            matchLabels: {app.kubernetes.io/name: queue}
      ports:
        - port: 4317
