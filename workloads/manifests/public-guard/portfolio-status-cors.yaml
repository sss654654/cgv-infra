# 포트폴리오 홈(https://subinhong.dev)이 데모 가동 여부를 표시하려고
#   GET /api/admission/stats 를 브라우저 fetch 로 조회한다. 교차 출처 요청이라
#   응답에 Access-Control-Allow-Origin 이 없으면 브라우저가 응답을 버린다.
# 이 파일은 그 경로 하나의 443(websecure)에만 해당 헤더를 붙인다.
#   허용 origin 은 포트폴리오 도메인 하나 — 다른 사이트의 스크립트는 여전히 응답을 읽지 못한다.
# 호스트가 꺼져 있으면 Cloudflare 의 522 응답에는 이 헤더가 없으므로 포트폴리오 쪽
#   fetch 가 실패한다 — 그 실패로 가동/꺼짐이 갈린다.
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: portfolio-cors
  namespace: app
spec:
  headers:
    accessControlAllowOriginList:
      - "https://subinhong.dev"
    accessControlAllowMethods:
      - GET
    accessControlMaxAge: 86400
---
# admin-api-deny 와 같은 방식 — 더 구체적인 경로(Exact)에 우선순위를 명시해 얹는다.
#   frontend Ingress 의 PathPrefix(/api/admission)보다 먼저 걸려 이 경로만 미들웨어를 탄다.
#   web(80)에는 걸지 않는다 — LAN 경로는 바뀌지 않는다.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: portfolio-status-cors
  namespace: app
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.middlewares: app-portfolio-cors@kubernetescrd
    traefik.ingress.kubernetes.io/router.priority: "1000"
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /api/admission/stats
            pathType: Exact
            backend:
              service:
                name: queue
                port:
                  number: 8090
