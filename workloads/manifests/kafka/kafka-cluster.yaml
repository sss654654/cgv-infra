# KafkaCluster CR — Strimzi 오퍼레이터(install.sh로 먼저 설치)가 이걸 보고 실제 브로커를 만든다(operator 패턴).
# 클러스터명 "cgv" → bootstrap 서비스 = cgv-kafka-bootstrap.data.svc:9092 (queue/booking env와 일치).
# Strimzi 1.1.0: API = kafka.strimzi.io/v1 (v1beta2 제거됨). KRaft+NodePool이 유일 모드라
#   strimzi.io/kraft·node-pools annotation 불필요(0.48에서 제거). Kafka 4.3.0 = operator 1.1.0 default.
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: cgv-pool
  namespace: data
  labels:
    strimzi.io/cluster: cgv
spec:
  replicas: 3                        # 3 브로커 (노드 3, RF3 성립)
  roles:
    - controller
    - broker                         # combined(dual-role) — 소규모
  # 브로커 resources는 v1 API에서 노드풀 소관이다. Kafka.spec.kafka.resources는 스키마에
  # 없어 서버가 거부한다("field not declared in schema" — SSA dry-run으로 확인).
  # JVM: 메모리가 핵심(request 0이면 노드 압박 시 1순위 evict → RF3 HA 붕괴).
  resources:
    requests: { cpu: 250m, memory: 768Mi }
    limits: { cpu: "1", memory: 1536Mi }
  storage:
    type: persistent-claim           # 단일 볼륨. 확장 여지 원하면 jbod 권장(조사 노트)
    size: 10Gi
    class: local-kafkadata           # 정적 PV(bootstrap/storage/) — kafkadata 디스크 통마운트, 노드당 1개
    deleteClaim: false
  template:
    pod:
      affinity:
        podAntiAffinity:             # 브로커 3개를 서로 다른 노드에 (co-location 방지)
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              # 셀렉터는 브로커 파드만 잡아야 한다.
              # Strimzi가 노드풀 파드에 다는 라벨: strimzi.io/cluster=<클러스터>,
              #   strimzi.io/name=<클러스터>-kafka, strimzi.io/pool-name=<풀>, strimzi.io/component-type=kafka.
              # entityOperator 파드는 strimzi.io/cluster는 같지만 strimzi.io/name=<클러스터>-entity-operator다.
              # strimzi.io/cluster 하나만 쓰면 EO도 걸린다 → 브로커가 재스케줄될 때 그 브로커의
              #   local PV가 있는 노드에 EO가 앉아 있으면 hard 규칙에 막혀 영구 Pending(RF3 → 2 고착,
              #   min.insync.replicas=2라 브로커 하나 더 흔들리면 쓰기 거부).
              labelSelector:
                matchLabels:
                  strimzi.io/cluster: cgv
                  strimzi.io/name: cgv-kafka
---
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: cgv
  namespace: data
spec:
  kafka:
    version: 4.3.0
    metadataVersion: 4.3-IV0
    # resources는 여기 못 적는다 — v1 스키마에 없다. 노드풀(cgv-pool) 쪽에 있다.
    jvmOptions:                      # 힙 상한 = limit의 60%(약 900MB). 나머지 40% = 비힙(다이렉트버퍼·메타스페이스).
      "-XX":
        MaxRAMPercentage: "60"
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false                   # 내부 평문·무인증(홈랩). 노출 시 tls 리스너 추가
        # Strimzi가 브로커용 NetworkPolicy를 이 리스너 정의를 보고 만든다.
        #   networkPolicyPeers가 비어 있으면 9092 규칙이 출처 없이 렌더되어 클러스터 안
        #   아무 파드나 admissions에 발행할 수 있다 → booking은 발신자를 확인하지 않으므로
        #   대기열·정원을 거치지 않고 예매 자격이 나온다.
        # 인증이 붙는 것은 아니다. 아래 라벨을 단 파드는 여전히 인증 없이 9092에 접속한다.
        # 9090(컨트롤러)·9091(복제)·8443(오퍼레이터)은 Strimzi가 출처까지 스스로 지정한다.
        networkPolicyPeers:
          - namespaceSelector:
              matchLabels: {kubernetes.io/metadata.name: app}
            podSelector:
              matchLabels: {app.kubernetes.io/name: queue}
          - namespaceSelector:
              matchLabels: {kubernetes.io/metadata.name: app}
            podSelector:
              matchLabels: {app.kubernetes.io/name: booking}
          # 브로커 자신. 서비스 경로에는 필요 없지만(복제 9091·컨트롤러 9090은 별도 포트)
          #   브로커 안에서 도는 관리 CLI가 이 경로를 쓴다. kafka-topics.sh --describe 나
          #   kafka-consumer-groups.sh 는 접속한 브로커에서 파티션 리더 목록을 받은 뒤
          #   각 리더에 9092로 직접 붙으므로, 이 항목이 없으면 조회가 타임아웃된다.
          # 브로커는 이미 그 데이터를 보관하는 주체라 이 항목으로 새로 열리는 범위는 없다.
          - podSelector:
              matchLabels: {strimzi.io/name: cgv-kafka}
    config:
      offsets.topic.replication.factor: 3
      transaction.state.log.replication.factor: 3
      transaction.state.log.min.isr: 2
      default.replication.factor: 3
      min.insync.replicas: 2
      # 보존 3일 — kafkadata 30G 산정의 근거값. 여기 값은 클러스터 기본이라
      #   KafkaTopic CR에 config가 없는 토픽(앱 auto-create 포함)에 적용된다.
      # 세그먼트가 닫혀야 삭제 대상이 되므로 roll 주기도 같이 줄인다
      #   (기본 log.roll.ms=7일이면 3일 보존이 실제로는 최대 10일까지 늘어난다).
      log.retention.hours: 72
      log.roll.ms: 86400000          # 24h
  entityOperator:
    # topicOperator만 둔다. resources를 비우면 BestEffort가 되어 노드 메모리 압박 시 가장 먼저
    #   퇴거되고, 그러면 KafkaTopic CR 반영이 조용히 멈춘다.
    # 또 limit이 없으면 JVM이 컨테이너가 아닌 노드 메모리(8GB)를 기준으로 힙 상한을 잡는다.
    # 256Mi 내역: 힙 128Mi(-Xmx) + 비힙 약 128Mi(메타스페이스·코드캐시·스레드스택·GC 구조체).
    #   토픽 5종 규모라 힙 128Mi로 충분하다.
    # limit만 384Mi로 둔다 — 실측 peak 215Mi가 256Mi의 84%라 JVM에 41Mi 여유는 얇다.
    #   limit은 스케줄러 예산에 안 들어가므로 올려도 다른 파드의 자리를 뺏지 않는다.
    #
    # ★ 2026-08-15 — userOperator를 뺐다. KafkaUser CR이 저장소 전체에 0건이고, 리스너가
    #   plain/9092·tls:false·authentication 미설정이라 발급할 자격증명 자체가 없다.
    #   조정할 객체 없이 JVM 컨테이너 하나가 request 256Mi를 잡고 있었다.
    #   되살릴 시점: 리스너에 SCRAM-SHA 또는 mTLS를 켜고 KafkaUser로 계정을 나눌 때.
    topicOperator:                   # KafkaTopic CR을 실제 토픽으로
      resources:
        requests: { cpu: 50m, memory: 256Mi }
        limits:   { cpu: 250m, memory: 384Mi }
      jvmOptions:
        -Xms: 64m
        -Xmx: 128m
