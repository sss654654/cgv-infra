# gp3 StorageClass — EKS 에서 EBS CSI 드라이버가 볼륨을 만드는 규격.
#
# EBS CSI 애드온은 드라이버만 설치하고 StorageClass 를 만들지 않는다. 값 파일(kafka · loki ·
#   mimir · tempo)이 gp3 라는 이름을 부르므로, 이것이 없으면 PVC 가 Pending 에서 움직이지 않는다.
# Terraform 에 두지 않는 이유 — 쿠버네티스 객체라 kubernetes provider 가 필요하고, 그러면
#   클러스터를 만드는 state 가 그 클러스터에 붙는 자격에 의존하게 된다.
#
# WaitForFirstConsumer — 파드가 놓일 노드가 정해진 뒤에 볼륨을 만든다.
#   서브넷이 두 AZ 에 걸쳐 있고 EBS 볼륨은 AZ 하나에 묶여서, 먼저 만들면 파드와 다른 AZ 에 생길 수 있다.
# Delete — PVC 를 지우면 EBS 볼륨도 지운다. 클러스터를 먼저 지우면 PVC 가 안 지워져 볼륨이 남는다
#   (bootstrap/eks/README.md 「지울 때」).
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp3
provisioner: ebs.csi.aws.com
parameters:
  type: gp3
  csi.storage.k8s.io/fstype: ext4
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Delete
allowVolumeExpansion: true
