# MetalLB 주소 풀 — Traefik LoadBalancer가 여기서 IP를 받음.
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: cgv-pool
  namespace: metallb-system
spec:
  addresses:
    - 10.0.0.240-10.0.0.250     # 격리망(OPNsense LAN) 대역. 노드가 10.0.0.11-13 으로 재구성되면서 함께 이동.
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: cgv-l2
  namespace: metallb-system
spec:
  ipAddressPools:
    - cgv-pool
