# stg · queue — queue 자신인가, queue 가 기다리는 쪽인가.
#
# dev 의 queue 대시보드에서 queue 파드 섹션을 가져오고 다듬었다.
#   뺀 것   Traefik 섹션(stg 입구는 ALB — 흐름 장 1행) · 지연 p99 · 5xx(흐름 장 2행)
#   더한 것 HPA 확장(stg 는 4-8대로 실제로 움직인다) · 기다리는 것(Redis 풀 · Kafka 발행)
#
# 읽는 법 — 흐름 장 0행이 깨졌거나 2행에서 p99 가 튀어서 왔다.
#   1행이 차 있다(CPU · 스로틀 · 메모리)          → queue 자신이 한계다
#   1행은 멀쩡한데 2행 대수가 max 에 붙었다        → 대수가 더 필요하다
#   1 · 2행은 멀쩡한데 3행 대기가 늘었다           → 기다리는 쪽이다 → stg · 데이터
#   ★ 전부 멀쩡한데 대기가 안 줄어든다            → 2행 오른쪽의 배경 루프를 본다.
#     루프가 멈추면 오류가 하나도 안 나오면서 일만 진행되지 않는다 — 요청은 200 이고 CPU 도 한가하다
#
# 뺀 패널 — Pending 파드. 노드가 m5.xlarge 넷이고 queue request 가 400m/250Mi 라 8대를 넣어도
#   자리가 남는다. dev 에서 노드 자리가 빠듯할 때 뜻이 있던 패널이고 여기서는 늘 0 이다.
#   늘 같은 값만 나오는 선은 시야만 차지한다. 그 자리에 배경 루프를 넣었다.
apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-stg-queue
  namespace: observability
  labels:
    grafana_dashboard: "1"
data:
  stg-queue.json: |
    {
      "uid": "stg-queue",
      "title": "stg · queue — 자신인가, 기다리는 쪽인가",
      "tags": ["cgv", "stg", "queue"],
      "editable": true,
      "timezone": "browser",
      "time": { "from": "now-1h", "to": "now" },
      "refresh": "30s",
      "schemaVersion": 39,
      "templating": { "list": [] },
      "links": [ { "title": "← stg · 흐름", "type": "link", "url": "/d/stg-flow/?${__url_time_range}" } ],
      "panels": [
        { "type": "row", "title": "1. queue 파드 — 자기 자원", "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 }, "collapsed": false, "panels": [] },
        {
          "id": 1, "type": "timeseries", "title": "메모리 — working_set / limit",
          "description": "100% 에 닿으면 커널이 파드를 죽인다(OOMKill). queue 의 메모리는 연결 수에 비례한다.",
          "datasource": { "type": "prometheus", "uid": "mimir" },
          "gridPos": { "h": 8, "w": 8, "x": 0, "y": 1 },
          "targets": [
            { "refId": "A", "expr": "max by (pod) (container_memory_working_set_bytes{namespace=\"app\", container=\"queue\"}) / on(pod) max by (pod) (kube_pod_container_resource_limits{namespace=\"app\", container=\"queue\", resource=\"memory\"})", "legendFormat": "{{pod}}" }
          ],
          "transformations": [ { "id": "renameByRegex", "options": { "regex": "(.*?)(queue|booking|frontend)-[a-z0-9]+-([a-z0-9]{5})", "renamePattern": "          $3" } } ], "options": { "legend": { "displayMode": "table", "placement": "bottom", "showLegend": true, "calcs": ["lastNotNull", "max"] }, "tooltip": { "mode": "multi", "sort": "desc" } }, "fieldConfig": { "defaults": { "unit": "percentunit", "max": 1.05, "custom": { "thresholdsStyle": { "mode": "line" } }, "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null }, { "color": "red", "value": 1 } ] } }, "overrides": [] }
        },
        {
          "id": 2, "type": "timeseries", "title": "CPU · 스로틀 — limit 대비",
          "description": "CPU 가 limit 에 붙고 스로틀이 생기면 queue 가 CPU 한계다. 스로틀 = 주기 중 CPU 를 못 쓰고 기다린 비율.",
          "datasource": { "type": "prometheus", "uid": "mimir" },
          "gridPos": { "h": 8, "w": 8, "x": 8, "y": 1 },
          "targets": [
            { "refId": "A", "expr": "sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\"app\", container=\"queue\"}[$__rate_interval])) / on(pod) max by (pod) (kube_pod_container_resource_limits{namespace=\"app\", container=\"queue\", resource=\"cpu\"})", "legendFormat": "CPU {{pod}}" },
            { "refId": "B", "expr": "sum by (pod) (rate(container_cpu_cfs_throttled_periods_total{namespace=\"app\", container=\"queue\"}[$__rate_interval])) / sum by (pod) (rate(container_cpu_cfs_periods_total{namespace=\"app\", container=\"queue\"}[$__rate_interval])) and on(pod) (kube_pod_status_phase{namespace=\"app\", phase=\"Running\"} == 1)", "legendFormat": "스로틀 {{pod}}" }
          ],
          "transformations": [ { "id": "renameByRegex", "options": { "regex": "(.*?)(queue|booking|frontend)-[a-z0-9]+-([a-z0-9]{5})", "renamePattern": "          $3" } } ], "options": { "legend": { "displayMode": "table", "placement": "bottom", "showLegend": true, "calcs": ["lastNotNull", "max"] }, "tooltip": { "mode": "multi", "sort": "desc" } }, "fieldConfig": { "defaults": { "unit": "percentunit" }, "overrides": [] }
        },
        {
          "id": 3, "type": "timeseries", "title": "동시 요청 · request 대비 사용",
          "description": "동시 요청 = 파드 안에 지금 들어와 있는 요청 수(고루틴). 이 파드의 메모리가 여기 비례한다(연결당 33-64KB). dev 3만 판에서 458 로 예측했는데 23,000 까지 갔다 — 그 예측이 이번에도 빗나가는지 본다.\n\n오른쪽 축 = request 대비 실사용. limit 대비는 \"죽는가\", request 대비는 \"스펙이 맞나\" 다 — 이 값이 부하 판의 산출물이다.",
          "datasource": { "type": "prometheus", "uid": "mimir" },
          "gridPos": { "h": 8, "w": 8, "x": 16, "y": 1 },
          "targets": [
            { "refId": "A", "expr": "sum by (pod) (go_goroutines{namespace=\"app\", pod=~\"queue-.*\"})", "legendFormat": "동시 요청 {{pod}}" },
            { "refId": "B", "expr": "avg(sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\"app\", container=\"queue\"}[$__rate_interval])) / on(pod) max by (pod) (kube_pod_container_resource_requests{namespace=\"app\", container=\"queue\", resource=\"cpu\"}))", "legendFormat": "CPU / request" },
            { "refId": "C", "expr": "avg(max by (pod) (container_memory_working_set_bytes{namespace=\"app\", container=\"queue\"}) / on(pod) max by (pod) (kube_pod_container_resource_requests{namespace=\"app\", container=\"queue\", resource=\"memory\"}))", "legendFormat": "메모리 / request" }
          ],
          "transformations": [ { "id": "renameByRegex", "options": { "regex": "(.*?)(queue|booking|frontend)-[a-z0-9]+-([a-z0-9]{5})", "renamePattern": "          $3" } } ], "options": { "legend": { "displayMode": "table", "placement": "bottom", "showLegend": true, "calcs": ["lastNotNull", "max"] }, "tooltip": { "mode": "multi", "sort": "desc" } }, "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [ { "matcher": { "id": "byRegexp", "options": ".*/ request$" }, "properties": [ { "id": "unit", "value": "percentunit" }, { "id": "custom.axisPlacement", "value": "right" } ] } ] }
        },

        { "type": "row", "title": "2. 확장 — HPA (4-8대)", "gridPos": { "h": 1, "w": 24, "x": 0, "y": 9 }, "collapsed": false, "panels": [] },
        {
          "id": 4, "type": "timeseries", "title": "대수 — 목표 vs 실제 · CPU / request (HPA 기준 70%)",
          "description": "CPU 가 70% 를 넘으면 HPA 가 목표 대수를 올린다. 목표가 올랐는데 실제가 늦게 따라오면 파드 기동이 늦다. 실제가 max 에 붙었는데 CPU 가 계속 오르면 대수가 모자라다.",
          "datasource": { "type": "prometheus", "uid": "mimir" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 10 },
          "targets": [
            { "refId": "A", "expr": "max(kube_horizontalpodautoscaler_status_desired_replicas{horizontalpodautoscaler=\"queue\"})", "legendFormat": "목표 대수" },
            { "refId": "B", "expr": "max(kube_horizontalpodautoscaler_status_current_replicas{horizontalpodautoscaler=\"queue\"})", "legendFormat": "실제 대수" },
            { "refId": "C", "expr": "max(kube_horizontalpodautoscaler_spec_max_replicas{horizontalpodautoscaler=\"queue\"})", "legendFormat": "max" },
            { "refId": "D", "expr": "avg(sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\"app\", container=\"queue\"}[$__rate_interval])) / on(pod) max by (pod) (kube_pod_container_resource_requests{namespace=\"app\", container=\"queue\", resource=\"cpu\"}))", "legendFormat": "CPU / request (평균)" }
          ],
          "transformations": [ { "id": "renameByRegex", "options": { "regex": "(.*?)(queue|booking|frontend)-[a-z0-9]+-([a-z0-9]{5})", "renamePattern": "          $3" } } ], "options": { "legend": { "displayMode": "table", "placement": "bottom", "showLegend": true, "calcs": ["lastNotNull", "max"] }, "tooltip": { "mode": "multi", "sort": "desc" } }, "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [ { "matcher": { "id": "byName", "options": "CPU / request (평균)" }, "properties": [ { "id": "unit", "value": "percentunit" }, { "id": "custom.axisPlacement", "value": "right" } ] } ] }
        },
        {
          "id": 5, "type": "timeseries", "title": "배경 루프 — 마지막 완주로부터 지난 시간",
          "description": "25초를 넘으면 그 루프가 멈춘 것이다. 멈추면 오류가 하나도 안 나오면서 일만 진행되지 않는다 — 요청은 200 이고 CPU 도 한가한데 대기자가 안 줄어든다.\n\npromote 승격 · session_timeout 만료 회수 · waiting_timeout 대기자 정리 · pending_sweep 재발행\n\n정상값이 0 이 아니다 — 수집 주기(15초)가 그대로 더해진다. 임계는 가장 느린 루프(10초)+15초.\n루프는 도는데 승격이 안 되면 발행 실패로 쉬는 중이다(오른쪽 Kafka 발행 실패).",
          "datasource": { "type": "prometheus", "uid": "mimir" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 10 },
          "targets": [
            { "refId": "A", "expr": "time() - max by (loop) (queue_loop_last_tick_timestamp_seconds)", "legendFormat": "{{loop}}" }
          ],
          "transformations": [ { "id": "renameByRegex", "options": { "regex": "(.*?)(queue|booking|frontend)-[a-z0-9]+-([a-z0-9]{5})", "renamePattern": "          $3" } } ], "options": { "legend": { "displayMode": "table", "placement": "bottom", "showLegend": true, "calcs": ["lastNotNull", "max"] }, "tooltip": { "mode": "multi", "sort": "desc" } }, "fieldConfig": { "defaults": { "unit": "s", "custom": { "thresholdsStyle": { "mode": "line" } }, "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null }, { "color": "red", "value": 25 } ] } }, "overrides": [] }
        },

        { "type": "row", "title": "3. 기다리는 것 — 늘면 stg · 데이터", "gridPos": { "h": 1, "w": 24, "x": 0, "y": 18 }, "collapsed": false, "panels": [] },
        {
          "id": 6, "type": "timeseries", "title": "Redis 풀 — 대기 · 타임아웃 · 연결",
          "description": "풀 대기(초/초)가 늘면 queue 가 Redis 연결을 기다린다.\n★ 풀 타임아웃은 명령이 느린 것이 아니라 풀에서 연결을 못 얻은 것이다. 둘은 원인이 다르다 — 연결을 못 얻는 것은 풀이 좁은 것(REDIS_POOL_SIZE 50)이고, 명령이 느린 것은 Redis 가 느린 것(명령 타임아웃 500ms)이다. 명령 자체가 느린지는 데이터 장 1행의 trace 와 booking 의 명령 시간으로 본다.\n받는 쪽(ElastiCache)이 찼는지도 데이터 장 1행.",
          "datasource": { "type": "prometheus", "uid": "mimir" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 19 },
          "links": [ { "title": "→ stg · 데이터", "url": "/d/stg-data/?${__url_time_range}" } ],
          "targets": [
            { "refId": "A", "expr": "sum(rate(queue_redis_pool_wait_seconds_total[$__rate_interval]))", "legendFormat": "풀 대기(초/초)" },
            { "refId": "B", "expr": "sum(rate(queue_redis_pool_timeouts_total[$__rate_interval])) or vector(0)", "legendFormat": "풀 타임아웃/초" },
            { "refId": "C", "expr": "sum by (state) (queue_redis_pool)", "legendFormat": "연결 {{state}}" }
          ],
          "transformations": [ { "id": "renameByRegex", "options": { "regex": "(.*?)(queue|booking|frontend)-[a-z0-9]+-([a-z0-9]{5})", "renamePattern": "          $3" } } ], "options": { "legend": { "displayMode": "table", "placement": "bottom", "showLegend": true, "calcs": ["lastNotNull", "max"] }, "tooltip": { "mode": "multi", "sort": "desc" } }, "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [ { "matcher": { "id": "byRegexp", "options": "연결 .*" }, "properties": [ { "id": "custom.axisPlacement", "value": "right" } ] } ] }
        },
        {
          "id": 7, "type": "timeseries", "title": "Kafka 발행 — p99 · 실패",
          "description": "발행이 느려지거나 실패하면 입장 통보가 늦는다(흐름 장 3행). 실패한 발행은 저널에 남아 스윕이 다시 보낸다.",
          "datasource": { "type": "prometheus", "uid": "mimir" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 19 },
          "links": [ { "title": "→ stg · 데이터", "url": "/d/stg-data/?${__url_time_range}" } ],
          "targets": [
            { "refId": "A", "expr": "histogram_quantile(0.99, sum by (le, topic) (rate(queue_kafka_publish_duration_seconds_bucket[$__rate_interval])))", "legendFormat": "p99 {{topic}}" },
            { "refId": "B", "expr": "sum(rate(queue_kafka_publish_failures_total[$__rate_interval])) or vector(0)", "legendFormat": "실패/초" }
          ],
          "transformations": [ { "id": "renameByRegex", "options": { "regex": "(.*?)(queue|booking|frontend)-[a-z0-9]+-([a-z0-9]{5})", "renamePattern": "          $3" } } ], "options": { "legend": { "displayMode": "table", "placement": "bottom", "showLegend": true, "calcs": ["lastNotNull", "max"] }, "tooltip": { "mode": "multi", "sort": "desc" } }, "fieldConfig": { "defaults": { "unit": "s" }, "overrides": [ { "matcher": { "id": "byName", "options": "실패/초" }, "properties": [ { "id": "unit", "value": "short" }, { "id": "custom.axisPlacement", "value": "right" } ] } ] }
        },

        { "type": "row", "title": "4. 흔적", "gridPos": { "h": 1, "w": 24, "x": 0, "y": 27 }, "collapsed": false, "panels": [] },
        {
          "id": 8, "type": "logs", "title": "queue 경고 · 오류 로그",
          "datasource": { "type": "loki", "uid": "loki" },
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 28 },
          "targets": [ { "refId": "A", "expr": "{pod=~\"queue-.*\"} |~ \"WARN|ERROR\"" } ],
          "options": { "showTime": true, "wrapLogMessage": true, "sortOrder": "Descending" }
        }
      ]
    }
