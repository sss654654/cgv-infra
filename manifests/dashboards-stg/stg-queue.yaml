# stg · queue — queue 자신인가, queue 가 기다리는 쪽인가.
#
# dev 의 queue 대시보드에서 queue 파드 섹션을 가져오고 다듬었다.
#   뺀 것   Traefik 섹션(stg 입구는 ALB — 흐름 장 1행) · 지연 p99 · 5xx(흐름 장 2행)
#   더한 것 HPA 확장(stg 는 4-8대로 실제로 움직인다) · 기다리는 것(Redis 풀 · Kafka 발행)
#
# 읽는 법 — 흐름 장 2행에서 p99 가 튀어서 왔다.
#   1행이 차 있다(CPU · 스로틀 · 메모리)          → queue 자신이 한계다
#   1행은 멀쩡한데 2행 대수가 max 에 붙었다        → 대수가 더 필요하다
#   1 · 2행은 멀쩡한데 3행 대기가 늘었다           → 기다리는 쪽이다 → stg · 데이터
apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-stg-queue
  namespace: observability
  labels:
    grafana_dashboard: "1"
data:
  stg-queue.json: |
    {
      "uid": "stg-queue",
      "title": "stg · queue — 자신인가, 기다리는 쪽인가",
      "tags": ["cgv", "stg", "queue"],
      "editable": true,
      "timezone": "browser",
      "time": { "from": "now-1h", "to": "now" },
      "refresh": "30s",
      "schemaVersion": 39,
      "templating": { "list": [] },
      "links": [ { "title": "← stg · 흐름", "type": "link", "url": "/d/stg-flow/?${__url_time_range}" } ],
      "panels": [
        { "type": "row", "title": "1. queue 파드 — 자기 자원", "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 }, "collapsed": false, "panels": [] },
        {
          "id": 1, "type": "timeseries", "title": "메모리 — working_set / limit",
          "description": "100% 에 닿으면 커널이 파드를 죽인다(OOMKill). queue 의 메모리는 연결 수에 비례한다.",
          "datasource": { "type": "prometheus", "uid": "mimir" },
          "gridPos": { "h": 8, "w": 8, "x": 0, "y": 1 },
          "targets": [
            { "refId": "A", "expr": "max by (pod) (container_memory_working_set_bytes{namespace=\"app\", container=\"queue\"}) / on(pod) max by (pod) (kube_pod_container_resource_limits{namespace=\"app\", container=\"queue\", resource=\"memory\"})", "legendFormat": "{{pod}}" }
          ],
          "fieldConfig": { "defaults": { "unit": "percentunit", "max": 1.05, "custom": { "thresholdsStyle": { "mode": "line" } }, "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null }, { "color": "red", "value": 1 } ] } }, "overrides": [] }
        },
        {
          "id": 2, "type": "timeseries", "title": "CPU · 스로틀 — limit 대비",
          "description": "CPU 가 limit 에 붙고 스로틀이 생기면 queue 가 CPU 한계다. 스로틀 = 주기 중 CPU 를 못 쓰고 기다린 비율.",
          "datasource": { "type": "prometheus", "uid": "mimir" },
          "gridPos": { "h": 8, "w": 8, "x": 8, "y": 1 },
          "targets": [
            { "refId": "A", "expr": "sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\"app\", container=\"queue\"}[$__rate_interval])) / on(pod) max by (pod) (kube_pod_container_resource_limits{namespace=\"app\", container=\"queue\", resource=\"cpu\"})", "legendFormat": "CPU {{pod}}" },
            { "refId": "B", "expr": "sum by (pod) (rate(container_cpu_cfs_throttled_periods_total{namespace=\"app\", container=\"queue\"}[$__rate_interval])) / sum by (pod) (rate(container_cpu_cfs_periods_total{namespace=\"app\", container=\"queue\"}[$__rate_interval])) and on(pod) (kube_pod_status_phase{namespace=\"app\", phase=\"Running\"} == 1)", "legendFormat": "스로틀 {{pod}}" }
          ],
          "fieldConfig": { "defaults": { "unit": "percentunit" }, "overrides": [] }
        },
        {
          "id": 3, "type": "timeseries", "title": "고루틴 — 동시 처리 요청 수를 따라간다",
          "description": "요청마다 고루틴이 하나씩 뜬다. queue HTTP 서버에는 연결 수 상한이 없어서, 이 선이 파드 안에 동시에 들어와 있는 요청 수를 보여 준다.",
          "datasource": { "type": "prometheus", "uid": "mimir" },
          "gridPos": { "h": 8, "w": 8, "x": 16, "y": 1 },
          "targets": [
            { "refId": "A", "expr": "sum by (pod) (go_goroutines{namespace=\"app\", pod=~\"queue-.*\"})", "legendFormat": "{{pod}}" }
          ],
          "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] }
        },

        { "type": "row", "title": "2. 확장 — HPA (4-8대)", "gridPos": { "h": 1, "w": 24, "x": 0, "y": 9 }, "collapsed": false, "panels": [] },
        {
          "id": 4, "type": "timeseries", "title": "대수 — 목표 vs 실제 · CPU / request (HPA 기준 70%)",
          "description": "CPU 가 70% 를 넘으면 HPA 가 목표 대수를 올린다. 목표가 올랐는데 실제가 늦게 따라오면 파드 기동이 늦다. 실제가 max 에 붙었는데 CPU 가 계속 오르면 대수가 모자라다.",
          "datasource": { "type": "prometheus", "uid": "mimir" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 10 },
          "targets": [
            { "refId": "A", "expr": "max(kube_horizontalpodautoscaler_status_desired_replicas{horizontalpodautoscaler=\"queue\"})", "legendFormat": "목표 대수" },
            { "refId": "B", "expr": "max(kube_horizontalpodautoscaler_status_current_replicas{horizontalpodautoscaler=\"queue\"})", "legendFormat": "실제 대수" },
            { "refId": "C", "expr": "max(kube_horizontalpodautoscaler_spec_max_replicas{horizontalpodautoscaler=\"queue\"})", "legendFormat": "max" },
            { "refId": "D", "expr": "avg(sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\"app\", container=\"queue\"}[$__rate_interval])) / on(pod) max by (pod) (kube_pod_container_resource_requests{namespace=\"app\", container=\"queue\", resource=\"cpu\"}))", "legendFormat": "CPU / request (평균)" }
          ],
          "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [ { "matcher": { "id": "byName", "options": "CPU / request (평균)" }, "properties": [ { "id": "unit", "value": "percentunit" }, { "id": "custom.axisPlacement", "value": "right" } ] } ] }
        },
        {
          "id": 5, "type": "timeseries", "title": "Pending 파드 — 늘릴 자리가 있나",
          "description": "HPA 가 늘린 파드가 노드에 자리가 없어 못 뜨면 여기 쌓인다. 0 이 정상이다.",
          "datasource": { "type": "prometheus", "uid": "mimir" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 10 },
          "targets": [
            { "refId": "A", "expr": "sum(kube_pod_status_phase{namespace=\"app\", phase=\"Pending\"}) or vector(0)", "legendFormat": "Pending(app)" }
          ],
          "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] }
        },

        { "type": "row", "title": "3. 기다리는 것 — 늘면 stg · 데이터", "gridPos": { "h": 1, "w": 24, "x": 0, "y": 18 }, "collapsed": false, "panels": [] },
        {
          "id": 6, "type": "timeseries", "title": "Redis 풀 — 대기 · 타임아웃 · 연결",
          "description": "풀 대기(초/초)가 늘면 queue 가 Redis 연결을 기다린다. 타임아웃이 생기면 명령이 500ms 안에 안 끝났다. 받는 쪽(ElastiCache)이 찼는지는 데이터 장 1행.",
          "datasource": { "type": "prometheus", "uid": "mimir" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 19 },
          "links": [ { "title": "→ stg · 데이터", "url": "/d/stg-data/?${__url_time_range}" } ],
          "targets": [
            { "refId": "A", "expr": "sum(rate(queue_redis_pool_wait_seconds_total[$__rate_interval]))", "legendFormat": "풀 대기(초/초)" },
            { "refId": "B", "expr": "sum(rate(queue_redis_pool_timeouts_total[$__rate_interval])) or vector(0)", "legendFormat": "풀 타임아웃/초" },
            { "refId": "C", "expr": "sum by (state) (queue_redis_pool)", "legendFormat": "연결 {{state}}" }
          ],
          "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [ { "matcher": { "id": "byRegexp", "options": "연결 .*" }, "properties": [ { "id": "custom.axisPlacement", "value": "right" } ] } ] }
        },
        {
          "id": 7, "type": "timeseries", "title": "Kafka 발행 — p99 · 실패",
          "description": "발행이 느려지거나 실패하면 입장 통보가 늦는다(흐름 장 3행). 실패한 발행은 저널에 남아 스윕이 다시 보낸다.",
          "datasource": { "type": "prometheus", "uid": "mimir" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 19 },
          "links": [ { "title": "→ stg · 데이터", "url": "/d/stg-data/?${__url_time_range}" } ],
          "targets": [
            { "refId": "A", "expr": "histogram_quantile(0.99, sum by (le, topic) (rate(queue_kafka_publish_duration_seconds_bucket[$__rate_interval])))", "legendFormat": "p99 {{topic}}" },
            { "refId": "B", "expr": "sum(rate(queue_kafka_publish_failures_total[$__rate_interval])) or vector(0)", "legendFormat": "실패/초" }
          ],
          "fieldConfig": { "defaults": { "unit": "s" }, "overrides": [ { "matcher": { "id": "byName", "options": "실패/초" }, "properties": [ { "id": "unit", "value": "short" }, { "id": "custom.axisPlacement", "value": "right" } ] } ] }
        },

        { "type": "row", "title": "4. 흔적", "gridPos": { "h": 1, "w": 24, "x": 0, "y": 27 }, "collapsed": false, "panels": [] },
        {
          "id": 8, "type": "logs", "title": "queue 경고 · 오류 로그",
          "datasource": { "type": "loki", "uid": "loki" },
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 28 },
          "targets": [ { "refId": "A", "expr": "{pod=~\"queue-.*\"} |~ \"WARN|ERROR\"" } ],
          "options": { "showTime": true, "wrapLogMessage": true, "sortOrder": "Descending" }
        }
      ]
    }
