            { "refId": "B", "expr": "histogram_quantile(0.99, sum by (le) (rate(http_server_requests_seconds_bucket{application=\"cgv-booking\", uri=\"/api/screenings/board\"}[$__rate_interval])))", "legendFormat": "board(로비 · 참고)" }
          ],
          "transformations": [ { "id": "renameByRegex", "options": { "regex": "(.*)targetgroup/k8s-app-([a-z]+)-.*", "renamePattern": "          $2" } } ], "options": { "legend": { "displayMode": "table", "placement": "bottom", "showLegend": true, "calcs": ["lastNotNull", "max"] }, "tooltip": { "mode": "multi", "sort": "desc" } }, "fieldConfig": { "defaults": { "unit": "s", "custom": { "thresholdsStyle": { "mode": "line" } }, "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null }, { "color": "red", "value": 1 } ] } }, "overrides": [ { "matcher": { "id": "byName", "options": "board(로비 · 참고)" }, "properties": [ { "id": "custom.lineStyle", "value": { "dash": [8, 4], "fill": "dash" } } ] } ] }
        },
