          "description": "0행 5번(예매 여정)의 진단이다. 넷이 그 SLO 의 분모이고 통과선 1초가 그 기준이다.\n어느 단계가 느린가 — 확정(/api/bookings)만 느리면 MySQL 쪽, 전부 같이 느리면 파드나 Redis 쪽을 먼저 본다.\n★ 로비 폴링(/api/screenings/board)은 점선으로 따로 둔다. 그건 1번 관문이라 이 SLO 의 분모가 아니다 — 싸고 많아서 같이 세면 느린 확정을 가린다.\n점(exemplar)을 누르면 trace 가 열린다.",
