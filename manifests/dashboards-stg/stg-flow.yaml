# stg · 흐름 — 통과했나(0행), 아니라면 어디서 막혔나(1-4행).
#
# 화면 구성
#   0행  판정        관문 다섯 + 불변식. 여기만 보면 통과 여부가 끝난다
#   1행  입구(ALB)   요청이 들어왔나 · 입구가 버린 것이 있나
#   2행  대기열      줄에 섰나 · 대기 화면이 살아 있나
#   3행  전달(Kafka) 자리를 주고받는 데 얼마나 걸렸나
#   4행  예매        어느 단계가 느린가 · 왜 실패했나
#   5행  노드        접어 둔다. 서비스 지표가 전부 정상인데 느릴 때만 연다
#
# 행마다 패널을 최대 둘로 줄였다(2026-09-13). 그 전에는 행마다 셋이었고 한 패널에 선이 열하나까지
#   들어가, 판 도중에 어디를 봐야 하는지 고르는 데 시간이 걸렸다. 행 제목이 그 행에서
#   답할 질문을 적고, 패널이 그 질문의 앞뒤를 나눈다.
#
# 뺀 것과 그 근거 (전부 다른 자리가 같은 것을 더 정확하게 본다)
#   enter 상태별 막대(200·202·400·503)  0행 2번이 성공률로 판정하고, 503 의 원인은 3행의 발행 실패다.
#                                        막대가 오른쪽 축을 차지해 enter 의 exemplar 점이 묻혔다
#   줄서기 누적 참고 칸                   0행 2번이 빌 때 읽던 예비였다. PrewarmHTTPSeries 배포 뒤
#                                        0행이 정상으로 차는 것을 확인해(2026-09-13) 근거가 없어졌다
#   Kafka 건수 넷(준 수·발급·확정·반환)   준 것과 받은 것이 안 맞는 것은 0행 불변식(컨슈머 랙)이 더
#                                        정확하다 — 앱 카운터 뺄셈은 파드 재시작에 흔들린다.
#                                        자리가 안 돌아오는 것은 2행의 대기·입장이 직접 보여 준다
#   ALB 5xx·비정상 대상의 대상그룹 분해   0 인 선이 대상그룹마다 세 줄씩이라 범례가 열한 줄이 됐고,
#                                        이름 치환이 접두사까지 지워 booking·frontend·queue 가
#                                        세 번씩 겹쳐 찍혔다. 합으로 두고, 갈라 볼 일은 0행이 가른다
#
# 0행 = 서비스 수준 목표(SLO). 사용자가 겪는 것만 있다 — CPU · 메모리 · 풀은 없다.
#   SLI = 좋은 사건 ÷ 유효한 사건. 지연도 "기준 안에 든 비율" 로 쓴다. 그래야 다섯이 같은 꼴이
#   되어 에러 버짓(100% − 목표)이 하나의 개념으로 통한다. p99 는 아래 진단 행에 둔다.
#   관문 다섯 = SLO 다섯. 사용자 여정에서 뽑았고 빠진 관문도 겹치는 관문도 없다.
#     1 로비 99.9% · 2 줄서기 99.9% · 3 순번 조회 99% · 4 전파 99.9% · 5 예매 여정 99%
#   ★ SLO 가 아닌 값은 0행에 두지 않는다. "1초 이내 비율" 같은 참고 지표를 옆에 두었더니
#     그 칸만 빨강이라 판정이 깨진 것처럼 보였다 — 줄서기 SLO 는 성공률이고 시간이 아니다.
#     시간은 2행의 enter p99 선으로 본다.
#   ★ 불변식만 예외로 0행에 남긴다. SLO 는 아니지만 "이 판이 유효한가" 라서, 캡처 한 장에
#     판정과 유효성이 같이 있어야 한다. 제목이 그 차이를 적는다.
#   ★ 분모에서 빼는 것이 목표값보다 중요하다.
#     400  형식이 틀린 요청. 클라이언트 잘못이지 서비스 품질이 아니다
#     409  좌석이 실제로 없어서 실패한 것. 정상 결과다
#          409 를 분모에 넣으면 좌석 4,000 에 16만 명이 올 때 성공률이 2.5% 로 나온다 —
#          시스템은 같은데 숫자만 40배 다르다
#   ★ 여기서 재지 않는 것 — 내 순번이 줄어드는 속도. 대기열은 기다리게 하는 것이 기능이고,
#     대기 시간은 정원 ÷ 인원의 결과다. SLO 로 두면 "손님이 많이 왔더니 위반" 이 된다.
#   ★ 목표값은 실사용 데이터 없이 정한 초기값이다. 근거는 사람의 지각 한계(1초)와 시스템 구조
#     (폴링 주기 · 좌석 락 TTL)이지 관측이 아니다. 판을 돌린 뒤 달성 가능한 수준을 보고 다시 정한다.
#
# ★ 해상도가 세 가지다.
#   입구(ALB)  CloudWatch 를 YACE 가 1분 단위로 가져와 몇 분 늦게 들어온다
#   queue      5초 (envs/stg/queue.yaml metrics.interval). 오픈 봉우리가 15초 한 주기 안에
#              전부 들어와 표본이 하나만 남던 것을 줄이려고 여기만 줄였다
#   나머지 앱   15초 / 노드(node-exporter) 60초 → 노드 지표는 [3m] 이상으로 봐야 표본이 둘 이상 든다
#
# ★ 라이브에서 확인해 고친 것들.
#   le 라벨은 "1" 이 아니라 "1.0" 이다. queue(Go client_golang) · booking(Micrometer) · 전파 지연
#     셋 다 같다. "1" 로 적으면 아무것도 안 걸려 패널이 No data 가 되는데, 그 화면은
#     "지표가 없다" 가 아니라 "조건에 맞는 요청이 없다" 로 읽힌다.
#   queue_waiting · queue_active 는 sum 하면 안 된다. Redis 의 한 값을 파드 넷이 각각 보고하므로
#     sum 은 네 배가 된다 — 정원 1,000 인데 입장이 4,000 으로 보여 정원 초과 불변식이
#     항상 위반으로 떴다. max 로 읽는다.
#   지표 이름(YACE snake_case)은 정규식으로 받는다 — 문서에 변환 규칙이 없다.
#   ★ rate · increase 는 그 시계열의 첫 표본 이전의 증가를 못 센다. 어떤 경로의 첫 요청이
#     오픈 봉우리에서 들어오면 시계열이 그때 처음 생기고 첫 표본에 이미 봉우리가 다 들어 있어,
#     계산할 앞 표본이 없다. 그 뒤로는 카운터가 평평해서 rate 가 0 이다 — 2026-09-13 5만 명
#     판에서 enter 50,000건이 0행 2번과 2행 어디에도 안 나타났다. 앱이 기동할 때 그 조합의
#     시계열을 0 으로 만들어 두면 해결된다(queue-go metrics.PrewarmHTTPSeries).
#     2026-09-13 16:11 판에서 0행 2번이 정상으로 차는 것을 확인했다. 그 배포 앞의 판
#     (14:50)은 이 칸이 영영 안 찬다 — 시계열에 "0 이었던 순간" 이 아예 없어서다.
apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-stg-flow
  namespace: observability
  labels:
    grafana_dashboard: "1"
data:
  stg-flow.json: |
    {
      "uid": "stg-flow",
      "title": "stg · 흐름 — 통과했나, 아니면 어디서 막혔나",
      "tags": ["cgv", "stg"],
      "editable": true,
      "timezone": "browser",
      "time": { "from": "now-1h", "to": "now" },
      "refresh": "30s",
      "schemaVersion": 39,
      "templating": { "list": [] },
      "panels": [
        { "type": "row", "title": "0. 판정 — 관문 다섯이 전부 초록이면 통과다. 아래 행은 안 봐도 된다", "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 }, "collapsed": false, "panels": [] },
        {
          "id": 20, "type": "stat", "title": "1. 로비 — 사이트가 뜬다",
          "description": "오픈 전, 방문자가 로비에서 현황판을 3초마다 부른다. 여기가 죽으면 아무도 예매하기를 못 누르고, 그러면 2번은 분모가 비어 통과해 버린다 — 앞 관문의 실패가 뒤에서 안 보이므로 따로 잰다. dev 에서 실제로 이 경로만 대기열 보호 밖이라 booking 이 먼저 무너진 적이 있다(그래서 nginx 캐시를 넣었다).\n\n좋은 사건 = 2xx · 유효한 사건 = 2xx + 5xx · 측정 = ALB frontend 대상그룹\n목표 99.9%",
          "datasource": { "type": "prometheus", "uid": "mimir" },
          "gridPos": { "h": 6, "w": 4, "x": 0, "y": 1 },
          "targets": [
            { "refId": "A", "expr": "sum(sum_over_time({__name__=~\"aws_applicationelb_httpcode_target_2_?xx_count_sum\", dimension_TargetGroup=~\".*frontend.*\"}[$__range])) / (sum(sum_over_time({__name__=~\"aws_applicationelb_httpcode_target_2_?xx_count_sum\", dimension_TargetGroup=~\".*frontend.*\"}[$__range])) + (sum(sum_over_time({__name__=~\"aws_applicationelb_httpcode_target_5_?xx_count_sum\", dimension_TargetGroup=~\".*frontend.*\"}[$__range])) or vector(0)))" }
          ],
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "textMode": "auto", "graphMode": "none" },
          "fieldConfig": { "defaults": { "unit": "percentunit", "decimals": 3, "thresholds": { "mode": "absolute", "steps": [ { "color": "red", "value": null }, { "color": "green", "value": 0.999 } ] } }, "overrides": [] }
        },
        {
          "id": 21, "type": "stat", "title": "2. 줄서기 — 누르면 줄에 선다",
          "description": "대기열이 존재하는 이유다. 대기열이 없으면 오픈 순간 전원이 booking 으로 몰려 서버가 죽고 모두 실패한다. 줄을 세우는 대신 \"전원을 받아 준다\" 를 약속한 것이므로 여기가 가장 엄격하다.\n\n좋은 사건 = 200(즉시 입장) · 202(대기 등록) · 유효한 사건 = enter 전체 − 400\n503(발행 실패 RETRY_LATER)은 실패로 센다 — 사용자 눈에는 줄서기 실패다.\n목표 99.9%. 깨지면 3행의 발행 실패를 본다 — 503 이 나는 경로는 그것뿐이다.\n\n★ 이 값은 \"줄에 섰나\" 만 본다 — 이것이 SLO 다. 얼마나 기다려 섰는지는 2행의 enter p99 선이 본다. 9초 걸려 선 것과 50ms 에 선 것이 여기서는 같은 100% 다.\n★ 칸이 비어 있으면 enter 시계열이 오픈 봉우리에서 처음 생긴 것이다(increase 가 앞 표본을 못 찾는다). 앱에 PrewarmHTTPSeries 가 들어간 뒤로는 이 칸이 정상으로 찬다(2026-09-13 확인).",
          "datasource": { "type": "prometheus", "uid": "mimir" },
          "gridPos": { "h": 6, "w": 4, "x": 4, "y": 1 },
          "targets": [
            { "refId": "A", "expr": "sum(increase(queue_http_request_duration_seconds_count{path=\"/api/admission/enter\", status=~\"2..\"}[$__range])) / sum(increase(queue_http_request_duration_seconds_count{path=\"/api/admission/enter\", status!=\"400\"}[$__range]))" }
          ],
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "textMode": "auto", "graphMode": "none" },
          "fieldConfig": { "defaults": { "unit": "percentunit", "decimals": 3, "thresholds": { "mode": "absolute", "steps": [ { "color": "red", "value": null }, { "color": "green", "value": 0.999 } ] } }, "overrides": [] }
        },
        {
          "id": 22, "type": "stat", "title": "3. 순번 조회 — 화면이 살아 있다",
          "description": "대기 화면은 폴링으로 갱신된다. 응답이 폴링 주기(가장 짧은 것이 1초)를 넘으면 다음 폴링이 앞 응답을 기다려 화면 갱신이 밀린다. 1초는 사람이 반응이 끊겼다고 느끼기 시작하는 선이기도 하다.\n\n좋은 사건 = 200 을 1초 안에 · 유효한 사건 = position 전체\n★ 분자에 status 조건이 있어야 한다 — 50ms 만에 돌아온 503 은 빠르지만 좋은 사건이 아니다.\n목표 99%",
          "datasource": { "type": "prometheus", "uid": "mimir" },
          "gridPos": { "h": 6, "w": 4, "x": 8, "y": 1 },
          "targets": [
            { "refId": "A", "expr": "sum(increase(queue_http_request_duration_seconds_bucket{path=\"/api/admission/position\", status=\"200\", le=\"1.0\"}[$__range])) / sum(increase(queue_http_request_duration_seconds_count{path=\"/api/admission/position\"}[$__range]))" }
          ],
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "textMode": "auto", "graphMode": "none" },
          "fieldConfig": { "defaults": { "unit": "percentunit", "decimals": 3, "thresholds": { "mode": "absolute", "steps": [ { "color": "red", "value": null }, { "color": "green", "value": 0.99 } ] } }, "overrides": [] }
        },
        {
          "id": 23, "type": "stat", "title": "4. 전파 — 들어가면 문이 열려 있다",
          "description": "queue 가 \"입장했습니다\" 를 띄운 순간과 booking 이 그 사실을 아는 순간이 다르다. 그 사이에 회차를 누르면 403 — 사용자 눈에는 \"입장했는데 거절당했다\" 다.\n★ 이 구간은 어느 요청 지표에도 안 나타난다. enter 도 403 도 각자 기준으로는 정상이고 빠른데 사용자만 실패한다.\n\n좋은 = 1초 안에 booking 도달 · 유효 = 입장 확정 전체 · 목표 99.9%\n깨지면 3행 왼쪽(주는 방향)을 본다.",
          "datasource": { "type": "prometheus", "uid": "mimir" },
          "gridPos": { "h": 6, "w": 4, "x": 12, "y": 1 },
          "targets": [
            { "refId": "A", "expr": "sum(increase(booking_admission_lag_seconds_bucket{le=\"1.0\"}[$__range])) / sum(increase(booking_admission_lag_seconds_count[$__range]))" }
          ],
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "textMode": "auto", "graphMode": "none" },
          "fieldConfig": { "defaults": { "unit": "percentunit", "decimals": 3, "thresholds": { "mode": "absolute", "steps": [ { "color": "red", "value": null }, { "color": "green", "value": 0.999 } ] } }, "overrides": [] }
        },
        {
          "id": 24, "type": "stat", "title": "5. 예매 여정 — 표가 손에 들어온다",
          "description": "입장 뒤 요청 넷 전부를 센다 — 회차 · 좌석 · 선점 · 확정.\n★ 확정만 세면 앞 단계가 죽을수록 분모가 줄어 뒤가 좋아 보인다. 넷을 다 세야 어디서 막혀도 잡힌다.\n로비 폴링(board)은 빼고 센다 — 그건 1번 관문이고, 싸고 많아서 넣으면 느린 확정을 가린다.\n\n좋은 사건 = 2xx 를 1초 안에 · 유효한 사건 = 넷 전체 − 409\n목표 99%. 줄 서서 입장까지 한 사람이 여기서 실패하면 자리를 잃는다 — 가장 비싼 실패다.\n깨지면 4행을 본다.",
          "datasource": { "type": "prometheus", "uid": "mimir" },
          "gridPos": { "h": 6, "w": 4, "x": 16, "y": 1 },
          "targets": [
            { "refId": "A", "expr": "sum(increase(http_server_requests_seconds_bucket{application=\"cgv-booking\", uri=~\"/api/screenings|/api/seats|/api/seats/select|/api/bookings\", status=~\"2..\", le=\"1.0\"}[$__range])) / sum(increase(http_server_requests_seconds_count{application=\"cgv-booking\", uri=~\"/api/screenings|/api/seats|/api/seats/select|/api/bookings\", status!=\"409\"}[$__range]))" }
          ],
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "textMode": "auto", "graphMode": "none" },
          "fieldConfig": { "defaults": { "unit": "percentunit", "decimals": 3, "thresholds": { "mode": "absolute", "steps": [ { "color": "red", "value": null }, { "color": "green", "value": 0.99 } ] } }, "overrides": [] }
        },
        {
          "id": 25, "type": "stat", "title": "불변식 — 0 이 아니면 판이 무효다",
          "description": "SLO 가 아니다. \"정원 초과를 0.1% 까지 허용\" 은 말이 안 되므로 참/거짓이다. 0 이 아니면 목표가 아니라 코드를 고칠 일이다.\n\n정원 초과 = 입장 − 정원. 게이트가 Redis Lua 안에서 원자로 도는데 그게 깨진 것이다.\n미소비 잔량 = 브로커가 세는 \"발행됐는데 booking 이 아직 안 가져간 수\"(컨슈머 그룹 랙). 판이 끝난 뒤 0 이어야 한다. SLO 4 는 받은 것만 세어 유실을 못 보므로 이 값이 그 자리를 맡는다.\n\n★ 앱 카운터 둘의 뺄셈(발행 − 수신)을 썼다가 두 번 틀렸다. increase() 는 외삽 오차로 −24 가 나왔고, 카운터 직접 뺄셈은 booking 파드가 판 앞에 재시작해 한쪽만 0 에서 시작하자 −12 가 나왔다. 랙은 브로커 오프셋의 차라 외삽도 없고 파드 재시작에도 안 흔들린다.\n한계: kafka-exporter 가 30초마다 한 번 보므로 판 도중의 순간 밀림은 여기 안 잡힌다 — 그건 3행의 승격→인증 지연이 본다. 여기는 \"끝나고 남았나\" 다.",
          "datasource": { "type": "prometheus", "uid": "mimir" },
          "gridPos": { "h": 6, "w": 4, "x": 20, "y": 1 },
          "targets": [
            { "refId": "A", "expr": "max_over_time((max(queue_active) - max(queue_capacity))[$__range:]) > 0 or vector(0)", "legendFormat": "정원 초과" },
            { "refId": "B", "expr": "sum(kafka_consumergroup_lag{topic=\"admissions\"}) or vector(0)", "legendFormat": "미소비 잔량" }
          ],
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "textMode": "value_and_name", "graphMode": "none", "orientation": "vertical" },
          "fieldConfig": { "defaults": { "unit": "short", "decimals": 0, "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null }, { "color": "red", "value": 1 } ] } }, "overrides": [] }
        },
        { "type": "row", "title": "1. 입구 (ALB) — 요청이 들어왔나 · 입구가 버린 것이 있나 | CloudWatch 라 1분 단위이고 몇 분 늦게 들어온다", "gridPos": { "h": 1, "w": 24, "x": 0, "y": 7 }, "collapsed": false, "panels": [] },
        {
          "id": 1, "type": "timeseries", "title": "처리량과 실패 (분당) — 요청만 오른쪽 축, 왼쪽 넷은 전부 0 이어야 한다",
          "description": "요청은 대상그룹으로 가른다 — ALB 하나가 frontend · queue · booking 셋으로 보내고, 0행 1번(로비)의 원천도 이 차원이다.\n\n왼쪽 축의 선 넷은 전부 0 이어야 하고, 오르면 각각 다른 곳을 가리킨다.\n· 대상 5xx — 파드가 5xx 를 돌려줬다. 어느 서비스인지는 0행 다섯 칸이 이미 가르므로 여기서는 합으로 둔다\n· ALB 자신의 5xx — 대상그룹이 없다. 503 은 건강한 대상이 없다는 뜻이고 504 는 대상이 시간 안에 답을 못 했다는 뜻이다. 파드가 아니라 입구를 본다\n· 거부된 연결 — ALB 가 연결 자체를 못 받았다\n· 비정상 대상 — 헬스체크가 떨어진 파드 수다. 그만큼 남은 파드에 부하가 몰린다\n\n★ 0 인 선을 대상그룹마다 세 줄씩 두면 범례가 열한 줄이 되고 이름이 겹쳐 못 읽는다. 실패는 합으로 보고, 갈라 볼 일이 생기면 그때 상세 장으로 간다.",
          "datasource": { "type": "prometheus", "uid": "mimir" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "targets": [
            { "refId": "A", "expr": "sum by (dimension_TargetGroup) ({__name__=~\"aws_applicationelb_request_count_per_target_sum\", dimension_TargetGroup=~\".*k8s-app-.*\"})", "legendFormat": "요청 {{dimension_TargetGroup}}" },
            { "refId": "B", "expr": "sum({__name__=~\"aws_applicationelb_httpcode_target_5_?xx_count_sum\", dimension_TargetGroup=~\".*k8s-app-.*\"}) or vector(0)", "legendFormat": "대상 5xx (합)" },
            { "refId": "C", "expr": "sum({__name__=~\"aws_applicationelb_httpcode_elb_5_?xx_count_sum\", dimension_LoadBalancer=~\".*k8s-app-.*\"}) or vector(0)", "legendFormat": "ALB 자신의 5xx" },
            { "refId": "D", "expr": "sum({__name__=~\"aws_applicationelb_rejected_connection_count_sum\", dimension_LoadBalancer=~\".*k8s-app-.*\"}) or vector(0)", "legendFormat": "거부된 연결" },
            { "refId": "E", "expr": "sum({__name__=~\"aws_applicationelb_un_?healthy_host_count_maximum\", dimension_TargetGroup=~\".*k8s-app-.*\"}) or vector(0)", "legendFormat": "비정상 대상 (합)" }
          ],
          "transformations": [ { "id": "renameByRegex", "options": { "regex": "(.*?)arn:.*targetgroup/k8s-app-([a-z]+)-.*", "renamePattern": "$1$2" } } ], "options": { "legend": { "displayMode": "table", "placement": "bottom", "showLegend": true, "calcs": ["lastNotNull", "max"] }, "tooltip": { "mode": "multi", "sort": "desc" } }, "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [ { "matcher": { "id": "byRegexp", "options": "요청 .*" }, "properties": [ { "id": "custom.axisPlacement", "value": "right" }, { "id": "custom.fillOpacity", "value": 8 } ] } ] }
        },
        {
          "id": 2, "type": "timeseries", "title": "지연과 연결 (분당) — 입구에서 본 값",
          "description": "ALB 가 잰 대상그룹별 p99 와, ALB 가 받아낸 연결 수.\n\n★ 앱이 잰 지연은 2행 · 4행에 있다(그쪽은 5초 · 15초 눈금이다). 여기 값이 그것보다 크게 높으면 느린 구간이 파드 안이 아니라 ALB 와 파드 사이다. 두 값을 한 패널에 겹치지 않는 이유는 눈금이 달라서다 — 1분 평균은 오픈 봉우리를 뭉개서 낮게 보이고, 그 차이가 구간 몫인 것처럼 읽힌다.\n\n연결은 dev 3만 판에서 origin 연결이 23,000 까지 올라 Traefik 이 무너진 적이 있어 같이 본다.",
          "datasource": { "type": "prometheus", "uid": "mimir" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "targets": [
            { "refId": "A", "expr": "max by (dimension_TargetGroup) ({__name__=~\"aws_applicationelb_target_response_time_p99\", dimension_TargetGroup=~\".*k8s-app-.*\"})", "legendFormat": "p99 {{dimension_TargetGroup}}" },
            { "refId": "B", "expr": "sum({__name__=~\"aws_applicationelb_active_connection_count_sum\", dimension_LoadBalancer=~\".*k8s-app-.*\"})", "legendFormat": "활성 연결" },
            { "refId": "C", "expr": "sum({__name__=~\"aws_applicationelb_new_connection_count_sum\", dimension_LoadBalancer=~\".*k8s-app-.*\"})", "legendFormat": "새 연결" }
          ],
          "transformations": [ { "id": "renameByRegex", "options": { "regex": "(.*)targetgroup/k8s-app-([a-z]+)-.*", "renamePattern": "          $2" } } ], "options": { "legend": { "displayMode": "table", "placement": "bottom", "showLegend": true, "calcs": ["lastNotNull", "max"] }, "tooltip": { "mode": "multi", "sort": "desc" } }, "fieldConfig": { "defaults": { "unit": "s" }, "overrides": [ { "matcher": { "id": "byRegexp", "options": ".*연결$" }, "properties": [ { "id": "unit", "value": "short" }, { "id": "custom.axisPlacement", "value": "right" } ] } ] }
        },

        { "type": "row", "title": "2. 대기열 (queue) — 줄에 섰나 · 대기 화면이 살아 있나 | 0행 2 · 3 이 깨지면 여기. 더 파려면 stg · queue", "gridPos": { "h": 1, "w": 24, "x": 0, "y": 16 }, "collapsed": false, "panels": [] },
        {
          "id": 4, "type": "timeseries", "title": "지연 p99 — 순번 조회(position) · 줄서기(enter) · 통과선 1초",
          "description": "기다리는 사람이 겪는 시간(앱 구간). 선 둘은 0행의 관문 둘과 같은 경로다.\n· 순번 조회 = GET /api/admission/position — 0행 3번의 판정 대상이고 통과선 1초가 그 기준이다\n· 줄서기 = POST /api/admission/enter — 0행 2번은 이 경로를 성공률로 판정하므로 여기 선은 참고값이다. 오픈 순간에 느린 것보다 실패하는 것이 훨씬 나쁘고, 느린 enter 는 사용자가 한 번 더 누르면 된다\n\n★ 점(exemplar)은 enter 선에만 붙는다. 누르면 그 요청의 trace 가 열린다.\n  position 에는 안 붙는다 — 대기 화면이 1-5초마다 부르는 경로라 트레이스 샘플러가 통째로 제외한다(queue-go tracing.go). 지표는 전수로 세고 trace 만 안 남긴다.",
          "datasource": { "type": "prometheus", "uid": "mimir" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 17 },
          "links": [ { "title": "→ stg · queue", "url": "/d/stg-queue/?${__url_time_range}" } ],
          "targets": [
            { "refId": "A", "expr": "histogram_quantile(0.99, sum by (le) (rate(queue_http_request_duration_seconds_bucket{path=\"/api/admission/position\"}[$__rate_interval])))", "legendFormat": "순번 조회 position p99 — 판정 대상", "exemplar": false },
            { "refId": "B", "expr": "histogram_quantile(0.99, sum by (le) (rate(queue_http_request_duration_seconds_bucket{path=\"/api/admission/enter\"}[$__rate_interval])))", "legendFormat": "줄서기 enter p99 — 참고", "exemplar": true }
          ],
          "transformations": [ { "id": "renameByRegex", "options": { "regex": "(.*)targetgroup/k8s-app-([a-z]+)-.*", "renamePattern": "          $2" } } ], "options": { "legend": { "displayMode": "table", "placement": "bottom", "showLegend": true, "calcs": ["lastNotNull", "max"] }, "tooltip": { "mode": "multi", "sort": "desc" } }, "fieldConfig": { "defaults": { "unit": "s", "custom": { "thresholdsStyle": { "mode": "line" } }, "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null }, { "color": "red", "value": 1 } ] } }, "overrides": [ { "matcher": { "id": "byName", "options": "줄서기 enter p99 — 참고" }, "properties": [ { "id": "custom.lineStyle", "value": { "dash": [8, 4], "fill": "dash" } } ] } ] }
        },
        {
          "id": 5, "type": "timeseries", "title": "인원 — 대기 · 입장 vs 정원",
          "description": "입장이 정원에 붙은 채 대기가 줄지 않으면 자리가 안 돌아오는 것이다 → 3행 오른쪽(돌려받는 방향)을 본다. 입장에 여유가 있는데 대기가 쌓이면 승격이 막힌 것이다 → stg · queue 의 루프 완주 도장.\n★ 입장이 정원을 넘으면 불변식 위반이다(0행 오른쪽 끝). 이 패널에서는 두 선이 겹치는 것까지가 정상이고 넘어서는 안 된다.\n★ 파드 넷이 Redis 의 같은 값을 각각 보고하므로 max 로 읽는다. sum 이면 네 배가 된다.",
          "datasource": { "type": "prometheus", "uid": "mimir" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 17 },
          "links": [ { "title": "→ stg · queue", "url": "/d/stg-queue/?${__url_time_range}" } ],
          "targets": [
            { "refId": "A", "expr": "max(queue_waiting)", "legendFormat": "대기" },
