# stg · 흐름 — 통과했나(0행), 아니라면 어디서 막혔나(1-4행).
#
# 0행이 판정이고 1-4행이 진단이다. 한 화면에 둔 이유는 "깨졌다 → 바로 아래에서 왜" 로
#   눈이 이어지게 하려는 것이다. 장을 나누면 그 사이에 클릭이 하나 들어가고, 부하 판 중에는
#   그 한 번이 흐름을 끊는다.
#
# 0행 = 서비스 수준 목표(SLO). 사용자가 겪는 것만 있다 — CPU · 메모리 · 풀은 없다.
#   SLI = 좋은 사건 ÷ 유효한 사건. 지연도 "기준 안에 든 비율" 로 쓴다. 그래야 다섯이 같은 꼴이
#   되어 에러 버짓(100% − 목표)이 하나의 개념으로 통한다. p99 는 아래 진단 행에 둔다.
#   관문 다섯 = SLO 다섯. 사용자 여정에서 뽑았고 빠진 관문도 겹치는 관문도 없다.
#     1 로비 99.9% · 2 줄서기 99.9% · 3 순번 조회 99% · 4 전파 99.9% · 5 예매 여정 99%
#   ★ 분모에서 빼는 것이 목표값보다 중요하다.
#     400  형식이 틀린 요청. 클라이언트 잘못이지 서비스 품질이 아니다
#     409  좌석이 실제로 없어서 실패한 것. 정상 결과다
#          409 를 분모에 넣으면 좌석 4,000 에 16만 명이 올 때 성공률이 2.5% 로 나온다 —
#          시스템은 같은데 숫자만 40배 다르다
#   ★ 여기서 재지 않는 것 — 내 순번이 줄어드는 속도. 대기열은 기다리게 하는 것이 기능이고,
#     대기 시간은 정원 ÷ 인원의 결과다. SLO 로 두면 "손님이 많이 왔더니 위반" 이 된다.
#   ★ 목표값은 실사용 데이터 없이 정한 초기값이다. 근거는 사람의 지각 한계(1초)와 시스템 구조
#     (폴링 주기 · 좌석 락 TTL)이지 관측이 아니다. 판을 돌린 뒤 달성 가능한 수준을 보고 다시 정한다.
#
# 1-4행 = 흐름의 단계. 위에서 아래로 요청이 지나간다.
#   1 입구(ALB) → 2 대기열(queue) → 3 서비스 사이 전달(Kafka) → 4 예매(booking)
#   단계마다 처리량 · 실패 · p99 만 둔다. CPU · 메모리 · 풀은 없다 — 그건 "왜" 라 상세 장에 있다.
#   행의 패널 링크(패널 제목 옆)를 누르면 같은 시간 범위로 상세 장(stg · queue / booking / 데이터)이 열린다.
#
# 읽는 법
#   0행이 전부 초록                    → 통과. 아래는 볼 필요 없다
#   한 단계만 튄다                    → 그 단계의 상세 장
#   2 · 4 가 같이 느려진다             → 둘이 같이 쓰는 Redis 를 의심한다 → 데이터 장 1행
#   4 의 결제만 느리다 · lock_contention → MySQL → 데이터 장 2행
#   3 의 쌍이 벌어진다                 → Kafka → 데이터 장 3행
#   흐름은 원형이다. 3 에서 "확정 vs 반환" 이 벌어지면 자리가 안 돌아와 2 의 대기가 쌓인다.
#
# ★ 해상도가 두 가지다. 입구(ALB)는 CloudWatch 를 YACE 가 1분 단위로 가져와 몇 분 늦게 들어오고,
#   앱 지표는 15초다. 두 눈금을 같은 패널에 겹쳐 놓고 차이를 읽으면 그 차이에 해상도 몫이 섞인다
#   — 1분 평균은 오픈 봉우리를 뭉개서 낮게 보인다.
#   그래서 둘을 비교하는 패널(2번)에서는 앱 쪽도 1분 창으로 맞춰 계산한다. 봉우리 자체는
#   2 · 4행의 15초 지표로 본다.
#
# ★ 두 가지를 라이브에서 확인해 고쳤다(2026-09-12 예열 판).
#   le 라벨은 "1" 이 아니라 "1.0" 이다. queue(Go client_golang) · booking(Micrometer) · 전파 지연
#     셋 다 같다. "1" 로 적으면 아무것도 안 걸려 패널이 No data 가 되는데, 그 화면은
#     "지표가 없다" 가 아니라 "조건에 맞는 요청이 없다" 로 읽힌다.
#   queue_waiting · queue_active 는 sum 하면 안 된다. Redis 의 한 값을 파드 넷이 각각 보고하므로
#     sum 은 네 배가 된다 — 정원 1,000 인데 입장이 4,000 으로 보여 정원 초과 불변식이
#     항상 위반으로 떴다. max 로 읽는다.
#   지표 이름(YACE snake_case)은 정규식으로 받는다 — 문서에 변환 규칙이 없다.
apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-stg-flow
  namespace: observability
  labels:
    grafana_dashboard: "1"
data:
  stg-flow.json: |
    {
      "uid": "stg-flow",
      "title": "stg · 흐름 — 통과했나, 아니면 어디서 막혔나",
      "tags": ["cgv", "stg"],
      "editable": true,
      "timezone": "browser",
      "time": { "from": "now-1h", "to": "now" },
      "refresh": "30s",
      "schemaVersion": 39,
      "templating": { "list": [] },
      "panels": [
        { "type": "row", "title": "0. 판정 (SLO) — 창 전체의 달성률. 목표 아래면 빨강. 여기가 전부 초록이면 아래는 안 봐도 된다", "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 }, "collapsed": false, "panels": [] },
        {
          "id": 20, "type": "stat", "title": "1. 로비 — 사이트가 뜬다",
          "description": "오픈 전, 방문자가 로비에서 현황판을 3초마다 부른다. 여기가 죽으면 아무도 예매하기를 못 누르고, 그러면 2번은 분모가 비어 통과해 버린다 — 앞 관문의 실패가 뒤에서 안 보이므로 따로 잰다. dev 에서 실제로 이 경로만 대기열 보호 밖이라 booking 이 먼저 무너진 적이 있다(그래서 nginx 캐시를 넣었다).\n\n좋은 사건 = 2xx · 유효한 사건 = 2xx + 5xx · 측정 = ALB frontend 대상그룹\n목표 99.9%",
          "datasource": { "type": "prometheus", "uid": "mimir" },
          "gridPos": { "h": 5, "w": 4, "x": 0, "y": 1 },
          "targets": [
            { "refId": "A", "expr": "sum(sum_over_time({__name__=~\"aws_applicationelb_httpcode_target_2_?xx_count_sum\", dimension_TargetGroup=~\".*frontend.*\"}[$__range])) / (sum(sum_over_time({__name__=~\"aws_applicationelb_httpcode_target_2_?xx_count_sum\", dimension_TargetGroup=~\".*frontend.*\"}[$__range])) + (sum(sum_over_time({__name__=~\"aws_applicationelb_httpcode_target_5_?xx_count_sum\", dimension_TargetGroup=~\".*frontend.*\"}[$__range])) or vector(0)))" }
          ],
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "textMode": "auto", "graphMode": "none" },
          "fieldConfig": { "defaults": { "unit": "percentunit", "decimals": 3, "thresholds": { "mode": "absolute", "steps": [ { "color": "red", "value": null }, { "color": "green", "value": 0.999 } ] } }, "overrides": [] }
        },
        {
          "id": 21, "type": "stat", "title": "2. 줄서기 — 누르면 줄에 선다",
          "description": "대기열이 존재하는 이유다. 대기열이 없으면 오픈 순간 전원이 booking 으로 몰려 서버가 죽고 모두 실패한다. 줄을 세우는 대신 \"전원을 받아 준다\" 를 약속한 것이므로 여기가 가장 엄격하다.\n\n좋은 사건 = 200(즉시 입장) · 202(대기 등록) · 유효한 사건 = enter 전체 − 400\n503(발행 실패 RETRY_LATER)은 실패로 센다 — 사용자 눈에는 줄서기 실패다.\n목표 99.9%. 깨지면 아래 2행의 queue 5xx 와 3행의 발행 실패를 본다.",
          "datasource": { "type": "prometheus", "uid": "mimir" },
          "gridPos": { "h": 5, "w": 4, "x": 4, "y": 1 },
          "targets": [
            { "refId": "A", "expr": "sum(increase(queue_http_request_duration_seconds_count{path=\"/api/admission/enter\", status=~\"2..\"}[$__range])) / sum(increase(queue_http_request_duration_seconds_count{path=\"/api/admission/enter\", status!=\"400\"}[$__range]))" }
          ],
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "textMode": "auto", "graphMode": "none" },
          "fieldConfig": { "defaults": { "unit": "percentunit", "decimals": 3, "thresholds": { "mode": "absolute", "steps": [ { "color": "red", "value": null }, { "color": "green", "value": 0.999 } ] } }, "overrides": [] }
        },
        {
          "id": 22, "type": "stat", "title": "3. 순번 조회 — 화면이 살아 있다",
          "description": "대기 화면은 폴링으로 갱신된다. 응답이 폴링 주기(가장 짧은 것이 1초)를 넘으면 다음 폴링이 앞 응답을 기다려 화면 갱신이 밀린다. 1초는 사람이 반응이 끊겼다고 느끼기 시작하는 선이기도 하다.\n\n좋은 사건 = 200 을 1초 안에 · 유효한 사건 = position 전체\n★ 분자에 status 조건이 있어야 한다 — 50ms 만에 돌아온 503 은 빠르지만 좋은 사건이 아니다.\n목표 99%",
          "datasource": { "type": "prometheus", "uid": "mimir" },
          "gridPos": { "h": 5, "w": 4, "x": 8, "y": 1 },
          "targets": [
            { "refId": "A", "expr": "sum(increase(queue_http_request_duration_seconds_bucket{path=\"/api/admission/position\", status=\"200\", le=\"1.0\"}[$__range])) / sum(increase(queue_http_request_duration_seconds_count{path=\"/api/admission/position\"}[$__range]))" }
          ],
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "textMode": "auto", "graphMode": "none" },
          "fieldConfig": { "defaults": { "unit": "percentunit", "decimals": 3, "thresholds": { "mode": "absolute", "steps": [ { "color": "red", "value": null }, { "color": "green", "value": 0.99 } ] } }, "overrides": [] }
        },
        {
          "id": 23, "type": "stat", "title": "4. 전파 — 들어가면 문이 열려 있다",
          "description": "queue 가 \"입장했습니다\" 를 띄운 순간과 booking 이 그 사실을 아는 순간이 다르다. 그 사이에 회차를 누르면 403 — 사용자 눈에는 \"입장했는데 거절당했다\" 다.\n★ 이 구간은 어느 요청 지표에도 안 나타난다. enter 도 403 도 각자 기준으로는 정상이고 빠른데 사용자만 실패한다.\n\n좋은 = 1초 안에 booking 도달 · 유효 = 입장 확정 전체 · 목표 99.9%",
          "datasource": { "type": "prometheus", "uid": "mimir" },
          "gridPos": { "h": 5, "w": 4, "x": 12, "y": 1 },
          "targets": [
            { "refId": "A", "expr": "sum(increase(booking_admission_lag_seconds_bucket{le=\"1.0\"}[$__range])) / sum(increase(booking_admission_lag_seconds_count[$__range]))" }
          ],
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "textMode": "auto", "graphMode": "none" },
          "fieldConfig": { "defaults": { "unit": "percentunit", "decimals": 3, "thresholds": { "mode": "absolute", "steps": [ { "color": "red", "value": null }, { "color": "green", "value": 0.999 } ] } }, "overrides": [] }
        },
        {
          "id": 24, "type": "stat", "title": "5. 예매 여정 — 표가 손에 들어온다",
          "description": "입장 뒤 요청 넷 전부를 센다 — 회차 · 좌석 · 선점 · 확정.\n★ 확정만 세면 앞 단계가 죽을수록 분모가 줄어 뒤가 좋아 보인다. 넷을 다 세야 어디서 막혀도 잡힌다.\n로비 폴링(board)은 빼고 센다 — 그건 1번 관문이고, 싸고 많아서 넣으면 느린 확정을 가린다.\n\n좋은 사건 = 2xx 를 1초 안에 · 유효한 사건 = 넷 전체 − 409\n목표 99%. 줄 서서 입장까지 한 사람이 여기서 실패하면 자리를 잃는다 — 가장 비싼 실패다.",
          "datasource": { "type": "prometheus", "uid": "mimir" },
          "gridPos": { "h": 5, "w": 4, "x": 16, "y": 1 },
          "targets": [
            { "refId": "A", "expr": "sum(increase(http_server_requests_seconds_bucket{application=\"cgv-booking\", uri=~\"/api/screenings|/api/seats|/api/seats/select|/api/bookings\", status=~\"2..\", le=\"1.0\"}[$__range])) / sum(increase(http_server_requests_seconds_count{application=\"cgv-booking\", uri=~\"/api/screenings|/api/seats|/api/seats/select|/api/bookings\", status!=\"409\"}[$__range]))" }
          ],
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "textMode": "auto", "graphMode": "none" },
          "fieldConfig": { "defaults": { "unit": "percentunit", "decimals": 3, "thresholds": { "mode": "absolute", "steps": [ { "color": "red", "value": null }, { "color": "green", "value": 0.99 } ] } }, "overrides": [] }
        },
        {
          "id": 25, "type": "stat", "title": "불변식 — 버짓이 없다",
          "description": "SLO 가 아니다. \"정원 초과를 0.1% 까지 허용\" 은 말이 안 되므로 참/거짓이다. 0 이 아니면 판이 무효이고, 목표가 아니라 코드를 고칠 일이다.\n\n정원 초과 = 입장 − 정원. 게이트가 Redis Lua 안에서 원자로 도는데 그게 깨진 것이다.\n전달 유실 = 자리 준 수 − booking 이 받은 수. SLO 4 는 받은 것만 세어 유실을 못 보므로 이 값이 그 자리를 맡는다.",
          "datasource": { "type": "prometheus", "uid": "mimir" },
          "gridPos": { "h": 5, "w": 4, "x": 20, "y": 1 },
          "targets": [
            { "refId": "A", "expr": "max_over_time((max(queue_active) - max(queue_capacity))[$__range:]) > 0 or vector(0)", "legendFormat": "정원 초과" },
            { "refId": "B", "expr": "(sum(increase(queue_kafka_published_total{topic=\"admissions\"}[$__range])) - sum(increase(booking_admissions_total{result=\"ok\"}[$__range]))) or vector(0)", "legendFormat": "전달 유실" }
          ],
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "textMode": "value_and_name", "graphMode": "none", "orientation": "vertical" },
          "fieldConfig": { "defaults": { "unit": "short", "decimals": 0, "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null }, { "color": "red", "value": 1 } ] } }, "overrides": [] }
        },

        { "type": "row", "title": "1. 입구 (ALB) — 1분 단위 · 몇 분 늦게 들어온다. 봉우리는 2 · 4행의 앱 지표로 본다", "gridPos": { "h": 1, "w": 24, "x": 0, "y": 6 }, "collapsed": false, "panels": [] },
        {
          "id": 1, "type": "timeseries", "title": "대상그룹별 요청 · 5xx (분당)",
          "description": "ALB 하나가 frontend · queue · booking 셋으로 가른다. 합계만 보면 어느 서비스가 실패했는지 모르므로 대상그룹으로 가른다 — 0행 1번(로비)의 원천도 이 차원이다.\n\nALB 5xx(맨 아래 선)는 대상그룹이 없다. ALB 자신이 낸 것이라서다 — 503 은 건강한 대상이 없다는 뜻이고 504 는 대상이 시간 안에 답을 못 했다는 뜻이다. 이게 오르면 파드가 아니라 입구를 본다.",
          "datasource": { "type": "prometheus", "uid": "mimir" },
          "gridPos": { "h": 8, "w": 8, "x": 0, "y": 7 },
          "targets": [
            { "refId": "A", "expr": "sum by (dimension_TargetGroup) ({__name__=~\"aws_applicationelb_request_count_per_target_sum\", dimension_TargetGroup=~\".*k8s-app-.*\"})", "legendFormat": "요청 {{dimension_TargetGroup}}" },
            { "refId": "B", "expr": "sum by (dimension_TargetGroup) ({__name__=~\"aws_applicationelb_httpcode_target_5_?xx_count_sum\", dimension_TargetGroup=~\".*k8s-app-.*\"})", "legendFormat": "5xx {{dimension_TargetGroup}}" },
            { "refId": "C", "expr": "sum({__name__=~\"aws_applicationelb_httpcode_elb_5_?xx_count_sum\", dimension_LoadBalancer=~\".*k8s-app-.*\"}) or vector(0)", "legendFormat": "ALB 자신의 5xx" }
          ],
          "transformations": [ { "id": "renameByRegex", "options": { "regex": "(.*)targetgroup/k8s-app-([a-z]+)-.*", "renamePattern": "          $2" } } ], "options": { "legend": { "displayMode": "table", "placement": "right", "showLegend": true, "calcs": ["lastNotNull", "max"] }, "tooltip": { "mode": "multi", "sort": "desc" } }, "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [ { "matcher": { "id": "byRegexp", "options": "요청 .*" }, "properties": [ { "id": "custom.axisPlacement", "value": "right" } ] } ] }
        },
        {
          "id": 2, "type": "timeseries", "title": "지연 p99 — ALB 가 잰 것 vs 앱이 잰 것 (둘 다 1분 창)",
          "description": "둘의 차이가 ALB 에서 파드까지 가는 구간이다.\n\n★ 앱 쪽도 1분 창으로 계산한다. ALB 는 CloudWatch 라 1분 단위인데 앱 기본값은 15초라, 그대로 겹치면 차이에 해상도 몫이 섞인다 — 1분 평균은 오픈 봉우리를 뭉개서 낮게 보인다. 눈금을 맞춰야 차이가 구간 몫만 남는다.\n봉우리의 실제 높이는 아래 2 · 4행에서 본다(거기는 15초다).",
          "datasource": { "type": "prometheus", "uid": "mimir" },
          "gridPos": { "h": 8, "w": 8, "x": 8, "y": 7 },
          "targets": [
            { "refId": "A", "expr": "max by (dimension_TargetGroup) ({__name__=~\"aws_applicationelb_target_response_time_p99\", dimension_TargetGroup=~\".*k8s-app-.*\"})", "legendFormat": "ALB {{dimension_TargetGroup}}" },
