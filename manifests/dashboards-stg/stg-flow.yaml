            { "refId": "C", "expr": "max(queue_capacity)", "legendFormat": "정원" }
          ],
          "transformations": [ { "id": "renameByRegex", "options": { "regex": "(.*)targetgroup/k8s-app-([a-z]+)-.*", "renamePattern": "          $2" } } ], "options": { "legend": { "displayMode": "table", "placement": "bottom", "showLegend": true, "calcs": ["lastNotNull", "max"] }, "tooltip": { "mode": "multi", "sort": "desc" } }, "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [ { "matcher": { "id": "byName", "options": "정원" }, "properties": [ { "id": "custom.lineStyle", "value": { "dash": [10, 10], "fill": "dash" } } ] } ] }
        },
        { "type": "row", "title": "3. 서비스 사이 전달 (Kafka) — 자리를 주고받는 데 얼마나 걸렸나 | 0행 4 가 깨지면 여기. 더 파려면 stg · 데이터 3행", "gridPos": { "h": 1, "w": 24, "x": 0, "y": 25 }, "collapsed": false, "panels": [] },
        {
          "id": 7, "type": "timeseries", "title": "전달 지연 — 승격→인증 · 확정→반환 (통과선 1초)",
          "description": "0행 4번(전파)의 진단이다. 통과선 1초는 그 SLO 와 같은 값이다.\n\n주는 방향 — 선 둘이 갈라 준다. 전체(승격→인증)만 오르고 발행이 멀쩡하면 브로커나 booking 의 소비 쪽이다. 발행도 같이 오르면 queue → 브로커 구간이다.\n돌려받는 방향 — 확정→반환. 여기에는 통과선을 안 둔다. 사용자가 직접 겪는 구간이 아니라(뒷사람이 늦게 들어올 뿐) SLO 가 아니고, 늦어진 영향은 2행의 대기 인원이 안 줄어드는 것으로 나타난다.\n\n발행 실패(오른쪽 축)는 0 이어야 한다. 오르면 queue 가 RETRY_LATER(503)를 준 것이고, 그것이 0행 2번 줄서기가 깨지는 유일한 경로다.\n\n★ 건수 넷(자리 준 수 · 인증 발급 · 확정 · 반환)을 뺐다. 준 것과 받은 것이 안 맞는 것은 0행의 불변식(미소비 잔량 = 컨슈머 랙)이 더 정확하게 보고 — 앱 카운터 뺄셈은 파드 재시작에 흔들린다 — 자리가 안 돌아오는 것은 2행의 대기·입장 패널이 직접 보여 준다.",
          "datasource": { "type": "prometheus", "uid": "mimir" },
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 26 },
          "links": [ { "title": "→ stg · 데이터", "url": "/d/stg-data/?${__url_time_range}" } ],
          "targets": [
            { "refId": "A", "expr": "histogram_quantile(0.99, sum by (le) (rate(booking_admission_lag_seconds_bucket[$__rate_interval])))", "legendFormat": "승격→인증 p99 — 판정 대상", "exemplar": true },
            { "refId": "B", "expr": "histogram_quantile(0.99, sum by (le) (rate(queue_kafka_publish_duration_seconds_bucket{topic=\"admissions\"}[$__rate_interval])))", "legendFormat": "그중 queue 발행 p99", "exemplar": true },
            { "refId": "C", "expr": "histogram_quantile(0.99, sum by (le) (rate(queue_completed_lag_seconds_bucket[$__rate_interval])))", "legendFormat": "확정→반환 p99 — 참고", "exemplar": true },
            { "refId": "D", "expr": "sum(rate(queue_kafka_publish_failures_total[$__rate_interval])) or vector(0)", "legendFormat": "발행 실패/초" }
          ],
          "options": { "legend": { "displayMode": "table", "placement": "bottom", "showLegend": true, "calcs": ["lastNotNull", "max"] }, "tooltip": { "mode": "multi", "sort": "desc" } }, "fieldConfig": { "defaults": { "unit": "s", "custom": { "thresholdsStyle": { "mode": "line" } }, "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null }, { "color": "red", "value": 1 } ] } }, "overrides": [ { "matcher": { "id": "byName", "options": "확정→반환 p99 — 참고" }, "properties": [ { "id": "custom.lineStyle", "value": { "dash": [8, 4], "fill": "dash" } } ] }, { "matcher": { "id": "byName", "options": "발행 실패/초" }, "properties": [ { "id": "unit", "value": "short" }, { "id": "custom.axisPlacement", "value": "right" }, { "id": "color", "value": { "mode": "fixed", "fixedColor": "red" } } ] } ] }
        },

        { "type": "row", "title": "4. 예매 (booking) — 어느 단계가 느린가 · 왜 실패했나 | 0행 5 가 깨지면 여기. 더 파려면 stg · booking", "gridPos": { "h": 1, "w": 24, "x": 0, "y": 34 }, "collapsed": false, "panels": [] },
        {
