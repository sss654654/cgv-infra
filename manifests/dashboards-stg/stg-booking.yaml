# stg · booking — booking 자신인가, booking 이 기다리는 쪽인가.
#
# dev 의 booking 대시보드에서 파드 행을 가져오고 다듬었다.
#   뺀 것   MySQL CPU(stg 는 RDS — 데이터 장 2행) · 여정 단계별 지연(흐름 장 4행)
#   옮긴 것 커넥션 풀 → "기다리는 것" 행으로. Redis 명령 지연을 옆에 더했다
#
# 읽는 법 — 흐름 장 4행에서 p99 가 튀어서 왔다.
#   1행이 차 있다(메모리 · CPU · 스로틀 · GC)   → booking 자신이 한계다. 파드가 1대라 곧 서비스 한계다
#   1행은 멀쩡한데 2행 대기가 늘었다            → 기다리는 쪽이다 → stg · 데이터
#
# stg 는 limit 3Gi 라 JVM 이 G1 GC 를 고를 것이다(dev 1536Mi 는 Serial GC). GC 멈춤 선이 dev 와 달라지는지 여기서 본다.
apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-stg-booking
  namespace: observability
  labels:
    grafana_dashboard: "1"
data:
  stg-booking.json: |
    {
      "uid": "stg-booking",
      "title": "stg · booking — 자신인가, 기다리는 쪽인가",
      "tags": ["cgv", "stg", "booking"],
      "editable": true,
      "timezone": "browser",
      "time": { "from": "now-1h", "to": "now" },
      "refresh": "30s",
      "schemaVersion": 39,
      "templating": { "list": [] },
      "links": [ { "title": "← stg · 흐름", "type": "link", "url": "/d/stg-flow/?${__url_time_range}" } ],
      "panels": [
        { "type": "row", "title": "1. booking 파드 — 자기 자원", "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 }, "collapsed": false, "panels": [] },
        {
          "id": 1, "type": "timeseries", "title": "메모리 — working_set / limit",
          "description": "100% 에 닿으면 커널이 파드를 죽인다(OOMKill). dev 에서 limit 1Gi 였을 때 오픈 버스트에 두 번 났고(exit 137, 25초 만에 재발) 그래서 1,536Mi 가 됐다. stg 는 3Gi 다.\n파드가 두 대라 하나가 죽어도 예매가 멈추지는 않지만, 남은 한 대가 회전 전부를 받는다 — 그때 CPU 와 DB 풀이 두 배로 뛴다.",
          "datasource": { "type": "prometheus", "uid": "mimir" },
          "gridPos": { "h": 8, "w": 8, "x": 0, "y": 1 },
          "targets": [
            { "refId": "A", "expr": "max by (pod) (container_memory_working_set_bytes{namespace=\"app\", container=\"booking\"}) / on(pod) max by (pod) (kube_pod_container_resource_limits{namespace=\"app\", container=\"booking\", resource=\"memory\"})", "legendFormat": "{{pod}}" }
          ],
          "transformations": [ { "id": "renameByRegex", "options": { "regex": "(.*?)(queue|booking|frontend)-[a-z0-9]+-([a-z0-9]{5})", "renamePattern": "$1$3" } } ], "options": { "legend": { "displayMode": "table", "placement": "bottom", "showLegend": true, "calcs": ["lastNotNull", "max"] }, "tooltip": { "mode": "multi", "sort": "desc" } }, "fieldConfig": { "defaults": { "unit": "percentunit", "max": 1.05, "custom": { "thresholdsStyle": { "mode": "line" } }, "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null }, { "color": "red", "value": 1 } ] } }, "overrides": [] }
        },
        {
          "id": 2, "type": "timeseries", "title": "CPU · 스로틀 · GC — limit 대비",
          "description": "CPU 가 limit 에 붙고 스로틀이 생기면 CPU 한계다. GC 멈춤 비율 = 초당 GC 로 멈춘 시간. GC 멈춤 최대가 Redis 명령 타임아웃(2초)에 가까워지면 멈춤만으로 명령이 실패할 수 있다.",
          "datasource": { "type": "prometheus", "uid": "mimir" },
          "gridPos": { "h": 8, "w": 8, "x": 8, "y": 1 },
          "targets": [
            { "refId": "A", "expr": "sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\"app\", container=\"booking\"}[$__rate_interval])) / on(pod) max by (pod) (kube_pod_container_resource_limits{namespace=\"app\", container=\"booking\", resource=\"cpu\"})", "legendFormat": "CPU {{pod}}" },
            { "refId": "B", "expr": "sum by (pod) (rate(container_cpu_cfs_throttled_periods_total{namespace=\"app\", container=\"booking\"}[$__rate_interval])) / sum by (pod) (rate(container_cpu_cfs_periods_total{namespace=\"app\", container=\"booking\"}[$__rate_interval])) and on(pod) (kube_pod_status_phase{namespace=\"app\", phase=\"Running\"} == 1)", "legendFormat": "스로틀 {{pod}}" },
            { "refId": "C", "expr": "sum(rate(jvm_gc_pause_seconds_sum{application=\"cgv-booking\"}[$__rate_interval]))", "legendFormat": "GC 멈춤 비율" },
            { "refId": "D", "expr": "max by (gc) (jvm_gc_pause_seconds_max{application=\"cgv-booking\"})", "legendFormat": "GC 멈춤 최대(초) {{gc}}" }
          ],
          "transformations": [ { "id": "renameByRegex", "options": { "regex": "(.*?)(queue|booking|frontend)-[a-z0-9]+-([a-z0-9]{5})", "renamePattern": "$1$3" } } ], "options": { "legend": { "displayMode": "table", "placement": "bottom", "showLegend": true, "calcs": ["lastNotNull", "max"] }, "tooltip": { "mode": "multi", "sort": "desc" } }, "fieldConfig": { "defaults": { "unit": "percentunit" }, "overrides": [ { "matcher": { "id": "byRegexp", "options": "GC 멈춤 최대.*" }, "properties": [ { "id": "unit", "value": "s" }, { "id": "custom.axisPlacement", "value": "right" } ] } ] }
        },
        {
          "id": 3, "type": "timeseries", "title": "heap — 사용 vs 상한",
          "description": "heap 사용이 상한에 붙으면 GC 가 잦아지고 멈춤이 길어진다. 상한은 limit × MaxRAMPercentage(50%).",
          "datasource": { "type": "prometheus", "uid": "mimir" },
          "gridPos": { "h": 8, "w": 8, "x": 16, "y": 1 },
          "targets": [
            { "refId": "A", "expr": "sum(jvm_memory_used_bytes{application=\"cgv-booking\", area=\"heap\"})", "legendFormat": "heap 사용" },
            { "refId": "B", "expr": "sum(jvm_memory_max_bytes{application=\"cgv-booking\", area=\"heap\"})", "legendFormat": "heap 상한" },
            { "refId": "C", "expr": "sum(jvm_memory_used_bytes{application=\"cgv-booking\", area=\"nonheap\"})", "legendFormat": "nonheap" }
          ],
          "transformations": [ { "id": "renameByRegex", "options": { "regex": "(.*?)(queue|booking|frontend)-[a-z0-9]+-([a-z0-9]{5})", "renamePattern": "$1$3" } } ], "options": { "legend": { "displayMode": "table", "placement": "bottom", "showLegend": true, "calcs": ["lastNotNull", "max"] }, "tooltip": { "mode": "multi", "sort": "desc" } }, "fieldConfig": { "defaults": { "unit": "bytes" }, "overrides": [] }
        },

        { "type": "row", "title": "2. 요청을 받아 줄 자리가 있나 — HTTP 와 Kafka 소비가 같은 JVM 을 쓴다", "gridPos": { "h": 1, "w": 24, "x": 0, "y": 9 }, "collapsed": false, "panels": [] },
        {
          "id": 9, "type": "timeseries", "title": "Tomcat 연결 — 현재 vs 상한",
          "description": "요청이 앱에 들어오기 전에 기다리는 자리다. ALB 가 잰 시간과 앱이 잰 시간의 차이가 이 대기다 — http_server_requests 는 요청 처리가 시작된 뒤부터 재므로 그 앞은 어느 앱 지표에도 안 잡힌다.\n2026-09-12 1만 명 판: ALB 가 잰 booking p99 48.0초 · 앱이 잰 것 4.33초.\n\n★ 스레드가 아니라 연결로 본다. 이 앱은 가상 스레드로 돌아(VIRTUAL_THREADS=true) 고정 스레드 풀이 없다 — tomcat_threads_* 는 전부 -1 이 나온다. 요청마다 가상 스레드가 하나씩 생기므로 스레드를 기다리는 일이 없고, 대신 연결 상한(maxConnections)이 그 자리를 맡는다.\n현재가 상한에 닿으면 새 연결은 OS 의 accept 대기열에서 기다리고, 그 큐도 차면 거절된다.\n\n비교할 자리: stg · 흐름 1행의 \"지연 p99 — ALB 가 잰 것 vs 앱이 잰 것\" 과 \"연결 · 대상 건강\".",
          "datasource": { "type": "prometheus", "uid": "mimir" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 10 },
          "targets": [
            { "refId": "A", "expr": "sum by (pod) (tomcat_connections_current_connections{application=\"cgv-booking\"})", "legendFormat": "연결 {{pod}}" },
            { "refId": "B", "expr": "max(tomcat_connections_config_max_connections{application=\"cgv-booking\"})", "legendFormat": "상한" },
            { "refId": "C", "expr": "sum by (pod) (tomcat_connections_keepalive_current_connections{application=\"cgv-booking\"})", "legendFormat": "keepalive {{pod}}" }
          ],
          "transformations": [ { "id": "renameByRegex", "options": { "regex": "(.*?)(queue|booking|frontend)-[a-z0-9]+-([a-z0-9]{5})", "renamePattern": "$1$3" } } ], "options": { "legend": { "displayMode": "table", "placement": "bottom", "showLegend": true, "calcs": ["lastNotNull", "max"] }, "tooltip": { "mode": "multi", "sort": "desc" } }, "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [ { "matcher": { "id": "byName", "options": "상한" }, "properties": [ { "id": "custom.lineStyle", "value": { "dash": [8, 4], "fill": "dash" } } ] } ] }
        },
        {
          "id": 10, "type": "timeseries", "title": "입장 전달 — 발행에서 받기까지 vs 받은 뒤 처리",
          "description": "승격 발행부터 입장 인증이 생기기까지(lag)를 두 구간으로 가른다.\n  대기 = 발행 → 이 파드가 그 레코드를 배치로 받은 시점(booking_admission_wait_seconds)\n  처리 = lag − 대기. 받은 뒤 Redis 에 쓰기까지\n\n대기가 크면 발행 쪽이나 브로커, 또는 이 파드가 poll 을 못 돌린 것이다 — 왼쪽 Tomcat 스레드와 1행 CPU 스로틀을 같이 본다. 처리가 크면 Redis 나 배치 크기다.\n두 구간을 가르기 전에는 lag 하나만 있어 어느 쪽인지 말할 수 없었다.",
          "datasource": { "type": "prometheus", "uid": "mimir" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 10 },
          "targets": [
            { "refId": "A", "expr": "histogram_quantile(0.99, sum by (le) (rate(booking_admission_lag_seconds_bucket[$__rate_interval])))", "legendFormat": "전체 p99", "exemplar": true },
            { "refId": "B", "expr": "histogram_quantile(0.99, sum by (le) (rate(booking_admission_wait_seconds_bucket[$__rate_interval])))", "legendFormat": "그중 대기 p99", "exemplar": true },
            { "refId": "C", "expr": "sum(rate(booking_admissions_total{result=\"ok\"}[$__rate_interval]))", "legendFormat": "인증 발급/초" }
          ],
          "options": { "legend": { "displayMode": "table", "placement": "bottom", "showLegend": true, "calcs": ["lastNotNull", "max"] }, "tooltip": { "mode": "multi", "sort": "desc" } }, "fieldConfig": { "defaults": { "unit": "s", "custom": { "thresholdsStyle": { "mode": "line" } }, "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null }, { "color": "red", "value": 1 } ] } }, "overrides": [ { "matcher": { "id": "byName", "options": "인증 발급/초" }, "properties": [ { "id": "unit", "value": "short" }, { "id": "custom.axisPlacement", "value": "right" } ] } ] }
        },

        { "type": "row", "title": "3. 기다리는 것 — 늘면 stg · 데이터", "gridPos": { "h": 1, "w": 24, "x": 0, "y": 19 }, "collapsed": false, "panels": [] },
        {
          "id": 4, "type": "timeseries", "title": "DB 풀 — 사용 · 대기 · 획득 시간",
          "description": "파드 전부의 합이다(파드당 20 × 두 대 = 상한 40). 사용 중이 상한에 붙고 대기가 생기면 풀이 좁거나 MySQL 이 느리다. 어느 쪽인지는 데이터 장 2행(RDS)을 같이 본다.",
          "datasource": { "type": "prometheus", "uid": "mimir" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 20 },
          "links": [ { "title": "→ stg · 데이터", "url": "/d/stg-data/?${__url_time_range}" } ],
          "targets": [
            { "refId": "A", "expr": "sum(hikaricp_connections_active{application=\"cgv-booking\"})", "legendFormat": "사용 중" },
            { "refId": "B", "expr": "sum(hikaricp_connections_pending{application=\"cgv-booking\"})", "legendFormat": "대기" },
            { "refId": "C", "expr": "sum(hikaricp_connections_max{application=\"cgv-booking\"})", "legendFormat": "상한" },
            { "refId": "D", "expr": "sum(rate(hikaricp_connections_acquire_seconds_sum{application=\"cgv-booking\"}[$__rate_interval])) / sum(rate(hikaricp_connections_acquire_seconds_count{application=\"cgv-booking\"}[$__rate_interval]))", "legendFormat": "획득 시간(초)" }
          ],
          "transformations": [ { "id": "renameByRegex", "options": { "regex": "(.*?)(queue|booking|frontend)-[a-z0-9]+-([a-z0-9]{5})", "renamePattern": "$1$3" } } ], "options": { "legend": { "displayMode": "table", "placement": "bottom", "showLegend": true, "calcs": ["lastNotNull", "max"] }, "tooltip": { "mode": "multi", "sort": "desc" } }, "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [ { "matcher": { "id": "byName", "options": "획득 시간(초)" }, "properties": [ { "id": "unit", "value": "s" }, { "id": "custom.axisPlacement", "value": "right" } ] } ] }
        },
        {
          "id": 5, "type": "timeseries", "title": "Redis 명령 — 평균 · 최대 · redis_error",
          "description": "명령 한 번의 평균 · 최대. 최대가 2초(명령 타임아웃)에 붙으면 명령이 실패하고 redis_error(503)가 된다. 받는 쪽(ElastiCache)이 찼는지는 데이터 장 1행.",
          "datasource": { "type": "prometheus", "uid": "mimir" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 20 },
          "links": [ { "title": "→ stg · 데이터", "url": "/d/stg-data/?${__url_time_range}" } ],
          "targets": [
            { "refId": "A", "expr": "sum(rate(lettuce_command_completion_seconds_sum{application=\"cgv-booking\"}[$__rate_interval])) / sum(rate(lettuce_command_completion_seconds_count{application=\"cgv-booking\"}[$__rate_interval]))", "legendFormat": "평균(초)" },
            { "refId": "B", "expr": "max(lettuce_command_completion_seconds_max{application=\"cgv-booking\"})", "legendFormat": "최대(초)" },
            { "refId": "C", "expr": "sum(rate(booking_confirm_total{result=\"redis_error\"}[$__rate_interval])) or vector(0)", "legendFormat": "redis_error/초" }
          ],
          "transformations": [ { "id": "renameByRegex", "options": { "regex": "(.*?)(queue|booking|frontend)-[a-z0-9]+-([a-z0-9]{5})", "renamePattern": "$1$3" } } ], "options": { "legend": { "displayMode": "table", "placement": "bottom", "showLegend": true, "calcs": ["lastNotNull", "max"] }, "tooltip": { "mode": "multi", "sort": "desc" } }, "fieldConfig": { "defaults": { "unit": "s", "custom": { "thresholdsStyle": { "mode": "line" } }, "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null }, { "color": "red", "value": 2 } ] } }, "overrides": [ { "matcher": { "id": "byName", "options": "redis_error/초" }, "properties": [ { "id": "unit", "value": "short" }, { "id": "custom.axisPlacement", "value": "right" } ] } ] }
        },

        { "type": "row", "title": "4. 흔적", "gridPos": { "h": 1, "w": 24, "x": 0, "y": 28 }, "collapsed": false, "panels": [] },
        {
          "id": 6, "type": "logs", "title": "booking 경고 · 오류 로그",
          "datasource": { "type": "loki", "uid": "loki" },
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 29 },
          "targets": [ { "refId": "A", "expr": "{pod=~\"booking-.*\"} |~ \"WARN|ERROR\"" } ],
          "options": { "showTime": true, "wrapLogMessage": true, "sortOrder": "Descending" }
        }
      ]
    }
