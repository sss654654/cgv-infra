# Let's Encrypt 발급자 둘 — staging으로 절차가 끝까지 도는 것을 확인한 뒤 prod로 받는다.
#   Let's Encrypt는 같은 도메인의 발급·실패 횟수에 상한을 두므로, 설정이 틀린 채
#   prod에 반복하면 그 도메인이 한동안 막힌다. staging은 상한이 넉넉한 대신
#   브라우저가 믿지 않는 인증서를 준다.
#
# 증명은 DNS-01 — cert-manager가 _acme-challenge TXT 레코드를 Cloudflare에 올려
#   도메인 소유를 증명한다. HTTP-01과 달리 포트를 먼저 열 필요가 없고
#   Cloudflare 프록시 상태와 무관하다.
#
# ClusterIssuer는 cluster-scoped지만 solver가 참조하는 Secret은
#   cert-manager 네임스페이스에서만 읽는다(cloudflare-api-token이 거기 있는 이유).
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: subinhong0109@gmail.com        # 갱신이 계속 실패하면 만료 경고가 이 주소로 온다
    privateKeySecretRef:
      name: letsencrypt-staging-account-key   # ACME 계정 키. cert-manager가 만들어 cert-manager ns에 둔다
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: api-token
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: subinhong0109@gmail.com
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: api-token
