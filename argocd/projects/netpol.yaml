# AppProject netpol — NetworkPolicy 전용 울타리.
#
# 전에는 정책이 사는 네임스페이스마다 Application 을 갈랐다(netpol-app · netpol-data ·
#   netpol-observability). 가른 이유는 종류가 달라서가 아니라 울타리였다 — apps·data·platform
#   프로젝트가 각자 자기 네임스페이스만 허용해서, 한 Application 에 세 네임스페이스의 정책을
#   담으면 울타리 밖 것이 OutOfSync 로 남았다(2026-09-07).
#
# 이 프로젝트는 그 셋을 한 울타리로 묶되 종류를 NetworkPolicy 하나로 좁힌다.
#   결과적으로 지금보다 좁아진다 — 전에는 netpol-app 이 apps 프로젝트에 있어서 그 프로젝트가
#   허용하는 모든 종류를 만들 수 있었다. 여기서는 Deployment 도 Secret 도 못 만든다.
#   cluster-scoped 는 아예 열지 않는다. NetworkPolicy 는 네임스페이스 객체다.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: netpol
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-5"   # 정책 App(wave 0)보다 프로젝트가 먼저 존재해야 한다
spec:
  description: 세 네임스페이스의 NetworkPolicy
  sourceRepos:
    - http://192.168.0.167:8929/cgv/cgv-infra.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: app
    - server: https://kubernetes.default.svc
      namespace: data
    - server: https://kubernetes.default.svc
      namespace: observability
    # stg(EKS). 켜는 날 EKS API 주소로 바꾼다.
    - server: https://7B1791387F0BBCB51B8C14C5E09523ED.gr7.ap-northeast-2.eks.amazonaws.com
      namespace: app
    - server: https://7B1791387F0BBCB51B8C14C5E09523ED.gr7.ap-northeast-2.eks.amazonaws.com
      namespace: data
    - server: https://7B1791387F0BBCB51B8C14C5E09523ED.gr7.ap-northeast-2.eks.amazonaws.com
      namespace: observability
  namespaceResourceWhitelist:
    - group: networking.k8s.io
      kind: NetworkPolicy
