# AppProject cluster — 클러스터 범위 기반(Namespace · StorageClass) 울타리. stg 전용.
#
# dev 는 이 둘을 bootstrap 이 손으로 만든다 — 허브가 서기 전이라 그럴 수밖에 없다.
#   stg 는 허브가 이미 떠 있어서 Application 으로 배달하는데, 둘 다 클러스터 범위 객체라
#   그것을 허용하는 울타리가 따로 있어야 한다. 다른 프로젝트는 Namespace 를 안 연다.
#
# 종류를 그 둘로 좁힌다. CRD · ClusterRole 까지 여는 platform 과 갈리는 지점이다.
#   네임스페이스 안의 객체는 하나도 못 만든다(namespaceResourceBlacklist).
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: cluster
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-5"   # cluster-stg(wave -4)보다 프로젝트가 먼저 존재해야 한다
spec:
  description: 클러스터 범위 기반 (Namespace · StorageClass)
  sourceRepos:
    - http://192.168.0.167:8929/cgv/cgv-infra.git
  destinations:
    # server 는 켜는 날 EKS API 주소로 바꾼다(bootstrap/eks/README.md).
    # namespace 가 * 인 이유 — 클러스터 범위 객체만 배달해서 Application 에 네임스페이스가 없다.
    #   아래 blacklist 가 네임스페이스 객체를 전부 막으므로 * 로 열어도 들어갈 것이 없다.
    - server: https://7B1791387F0BBCB51B8C14C5E09523ED.gr7.ap-northeast-2.eks.amazonaws.com
      namespace: "*"
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    - group: storage.k8s.io
      kind: StorageClass
  namespaceResourceBlacklist:
    - group: "*"
      kind: "*"
