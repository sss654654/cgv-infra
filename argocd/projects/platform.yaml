# AppProject platform — 클러스터 기반 계층(진입 · 관측) 울타리.
# infra 프로젝트에서 갈라 나왔다. data 와 갈린 근거는 울타리 내용이 실제로 다르다는 것이다 —
#   이쪽은 업스트림 차트를 쓰고 cluster-scoped 리소스(CRD · ClusterRole)를 만들어야 한다.
# 관측(observability · observability-host)과 진입(metallb-system · traefik)을 한 프로젝트에 둔다.
#   clusterResourceWhitelist 는 양쪽 다 */* 다 — 둘 다 CRD 와 ClusterRole 을 만든다.
#   가르면 destinations(2 / 2)는 좁아진다(sourceRepos 는 양쪽 다 이 저장소 + 차트 레지스트리로 같다). 그 이득을 지금 취하지 않는
#   이유는 traefik 차트가 observability 네임스페이스에 객체를 만드는 경로가 없고, ArgoCD 사용자가
#   하나여서 팀 격리 축이 없기 때문이다. 관측을 다른 사람이 맡게 되면 그때 가른다
#   (docs/구조-기준.md "무엇 단위로 나누나").
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-5"   # metallb App(wave -4)보다 프로젝트가 먼저 존재해야 함
spec:
  description: 진입(metallb · traefik) · 관측(LGTM · Alloy · exporter) · stg 클러스터 기반(CRD · Strimzi · ALB Controller)
  sourceRepos:
    - http://192.168.0.167:8929/cgv/cgv-infra.git       # 값 파일
    - 192.168.0.167:5050/cgv/cgv-infra/charts           # 업스트림 차트의 사본(GitLab 레지스트리). 원래 저장소는 열지 않는다
                                                        #   stg 의 ALB Controller · CRD · Strimzi 도 여기서 받는다
  destinations:
    - name: in-cluster
      namespace: observability
    - name: in-cluster
      namespace: observability-host      # node-exporter 전용(privileged PSA)
    - name: in-cluster
      namespace: metallb-system
    - name: in-cluster
      namespace: traefik
    # stg(EKS). server 는 켜는 날 EKS API 주소로 바꾼다(bootstrap/eks/README.md).
    #   dev 에서 bootstrap 이 손으로 까는 클러스터 기반(CRD · Strimzi)을 stg 에서는 허브가 이 울타리로 배달한다.
    - name: cgv-stg
      namespace: observability
    - name: cgv-stg
      namespace: observability-host
    - name: cgv-stg
      namespace: kube-system             # CRD 릴리스 · ALB Controller
    - name: cgv-stg
      namespace: data                    # Strimzi 오퍼레이터
  # 업스트림 차트가 CRD 와 ClusterRole 을 만든다(metallb IPAddressPool · prometheus-operator 계열 ·
  #   traefik IngressRoute). 그래서 cluster-scoped 를 연다 — 이것이 data 와 갈리는 실질 차이다.
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
