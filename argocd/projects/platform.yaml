# AppProject platform — 클러스터 기반 계층(진입 · 관측) 울타리.
# infra 프로젝트에서 갈라 나왔다. data 와 갈린 근거는 울타리 내용이 실제로 다르다는 것이다 —
#   이쪽은 업스트림 차트를 쓰고 cluster-scoped 리소스(CRD · ClusterRole)를 만들어야 한다.
# 관측(observability · observability-host)과 진입(metallb-system · traefik)을 한 프로젝트에 둔다.
#   clusterResourceWhitelist 는 양쪽 다 */* 다 — 둘 다 CRD 와 ClusterRole 을 만든다.
#   가르면 sourceRepos(관측 4 / 진입 2)와 destinations(2 / 2)는 좁아진다. 그 이득을 지금 취하지 않는
#   이유는 traefik 차트가 observability 네임스페이스에 객체를 만드는 경로가 없고, ArgoCD 사용자가
#   하나여서 팀 격리 축이 없기 때문이다. 관측을 다른 사람이 맡게 되면 그때 가른다
#   (docs/구조-기준.md "무엇 단위로 나누나").
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-5"   # metallb App(wave -4)보다 프로젝트가 먼저 존재해야 함
spec:
  description: 진입(metallb · traefik)과 관측(LGTM · Alloy · exporter)
  sourceRepos:
    - http://192.168.0.167:8929/cgv/cgv-infra.git
    - https://grafana-community.github.io/helm-charts   # 관측 업스트림 차트(멀티소스)
    - https://grafana.github.io/helm-charts
    - https://charts.min.io/
    - https://prometheus-community.github.io/helm-charts
    - https://metallb.github.io/metallb
    - https://traefik.github.io/charts
  destinations:
    - server: https://kubernetes.default.svc
      namespace: observability
    - server: https://kubernetes.default.svc
      namespace: observability-host      # node-exporter 전용(privileged PSA)
    - server: https://kubernetes.default.svc
      namespace: metallb-system
    - server: https://kubernetes.default.svc
      namespace: traefik
  # 업스트림 차트가 CRD 와 ClusterRole 을 만든다(metallb IPAddressPool · prometheus-operator 계열 ·
  #   traefik IngressRoute). 그래서 cluster-scoped 를 연다 — 이것이 data 와 갈리는 실질 차이다.
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
