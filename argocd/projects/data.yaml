# AppProject data — 미들웨어(mysql · redis · kafka CR) 울타리.
# infra 프로젝트에서 갈라 나왔다. infra 는 data · observability · observability-host ·
#   metallb-system · traefik 다섯 네임스페이스를 한 울타리에 묶고 있어서,
#   traefik App 이 data 네임스페이스에 무엇이든 만들 수 있는 상태였다.
#   울타리를 나누는 기준은 "내용이 실제로 다른 단위"다
#   (docs/구조-기준.md "무엇 단위로 나누나") —
#   data 는 cluster-scoped 리소스를 만들 필요가 없고 업스트림 차트도 안 쓴다.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: data
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-5"   # 이 프로젝트를 쓰는 App(wave -1)보다 먼저 존재해야 참조 가능
spec:
  description: CGV 미들웨어 (mysql · redis · kafka)
  sourceRepos:
    - http://192.168.0.167:8929/cgv/cgv-infra.git
  destinations:
    - name: in-cluster
      namespace: data
    # stg(EKS) — kafka-stg 하나. MySQL · Redis 는 stg 에서 관리형(RDS · ElastiCache)이라 안 온다.
    #   켜는 날 EKS API 주소로 바꾼다.
    - name: cgv-stg
      namespace: data
  # 미들웨어는 cluster-scoped 리소스를 만들지 않는다. StatefulSet · Service · PVC · Secret ·
  #   Kafka CR · PodMonitor 는 전부 네임스페이스 범위다. CRD 는 bootstrap 이 미리 세운다.
  #   여기서 막히면 ArgoCD 가 "resource not permitted in project" 로 명시적으로 실패한다.
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
