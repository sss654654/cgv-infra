# metallb-pool — IPAddressPool·L2Advertisement CR(자체 매니페스트).
# metallb 차트 App(applications/metallb.yaml · wave -4)과 같은 root 직속이라 -4 → -3 순서가 선다.
#   앞 wave 가 Healthy 가 될 때까지 다음 wave 를 시작하지 않으므로, 이 App 이 sync 될 때는
#   metallb 가 IPAddressPool CRD 를 세운 뒤다.
# 아래 SkipDryRunOnMissingResource 와 retry 는 그 순서가 어긋날 때의 안전망으로 남긴다.
#   SkipDryRunOnMissingResource는 dry-run만 건너뛰고, 실제 apply의 no matches for kind는 그대로 실패한다.
#   이 순서는 빈 클러스터를 처음 세울 때만 작동해서 평소에 검증되지 않는다.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: metallb-pool
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-3"    # root 직속 App들 중 이른 순번(CRD 존재를 보장하지는 않음 — 위 주석)
spec:
  project: platform
  source:
    repoURL: http://192.168.0.167:8929/cgv/cgv-infra.git
    targetRevision: main
    path: manifests/metallb-pool
  destination:
    server: https://kubernetes.default.svc
    namespace: metallb-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - SkipDryRunOnMissingResource=true  # CRD가 dry-run 시점에 아직 미등록일 수 있음
    retry:
      # automated sync는 같은 리비전에서 실패한 sync를 스스로 다시 돌리지 않는다
      #   (selfHeal은 "성공한 sync 뒤의 드리프트"를 되돌리는 장치다).
      # retry가 없으면 metallb 차트가 CRD를 깐 뒤에도 pool은 실패 상태로 고착하고,
      #   traefik Service가 EXTERNAL-IP <pending>으로 남아 외부 진입이 조용히 막힌다.
      # 5회 · 5s→10s→20s→40s→80s(최대 2분) = 누적 약 2.6분. metallb 차트가 CRD를 등록하는 데
      #   걸리는 시간(수십 초에서 수 분)을 덮는다.
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 2m
