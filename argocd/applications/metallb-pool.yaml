# metallb-pool — IPAddressPool·L2Advertisement CR(자체 매니페스트).
# wave -3은 root 직속 App들 사이의 생성 순서일 뿐이다. metallb 차트 App은 platform ApplicationSet이
#   만들고, 그 AppSet 자체가 root 폭포에서 wave 0에 생성된다 → 첫 부트스트랩에서는 이 App이
#   metallb App보다 먼저 sync를 시도한다. 즉 IPAddressPool CRD가 아직 없는 시점에 apply가 돈다.
# SkipDryRunOnMissingResource는 dry-run만 건너뛰고, 실제 apply의 no matches for kind는 그대로 실패한다.
#   → 첫 sync 실패는 정상 경로다. 그 실패를 되돌리는 장치가 아래 retry.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: metallb-pool
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-3"    # root 직속 App들 중 이른 순번(CRD 존재를 보장하지는 않음 — 위 주석)
spec:
  project: infra
  source:
    repoURL: https://github.com/sss654654/cgv-infra.git
    targetRevision: main
    path: workloads/manifests/metallb
  destination:
    server: https://kubernetes.default.svc
    namespace: metallb-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - SkipDryRunOnMissingResource=true  # CRD가 dry-run 시점에 아직 미등록일 수 있음
    retry:
      # automated sync는 같은 리비전에서 실패한 sync를 스스로 다시 돌리지 않는다
      #   (selfHeal은 "성공한 sync 뒤의 드리프트"를 되돌리는 장치다).
      # retry가 없으면 metallb 차트가 CRD를 깐 뒤에도 pool은 실패 상태로 고착하고,
      #   traefik Service가 EXTERNAL-IP <pending>으로 남아 외부 진입이 조용히 막힌다.
      # 5회 · 5s→10s→20s→40s→80s(최대 2분) = 누적 약 2.6분. metallb 차트가 CRD를 등록하는 데
      #   걸리는 시간(수십 초에서 수 분)을 덮는다.
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 2m
