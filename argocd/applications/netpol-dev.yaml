# netpol-dev — 세 네임스페이스의 NetworkPolicy 를 한 Application 이 배달한다.
#
# 전에는 manifests ApplicationSet 이 netpol-app · netpol-data · netpol-observability 셋을
#   만들었다. 정적 매니페스트였고, 그래서 환경마다 달라지는 것을 표현할 자리가 없었다 —
#   stg 는 입구가 ALB 이고 MySQL·Redis 가 관리형이라 정책이 가리키는 대상이 통째로 다르다.
#   차트로 옮기면서 그 차이가 envs/<환경>/netpol.yaml 로 가고, Application 은 환경당 하나가 된다.
#
# 세 네임스페이스를 한 Application 이 담을 수 있는 것은 정책 객체가 metadata.namespace 를
#   각자 갖고 있어서다. destination.namespace 는 그것을 안 적은 객체의 기본값일 뿐이다.
#   막았던 것은 AppProject 울타리였고, netpol 프로젝트가 그 셋을 허용한다.
#
# 개별 Application 인 이유 — 반복 축이 환경뿐이고 지금 둘이다. ApplicationSet 으로 묶으면
#   축 하나짜리 제너레이터가 생기는데, 그 표를 읽는 것보다 파일 두 장을 보는 편이 짧다
#   (docs/구조-기준.md "Application 인가 ApplicationSet 인가"). mysql 이 같은 자리다.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: netpol-dev
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"   # 앱(wave 3)보다 먼저. 정책이 뒤에 오면 그 사이가 열려 있다
spec:
  project: netpol
  source:
    repoURL: http://192.168.0.167:8929/cgv/cgv-infra.git
    targetRevision: main
    path: charts/platform/netpol
    helm:
      releaseName: netpol
      # 상대경로 기준 = source.path. 차트가 이 저장소 안에 있어 단일 소스로 끝난다.
      valueFiles:
        - values.yaml                       # 차트 기본값 — 환경 무관한 구조와 포트
        - ../../../envs/dev/netpol.yaml     # 이 환경에서 정책이 무엇을 가리키나
  destination:
    server: https://kubernetes.default.svc
    namespace: app                          # 객체가 metadata.namespace 를 각자 갖는다. 이건 기본값이다
  syncPolicy:
    automated:
      prune: true       # 파일을 지우면 클러스터에서도 사라진다 — 정본이 git 이라는 뜻
      selfHeal: true    # kubectl 로 손댄 것은 다음 sync 에 되돌아간다
