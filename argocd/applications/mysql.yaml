# mysql — 손 나열 개별 Application. workloads/charts/data/cgv-mysql(래퍼, 벤더링) 배포.
# 채널: install.sh 손 설치에서 GitOps로 이동. prune=false(DB 리소스 자동삭제 금지), 데이터 안전은 Retain PV가 커버.
# mysql-secret은 sealed-secrets App(wave -2)이 선배달 → 이 App(wave -1)이 그 뒤 sync.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mysql
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"    # 앱보다 먼저(booking이 MySQL에 의존)
spec:
  project: infra
  source:
    repoURL: http://192.168.0.167:8929/cgv/cgv-infra.git
    targetRevision: main
    path: workloads/charts/data/cgv-mysql
    helm:
      valueFiles:
        - values.yaml
        - ../../../environments/dev/values-mysql.yaml   # data/cgv-mysql 기준 → workloads/environments/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: data
  syncPolicy:
    automated:
      prune: false                        # DB — 선언 제거가 리소스 삭제로 이어지지 않게
      selfHeal: true
    # ServerSideApply는 쓰지 않는다. 이 차트는 null·빈 배열 필드(affinity/podAffinity: null,
    # supplementalGroups: [] 등)를 렌더에 남기는데, 서버는 그런 필드를 저장하지 않아
    # SSA 비교에서는 영구 OutOfSync가 된다. 일반 apply 비교는 null과 부재를 같게 정규화한다.
    # (SSA를 넣었던 근거였던 last-applied 애노테이션 크기 제한은 이 매니페스트 크기에선 도달하지 않는다.)
