# ArgoCD 자신을 GitOps로 관리한다. 차트는 업스트림에서, 값은 이 저장소에서 읽는다.
#
# 최초 설치는 bootstrap/install.sh의 helm이 한다 — 클러스터가 비어 있을 때는 배포할 주체가
# 없기 때문이다. 이 App은 그렇게 만들어진 리소스를 이어받아, 이후 값 변경이 helm 명령이 아닌
# git 커밋으로 흐르게 한다.
#
# targetRevision은 설치된 차트 버전과 같게 둔다. 다르면 이 App이 처음 sync하는 순간
# ArgoCD가 자기를 업그레이드하며 재시작한다.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-9"    # 다른 App보다 먼저. 제어면이 흔들리는 동안 나머지가 안 밀리게
spec:
  project: argocd
  sources:
    - repoURL: https://argoproj.github.io/argo-helm
      chart: argo-cd
      targetRevision: 10.1.4
      helm:
        valueFiles:
          - $values/bootstrap/argocd/values.yaml   # 아래 ref: values 소스를 가리킨다
    - repoURL: http://192.168.0.167:8929/cgv/cgv-infra.git
      targetRevision: main
      ref: values                                 # 차트를 렌더할 때 값만 제공. 이 소스 자체는 배포하지 않는다
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      # prune 켜면 이 파일이 사라졌을 때 ArgoCD가 자기 리소스를 지운다. 지우고 나면 되살릴 주체가 없다.
      prune: false
      # selfHeal 켜면 sync가 argocd-server·application-controller를 재시작시키고,
      # 그 재시작이 다시 sync를 유발하는 순환에 들어갈 수 있다. 값 변경은 git 커밋으로만 반영한다.
      selfHeal: false
