# alb-controller-stg — AWS Load Balancer Controller. frontend · grafana 의 Ingress 를 보고 ALB 를 만든다.
#
# 집에서 MetalLB(주소)와 Traefik(라우팅)이 하던 일을 ALB 가 받는다. ALB 는 AWS 자원이지만
#   Terraform 이 아니라 이 컨트롤러가 Ingress 를 보고 만든다 — 그래서 state 에 없다.
#   이 컨트롤러가 없으면 Ingress 는 Synced 인데 ALB 가 안 생겨 주소가 비어 있다.
# IAM 역할(cgv-stg-alb)은 Terraform 이 만들었다. 파드는 SA 애노테이션으로 그 역할을 맡는다(IRSA).
#
# 웹훅 인증서를 차트가 렌더할 때마다 새로 만든다. ArgoCD 는 매번 렌더하므로 그대로 두면
#   Secret 과 웹훅 설정의 caBundle 이 늘 OutOfSync 이고, sync 할 때마다 인증서가 바뀐다.
#   그 세 자리만 비교에서 빼고(ignoreDifferences) sync 때도 살아 있는 값을 유지한다
#   (RespectIgnoreDifferences). 처음 만들 때는 한 번의 렌더에서 나온 짝이 같이 들어가 맞는다.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alb-controller-stg
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-3"   # Ingress 를 가진 관측(1) · 앱(3)보다 먼저
spec:
  project: platform
  sources:
    - repoURL: https://aws.github.io/eks-charts
      chart: aws-load-balancer-controller
      # 차트 1.13.4 = 컨트롤러 v2.13.4. Terraform 의 IAM 정책이 이 버전의 iam_policy.json 이다.
      #   컨트롤러만 올리면 새 버전이 부르는 API 가 정책에 없어 권한 오류가 난다 — 둘을 같이 올린다.
      targetRevision: 1.13.4
      helm:
        releaseName: aws-load-balancer-controller
        valueFiles:
          - $values/charts/platform/aws-load-balancer-controller.yaml   # 환경 무관
          - $values/envs/stg/aws-load-balancer-controller.yaml          # 어느 클러스터 · VPC · IAM 역할
    - repoURL: http://192.168.0.167:8929/cgv/cgv-infra.git
      targetRevision: main
      ref: values
  destination:
    server: https://STG_EKS_ENDPOINT     # 켜는 날 EKS API 주소로 바꾼다
    namespace: kube-system
  ignoreDifferences:
    - group: ""
      kind: Secret
      name: aws-load-balancer-tls
      jsonPointers: [/data]
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      name: aws-load-balancer-webhook
      jqPathExpressions:
        - '.webhooks[].clientConfig.caBundle'
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      name: aws-load-balancer-webhook
      jqPathExpressions:
        - '.webhooks[].clientConfig.caBundle'
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - RespectIgnoreDifferences=true
    retry:
      limit: 10
      backoff: { duration: 20s, factor: 2, maxDuration: 3m }
