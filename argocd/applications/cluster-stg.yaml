# cluster-stg — stg 클러스터의 바닥 둘: 워크로드 네임스페이스(PSA 라벨) · gp3 StorageClass.
#
# dev 에서는 bootstrap/k3s/install.sh 가 같은 네임스페이스 정의를 손으로 apply 한다.
#   stg 는 허브가 이미 떠 있어 손으로 할 이유가 없다. EKS 를 허브에 등록(bootstrap/eks/register.sh)한
#   뒤에는 이 Application 이 가장 먼저 선다 — 네임스페이스가 있어야 뒤의 것들이 들어갈 자리가 생긴다.
#
# 소스가 둘이다. 네임스페이스는 두 환경이 같이 쓰는 정의이고 StorageClass 는 EBS 에만 있다.
#   한 폴더에 두면 dev 가 네임스페이스를 apply 할 때 EBS 규격까지 딸려 온다.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cluster-stg
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-4"
spec:
  project: cluster
  sources:
    - repoURL: http://192.168.0.167:8929/cgv/cgv-infra.git
      targetRevision: main
      path: manifests/namespaces
    - repoURL: http://192.168.0.167:8929/cgv/cgv-infra.git
      targetRevision: main
      path: manifests/storage-ebs
  destination:
    server: https://STG_EKS_ENDPOINT   # 켜는 날 EKS API 주소로 바꾼다
  syncPolicy:
    automated:
      # 네임스페이스를 지우면 그 안의 것이 전부 지워진다. 파일에서 빠져도 클러스터에는 남긴다.
      prune: false
      selfHeal: true
    # wave 는 만드는 순서만 정한다 — 허브에 Application 헬스 체크 설정이 없어서 앞 wave 의 sync 가
    #   끝나기를 기다리지 않는다. 먼저 돌다 실패하면 여기서 다시 시도한다. 첫 연결 실패도 같다.
    retry:
      limit: 10
      backoff: { duration: 20s, factor: 2, maxDuration: 3m }
