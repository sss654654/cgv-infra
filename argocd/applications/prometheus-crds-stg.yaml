# prometheus-crds-stg — prometheus-operator 의 CRD(ServiceMonitor · PodMonitor 등). 오퍼레이터는 안 깐다.
#
# 앱 차트(cgv-app)와 관측 차트들이 ServiceMonitor · PodMonitor 를 렌더하고 Alloy 가 그것을 읽는다.
#   CRD 가 없으면 그 Application 들이 "no matches for kind" 로 sync 에 실패한다.
# dev 는 bootstrap/k3s/install.sh [6/9] 가 같은 차트 · 같은 버전을 helm 으로 깐다.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus-crds-stg
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-4"   # 이것을 쓰는 관측(1) · 앱(3)보다 먼저
spec:
  project: platform
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: prometheus-operator-crds
    targetRevision: 30.0.1                # dev 와 같은 버전 — 두 환경이 같은 CRD 스키마를 본다
    helm:
      releaseName: prometheus-operator-crds
  destination:
    server: https://STG_EKS_ENDPOINT     # 켜는 날 EKS API 주소로 바꾼다
    namespace: kube-system
  syncPolicy:
    automated:
      # CRD 를 지우면 그 종류의 객체가 클러스터에서 전부 지워진다. 파일에서 빠져도 남긴다.
      prune: false
      selfHeal: true
    syncOptions:
      # CRD 가 커서 client-side apply 가 남기는 last-applied 애노테이션이 크기 한도(256KiB)를 넘는다.
      - ServerSideApply=true
    retry:
      limit: 10
      backoff: { duration: 20s, factor: 2, maxDuration: 3m }
