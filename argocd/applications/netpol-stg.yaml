# netpol-stg — 세 네임스페이스의 NetworkPolicy. netpol-dev 와 같은 차트다.
#
# 갈리는 것은 envs/stg/netpol.yaml 이 주는 목적지 —
#   입구가 ALB 이고 MySQL · Redis 가 클러스터 밖(RDS · ElastiCache)이라 파드 셀렉터로 못 고르고
#   서브넷 대역(ipBlock) + 포트로 연다.
# EKS 는 VPC CNI 애드온의 enableNetworkPolicy 로 이 정책을 집행한다(cgv-terraform modules/eks).
#   집행이 꺼져 있으면 객체는 Synced 인데 아무것도 안 막는다.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: netpol-stg
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"   # 앱(wave 3)보다 먼저. 정책이 뒤에 오면 그 사이가 열려 있다
spec:
  project: netpol
  source:
    repoURL: http://192.168.0.167:8929/cgv/cgv-infra.git
    targetRevision: main
    path: charts/platform/netpol
    helm:
      releaseName: netpol
      valueFiles:
        - values.yaml                       # 차트 기본값 — 환경 무관한 구조와 포트
        - ../../../envs/stg/netpol.yaml     # 이 환경에서 정책이 무엇을 가리키나
  destination:
    name: cgv-stg
    namespace: app                          # 객체가 metadata.namespace 를 각자 갖는다. 이건 기본값이다
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    # 네임스페이스(cluster-stg)가 서기 전에 돌다 실패하면 다시 시도한다.
    retry:
      limit: 10
      backoff: { duration: 20s, factor: 2, maxDuration: 3m }
