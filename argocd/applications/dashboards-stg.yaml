# dashboards-stg — stg Grafana 에 넣을 대시보드 넷. dashboards(dev)와 같은 폴더를 가리킨다.
#
# 파일을 복제하지 않고 directory.include 로 고른다. 대시보드를 고치면 두 환경에 같이 간다.
#   보내는 넷   queue · booking · Redis/Kafka · 클러스터 인프라 — 부하 판을 읽는 데 쓰는 것
#   빼는 셋     공개 서비스(Cloudflare 엣지 지표 — stg 에 엣지가 없다) ·
#               하이퍼바이저(Proxmox — stg 노드는 EC2 다) · 관측 파이프라인(앱 부하와 무관)
#
# 보내는 넷에도 빈 패널이 생긴다. queue 대시보드의 입구 패널은 Traefik 지표를 쓰고(stg 는 ALB),
#   클러스터 인프라의 제어면 패널은 etcd · 스케줄러 · 컨트롤러 매니저 지표를 쓴다(EKS 는 안 준다).
#   어느 패널이 비는지가 곧 온프레미스와 관리형의 차이라, 패널을 지우지 않고 남긴다.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dashboards-stg
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"   # 관측 스택(1) 뒤. 순서가 어긋나도 ConfigMap 은 남고 sidecar 가 나중에 읽는다
spec:
  project: platform
  source:
    repoURL: http://192.168.0.167:8929/cgv/cgv-infra.git
    targetRevision: main
    path: manifests/dashboards
    directory:
      include: '{app-queue-detail.yaml,app-booking-detail.yaml,app-redis-kafka.yaml,infra-cluster-overview.yaml}'
  destination:
    server: https://STG_EKS_ENDPOINT     # 켜는 날 EKS API 주소로 바꾼다
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff: { duration: 20s, factor: 2, maxDuration: 3m }
