# 앱 ApplicationSet — workloads/charts/apps/* 를 순회해 queue/booking/frontend Application 자동 생성.
# 각 App = charts/apps/cgv-app(공통 틀) + charts/apps/<name>/values.yaml(정체성) + environments/dev/values-<name>.yaml(환경).
# directory generator가 charts/apps/*를 순회하되 공통 틀 cgv-app은 exclude.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: apps
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  # root-app이 argocd/ 전체를 prune:true로 관리한다 → 이 파일을 지우거나 경로를 바꾸는 커밋 하나로
  #   이 ApplicationSet이 prune된다. ApplicationSet 기본 동작은 cascade라, 그때 queue·booking·frontend
  #   Application이 워크로드째 사라진다.
  # 반면 root 직속 Application(applications/*.yaml)은 finalizer가 없어 prune돼도 리소스는 남고
  #   관리만 이탈한다 — 같은 root prune인데 두 경로의 삭제 반경이 정반대였다.
  # preserveResourcesOnDeletion: true 로 두 경로를 "관리만 이탈, 리소스는 존치"로 맞춘다.
  #   대가: ApplicationSet을 지운 뒤 남는 Application·워크로드는 손으로 정리해야 한다.
  # 대안이던 root-app prune:false는 argocd/ 아래 무엇을 지워도 자동 정리가 사라져 제어면 전체가
  #   수동이 된다. 자동 정리는 남기고 워크로드 삭제만 막는 쪽을 택했다.
  syncPolicy:
    preserveResourcesOnDeletion: true
  generators:
    - git:
        repoURL: http://192.168.0.167:8929/cgv/cgv-infra.git
        revision: main
        directories:
          - path: workloads/charts/apps/*
          - path: workloads/charts/apps/cgv-app     # 공통 틀은 App 아님 → 제외
            exclude: true
  template:
    metadata:
      name: '{{.path.basename}}'          # queue / booking / frontend
      annotations:
        argocd.argoproj.io/sync-wave: "3"   # 미들웨어(-1)·관측(0~1) 뒤에 앱
        # ── image updater — 이 App의 이미지를 감시하고 새 태그를 git에 되쓴다 ──
        # 이미지 이름: 레지스트리 경로는 cgv-onprem의 디렉터리명을 따르는데 queue만 디렉터리가
        #   queue-go라 App 이름(queue)과 어긋난다. 그 하나만 조건문으로 맞춘다.
        argocd-image-updater.argoproj.io/image-list: 'app=192.168.0.167:5050/cgv/cgv-onprem/{{ if eq .path.basename "queue" }}queue-go{{ else }}{{ .path.basename }}{{ end }}'
        # newest-build: 빌드 시각 기준 최신. 태그(dev-<파이프라인번호>-<해시>)가 사전순 정렬이
        #   안 되는 형태라(dev-9 > dev-15) 시각으로 고른다.
        argocd-image-updater.argoproj.io/app.update-strategy: newest-build
        # dev 계열만 후보로. MR 파이프라인의 ci-pipeline-* 나 손으로 올린 태그는 배포 후보가 아니다.
        argocd-image-updater.argoproj.io/app.allow-tags: 'regexp:^dev-[0-9]+-[0-9a-f]+$'
        # 발견한 태그를 어느 헬름 값에 쓸지 — environments/dev 값 파일의 image.tag 한 줄.
        argocd-image-updater.argoproj.io/app.helm.image-name: image.repository
        argocd-image-updater.argoproj.io/app.helm.image-tag: image.tag
        # 되쓰기 = git 커밋. 자격은 ArgoCD의 저장소 자격(argocd-repo-cgv-infra)을 빌린다(repocreds).
        #   전용 시크릿(git:secret:) 경로는 updater 코드가 https 저장소만 받아 평문 http에서 죽는다
        #   — repocreds 경로는 스킴을 안 가린다. 그래서 저장소 자격에 write_repository 토큰이 들어
        #   있다(읽기·쓰기 통합). TLS 도입 때 전용 시크릿 분리로 되돌린다.
        argocd-image-updater.argoproj.io/write-back-method: git
        argocd-image-updater.argoproj.io/git-branch: main
        # 앞의 / = 저장소 루트 기준. 이 App이 helm 값을 읽는 그 파일에 그대로 쓴다.
        argocd-image-updater.argoproj.io/write-back-target: 'helmvalues:/workloads/environments/dev/values-{{.path.basename}}.yaml'
    spec:
      project: apps
      source:
        repoURL: http://192.168.0.167:8929/cgv/cgv-infra.git
        targetRevision: main
        path: workloads/charts/apps/cgv-app     # 공통 틀
        helm:
          valueFiles:
            # 상대경로 기준 = source.path(charts/apps/cgv-app)
            - values.yaml                                                # 차트 기본값
            - '../{{.path.basename}}/values.yaml'                        # 정체성(env 무관) — charts/apps/<name>/
            - '../../../environments/dev/values-{{.path.basename}}.yaml' # 환경값 — workloads/environments/dev/
      destination:
        server: https://kubernetes.default.svc
        namespace: app
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
