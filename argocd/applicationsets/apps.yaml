# 앱 ApplicationSet — cgv-app 차트 하나로 queue · booking · frontend Application 을 만든다.
# 축이 둘이다: 서비스(대상) × 환경. matrix 제너레이터가 둘을 곱한다.
#   지금 환경 목록에 dev 한 줄뿐이라 Application 은 3개다. stg 클러스터가 생기면
#   환경 목록에 한 줄을 더해 6개가 된다 — 이 파일 말고 고칠 곳이 없다.
#
# 서비스 목록을 디렉터리 순회에서 명시 목록으로 바꿨다.
#   순회 방식은 charts/apps/* 아래 폴더가 있으면 앱으로 쳤고, 그래서 공통 틀 cgv-app 을
#   exclude 로 빼는 예외가 필요했다. 또 레지스트리 경로가 App 이름과 다른 queue(queue-go)를
#   템플릿 안 조건문으로 맞춰야 했다. 목록에 적으면 예외도 조건문도 없어진다.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: apps
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  # root-app이 argocd/ 전체를 prune:true로 관리한다 → 이 파일을 지우거나 경로를 바꾸는 커밋 하나로
  #   이 ApplicationSet이 prune된다. ApplicationSet 기본 동작은 cascade라, 그때 queue·booking·frontend
  #   Application이 워크로드째 사라진다.
  # 반면 root 직속 Application(applications/*.yaml)은 finalizer가 없어 prune돼도 리소스는 남고
  #   관리만 이탈한다 — 같은 root prune인데 두 경로의 삭제 반경이 정반대였다.
  # preserveResourcesOnDeletion: true 로 두 경로를 "관리만 이탈, 리소스는 존치"로 맞춘다.
  #   대가: ApplicationSet을 지운 뒤 남는 Application·워크로드는 손으로 정리해야 한다.
  syncPolicy:
    preserveResourcesOnDeletion: true
  generators:
    - matrix:
        generators:
          # 서비스 축 — image 는 레지스트리 안의 경로다(레지스트리 주소는 환경 값이 준다).
          #   cgv-onprem 의 디렉터리명을 따르므로 queue 만 App 이름과 경로가 다르다.
          - list:
              elements:
                - { name: queue,    image: cgv/cgv-onprem/queue-go }
                - { name: booking,  image: cgv/cgv-onprem/booking }
                - { name: frontend, image: cgv/cgv-onprem/frontend }
          # 환경 축 — 한 줄이 곧 환경의 정의다.
          #   env      값 파일 폴더 이름
          #   server   배포 대상 클러스터
          #   registry 이 클러스터가 이미지를 받아오는 곳
          # registry 를 envs/ 값 파일이 아니라 여기 두는 이유:
          #   image-updater 가 폴링할 주소는 ApplicationSet 이 애노테이션을 만들 때 정해지는데,
          #   그 시점에 Helm 값 파일은 아직 읽히지 않는다(평가 주체가 다르다).
          #   양쪽에 적으면 같은 주소가 두 곳에 생기므로, 여기를 정본으로 두고
          #   렌더에는 helm.parameters 로 내려보낸다.
          - list:
              elements:
                - { env: dev, server: "https://kubernetes.default.svc", registry: "192.168.0.167:5050" }
  template:
    metadata:
      name: '{{.name}}'
      annotations:
        argocd.argoproj.io/sync-wave: "3"   # 미들웨어(-1)·관측(0~1) 뒤에 앱
        # ── image updater — 이 App의 이미지를 감시하고 새 태그를 git에 되쓴다 ──
        argocd-image-updater.argoproj.io/image-list: 'app={{.registry}}/{{.image}}'
        # newest-build: 빌드 시각 기준 최신. 태그(dev-<파이프라인번호>-<해시>)가 사전순 정렬이
        #   안 되는 형태라(dev-9 > dev-15) 시각으로 고른다.
        argocd-image-updater.argoproj.io/app.update-strategy: newest-build
        # dev 계열만 후보로. MR 파이프라인의 ci-pipeline-* 나 손으로 올린 태그는 배포 후보가 아니다.
        argocd-image-updater.argoproj.io/app.allow-tags: 'regexp:^dev-[0-9]+-[0-9a-f]+$'
        # 발견한 태그를 어느 헬름 값에 쓸지 — 환경 값 파일의 image.tag 한 줄.
        argocd-image-updater.argoproj.io/app.helm.image-tag: image.tag
        # image-name 은 끌 수 없다. 비워 두거나 생략해도 updater 가 기본값으로 이미지 이름을 쓴다.
        #   그래서 템플릿이 읽지 않는 자리로 돌린다 — 이미지 이름은 사람이 정하고
        #   (registry = envs/, repository = charts/apps/), 봇은 태그만 옮긴다.
        #   여기 쓰이는 값은 봇이 레지스트리에서 조회해 해석한 전체 주소이고, 렌더에 쓰이지 않는다.
        argocd-image-updater.argoproj.io/app.helm.image-name: imageUpdater.resolvedImage
        # 되쓰기 = git 커밋. 자격은 ArgoCD의 저장소 자격(argocd-repo-cgv-infra)을 빌린다(repocreds).
        #   전용 시크릿(git:secret:) 경로는 updater 코드가 https 저장소만 받아 평문 http에서 죽는다
        #   — repocreds 경로는 스킴을 안 가린다. 그래서 저장소 자격에 write_repository 토큰이 들어
        #   있다(읽기·쓰기 통합). TLS 도입 때 전용 시크릿 분리로 되돌린다.
        argocd-image-updater.argoproj.io/write-back-method: git
        argocd-image-updater.argoproj.io/git-branch: main
        # 앞의 / = 저장소 루트 기준. 이 App이 helm 값을 읽는 그 파일에 그대로 쓴다.
        argocd-image-updater.argoproj.io/write-back-target: 'helmvalues:/envs/{{.env}}/{{.name}}.yaml'
    spec:
      project: apps
      source:
        repoURL: http://192.168.0.167:8929/cgv/cgv-infra.git
        targetRevision: main
        path: charts/apps/cgv-app                # 공통 틀 — 세 서비스가 같은 차트를 쓴다
        helm:
          # 상대경로 기준 = source.path(charts/apps/cgv-app).
          #   차트가 이 저장소 안에 있어 단일 소스로 끝난다. 업스트림 차트를 쓰는 AppSet
          #   (platform·observability)만 값 제공용 git 소스를 따로 두고 $values 를 쓴다.
          valueFiles:
            - values.yaml                             # 차트 기본값
            - '../{{.name}}/values.yaml'              # 이 서비스가 무엇인가 (환경 무관)
            - '../../../envs/{{.env}}/{{.name}}.yaml' # 이 환경에서 얼마나 크게
          # 위 환경 목록의 registry 를 렌더로 내려보낸다. parameters 는 valueFiles 보다 나중에
          #   적용되므로, 값 파일에 같은 키를 또 두지 않는다.
          parameters:
            - name: image.registry
              value: '{{.registry}}'
      destination:
        server: '{{.server}}'
        namespace: app
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
