# 플랫폼 ApplicationSet — metallb·traefik를 GitOps로 관리.
# metallb·traefik은 부트스트랩 순환에도 CRD 의존에도 해당하지 않아 GitOps로 관리한다.
#   특히 traefik은 OTel 튜닝을 수동 helm upgrade(순단 위험) 없이 반영할 수 있다.
# cert-manager는 제외 — 현재 소비자 없음. 존치/제거가 미결이라 Phase2까지 bootstrap에서 손으로 관리.
# wave: metallb -4 → traefik -2. 이 wave는 이 AppSet이 만드는 App들 사이의 순서다.
#   root 폭포에서는 AppSet 자체가 wave 0에 생성되므로, root 직속 App(metallb-pool 등)이 먼저 만들어진다
#   — metallb-pool은 그 전제 위에서 retry를 갖고 있다(applications/metallb-pool.yaml).
#   argocd 자체는 install.sh가 손 설치 후 kubectl로 root-app apply(ingress 불요) → 이 폭포가 metallb/traefik를 뒤이어 세움.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: platform
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  # root-app이 argocd/ 전체를 prune:true로 관리한다 → 이 파일을 지우거나 경로를 바꾸는 커밋 하나로
  #   이 ApplicationSet이 prune된다. ApplicationSet 기본 동작은 cascade라, 그때 생성돼 있던
  #   Application과 그 워크로드까지 같이 지워진다.
  # 반면 root 직속 Application(applications/*.yaml)은 finalizer가 없어 prune돼도 리소스는 남고
  #   관리만 이탈한다 — 같은 root prune인데 두 경로의 삭제 반경이 정반대였다.
  # preserveResourcesOnDeletion: true 로 두 경로를 "관리만 이탈, 리소스는 존치"로 맞춘다.
  #   대가: ApplicationSet을 지운 뒤 남는 Application·워크로드는 손으로 정리해야 한다.
  # 대안이던 root-app prune:false는 argocd/ 아래 무엇을 지워도 자동 정리가 사라져 제어면 전체가
  #   수동이 된다. 자동 정리는 남기고 워크로드 삭제만 막는 쪽을 택했다.
  syncPolicy:
    preserveResourcesOnDeletion: true
  generators:
    - list:
        elements:
          # psa: 이 ns를 만드는 주체가 Argo(CreateNamespace)라 라벨도 여기서 건다(managedNamespaceMetadata).
          #   metallb=privileged — speaker·frr-k8s가 hostNetwork + NET_ADMIN/NET_RAW/SYS_ADMIN을 쓴다(L2 광고에 필수).
          #   traefik=restricted — 렌더 실물이 runAsNonRoot·cap drop ALL·seccomp RuntimeDefault·8000/8443 비특권 포트라 그대로 통과.
          - { name: metallb, repoURL: https://metallb.github.io/metallb, chart: metallb, version: "0.16.1", namespace: metallb-system, wave: "-4", psa: privileged }
          - { name: traefik, repoURL: https://traefik.github.io/charts,  chart: traefik, version: "41.0.2", namespace: traefik,        wave: "-2", psa: restricted }
  template:
    metadata:
      name: '{{.name}}'
      annotations:
        argocd.argoproj.io/sync-wave: '{{.wave}}'
    spec:
      project: infra
      sources:
        - repoURL: '{{.repoURL}}'          # 업스트림 차트(직접 참조 + 버전 핀)
          chart: '{{.chart}}'
          targetRevision: '{{.version}}'
          helm:
            valueFiles:
              - $values/workloads/charts/platform/{{.name}}/values.yaml
        - repoURL: http://192.168.0.167:8929/cgv/cgv-infra.git   # 값 제공용 git 소스
          targetRevision: main
          ref: values
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{.namespace}}'
      syncPolicy:
        managedNamespaceMetadata:         # CreateNamespace=true로 만드는 ns에 PodSecurity 라벨을 같이 건다
          labels:
            pod-security.kubernetes.io/enforce: '{{.psa}}'
            pod-security.kubernetes.io/enforce-version: latest
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true          # metallb-system·traefik ns 자동 생성
          - ServerSideApply=true          # 차트 CRD(metallb IPAddressPool 등) 대비
