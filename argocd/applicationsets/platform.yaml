# 진입 ApplicationSet — 업스트림 차트를 이 저장소의 값과 함께 올린다.
#
# 지금 목록에 traefik 하나뿐이다. 그래도 AppSet 인 이유는 환경 축이 있기 때문이다 —
#   stg 클러스터가 생기면 traefik 은 양쪽에 다 있어야 한다
#   (docs/구조-기준.md "Application 인가 ApplicationSet 인가").
#
# metallb 는 applications/metallb.yaml 로 갈라 나갔다. 클라우드에서는 관리형 로드밸런서가
#   그 자리를 대신하므로 온프레미스에만 있고, matrix 는 모든 원소를 모든 환경에 곱하기 때문에
#   둘이 한 AppSet 에 있으면 metallb 까지 stg 에 생긴다.
#
# 관측(observability AppSet)과 형태는 같지만 합치지 않는다 — 관측 8종은 환경 축이 없어서
#   같은 matrix 에 넣으면 8종이 전부 stg 에 생긴다.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: platform
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  # root-app이 argocd/ 전체를 prune:true로 관리한다 → 이 파일을 지우거나 경로를 바꾸는 커밋 하나로
  #   이 ApplicationSet이 prune된다. ApplicationSet 기본 동작은 cascade라, 그때 생성돼 있던
  #   Application과 그 워크로드까지 같이 지워진다.
  # 반면 root 직속 Application(applications/*.yaml)은 finalizer가 없어 prune돼도 리소스는 남고
  #   관리만 이탈한다 — 같은 root prune인데 두 경로의 삭제 반경이 정반대였다.
  # preserveResourcesOnDeletion: true 로 두 경로를 "관리만 이탈, 리소스는 존치"로 맞춘다.
  syncPolicy:
    preserveResourcesOnDeletion: true
  generators:
    - matrix:
        generators:
          # psa: 이 ns를 만드는 주체가 Argo(CreateNamespace)라 라벨도 여기서 건다(managedNamespaceMetadata).
          #   traefik=restricted — 렌더 실물이 runAsNonRoot·cap drop ALL·seccomp RuntimeDefault·8000/8443
          #   비특권 포트라 그대로 통과한다.
          - list:
              elements:
                - { name: traefik, repoURL: https://traefik.github.io/charts, chart: traefik, version: "41.0.2", namespace: traefik, wave: "-2", psa: restricted }
          - list:
              elements:
                - { env: dev, server: "https://kubernetes.default.svc" }
  template:
    metadata:
      name: '{{.name}}-{{.env}}'
      annotations:
        argocd.argoproj.io/sync-wave: '{{.wave}}'
    spec:
      project: platform
      sources:
        - repoURL: '{{.repoURL}}'          # 업스트림 차트(직접 참조 + 버전 핀)
          chart: '{{.chart}}'
          targetRevision: '{{.version}}'
          helm:
            # Application 이름이 traefik-dev 여도 Helm 릴리스 이름은 traefik 으로 고정한다.
            #   차트가 Release.Name 으로 selector 라벨(instance: traefik-traefik)을 만드는데
            #   selector 는 불변이라, 릴리스 이름이 바뀌면 기존 Deployment 에 apply 가 거부된다.
            releaseName: '{{.name}}'
            valueFiles:
              - $values/charts/platform/{{.name}}/values.yaml
        - repoURL: http://192.168.0.167:8929/cgv/cgv-infra.git   # 값 제공용 git 소스
          targetRevision: main
          ref: values
      destination:
        server: '{{.server}}'
        namespace: '{{.namespace}}'
      syncPolicy:
        managedNamespaceMetadata:         # CreateNamespace=true로 만드는 ns에 PodSecurity 라벨을 같이 건다
          labels:
            pod-security.kubernetes.io/enforce: '{{.psa}}'
            pod-security.kubernetes.io/enforce-version: latest
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true          # traefik ns 자동 생성
          - ServerSideApply=true          # 차트 CRD(IngressRoute 등) 대비
