# 관측 ApplicationSet — 컴포넌트마다 다른 업스트림 차트를 생성한다.
# 축이 둘이다: 대상(컴포넌트) × 환경. 값은 두 층으로 온다 —
#   charts/observability/<이름>.yaml        환경 무관
#   envs/<환경>/observability/<이름>.yaml   그 환경에서 갈리는 것
# 버전은 helm 으로 검증해 고정. loki 는 grafana-community 리포(포크됨).
# 차트는 GitLab 레지스트리에 둔 사본에서 받는다. 원래 저장소와 버전 목록은 charts/upstream-charts.txt.
#
# ★ releaseName 을 Application 이름과 분리한다 (2026-09-11).
#   ArgoCD 는 releaseName 이 없으면 Application 이름을 Helm 릴리스 이름으로 쓴다.
#   환경 축을 넣으면서 Application 이 loki-dev 가 되는데, 릴리스 이름까지 따라가면
#   객체 이름이 loki-gateway 에서 loki-dev-gateway 로 전부 바뀐다 — 스택이 통째로 재생성된다.
#   apps AppSet 이 같은 이유로 releaseName 을 고정하고 있다.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: observability
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  # root-app이 argocd/ 전체를 prune:true로 관리한다 → 이 파일을 지우거나 경로를 바꾸는 커밋 하나로
  #   이 ApplicationSet이 prune된다. ApplicationSet 기본 동작은 cascade라, 그때 LGTM Application이
  #   워크로드째 사라진다(PV는 Retain이라 데이터만 남고 스택은 없어진다).
  # 반면 root 직속 Application(applications/*.yaml)은 finalizer가 없어 prune돼도 리소스는 남고
  #   관리만 이탈한다 — 같은 root prune인데 두 경로의 삭제 반경이 정반대였다.
  # preserveResourcesOnDeletion: true 로 두 경로를 "관리만 이탈, 리소스는 존치"로 맞춘다.
  #   대가: ApplicationSet을 지운 뒤 남는 Application·워크로드는 손으로 정리해야 한다.
  # 대안이던 root-app prune:false는 argocd/ 아래 무엇을 지워도 자동 정리가 사라져 제어면 전체가
  #   수동이 된다. 자동 정리는 남기고 워크로드 삭제만 막는 쪽을 택했다.
  syncPolicy:
    preserveResourcesOnDeletion: true
  generators:
    # 두 환경에 다 서는 일곱 — 대상 축 × 환경 축.
    - matrix:
        generators:
          # namespace: node-exporter만 observability-host(privileged). 나머지는 observability(baseline).
          #   node-exporter가 hostNetwork·hostPID·hostPath를 써서 baseline을 못 넘기 때문이고,
          #   그 하나 때문에 Grafana(관리자 자격)까지 privileged로 두지 않으려는 분리다.
          - list:
              elements:
                - { name: loki,               chart: loki,                     version: "18.5.0",  namespace: observability }
                - { name: mimir,              chart: mimir-distributed,        version: "6.1.0",   namespace: observability }
                - { name: tempo,              chart: tempo,                    version: "1.24.4",  namespace: observability }
                - { name: grafana,            chart: grafana,                  version: "10.5.15", namespace: observability }
                - { name: alloy,              chart: alloy,                    version: "1.10.1",  namespace: observability }
                - { name: kube-state-metrics, chart: kube-state-metrics,       version: "7.8.1",   namespace: observability }
                - { name: node-exporter,      chart: prometheus-node-exporter, version: "4.56.1",  namespace: observability-host }
          # 환경 축 — 한 줄이 곧 환경의 정의다.
          #   ★ 켜는 날 stg 한 줄을 더한다. server 는 그때 받은 EKS 주소다.
          #     지금 넣으면 없는 클러스터를 가리키는 Application 일곱이 계속 실패 상태로 남는다.
          - list:
              elements:
                - { env: dev, server: "https://kubernetes.default.svc" }
    # dev 에만 있는 것. stg 는 오브젝트 저장소가 S3 라 이 자리가 없다.
    #   matrix 에 두면 환경 축을 곱해 stg 에도 생기므로 따로 뺀다.
    - list:
        elements:
          - { name: minio, chart: minio, version: "5.4.0", namespace: observability, env: dev, server: "https://kubernetes.default.svc" }
  template:
    metadata:
      name: '{{.name}}-{{.env}}'
      annotations:
        argocd.argoproj.io/sync-wave: '{{ if eq .name "minio" }}0{{ else }}1{{ end }}'   # 오브젝트 저장소 먼저 → LGTM/수집기
    spec:
      project: platform
      sources:
        # 업스트림 차트의 사본. GitLab 레지스트리(OCI)라 oci:// 없이 적는다.
        #   무엇이 올라가 있는지는 charts/upstream-charts.txt, 받는 자격은 argocd-repo-charts(manifests/secrets).
        - repoURL: 192.168.0.167:5050/cgv/cgv-infra/charts
          chart: '{{.chart}}'
          targetRevision: '{{.version}}'
          helm:
            # ★ Application 이름이 loki-dev 여도 Helm 릴리스 이름은 loki 로 고정한다.
            #   릴리스 이름이 객체 이름의 접두사라, 바뀌면 스택이 통째로 다시 만들어진다.
            releaseName: '{{.name}}'
            valueFiles:
              - $values/charts/observability/{{.name}}.yaml          # 환경 무관
              - $values/envs/{{.env}}/observability/{{.name}}.yaml   # 이 환경에서 갈리는 것
        - repoURL: http://192.168.0.167:8929/cgv/cgv-infra.git   # 값 제공용 git 소스
          targetRevision: main
          ref: values
      destination:
        server: '{{.server}}'
        namespace: '{{.namespace}}'      # 두 ns 모두 bootstrap/k3s/namespaces.yaml 이 라벨과 함께 미리 만든다(CreateNamespace 불요)
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
