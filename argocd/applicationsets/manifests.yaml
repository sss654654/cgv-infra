# 매니페스트 ApplicationSet — 렌더 없이 그대로 apply 하는 것들을 목록 하나로 만든다.
#
# 묶는 기준이 "쿠버네티스 종류"가 아니라 두 가지다.
#   1. source 형태가 같다 — 값이 없고 경로 하나를 그대로 apply 한다.
#      ApplicationSet 템플릿은 source 형태를 하나만 표현할 수 있어, 차트 기반은 다른 AppSet 이다.
#   2. 환경 축이 있다 — stg 클러스터가 생기면 양쪽에 다 있어야 하는 것들이다.
#      dev 에만 있는 것(metallb-pool · dashboards · alerting · public-guard · reset-app)은
#      반복 축이 없으므로 개별 Application 으로 남는다
#      (docs/구조-기준.md "Application 인가 ApplicationSet 인가").
#
# 여기 모으기 전에는 같은 정보가 파일 7개에 흩어져 있었다. 어느 매니페스트가 어느 울타리에서
#   어느 순서로 서는지 보려면 7개를 열어야 했다 — 지금은 아래 목록 한 표가 답한다.
#
# 환경 축은 이름까지만 걸려 있다. 경로는 아직 환경별로 안 갈렸다 —
#   stg 를 붙일 때 어떤 것이 환경별 경로를 필요로 하는지(봉인 키가 다른 secrets,
#   도메인이 다른 certificates)가 정해지므로, 안 해 본 것을 미리 구조로 만들지 않는다.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: manifests
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  # root-app 이 argocd/ 를 prune:true 로 관리한다. 이 파일이 지워지면 AppSet 이 prune 되고
  #   기본 동작인 cascade 로 생성된 Application 과 리소스까지 사라진다.
  #   root 직속 Application 은 finalizer 가 없어 리소스가 남는데, 그 반경을 여기에도 맞춘다.
  syncPolicy:
    preserveResourcesOnDeletion: true
  generators:
    - matrix:
        generators:
          # 대상 축 — 어느 경로를 어느 울타리에서 어느 네임스페이스에 어느 순서로.
          #
          # ★ NetworkPolicy 셋이 여기서 빠졌다 (2026-09-11).
          #   환경마다 정책이 가리키는 대상이 달라져서(stg 는 입구가 ALB, MySQL·Redis 가 관리형)
          #   정적 매니페스트로는 표현할 자리가 없다. 차트로 옮겨 envs/<환경>/netpol.yaml 이
          #   그 차이만 주게 했고, Application 은 환경당 하나가 됐다
          #   (charts/platform/netpol · argocd/applications/netpol-<환경>.yaml).
          #   셋으로 갈랐던 이유가 AppProject 울타리였는데, netpol 프로젝트가 세 네임스페이스를
          #   허용하면서 그 이유도 없어졌다.
          #
          # ★ Kafka 도 같은 이유로 빠졌다 (2026-09-11).
          #   브로커 볼륨(정적 PV ↔ EBS)과 토픽 파티션 수가 환경마다 다르다.
          #   charts/data/cgv-kafka · argocd/applications/kafka-<환경>.yaml.
          #
          # 남은 다섯은 전부 환경 축이 없다 — dev 전용이거나(cert 둘 · sealed-secrets)
          #   환경과 무관하다(rbac). 그래서 아래 환경 축은 사실상 이름을 붙이는 자리로만 남는다.
          - list:
              elements:
                - { name: sealed-secrets,       path: manifests/secrets,              project: secrets,  namespace: data,          wave: "-2" }
                - { name: rbac,                 path: manifests/rbac,                 project: platform, namespace: observability, wave: "0" }
                - { name: cert-issuers,         path: manifests/cert-issuers,         project: cert,     namespace: cert-manager,  wave: "0" }
                - { name: certificates,         path: manifests/certificates,         project: apps,     namespace: app,           wave: "0" }
          # 환경 축 — 지금은 이름에만 쓴다. 경로는 아직 환경별로 갈리지 않았다.
          #   stg 를 붙일 때 어떤 것이 환경별 경로를 필요로 하는지(봉인 키가 다른 secrets,
          #   도메인이 다른 certificates) 정해지면 그때 path 에도 {{.env}} 를 넣는다.
          - list:
              elements:
                - { env: dev, cluster: in-cluster }
  template:
    metadata:
      name: '{{.name}}-{{.env}}'
      annotations:
        argocd.argoproj.io/sync-wave: '{{.wave}}'
    spec:
      project: '{{.project}}'
      source:
        repoURL: http://192.168.0.167:8929/cgv/cgv-infra.git
        targetRevision: main
        path: '{{.path}}'
      destination:
        name: '{{.cluster}}'
        namespace: '{{.namespace}}'
      syncPolicy:
        automated:
          # prune: 파일을 지우면 클러스터에서도 사라진다 — 정본이 git 이라는 뜻.
          prune: true
          # selfHeal: UI 나 kubectl 로 손댄 것은 다음 sync 에 되돌아간다.
          selfHeal: true
        syncOptions:
          # 부트스트랩 시점에 CRD 가 아직 등록되지 않은 것이 섞여 있다(Strimzi Kafka CR ·
          #   SealedSecret · cert-manager ClusterIssuer). 그때 dry-run 이 "종류를 모른다"로
          #   실패하는 것을 건너뛴다. 종류가 이미 등록돼 있으면 이 옵션은 아무 일도 하지 않으므로
          #   목록 전체에 걸어 템플릿을 하나로 유지한다.
          - SkipDryRunOnMissingResource=true
