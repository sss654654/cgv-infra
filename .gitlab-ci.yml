# cgv-infra CI — 배포하지 않는다. 이 저장소가 만드는 것을 클러스터에 닿기 전에 검증만 한다.
#
# 왜 필요한가: 이 저장소에는 배포 파이프라인이 없다(배포는 ArgoCD 가 한다). 그래서
#   잘못된 YAML 을 push 하면 그것을 알려 주는 것이 클러스터였다 — ArgoCD 가 sync 에 실패하고
#   Application 이 빨개진 뒤에야 안다. 그건 늦다. 여기서 커밋 시점에 잡는다.
#
# 클러스터에 접근하지 않는다. 러너는 데스크탑이고 kubeconfig 가 없다.
#   그래서 CRD 스키마를 schemas/ 에 파일로 갖고 있다(아래 validate job 주석).
#
# stage 는 둘이다. validate 의 job 들은 서로 독립이고 전부 몇 초짜리라 순서를 강제하지 않는다.
#   mirror 는 업스트림 차트 목록이 바뀐 커밋에만 생긴다. 새 버전을 레지스트리에 올린 뒤에
#   validate 의 렌더가 그 버전을 받게 하려고 앞에 둔다(아래 "업스트림 차트").

stages:
  - mirror
  - validate

default:
  tags:
    - docker            # cgv-onprem 과 같은 러너. 별도 러너를 두지 않는다
  interruptible: true   # 같은 브랜치에 새 커밋이 오면 돌던 것을 취소한다
  timeout: 10m          # 전부 몇 초짜리다. 이 시간을 넘으면 뭔가 매달린 것이다

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
      # 일반 브랜치는 MR 을 열어야 돈다. main 은 직접 push 를 막아 두었지만,
      #   argocd-image-updater 가 봇으로 커밋하는 경로가 있어 그쪽도 검증한다.

variables:
  # 도구 이미지는 이 저장소의 GitLab 레지스트리에서 받는다. 업스트림(docker.io · ghcr.io)을
  #   직접 쓰지 않는 이유는 셋이다.
  #   1. 러너의 allowed_images 는 외부 이미지를 하나씩 여는 구조다. 검증 하나 하자고
  #      그 목록에 외부 저장소를 더하면 통제가 넓어지고, 그 이유가 git 밖(config.toml)에 남는다.
  #      레지스트리 하나만 열면 앞으로 도구가 늘어도 목록을 안 건드린다.
  #   2. 매 job 마다 외부에 붙지 않는다. 거기가 느리거나 죽으면 CI 가 멈춘다.
  #   3. 이미지가 데스크탑 도커에 캐시돼 두 번째 job 부터 pull 이 0 초다.
  # 미러링 절차는 schemas/README.md 가 아니라 아래 "도구 이미지 갱신" 주석에.
  HELM_IMAGE: 192.168.0.167:5050/cgv/cgv-infra/helm:3.16.3
  KUBECONFORM_IMAGE: 192.168.0.167:5050/cgv/cgv-infra/kubeconform:v0.6.7-alpine
  #
  # ── 도구 이미지 갱신 ───────────────────────────────────────────────────────
  # 버전을 올릴 때 데스크탑에서 한 번 밀어 넣는다. 러너는 같은 도커 데몬을 쓴다.
  #   docker login 192.168.0.167:5050
  #   docker pull  alpine/helm:<새 버전>
  #   docker tag   alpine/helm:<새 버전> 192.168.0.167:5050/cgv/cgv-infra/helm:<새 버전>
  #   docker push  192.168.0.167:5050/cgv/cgv-infra/helm:<새 버전>
  #   → 그다음 위 HELM_IMAGE 를 그 버전으로.  kubeconform 도 같다.
  # ⚠ 러너의 allowed_images 에 "192.168.0.167:5050/**" 가 있어야 한다(러너 config.toml).
  #   별 하나(*)는 슬래시를 안 넘어 cgv/cgv-infra/helm 같은 중첩 경로가 안 걸린다.
  # ⚠ kubeconform 은 -alpine 태그를 쓴다. 기본 태그는 scratch 기반이라 셸이 없고,
  #   GitLab 은 script: 를 셸로 실행하므로 "sh: executable file not found" 로 죽는다.
  # ArgoCD 가 렌더할 때 helm.parameters 로 주는 값. 여기서는 렌더가 되는지만 보므로
  #   실제 레지스트리 주소일 필요가 없다 — 비어 있으면 차트의 required 가 걸린다.
  RENDER_REGISTRY: registry.invalid
  # 렌더 검증 대상 환경. 배포 배선(ApplicationSet 의 env 축)보다 앞서도 된다 —
  #   값 파일이 채워진 환경은 배포 전에 미리 렌더해 두는 편이 스키마 오류를 일찍 잡는다.
  #   stg 를 빼 뒀던 이유는 값 파일이 골격이라 "resources 가 없다"로 항상 실패해서였는데,
  #   실물 값을 채우면서 그 이유가 없어졌다.
  # ⚠ 환경을 새로 만들면 값 파일을 채우는 시점에 여기도 같이 늘린다.
  ACTIVE_ENVS: "dev stg"
  # 업스트림 차트 사본이 있는 곳. ArgoCD Application 의 repoURL(192.168.0.167:5050/cgv/cgv-infra/charts)과 같다.
  CHARTS: $CI_REGISTRY_IMAGE/charts

# ── 차트 구조 ────────────────────────────────────────────────────────────────
# Chart.yaml 이 있는 것만 대상이다. charts/ 아래 대부분은 값 파일만 있는 폴더라
#   차트가 아니다(docs/구조-기준.md "아직 기준대로 되어 있지 않은 것" 참조).
#
# ⚠ 차트 기본값만으로는 lint 할 수 없다. values.schema.json 이 resources.limits.memory 를
#   required 로 걸어 두었고, 그 값은 환경 층이 채우기 때문이다(기본값에 없는 것이 정상).
#   그래서 실제 배포와 같은 값 조합을 줘서 lint 한다 — 그러지 않으면 "기본값이 스키마를
#   못 지킨다"는, 배포에서 일어나지 않는 실패를 보게 된다.
lint:charts:
  stage: validate
  image:
    name: $HELM_IMAGE
    entrypoint: [""]
  script:
    - |
      set -e
      echo "── charts/apps/cgv-app (queue@dev 값 조합)"
      helm lint charts/apps/cgv-app \
        -f charts/apps/cgv-app/values.yaml \
        -f charts/apps/queue.yaml \
        -f envs/dev/queue.yaml \
        --set image.registry=$RENDER_REGISTRY
      for c in charts/data/cgv-mysql charts/data/cgv-redis; do
        svc=$(basename "$c" | sed 's/^cgv-//')
        echo "── $c ($svc@dev 값 조합)"
        helm lint "$c" -f "$c/values.yaml" -f "envs/dev/$svc.yaml"
      done

# ── 렌더 ─────────────────────────────────────────────────────────────────────
# ArgoCD 가 각 Application 에서 하는 helm 렌더를 같은 값 조합으로 재현한다.
#   여기서 실패하면 ArgoCD 도 ComparisonError 로 실패한다. 그 실패를 여기로 당긴다.
# 값 조합은 argocd/applicationsets/{apps,data}.yaml 의 valueFiles 순서와 같아야 한다.
#   그 순서가 바뀌면 이 job 도 같이 고친다 — 아니면 여기 통과가 의미를 잃는다.
template:render:
  stage: validate
  image:
    name: $HELM_IMAGE
    entrypoint: [""]
  script:
    - |
      set -e
      mkdir -p rendered

      # ACTIVE_ENVS 의 환경을 렌더한다. 값 조합은 ApplicationSet 의 valueFiles 순서와 같다
      #   (argocd/applicationsets/apps.yaml · data.yaml).
      #   값 파일이 비어 있는 환경을 넣으면 "resources 가 없다"로 항상 실패하므로,
      #   값을 채우는 시점에 ACTIVE_ENVS 에 넣는다. 배포 배선보다 앞서도 된다.
      # data 쪽은 그 환경에 값 파일이 없으면 건너뛴다 — stg 는 MySQL·Redis 가 관리형이라
      #   차트가 없다.
      for e in $ACTIVE_ENVS; do
        for svc in queue booking frontend; do
          echo "── apps  $svc @ $e"
          helm template "$svc" charts/apps/cgv-app \
            -f charts/apps/cgv-app/values.yaml \
            -f "charts/apps/$svc.yaml" \
            -f "envs/$e/$svc.yaml" \
            --set image.registry=$RENDER_REGISTRY \
            > "rendered/$e-$svc.yaml"
        done

        # data AppSet(redis) · mysql Application: 차트마다 자기 값 + 환경 값
        for pair in "redis:cgv-redis" "mysql:cgv-mysql" "kafka:cgv-kafka"; do
          svc=${pair%%:*}; chart=${pair##*:}
          [ -f "envs/$e/$svc.yaml" ] || { echo "── skip  $svc @ $e (이 환경엔 없다)"; continue; }
          echo "── data  $svc @ $e"
          helm template "$svc" "charts/data/$chart" \
            -f "charts/data/$chart/values.yaml" \
            -f "envs/$e/$svc.yaml" \
            > "rendered/$e-$svc.yaml"
        done

        # netpol: 환경당 하나. 세 네임스페이스의 정책을 한 릴리스가 렌더한다.
        echo "── platform  netpol @ $e"
        helm template netpol charts/platform/netpol \
          -f charts/platform/netpol/values.yaml \
          -f "envs/$e/netpol.yaml" \
          > "rendered/$e-netpol.yaml"
      done

      ls -la rendered/
  artifacts:
    paths:
      - rendered/       # validate:manifests 가 이걸 이어받아 스키마 검사를 한다
    expire_in: 1 day

# ── 스키마 ───────────────────────────────────────────────────────────────────
# 렌더 결과와 정적 매니페스트가 쿠버네티스 스키마에 맞는지 본다.
#   -strict: 스키마에 없는 필드를 오류로. 오타난 키를 잡는 것이 이 job 의 목적이다.
#
# CRD 11종(Kafka·KafkaNodePool·KafkaTopic·SealedSecret·ClusterIssuer·Certificate·
#   IPAddressPool·L2Advertisement·Middleware·ServiceMonitor·PodMonitor)은 kubeconform 이 모른다. 그래서
#   schemas/ 에 클러스터에서 뽑은 openAPIV3Schema 를 커밋해 두고 그것을 쓴다.
#   -ignore-missing-schemas 를 쓰지 않는 이유: 그러면 CRD 를 통째로 안 보게 되는데,
#   Kafka CR 처럼 브로커 수·리스너가 들어 있는 것이 검증 밖으로 나간다.
#   ⚠ CRD 버전을 올리면 schemas/ 도 다시 뽑아야 한다(절차와 함정은 schemas/README.md).
validate:manifests:
  stage: validate
  needs: ["template:render"]
  image:
    name: $KUBECONFORM_IMAGE
    entrypoint: [""]
  script:
    - |
      set -e
      # 스키마 파일 이름의 종류(kind)는 소문자다. kubeconform 이 {{.ResourceKind}} 를
      #   소문자로 치환하기 때문이다(v0.6.7 pkg/registry/registry.go 의
      #   ResourceKind: strings.ToLower(resourceKind)). 그룹과 버전은 원본 표기 그대로다.
      #   대문자로 두면 러너의 파일시스템이 대소문자를 구분해 CRD 를 하나도 못 찾는다
      #   (파이프라인 #111-#115: 코어 61개 통과, CRD 36개가 전부 "could not find schema").
      # 경로는 절대로 준다 — job 의 작업 디렉터리에 기대지 않게. $CI_PROJECT_DIR 은
      #   GitLab 이 주는 저장소 루트라 러너의 builds_dir 이 바뀌어도 따라간다.
      TPL="$CI_PROJECT_DIR/schemas/{{.ResourceKind}}-{{.Group}}-{{.ResourceAPIVersion}}.json"
      echo "── 스키마 패턴: $TPL"
      /kubeconform -strict -summary \
        -schema-location default \
        -schema-location "$TPL" \
        manifests/ rendered/

# ── 업스트림 차트 ────────────────────────────────────────────────────────────
# 외부 차트(관측 · 진입 · ArgoCD 자신 · stg 전용)는 원래 저장소가 아니라 이 프로젝트의 GitLab
#   레지스트리에 둔 사본에서 받는다. 목록과 버전은 charts/upstream-charts.txt 한 곳에 있다.
#   이유와 버전 올리는 순서: docs/구조-기준.md "업스트림 차트를 받는 방식".
#
# 레지스트리 자격. helm 3.16 의 push 에는 자격 인자가 없고 registry login 에는 평문 http 를
#   고르는 옵션이 없어서, helm 이 읽는 자격 파일(도커 config 와 같은 형식)을 직접 쓴다.
#   CI_REGISTRY_USER · CI_REGISTRY_PASSWORD 는 GitLab 이 job 마다 주는 이 프로젝트 레지스트리 자격이다.
.chart-registry:
  image:
    name: $HELM_IMAGE
    entrypoint: [""]
  before_script:
    - |
      set -e
      mkdir -p "$HOME/.config/helm/registry"
      AUTH=$(printf '%s:%s' "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" | base64 | tr -d '\n')
      printf '{"auths":{"%s":{"auth":"%s"}}}' "$CI_REGISTRY" "$AUTH" > "$HOME/.config/helm/registry/config.json"

# 목록 파일이 바뀐 파이프라인에서만 생긴다 — 버전을 올리거나 차트를 더한 커밋이다.
#   레지스트리에 이미 있는 버전은 건너뛰고, 없는 것만 원래 저장소에서 받아 올린다.
#   원래 저장소(인터넷)에 붙는 job 은 이것 하나다. 목록이 안 바뀐 파이프라인에는 없다.
mirror:charts:
  extends: .chart-registry
  stage: mirror
  interruptible: false        # 올리는 도중에 새 커밋이 와도 취소하지 않는다
  rules:
    - changes:
        - charts/upstream-charts.txt
  script:
    - |
      set -e
      grep -v -e '^#' -e '^[[:space:]]*$' charts/upstream-charts.txt | while read -r chart version repo; do
        if helm show chart "oci://$CHARTS/$chart" --version "$version" --plain-http >/dev/null 2>&1; then
          echo "── 있음  $chart $version"
          continue
        fi
        echo "── 올림  $chart $version  ← $repo"
        # 빈 폴더에 받고 거기 생긴 파일을 올린다. 받은 파일 이름은 저장소가 정한다 —
        #   strimzi 는 strimzi-kafka-operator-helm-3-chart-1.1.0.tgz 로 준다.
        #   레지스트리에 올라가는 이름은 파일 이름이 아니라 차트 안의 Chart.yaml name 이다.
        d=$(mktemp -d)
        helm pull "$chart" --repo "$repo" --version "$version" -d "$d"
        helm push "$d"/*.tgz "oci://$CHARTS" --plain-http
        rm -rf "$d"
      done

# 업스트림 차트를 ArgoCD 와 같은 릴리스 이름 · 네임스페이스 · 값 조합으로 렌더한다.
#   먼저 ArgoCD 파일에 적힌 차트 버전이 목록에 있는지 본다. 없으면 여기서 렌더한 것과
#   ArgoCD 가 받는 것이 달라지거나, 레지스트리에 그 버전이 없어 ArgoCD 가 받지 못한다.
# 렌더 결과는 validate:manifests(kubeconform)에 넘기지 않는다. 차트가 만드는 CRD 인스턴스
#   (IngressClassParams 등)는 schemas/ 에 스키마가 없어 -strict 에서 실패하고, 차트 템플릿 자체는
#   제작사가 검증한다. 여기서 보는 것은 이 저장소의 값으로 렌더가 되는가다.
# ⚠ 렌더가 통과해도 차트가 모르는 키(오타 · 잘못된 들여쓰기)는 오류 없이 무시된다.
#   그런 값이 실제로 들어갔는지는 아티팩트(rendered-upstream/)를 열어 봐야 드러난다.
template:render-upstream:
  extends: .chart-registry
  stage: validate
  script:
    - |
      set -e
      LIST=charts/upstream-charts.txt
      mkdir -p rendered-upstream

      # 1) ArgoCD 파일의 버전이 목록에 있는가.
      #   ApplicationSet 원소는 한 줄(chart: X, version: "Y"), Application 은 chart: 다음의 targetRevision: 이다.
      {
        grep -rhoE 'chart: *[A-Za-z0-9._-]+, *version: *"[^"]+"' argocd/ \
          | sed -E 's/chart: *([^,]+), *version: *"([^"]+)"/\1 \2/'
        find argocd -name '*.yaml' -exec awk '
          FNR == 1 { c = "" }
          /^[[:space:]]*(-[[:space:]]*)?chart:/ { c = $NF; next }
          c != "" && /targetRevision:/ { v = $2; gsub(/"/, "", v); print c, v; c = "" }
        ' {} +
      } | grep -v '{{' | sort -u > used.txt
      FAIL=0
      while read -r c v; do
        if awk -v c="$c" -v v="$v" '$1 == c && $2 == v { f = 1 } END { exit !f }' "$LIST"; then
          echo "── 목록과 같다  $c $v"
        else
          echo "── 목록에 없다  $c $v  → $LIST 에 넣는다(넣으면 mirror:charts 가 올린다)"
          FAIL=1
        fi
      done < used.txt
      [ "$FAIL" = 0 ]

      # 2) 렌더
      ver()  { awk -v c="$1" '$1 == c { print $2 }' "$LIST"; }
      kube() { case "$1" in dev) echo 1.36.2 ;; stg) echo 1.33.0 ;; esac; }   # dev = k3s · stg = EKS
      render() {   # <환경> <릴리스> <차트> <네임스페이스> [값 파일 ...]
        e=$1; rel=$2; chart=$3; ns=$4; shift 4
        v=$(ver "$chart")
        set -- $(for f in "$@"; do printf -- '-f %s ' "$f"; done)
        echo "── $rel @ $e  ($chart $v)"
        helm template "$rel" "oci://$CHARTS/$chart" --version "$v" --plain-http \
          -n "$ns" --kube-version "$(kube "$e")" "$@" > "rendered-upstream/$e-$rel.yaml"
      }

      # 관측 — observability ApplicationSet. 값은 환경 무관 · 환경별 두 층이다.
      #   그 환경의 값 파일이 없으면 그 환경에 없는 것이다(minio 는 dev 에만, cloudwatch-exporter 는 stg 에만).
      for e in $ACTIVE_ENVS; do
        for pair in loki:loki mimir:mimir-distributed tempo:tempo grafana:grafana alloy:alloy \
            kube-state-metrics:kube-state-metrics node-exporter:prometheus-node-exporter \
            minio:minio cloudwatch-exporter:prometheus-yet-another-cloudwatch-exporter; do
          name=${pair%%:*}; chart=${pair##*:}
          [ -f "envs/$e/observability/$name.yaml" ] || continue
          ns=observability
          if [ "$name" = node-exporter ]; then ns=observability-host; fi
          render "$e" "$name" "$chart" "$ns" "charts/observability/$name.yaml" "envs/$e/observability/$name.yaml"
        done
      done

      # 허브(온프레미스 클러스터)에만 있는 것
      render dev traefik              traefik              traefik        charts/platform/traefik.yaml
      render dev metallb              metallb              metallb-system charts/platform/metallb.yaml
      render dev argocd               argo-cd              argocd         bootstrap/k3s/argocd-values.yaml
      render dev argocd-image-updater argocd-image-updater argocd         charts/platform/argocd-image-updater.yaml

      # stg 에만 있는 것 — 그 Application 파일이 있을 때만 렌더한다(stg 를 켜는 커밋에 있다)
      if [ -f argocd/applications/alb-controller-stg.yaml ]; then
        render stg aws-load-balancer-controller aws-load-balancer-controller kube-system \
          charts/platform/aws-load-balancer-controller.yaml envs/stg/aws-load-balancer-controller.yaml
      fi
      if [ -f argocd/applications/strimzi-stg.yaml ]; then
        render stg strimzi strimzi-kafka-operator data charts/data/strimzi.yaml
      fi
      if [ -f argocd/applications/prometheus-crds-stg.yaml ]; then
        render stg prometheus-operator-crds prometheus-operator-crds kube-system
      fi

      ls -la rendered-upstream/
  artifacts:
    paths:
      - rendered-upstream/   # 값이 실제로 들어갔는지(nodeSelector · toleration · IRSA 역할 등)는 여기서 본다
    expire_in: 1 day
