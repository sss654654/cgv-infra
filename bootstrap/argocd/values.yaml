# argocd helm 값 (최소). 내부 접근·Traefik 뒤라 insecure.
configs:
  params:
    server.insecure: true

# 차트 기본값은 dex·notifications도 함께 띄운다(끄기 전 렌더 = Deployment 6 + StatefulSet 1).
# dex = SSO(OIDC) 브로커. 로그인은 로컬 admin 하나만 쓰고 configs.cm에 OIDC 설정이 없어 파드가 놀고만 있다.
# notifications = 알림 컨트롤러. 저장소에 트리거·템플릿·구독 설정이 하나도 없다.
# 8GB 노드라 안 쓰는 파드를 끈다. SSO나 알림을 붙일 때 다시 켠다.
dex:
  enabled: false
notifications:
  enabled: false

# applicationSet은 켜둔 채로 둔다 — argocd/applicationsets/ 3개(apps·observability·platform)를 이게 처리한다.
# 차트 기본 resources가 빈 맵이라 그대로 두면 BestEffort로 떠서 메모리 압박 때 가장 먼저 evict된다.
# 이게 죽으면 AppSet이 만드는 Application이 갱신되지 않는데 기존 App은 살아 있어 증상이 잘 안 보인다.
applicationSet:
  resources:
    requests: { cpu: 25m, memory: 64Mi }
    limits:   { cpu: 100m, memory: 128Mi }

# 리소스 — 파드 5개(controller·server·repoServer·redis·applicationSet). evict 방지 목적.
# controller는 App 전체의 라이브 상태 캐시를 들고 비교·적용을 돈다. App 19개 기준
# limit 448Mi는 OOMKilled 루프(exit 137, 2026-07-28 실측) — repoServer와 같은 병.
controller:
  resources:
    requests: { cpu: 100m, memory: 384Mi }
    limits:   { cpu: 500m, memory: 1Gi }
  # Go 런타임은 cgroup limit을 읽지 않는다 — 기본 GC 규칙(직전 살아있는 양의 두 배에서 회수)만으로는
  #   RSS가 살아있는 양(실측 127Mi)의 3배(359-487Mi)까지 부푼다. GC 헤드룸과 미반납 페이지 몫.
  # GOMEMLIMIT 384MiB: 힙+고루틴 스택+런타임 메타의 목표. limit 1Gi 아래 여유를 두고 잡는다.
  # GOGC 50: 회수 지점을 살아있는 양의 1.5배로 내린다. 메모리를 줄이는 대신 GC CPU를 더 쓴다.
  # 적용 후 24시간 + sync 폭풍 1회를 관측해 RSS가 내려오는지 확인하고 request를 재산정한다.
  env:
    - { name: GOGC, value: "50" }
    - { name: GOMEMLIMIT, value: "384MiB" }
server:
  # 이름으로 접근한다 — Traefik이 Host 헤더를 보고 이 서비스로 보낸다.
  # 이걸 켜기 전에는 port-forward가 유일한 경로였고, 외부에서 오는 요청(webhook)은 닿을 수 없었다.
  # tls: false — 차트가 argocd-server-tls 시크릿을 참조하지 않게 한다. 인증서를 아직 발급하지 않았고,
  #   configs.params의 server.insecure: true와 짝이라 Traefik과 argocd-server 사이도 평문이다.
  ingress:
    enabled: true
    ingressClassName: traefik
    hostname: argocd.cgv.lan
    path: /
    pathType: Prefix
    tls: false
  resources:
    # 부하 판 실측 31Mi. UI·API 서버라 요청이 없으면 상주분이 작다.
    requests: { cpu: 25m, memory: 64Mi }
    limits:   { cpu: 100m, memory: 192Mi }
# repoServer는 git을 읽어 매니페스트를 렌더하는 담당. root-app 인계 직후 App 19개의 차트를
# 동시에 렌더하는데(mimir-distributed 포함), limit 256Mi로는 OOMKilled 루프에 빠져
# sync 전체가 정체된다(2026-07-28 실측 — exit 137 반복). 렌더 동시성의 최대 부하 기준으로 상향.
repoServer:
  resources:
    # 부하 판 실측 134Mi. 렌더 스파이크(App 19개 동시 갱신)는 limit 1Gi 가 받는다.
    requests: { cpu: 50m, memory: 192Mi }
    limits:   { cpu: 500m, memory: 1Gi }
redis:
  resources:
    requests: { cpu: 10m, memory: 50Mi }
    limits:   { cpu: 50m, memory: 128Mi }
