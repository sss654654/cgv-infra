# cert-manager 자원 (set-once) — 3파드(controller·webhook·cainjector). evict 방지 최소 request.
#
# 2026-08-15 세 파드를 0대로 내렸다(발급 대상 0건) → 2026-08-28 되살렸다.
#   DNS-01로 인증서를 받는 ClusterIssuer를 만들기에 앞서, 그 오브젝트를 검증(webhook)하고
#   처리(controller)할 파드가 떠 있어야 한다. replicaCount 미지정 = 차트 기본값 1대.
#   자원 복귀: requests 128Mi · CPU 150m.
# ⚠️ 이 차트는 ArgoCD가 관리하지 않는다(platform ApplicationSet이 명시 제외).
#   값을 고쳐 머지해도 클러스터는 안 바뀐다 — bootstrap/에서 helm upgrade로 직접 적용한다.
crds:
  enabled: true                       # install.sh --set에서 이관(값 파일로 일원화)
resources:                            # controller
  requests: { cpu: 50m, memory: 64Mi }
  limits:   { cpu: 200m, memory: 128Mi }
webhook:
  resources:
    requests: { cpu: 50m, memory: 32Mi }
    limits:   { cpu: 100m, memory: 64Mi }
cainjector:
  # limit 64Mi → 192Mi (2026-08-29). 10분 peak 58MiB 로 limit 의 90.6% 였다.
  #   cainjector 는 CA 번들을 주입할 대상(CRD·Secret·webhook 설정)을 전부 캐시로 들고 있어
  #   메모리가 요청 수가 아니라 클러스터 오브젝트 수를 따라간다. 오브젝트가 늘면 같이 오르고,
  #   limit 에 닿으면 OOMKill 된다 — 그러면 새 CRD 에 CA 번들이 안 박혀 webhook 검증이 실패한다.
  # request 32Mi → 64Mi. 실사용이 그 위라 그대로 두면 노드 압박 시 퇴거 앞 순위가 된다.
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits:   { cpu: 100m, memory: 192Mi }
