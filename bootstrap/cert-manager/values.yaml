# cert-manager 자원 (set-once) — 3파드(controller·webhook·cainjector). evict 방지 최소 request.
#
# 2026-08-15 세 파드를 0대로 내렸다(발급 대상 0건) → 2026-08-28 되살렸다.
#   DNS-01로 인증서를 받는 ClusterIssuer를 만들기에 앞서, 그 오브젝트를 검증(webhook)하고
#   처리(controller)할 파드가 떠 있어야 한다. replicaCount 미지정 = 차트 기본값 1대.
#   자원 복귀: requests 128Mi · CPU 150m.
# ⚠️ 이 차트는 ArgoCD가 관리하지 않는다(platform ApplicationSet이 명시 제외).
#   값을 고쳐 머지해도 클러스터는 안 바뀐다 — bootstrap/에서 helm upgrade로 직접 적용한다.
crds:
  enabled: true                       # install.sh --set에서 이관(값 파일로 일원화)
resources:                            # controller
  requests: { cpu: 50m, memory: 64Mi }
  limits:   { cpu: 200m, memory: 128Mi }
webhook:
  resources:
    requests: { cpu: 50m, memory: 32Mi }
    limits:   { cpu: 100m, memory: 64Mi }
cainjector:
  resources:
    requests: { cpu: 50m, memory: 32Mi }
    limits:   { cpu: 100m, memory: 64Mi }
