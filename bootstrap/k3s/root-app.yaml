# root-app (app-of-apps) — install.sh가 마지막에 이 하나만 apply하면 argocd/가 폭포로 딸려 온다.
# argocd/ 하위: projects/(AppProject) + applicationsets/ + applications/.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
spec:
  # 이 파일은 argocd/ 밖에 있어 root가 배달하지 않는다. project를 바꾼 뒤에는
  # kubectl apply -f bootstrap/root-app.yaml 로 직접 갱신해야 반영된다.
  project: bootstrap                       # argocd/projects/bootstrap.yaml — argoproj.io 리소스만 허용
  source:
    repoURL: http://192.168.0.167:8929/cgv/cgv-infra.git
    targetRevision: main
    path: argocd
    directory:
      recurse: true                        # argocd/ 하위(projects·applicationsets·applications) 전부
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd                      # argocd 객체(App·AppProject·AppSet)가 사는 곳
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
