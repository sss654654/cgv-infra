# argocd helm 값 (최소). 내부 접근·Traefik 뒤라 insecure.
configs:
  params:
    server.insecure: true

# 차트 기본값은 dex·notifications도 함께 띄운다(끄기 전 렌더 = Deployment 6 + StatefulSet 1).
# dex = SSO(OIDC) 브로커. 로그인은 로컬 admin 하나만 쓰고 configs.cm에 OIDC 설정이 없어 파드가 놀고만 있다.
# notifications = 알림 컨트롤러. 저장소에 트리거·템플릿·구독 설정이 하나도 없다.
# 8GB 노드라 안 쓰는 파드를 끈다. SSO나 알림을 붙일 때 다시 켠다.
dex:
  enabled: false
notifications:
  enabled: false

# applicationSet은 켜둔 채로 둔다 — argocd/applicationsets/ 다섯(apps·data·manifests·observability·platform)을 이게 처리한다.
# 차트 기본 resources가 빈 맵이라 그대로 두면 BestEffort로 떠서 메모리 압박 때 가장 먼저 evict된다.
# 이게 죽으면 AppSet이 만드는 Application이 갱신되지 않는데 기존 App은 살아 있어 증상이 잘 안 보인다.
#
# 자원 산정의 출발점 — 14일 최대 working set(2026-09-11, Mimir 의 container_memory_working_set_bytes).
#   그때 허브가 관리하던 것은 클러스터 하나 · Application 29개다. stg(EKS)를 켜면 클러스터가 둘,
#   Application 이 47개가 된다(stg 18). 아래 셋은 그 차이를 받도록 다시 잡은 값이다.
#   노드 request 는 이미 allocatable 의 86-93% 가 차 있어서(k3s-1 여유 361Mi) request 는 조금만,
#   순간 부하는 limit 이 받게 한다.
#
# applicationSet — 14일 최대 123Mi. 상한 128Mi 의 96% 로, stg 전에도 이미 한도에 붙어 있었다.
#   stg 를 켜면 AppSet 이 만드는 Application 이 17 → 28 개가 된다.
applicationSet:
  resources:
    requests: { cpu: 25m, memory: 128Mi }
    limits:   { cpu: 100m, memory: 256Mi }

# 리소스 — 파드 5개(controller·server·repoServer·redis·applicationSet). evict 방지 목적.
# controller 는 관리하는 클러스터마다 모든 객체의 라이브 상태를 캐시에 들고 비교·적용을 돈다.
#   App 19개 때 limit 448Mi 는 OOMKilled 루프였다(exit 137, 2026-07-28 실측) — repoServer와 같은 병.
#   14일 최대 597Mi(클러스터 하나 · App 29개). 캐시는 클러스터의 객체 수에 비례하는데 stg 의 객체 수는
#   아직 못 쟀다 — dev 와 비슷하다고 보면 캐시가 두 배가 된다.
#   → limit 1Gi → 1536Mi, GOMEMLIMIT 384MiB → 768MiB, request 384Mi → 512Mi.
controller:
  resources:
    requests: { cpu: 100m, memory: 512Mi }
    limits:   { cpu: 500m, memory: 1536Mi }
  # Go 런타임은 cgroup limit을 읽지 않는다 — 기본 GC 규칙(직전 살아있는 양의 두 배에서 회수)만으로는
  #   RSS가 살아있는 양(실측 127Mi)의 3배(359-487Mi)까지 부푼다. GC 헤드룸과 미반납 페이지 몫.
  # GOMEMLIMIT: 힙+고루틴 스택+런타임 메타의 목표. limit 아래 여유를 두고 잡는다.
  #   384MiB 일 때 RSS 최대가 597Mi 였다 — 힙 밖의 몫이 약 213Mi 다.
  #   캐시가 두 배면 힙 목표도 두 배(768MiB)가 필요하고, RSS 최대는 768 + 213 = 약 981Mi 로 본다.
  #   limit 1536Mi 가 그것을 받는다.
  # GOGC 50: 회수 지점을 살아있는 양의 1.5배로 내린다. 메모리를 줄이는 대신 GC CPU를 더 쓴다.
  # stg 를 켠 날 kubectl top 과 14일 최대로 다시 본다.
  env:
    - { name: GOGC, value: "50" }
    - { name: GOMEMLIMIT, value: "768MiB" }
server:
  # 이름으로 접근한다 — Traefik이 Host 헤더를 보고 이 서비스로 보낸다.
  # 이걸 켜기 전에는 port-forward가 유일한 경로였고, 외부에서 오는 요청(webhook)은 닿을 수 없었다.
  # tls: false — 차트가 argocd-server-tls 시크릿을 참조하지 않게 한다. 인증서를 아직 발급하지 않았고,
  #   configs.params의 server.insecure: true와 짝이라 Traefik과 argocd-server 사이도 평문이다.
  ingress:
    enabled: true
    ingressClassName: traefik
    # 이 라우터를 web(80) 에만 붙인다. websecure(443) 에는 붙지 않는다.
    #   Traefik 은 요청의 Host 헤더로 대상을 가르는데 그 헤더는 보내는 쪽이 적는 값이라
    #   검증할 수 없다. 공유기가 443 만 인터넷에 열므로, 이 라우터를 443 에서 빼면
    #   Host 를 argocd.cgv.lan 으로 적어 보내도 매칭될 라우터가 없다.
    #   관리 접근은 WireGuard 터널을 거쳐 80 으로 들어온다.
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: web
    hostname: argocd.cgv.lan
    path: /
    pathType: Prefix
    tls: false
  resources:
    # 부하 판 실측 31Mi. UI·API 서버라 요청이 없으면 상주분이 작다.
    requests: { cpu: 25m, memory: 64Mi }
    limits:   { cpu: 100m, memory: 192Mi }
# repoServer는 git을 읽어 매니페스트를 렌더하는 담당. root-app 인계 직후 App 19개의 차트를
# 동시에 렌더하는데(mimir-distributed 포함), limit 256Mi로는 OOMKilled 루프에 빠져
# sync 전체가 정체된다(2026-07-28 실측 — exit 137 반복). 렌더 동시성의 최대 부하 기준으로 상향.
#
# 새 커밋이 오면 Application 전부를 다시 렌더한다. 14일 최대 668Mi(App 29개).
#   stg 를 켜면 같은 차트(mimir-distributed 등)를 stg 값으로 한 번 더 렌더해 동시 렌더가 29 → 47 이 된다.
#   App 수에 비례한다고 보면 668 × 47 / 29 = 약 1083Mi — limit 1Gi 를 넘는다. → limit 1536Mi.
#   request 는 그대로 둔다. 평소 47Mi 이고 스파이크는 커밋 직후 잠깐이라 예약을 올리지 않는다.
#   그래도 넘으면 다음 손잡이는 reposerver.parallelism.limit(동시 렌더 수 상한)이다 —
#   메모리를 App 수가 아니라 동시성으로 묶는다. 대신 커밋 뒤 반영이 늦어진다.
repoServer:
  resources:
    requests: { cpu: 50m, memory: 192Mi }
    limits:   { cpu: 500m, memory: 1536Mi }
redis:
  resources:
    requests: { cpu: 10m, memory: 50Mi }
    limits:   { cpu: 50m, memory: 128Mi }
