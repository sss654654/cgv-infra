{{/*
KafkaNodePool + Kafka — Strimzi 오퍼레이터가 이걸 보고 실제 브로커를 만든다(operator 패턴).
클러스터명이 bootstrap 서비스 이름을 정한다 — <이름>-kafka-bootstrap.data.svc:9092.
  queue·booking 의 KAFKA_BROKER 와 글자까지 같아야 한다.
Strimzi 1.1.0: API = kafka.strimzi.io/v1 (v1beta2 제거됨). KRaft+NodePool 이 유일 모드라
  strimzi.io/kraft·node-pools 애노테이션이 필요 없다(0.48 에서 제거).
*/}}
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: {{ .Values.cluster.poolName }}
  namespace: data
  labels:
    strimzi.io/cluster: {{ .Values.cluster.name }}
spec:
  replicas: {{ .Values.cluster.replicas }}
  roles:
    - controller
    - broker                         # combined(dual-role) — 소규모
  resources: {{- toYaml .Values.cluster.resources | nindent 4 }}
  storage:
    type: persistent-claim           # 단일 볼륨. 확장 여지 원하면 jbod 권장
    size: {{ .Values.storage.size }}
    class: {{ .Values.storage.class }}
    deleteClaim: false
  template:
    pod:
      affinity:
        podAntiAffinity:             # 브로커 셋을 서로 다른 노드에 (co-location 방지)
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              # 셀렉터는 브로커 파드만 잡아야 한다.
              # Strimzi 가 노드풀 파드에 다는 라벨: strimzi.io/cluster=<클러스터>,
              #   strimzi.io/name=<클러스터>-kafka, strimzi.io/pool-name=<풀>, strimzi.io/component-type=kafka.
              # entityOperator 파드는 strimzi.io/cluster 는 같지만 strimzi.io/name 이 다르다.
              # strimzi.io/cluster 하나만 쓰면 EO 도 걸린다 → 브로커가 재스케줄될 때 그 브로커의
              #   볼륨이 있는 노드에 EO 가 앉아 있으면 hard 규칙에 막혀 영구 Pending
              #   (RF3 → 2 고착, min.insync.replicas=2 라 브로커 하나 더 흔들리면 쓰기 거부).
              labelSelector:
                matchLabels:
                  strimzi.io/cluster: {{ .Values.cluster.name }}
                  strimzi.io/name: {{ .Values.cluster.name }}-kafka
---
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: {{ .Values.cluster.name }}
  namespace: data
spec:
  kafka:
    version: {{ .Values.cluster.version | quote }}
    metadataVersion: {{ .Values.cluster.metadataVersion | quote }}
    # resources 는 여기 못 적는다 — v1 스키마에 없다. 노드풀 쪽에 있다.
    jvmOptions:
      "-Xmx": {{ .Values.cluster.heap }}
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false                   # 내부 평문·무인증. 노출 시 tls 리스너 추가
        # Strimzi 가 브로커용 NetworkPolicy 를 이 리스너 정의를 보고 만든다.
        #   networkPolicyPeers 가 비어 있으면 9092 규칙이 출처 없이 렌더되어 클러스터 안
        #   아무 파드나 admissions 에 발행할 수 있다 → booking 은 발신자를 확인하지 않으므로
        #   대기열·정원을 거치지 않고 예매 자격이 나온다.
        # 인증이 붙는 것은 아니다. 아래 라벨을 단 파드는 여전히 인증 없이 9092 에 접속한다.
        # 9090(컨트롤러)·9091(복제)·8443(오퍼레이터)은 Strimzi 가 출처까지 스스로 지정한다.
        networkPolicyPeers:
          - namespaceSelector:
              matchLabels: {kubernetes.io/metadata.name: app}
            podSelector:
              matchLabels: {app.kubernetes.io/name: queue}
          - namespaceSelector:
              matchLabels: {kubernetes.io/metadata.name: app}
            podSelector:
              matchLabels: {app.kubernetes.io/name: booking}
          # 브로커 자신. 서비스 경로에는 필요 없지만(복제 9091·컨트롤러 9090 은 별도 포트)
          #   브로커 안에서 도는 관리 CLI 가 이 경로를 쓴다. kafka-topics.sh --describe 는
          #   접속한 브로커에서 파티션 리더 목록을 받은 뒤 각 리더에 9092 로 직접 붙으므로,
          #   이 항목이 없으면 조회가 타임아웃된다.
          - podSelector:
              matchLabels: {strimzi.io/name: {{ .Values.cluster.name }}-kafka}
    config:
      offsets.topic.replication.factor: 3
      transaction.state.log.replication.factor: 3
      transaction.state.log.min.isr: 2
      default.replication.factor: 3
      min.insync.replicas: 2
      # 클러스터 기본값이라 KafkaTopic CR 에 config 가 없는 토픽(앱 auto-create 포함)에 적용된다.
      log.retention.hours: 72
      log.roll.ms: 86400000          # 24h
  entityOperator:
    # topicOperator 만 둔다. resources 를 비우면 BestEffort 가 되어 노드 메모리 압박 시 가장 먼저
    #   퇴거되고, 그러면 KafkaTopic CR 반영이 조용히 멈춘다.
    # limit 이 없으면 JVM 이 컨테이너가 아닌 노드 메모리를 기준으로 힙 상한을 잡는다.
    # 256Mi 내역: 힙 128Mi(-Xmx) + 비힙 약 128Mi(메타스페이스·코드캐시·스레드스택·GC 구조체).
    # limit 만 384Mi — 실측 peak 215Mi 가 256Mi 의 84% 라 여유가 얇다.
    #   limit 은 스케줄러 예산에 안 들어가므로 올려도 다른 파드의 자리를 뺏지 않는다.
    #
    # ★ 2026-08-15 — userOperator 를 뺐다. KafkaUser CR 이 저장소 전체에 0건이고, 리스너가
    #   plain/9092·tls:false·authentication 미설정이라 발급할 자격증명 자체가 없다.
    #   되살릴 시점: 리스너에 SCRAM-SHA 또는 mTLS 를 켜고 KafkaUser 로 계정을 나눌 때.
    topicOperator:                   # KafkaTopic CR 을 실제 토픽으로
      resources:
        requests: { cpu: 50m, memory: 256Mi }
        limits:   { cpu: 250m, memory: 384Mi }
      jvmOptions:
        -Xms: 64m
        -Xmx: 128m
