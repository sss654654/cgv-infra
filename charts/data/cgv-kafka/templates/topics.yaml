{{/*
KafkaTopic CR — 토픽 소유권을 GitOps 로 관리한다. auto-create 대신 명시 선언이다.
  선언하지 않으면 앱이 처음 붙을 때 브로커가 기본값(파티션 1)으로 만들고, 파티션은 줄일 수 없어
  그 값이 굳는다 → 소비 병렬성이 1로 고정된다.

토픽 다섯
  admissions              queue→booking  입장 승인
  admissions-revoked      queue→booking  입장 회수(세션 만료·이탈·자리반환)
  bookings-completed      booking→queue  예매 확정 → 자리 반환
  admissions.DLT          booking 내부   admissions 소비 재시도 소진분 격리
  admissions-revoked.DLT  booking 내부   admissions-revoked 소비 재시도 소진분 격리

파티션은 앱 HPA 상한과 짝이다 — 한 그룹의 동시 소비 파드는 파티션 수를 넘지 못한다.
  전역 순서는 포기하고 키 단위 순서만 지킨다. 발행 키가 requestId 라, 같은 사용자의
  입장·회수가 같은 파티션에서 순서대로 처리된다(키가 없으면 회수가 입장을 앞질러
  이미 지운 인증이 되살아난다). 환경이 그 수를 준다.

보존 상한은 브로커 볼륨과 짝이다. RF3 · 브로커 셋이라 한 대가 전 토픽의 파티션을 다 든다.
  최악 = (본 토픽 셋 × 파티션 × 2GiB) + DLT 2GiB + revoked-DLT 1GiB.
  그 값이 볼륨 크기 아래여야 한다 — 계산은 envs/<환경>/kafka.yaml 에 적혀 있다.
*/}}
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: admissions
  namespace: data
  labels:
    strimzi.io/cluster: {{ .Values.cluster.name }}
spec:
  partitions: {{ .Values.partitions }}
  replicas: 3
  config:
    retention.ms: {{ .Values.retention.ms }}
    segment.ms: {{ .Values.retention.segmentMs }}
    retention.bytes: {{ .Values.retention.bytes }}
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: bookings-completed
  namespace: data
  labels:
    strimzi.io/cluster: {{ .Values.cluster.name }}
spec:
  partitions: {{ .Values.partitions }}
  replicas: 3
  config:
    retention.ms: {{ .Values.retention.ms }}
    segment.ms: {{ .Values.retention.segmentMs }}
    retention.bytes: {{ .Values.retention.bytes }}
---
# 입장 회수 — 세션 만료·이탈·자리반환으로 queue 가 자리를 거둘 때 발행한다.
# booking 은 이걸 받아 입장 인증을 지운다. 이 토픽이 없으면 자리를 잃은 사용자의 인증이
# TTL 만료까지 남아 정원 밖에서 예매 API 를 통과한다.
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: admissions-revoked
  namespace: data
  labels:
    strimzi.io/cluster: {{ .Values.cluster.name }}
spec:
  partitions: {{ .Values.partitions }}
  replicas: 3
  config:
    retention.ms: {{ .Values.retention.ms }}
    segment.ms: {{ .Values.retention.segmentMs }}
    retention.bytes: {{ .Values.retention.bytes }}
---
# admissions 소비 실패 격리(dead letter). booking 의 리스너가 재시도를 소진하면 원본 메시지를
# 여기로 옮기고 오프셋을 커밋한다 — 한 건의 실패가 파티션 전체를 멈추지 않게 하되, 메시지는 남긴다.
# 파티션 1: 소비자가 없고 사후 조사용이라 병렬성이 필요 없다.
# 보존 7일: 원본(3일)보다 길어야 한다. 밤사이 쌓인 실패를 다음 날 확인할 수 있어야 하고,
#   원본과 같으면 조사 시점에 이미 지워져 있을 수 있다.
# metadata.name 은 k8s 객체 이름이라 대문자 불가(RFC 1123) — 실제 카프카 토픽명은
# spec.topicName 으로 준다. 앱이 쓰는 이름은 topicName 쪽이다(spring-kafka 기본 DLT 접미사 .DLT).
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: admissions-dlt
  namespace: data
  labels:
    strimzi.io/cluster: {{ .Values.cluster.name }}
spec:
  topicName: admissions.DLT
  partitions: 1
  replicas: 3
  config:
    retention.ms: {{ .Values.retention.dltMs }}
    segment.ms: {{ .Values.retention.segmentMs }}
    retention.bytes: {{ .Values.retention.dltBytes }}
---
# admissions-revoked 소비 실패 격리. booking 의 에러핸들러는 리스너 공용이고 대상이
# "{원본 토픽}.DLT" 라, revoked 소비의 재시도 소진분은 여기로 온다 — 선언이 없으면
# DLT 발행이 실패해 격리 대상 메시지가 ERROR 로그로만 남는다.
# 파티션 1·보존 7일 근거는 admissions.DLT 와 같다.
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: admissions-revoked-dlt
  namespace: data
  labels:
    strimzi.io/cluster: {{ .Values.cluster.name }}
spec:
  topicName: admissions-revoked.DLT
  partitions: 1
  replicas: 3
  config:
    retention.ms: {{ .Values.retention.dltMs }}
    segment.ms: {{ .Values.retention.segmentMs }}
    retention.bytes: {{ .Values.retention.revokedDltBytes }}
