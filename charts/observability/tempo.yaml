# grafana/tempo 1.24.4 (Tempo 2.9.0) — Single Binary(monolithic).
# 차트 deprecated(grafana-community로 이관 예정) — monolithic은 이 차트가 유일. 이관 후 소스 전환 검토.
# HTTP API 포트 = 3200 (3100 아님 — 3100은 Loki). OTLP 수신 4317(gRPC)/4318(HTTP).
# jaeger receiver는 차트 버그로 끄지 못함(4317/4318만 사용, 나머지 무해).
# 영속: monolithic이라 복제 없음 → WAL 영속 필수. retention 24h = 차트 기본값 유지.
#
# 환경마다 갈리는 것은 envs/<환경>/observability/tempo.yaml 에 있다 —
#   자원(requests · limits) · live traces 한도 · 오브젝트 저장소 접속(주소·버킷·자격) · WAL 볼륨 · 노드 고정.
# ★ 자원과 live traces 한도를 이 파일에 두지 않는다. 2026-09-12 에 stg 실측으로 여기 request 를 2Gi 로
#   올리자 dev 파드도 2Gi 를 요구했고, dev 는 WAL 볼륨이 있는 노드 하나에만 뜨는데 그 노드에 자리가 없어
#   35시간 Pending 이었다(그동안 dev trace 가 저장되지 않았다). 노드 크기가 환경마다 달라 값도 갈린다.
replicas: 1
tempo:
  reportingEnabled: false
  extraArgs:
    "config.expand-env": "true"
  # 차트 기본값이 memBallastSizeMbs: 1024 다. 밸러스트는 GC 를 늦추려고 1GiB 를 가짜로
  #   할당해 두는 옛 기법인데, GOMEMLIMIT(아래)이 생긴 뒤로는 해가 된다 —
  #   밸러스트가 상한보다 커서 GC 가 목표를 영원히 못 맞추고 계속 돈다.
  # 실측 2026-08-15: GC 12.58 회/초 · CPU 120m.  같은 Go 프로그램인 Loki 는 0.01 회/초 · 9m.
  #   그런데 이 파드가 실제로 하는 일은 0.83 span/초 · live traces 13개다.
  #   살아있는 힙 1,039MiB 로 보고되는데 RSS 는 109MiB — 그 차이가 밸러스트다.
  memBallastSizeMbs: 0
  extraEnv:
    # Go 런타임은 컨테이너 memory limit을 읽지 않는다. GOMEMLIMIT 미설정이면 기본값이 int64 최대라
    #   메모리가 무한이라고 보고, GOGC=100 규칙(직전 GC의 살아있는 힙 × 2에서 다음 GC)으로
    #   다음 GC 목표를 2.36GB에 잡았다(실측 go_memstats_next_gc_bytes). limit 1Gi의 두 배가 넘는다.
    #   커널이 죽이는 선은 1Gi인데 런타임의 다음 GC 지점이 2.36GB라, 그 사이에서는 GC가 안 돈다.
    # limit 아래로 정한다. 나머지는 고루틴 스택·런타임 메타데이터·OS 버퍼 몫.
    - name: GOMEMLIMIT
      value: "2600MiB"
  storage:
    trace:
      backend: s3                     # 접속 정보(s3 블록)는 환경 값이 준다
      wal:
        path: /var/tempo/wal
  receivers:
    otlp:
      protocols:
        grpc: { endpoint: "0.0.0.0:4317" }
        http: { endpoint: "0.0.0.0:4318" }
  # live traces 한도 — 값은 환경 파일의 overrides.defaults.ingestion.max_traces_per_user.
  #   차트 기본은 비어 있어, 환경 파일이 안 주면 Tempo 기본값 10,000이 적용된다.
  #
  # live traces = ingester가 지금 메모리에 들고 있는, 아직 끝나지 않은 트레이스 수다.
  #   트레이스는 마지막 span이 온 뒤 trace_idle_period(기본 5초) 동안 새 span이 없으면 목록에서
  #   빠지므로, 이 값은 대략 "초당 생기는 트레이스 수 × 5초"다. 초당 요청 수가 아니라 동시에
  #   열려 있는 트레이스 수가 정하는 값이라, 요청이 제일 많은 순간과 이 값이 제일 큰 순간이 다르다
  #   (2026-08-22 실측: 2,946 req/s일 때 live 1,649 · 그다음 분 1,296 req/s일 때 live 10,000).
  # 넘으면 그 구간 span이 live_traces_exceeded로 버려진다 — 화면에서 exemplar를 눌러도 안 열린다.
  # 버려지는지는 tempo_discarded_spans_total{reason="live_traces_exceeded"}로 확인한다.
  # 한도는 메모리와 짝이다 — 트레이스 하나가 메모리에서 약 31KiB(2026-09-12 stg 실측)라
  #   한도 × 31KiB 가 limit 안쪽이어야 한다.

# self-metric: Tempo 자신의 수집·S3 쓰기 상태.
serviceMonitor:
  enabled: true
