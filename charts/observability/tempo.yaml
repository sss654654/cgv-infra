# grafana/tempo 1.24.4 (Tempo 2.9.0) — Single Binary(monolithic).
# 차트 deprecated(grafana-community로 이관 예정) — monolithic은 이 차트가 유일. 이관 후 소스 전환 검토.
# HTTP API 포트 = 3200 (3100 아님 — 3100은 Loki). OTLP 수신 4317(gRPC)/4318(HTTP).
# jaeger receiver는 차트 버그로 끄지 못함(4317/4318만 사용, 나머지 무해).
# 영속: monolithic이라 복제 없음 → WAL 영속 필수. retention 24h = 차트 기본값 유지.
#
# 환경마다 갈리는 것은 envs/<환경>/observability/tempo.yaml 에 있다 —
#   오브젝트 저장소 접속(주소·버킷·자격) · WAL 볼륨 · 노드 고정.
replicas: 1
tempo:
  reportingEnabled: false
  extraArgs:
    "config.expand-env": "true"
  # 차트 기본값이 memBallastSizeMbs: 1024 다. 밸러스트는 GC 를 늦추려고 1GiB 를 가짜로
  #   할당해 두는 옛 기법인데, GOMEMLIMIT(아래)이 생긴 뒤로는 해가 된다 —
  #   밸러스트가 상한보다 커서 GC 가 목표를 영원히 못 맞추고 계속 돈다.
  # 실측 2026-08-15: GC 12.58 회/초 · CPU 120m.  같은 Go 프로그램인 Loki 는 0.01 회/초 · 9m.
  #   그런데 이 파드가 실제로 하는 일은 0.83 span/초 · live traces 13개다.
  #   살아있는 힙 1,039MiB 로 보고되는데 RSS 는 109MiB — 그 차이가 밸러스트다.
  memBallastSizeMbs: 0
  extraEnv:
    # Go 런타임은 컨테이너 memory limit을 읽지 않는다. GOMEMLIMIT 미설정이면 기본값이 int64 최대라
    #   메모리가 무한이라고 보고, GOGC=100 규칙(직전 GC의 살아있는 힙 × 2에서 다음 GC)으로
    #   다음 GC 목표를 2.36GB에 잡았다(실측 go_memstats_next_gc_bytes). limit 1Gi의 두 배가 넘는다.
    #   커널이 죽이는 선은 1Gi인데 런타임의 다음 GC 지점이 2.36GB라, 그 사이에서는 GC가 안 돈다.
    # limit 아래로 정한다. 나머지는 고루틴 스택·런타임 메타데이터·OS 버퍼 몫.
    - name: GOMEMLIMIT
      value: "2600MiB"
  resources:                          # [렌더 확인: 업스트림에 resources 2곳(tempo.resources/top-level) — 적용처 검증]
    # memory limit 512Mi에서 110회 재시작. 종료 코드는 137이지만 OOMKilled가 아니다 —
    #   이벤트는 Killing(사유: failed liveness probe)이고 OOMKilling은 0건. /ready가 답하지 못해 kubelet이 죽였다.
    #   재시작할 때마다 WAL replay로 힙이 부풀고(기동 직후 live_traces 1736 → 4분 뒤 13) 같은 자리에 다시 닿는 고리가 됐다.
    # request는 128Mi에서 256Mi로. 실측이 그보다 위라 그대로 두면 스케줄러가 이 파드를 과소 평가한다.
    #
    # 2026-09-12 stg 1만 명 판에서 실측하고 다시 정했다.
    #   live traces 50,000(한도에 붙음) · 이 파드 working set 1,545MiB · 재시작 0.
    #   트레이스 하나가 메모리에서 차지하는 몫 = 1,545MiB ÷ 50,000 = 약 31KiB.
    #   이 값이 앞서 적어 둔 추정(10,000당 747MiB = 76KiB)의 절반 이하다. 추정은 폐기하고
    #   아래 한도는 실측 31KiB 기준으로 계산한다.
    #
    # request 256Mi → 2Gi. 실사용 1,545MiB가 request의 여섯 배라 스케줄러가 이 파드를
    #   과소 평가했고, 노드 메모리가 모자랄 때 퇴거 1순위가 된다.
    # limit 3Gi → 5Gi. 노드 allocatable 14.3GiB 중 limit 합이 이미 12GiB라 더 올리면
    #   합이 allocatable을 넘는다. 5Gi = 트레이스 몫 약 4.5GiB + 런타임·버퍼 약 0.5GiB.
    requests: { cpu: 100m, memory: 2Gi }
    limits: { cpu: 500m, memory: 5Gi }
  storage:
    trace:
      backend: s3                     # 접속 정보(s3 블록)는 환경 값이 준다
      wal:
        path: /var/tempo/wal
  receivers:
    otlp:
      protocols:
        grpc: { endpoint: "0.0.0.0:4317" }
        http: { endpoint: "0.0.0.0:4318" }
  # live traces 한도. 차트 기본은 비어 있어 Tempo 기본값 10,000이 적용된다.
  #
  # live traces = ingester가 지금 메모리에 들고 있는, 아직 끝나지 않은 트레이스 수다.
  #   트레이스는 마지막 span이 온 뒤 trace_idle_period(기본 5초) 동안 새 span이 없으면 목록에서
  #   빠지므로, 이 값은 대략 "초당 생기는 트레이스 수 × 5초"다. 초당 요청 수가 아니라 동시에
  #   열려 있는 트레이스 수가 정하는 값이라, 요청이 제일 많은 순간과 이 값이 제일 큰 순간이 다르다
  #   (2026-08-22 실측: 2,946 req/s일 때 live 1,649 · 그다음 분 1,296 req/s일 때 live 10,000).
  # 넘으면 그 구간 span이 live_traces_exceeded로 버려진다 — 화면에서 exemplar를 눌러도 안 열린다.
  #
  # 10,000 → 50,000 → 150,000.
  #   50,000 은 stg 1만 명 판에서 다시 한도에 닿았다 — 수신 1,162,948 span 중 40,895 건을
  #   live_traces_exceeded 로 버렸다(3.5%). 버려진 구간이 오픈 직후이고, 전파 지연이 1초를
  #   넘은 495 건이 바로 그 구간이라 exemplar 를 눌러도 트레이스가 없었다(404).
  #   화면에서는 "느린 요청의 트레이스만 없는" 모양이 된다 — 제일 보고 싶은 것이 제일 잘 버려진다.
  #
  #   150,000 의 근거: 트레이스당 약 31KiB(위 실측) × 150,000 = 약 4.5GiB 로, limit 5Gi 안쪽이다.
  #   50,000 에 붙어 있던 동안 진짜 수요는 알 수 없으므로 이 값은 "재보기 위한 값"이다.
  #   다음 판에서 tempo_ingester_live_traces 가 150,000 에 다시 붙으면 한도를 더 올릴 게 아니라
  #   트레이스 수를 줄인다 — 순번 조회 폴링(/api/admission/position)이 요청의 대부분인데
  #   그 트레이스는 판단에 안 쓰인다.
  # 버려지는지는 tempo_discarded_spans_total{reason="live_traces_exceeded"}로 확인한다.
  overrides:
    defaults:
      ingestion:
        max_traces_per_user: 150000

# self-metric: Tempo 자신의 수집·S3 쓰기 상태.
serviceMonitor:
  enabled: true
