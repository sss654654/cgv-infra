# grafana-community/loki 18.5.0 (OSS Loki 3.7.3) — Monolithic(단일바이너리).
# 리포 변경: OSS loki 차트가 grafana/helm-charts → grafana-community/helm-charts로 포크됨.
#   grafana/loki 7.x는 GEL(엔터프라이즈)로 전환. → 관측 AppSet이 grafana-community를 가리킴.
# helm template 검증 완료(StatefulSet 1 + gateway 1, memcached/canary 없음).
# 영속: monolithic이라 복제 없음 → 크래시 시 최근 로그를 지킬 수단이 WAL뿐 = 영속 필수.
#
# 환경마다 갈리는 것은 envs/<환경>/observability/loki.yaml 에 있다 —
#   오브젝트 저장소 접속(주소·버킷·자격) · WAL 볼륨 · 노드 고정.
deploymentMode: Monolithic
# RBAC 축소. 차트 기본은 sidecar.rules.enabled=true + rbac.namespaced=false 조합이라
# loki ServiceAccount에 전 네임스페이스 configmaps/secrets get·watch·list ClusterRole이 붙는다
# (= data ns의 mysql-secret·redis-secret, app ns의 booking-secrets/queue-secrets까지 읽힌다).
# 이 클러스터는 Loki 룰(alert/recording)을 쓰지 않아 룰 사이드카가 읽을 대상이 0건이다.
#   sidecar.rules.enabled=false → 사이드카 컨테이너 제거
#   rbac.namespaced=true        → ClusterRole/ClusterRoleBinding 생성 자체를 막음
#                                 (사이드카가 꺼져 있어 대체 Role도 안 만들어짐)
# 룰을 쓰게 되면 sidecar.rules.enabled=true + rbac.namespaced=true 로 되돌린다 —
# 그러면 권한이 observability ns 안의 Role로만 생긴다.
# [렌더 확인: ClusterRole/ClusterRoleBinding 0건, StatefulSet 컨테이너 loki 1개(loki-sc-rules 제거)]
sidecar:
  rules:
    enabled: false
rbac:
  namespaced: true
loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  limits_config:
    retention_period: 168h            # 로그 보존 7일. 오브젝트 저장소 무한증가 차단
  compactor:
    retention_enabled: true           # retention 적용 주체 — 없으면 위 기간이 장식
    delete_request_store: s3          # Loki 3.x retention 필수 스토어
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  storage:
    type: s3                          # 접속 정보(bucketNames · s3 블록)는 환경 값이 준다
singleBinary:
  replicas: 1
  resources:                          # 시작값 — request 부여로 evict 우선순위 방어 + limit 상한
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: 500m, memory: 512Mi }
gateway:
  enabled: true
  replicas: 1
  resources:                          # loki gateway(mimir gateway와 동일). 부하 판 실측 38Mi
    requests: { cpu: 100m, memory: 64Mi }
    limits: { cpu: 500m, memory: 256Mi }
# Monolithic이라도 SSD 타겟 기본 3 → validate.yaml이 0으로 안 내리면 거부(필수).
read: { replicas: 0 }
write: { replicas: 0 }
backend: { replicas: 0 }
# 무거운 옵션 끔.
chunksCache: { enabled: false }
resultsCache: { enabled: false }
lokiCanary: { enabled: false }
test: { enabled: false }
minio: { enabled: false }

# self-metric: Loki 자신의 상태(수집량·S3 쓰기 실패·compactor retention 동작)를 발행한다.
# 없으면 대시보드가 비었을 때 "수집이 막힌 건지 실제로 조용한 건지"를 가릴 수단이 없다.
monitoring:
  serviceMonitor:
    enabled: true
