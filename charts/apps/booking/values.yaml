# booking (Java/Spring Boot 3.3) 인스턴스 정체성 — env 무관.
# 근거 = cgv-onprem/booking (application.yml PORT 8091·actuator probes / Dockerfile nonroot 1001 / pom Flyway 없음).

image:
  repository: 192.168.0.167:5050/cgv/cgv-onprem/booking

containerPort: 8091

service:
  port: 8091

# 메트릭 = 본 앱 포트의 /actuator/prometheus (micrometer). → ServiceMonitor (queue의 PodMonitor와 대비).
metrics:
  enabled: true
  kind: ServiceMonitor
  path: /actuator/prometheus
  interval: 15s

# temurin useradd -u 1001. JVM은 /tmp에 hsperfdata·temp 씀 → readOnlyRootFilesystem + /tmp emptyDir.
securityContext:
  runAsUser: 1001
  runAsGroup: 1001

volumes:
  - name: tmp
    emptyDir: {}
volumeMounts:
  - name: tmp
    mountPath: /tmp

# actuator 프로브 (application.yml probes.enabled=true, readiness=db·redis).
# JVM 느린 기동 → startupProbe로 감싸고(최대 150s), liveness/readiness는 기동 후 시작.
#
# timeoutSeconds 기본값(1초) → 5초 (2026-08-30). 사용자 10,000 부하의 오픈 버스트에서
#   호스트가 30초 만에 100°C에 닿아 열 스로틀이 걸리고, 갓 뜬 파드는 JIT 컴파일까지
#   겹쳐 health 응답이 몇 초 느려진다. 1초 기준으로는 그 순간 응답 셋이 연속 초과되어
#   kubelet이 파드를 죽였고(exit 137), 죽어 있는 동안 traefik이 초당 121건의 5xx를
#   돌려줬다 — "몇 초 느림"이 "다운 + 5xx 폭풍"으로 증폭된 것.
#   같은 조건에서 오래 돈 파드(JIT 완료)는 1초 안에 답했다(전날 판 생존).
# 대가: 실제로 멈춘 파드의 감지가 최대 수십 초(5s × failureThreshold × period) 늦어진다.
# readiness도 같이 5초: 단일 replica라 Service에서 빠져도 대신 받을 파드가 없어
#   결과가 똑같이 503이다 — 민감하게 빼서 얻는 것이 없다.
startupProbe:
  httpGet: { path: /actuator/health/readiness, port: http }
  periodSeconds: 5
  failureThreshold: 30
livenessProbe:
  httpGet: { path: /actuator/health/liveness, port: http }
  periodSeconds: 15
  timeoutSeconds: 5
readinessProbe:
  httpGet: { path: /actuator/health/readiness, port: http }
  periodSeconds: 10
  timeoutSeconds: 5

# Spring graceful shutdown(30s) + preStop Endpoints 유예. terminationGrace를 그보다 넉넉히.
lifecycle:
  preStop:
    sleep:
      seconds: 5
terminationGracePeriodSeconds: 45

# 비밀번호는 평문 금지 → SealedSecret을 envFrom으로.
envFrom:
  - secretRef:
      name: booking-secrets   # MYSQL_PASSWORD (+ 필요 시 REDIS_PASSWORD)
  - secretRef:
      name: app-admin-token   # ADMIN_TOKEN. 값이 있어야 초기화 컨트롤러가 등록된다(queue와 같은 시크릿)

# dev는 replica 1(스키마 레이스 회피)이라 PDB 없음. topologySpread는 멀티replica 승격 대비.
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: booking

partOf: cgv
