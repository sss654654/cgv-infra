# frontend (nginx) 인스턴스 정체성 — 정적 SPA 서빙. 클러스터 라우팅은 Ingress로 이관.
# 근거 = cgv-onprem/frontend (nginx.conf 게이트웨이 → k3s는 Traefik Ingress). 이미지=nginx-unprivileged(8080, uid 101).

image:
  repository: cgv/cgv-onprem/frontend

containerPort: 8080        # nginx-unprivileged 기본 리슨

service:
  port: 8080

# nginx-unprivileged uid 101. readOnlyRootFilesystem + 쓰기 경로 emptyDir.
securityContext:
  runAsUser: 101
  runAsGroup: 101

# 쓰기 경로 셋. readOnlyRootFilesystem=true 라 여기 적힌 곳 밖에는 못 쓴다.
#   tmp     nginx 의 pid·임시 파일
#   cache   /api/movies 응답 캐시(proxy_cache_path 가 이 안을 가리킨다)
#   conf    ★ 기동할 때 엔트리포인트가 /etc/nginx/templates/*.template 을 렌더해 여기에 쓴다.
#           이 볼륨이 없으면 렌더 대상 경로가 읽기 전용이라 기동에서 죽는다.
#           이미지가 그 경로에 파일을 안 넣으므로 빈 볼륨으로 덮어도 가려지는 것이 없다.
volumes:
  - name: tmp
    emptyDir: {}
  - name: cache
    emptyDir: {}
  - name: conf
    emptyDir: {}
volumeMounts:
  - name: tmp
    mountPath: /tmp
  - name: cache
    mountPath: /var/cache/nginx
  - name: conf
    mountPath: /etc/nginx/conf.d

# 정적 서버 — GET / 은 index.html(200).
livenessProbe:
  httpGet: { path: /, port: http }
  initialDelaySeconds: 5
  periodSeconds: 15
readinessProbe:
  httpGet: { path: /, port: http }
  initialDelaySeconds: 3
  periodSeconds: 10

# nginx는 자체 메트릭 없음 → nginx-exporter 사이드카로 노출. 활성은 관측 배선 단계에서 —
# 선행 조건: cgv-onprem frontend nginx.conf에 stub_status location 추가(앱 레포 변경) + monitor 배선.
# 그때 아래 주석 해제 + metrics 배선:
# extraContainers:
#   - name: nginx-exporter
#     image: nginx/nginx-prometheus-exporter:1.4.2   # 7부에 태그 재확인
#     args: ["--nginx.scrape-uri=http://127.0.0.1:8080/stub_status"]
#     ports: [{ name: nginx-metrics, containerPort: 9113 }]
#     resources:
#       requests: { cpu: 50m, memory: 32Mi }
#       limits:   { cpu: 100m, memory: 64Mi }
metrics:
  enabled: false

# Ingress 게이트웨이 — nginx.conf 라우팅을 Traefik으로 이관. host는 env가 지정.
# longest-prefix 매칭: /api/admission → queue, /api/movies → frontend, /api → booking, / → frontend.
#
# /api/movies 만 booking 이 아니라 frontend(nginx)로 보낸다. 그 nginx 가 응답을 캐시하고
#   booking 으로는 캐시가 빌 때만 나간다(proxy_cache 10초 + proxy_cache_lock).
#   영화 목록은 첫 화면이라 대기열 게이트 밖이고 방문자 전원이 부른다 — 실측(2026-08-18,
#   사용자 5,000명)에서 판 시작 3초 안에 booking 스로틀 81.79%, readiness 프로브가 떨어졌다.
#   대기열이 뒷단을 지키는 구조인데 이 경로만 그 보호 밖이었다.
# frontend 는 정적 서빙만 하던 파드라 이 프록시가 얹혀도 CPU 여유가 있다.
ingress:
  enabled: true
  className: traefik
  paths:
    - { path: /api/admission, pathType: Prefix, service: queue,    port: 8090 }
    - { path: /api/movies,    pathType: Prefix, service: frontend, port: 8080 }
    - { path: /api,           pathType: Prefix, service: booking,  port: 8091 }
    - { path: /,              pathType: Prefix, service: frontend, port: 8080 }

topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: frontend
podDisruptionBudget:
  enabled: true
  minAvailable: null       # 차트 기본 minAvailable:1을 null로 지움(맵 딥머지 함정 — 안 지우면 maxUnavailable와 동시 렌더로 invalid)
  maxUnavailable: 1        # HPA min 1과 호환 — minAvailable:1이면 replica 1일 때 드레인이 영구 블록됨

partOf: cgv
