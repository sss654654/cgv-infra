# queue (Go) 인스턴스 정체성 — env 무관 (image·포트·프로브·메트릭·보안).
# 근거 = cgv-onprem/queue-go (config.go PORT 8090 / handler/health.go / Dockerfile nonroot).

image:
  # 레지스트리 안의 경로만 적는다. 레지스트리 주소(image.registry)는 값 파일이 아니라
  #   argocd/applicationsets/apps.yaml 의 환경 목록에 있고 helm.parameters 로 들어온다 —
  #   image-updater 가 폴링할 주소를 AppSet 이 애노테이션에 쓰는 시점에 값 파일은 아직 안 읽힌다.
  #   경로는 GitLab 의 그룹/프로젝트/이미지 구조를 그대로 따른다(cgv-onprem 의 디렉터리명 = queue-go).
  repository: cgv/cgv-onprem/queue-go

containerPort: 8090        # config.go PORT 기본 8090

service:
  port: 8090

# 메트릭 = 별도 포트 9091(/metrics, promauto). Service엔 안 물림 → PodMonitor로 파드 직접 스크레이프.
metrics:
  enabled: true
  kind: PodMonitor
  containerPort: 9091
  path: /metrics
  interval: 15s

# distroless :nonroot = uid 65532. readOnlyRootFilesystem=true (Go 정적, 디스크 쓰기 없음).
securityContext:
  runAsUser: 65532
  runAsGroup: 65532

# Redis auth(dev HA) 비번 주입 — cgv-app은 envFrom만 지원 → 시크릿 키명 = env명(REDIS_PASSWORD).
# redis-secret은 data ns(redis 서버용)라 파드가 못 봄 → app ns에 같은 값을 queue-secrets로 복제.
envFrom:
  - secretRef:
      name: queue-secrets   # REDIS_PASSWORD (= data ns redis-secret 값)
  - secretRef:
      name: app-admin-token   # ADMIN_TOKEN. 값이 있어야 초기화 라우트가 등록된다(booking과 같은 시크릿)

# health.go: /health/live(liveness), /health/ready(readiness=Redis PING) — 앱 포트.
livenessProbe:
  httpGet: { path: /health/live, port: http }
  initialDelaySeconds: 5
  periodSeconds: 10
readinessProbe:
  httpGet: { path: /health/ready, port: http }
  initialDelaySeconds: 3
  periodSeconds: 5

# main.go가 SIGTERM 드레인. preStop sleep로 Endpoints 명단 전파를 기다림.
# distroless엔 sleep 바이너리 없음 → k8s 네이티브 sleep 액션(1.30+).
lifecycle:
  preStop:
    sleep:
      seconds: 5
terminationGracePeriodSeconds: 45     # preStop 5 + drain 20 + 자원정리 여유

# replica 분산 + 드레인 시 최소 1 가용
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: queue
podDisruptionBudget:
  enabled: true
  minAvailable: 1

partOf: cgv
