# charts/app — 제네릭 앱 차트 기본값.
# 오버라이드 순서: 이 파일 → apps/<name>/values.yaml(정체성) → envs/<env>/values-<name>.yaml(환경).
# 뒤가 이김. 맵은 deep merge, 배열은 통째 교체.

replicaCount: 1

# 배포 전략. 비우면 쿠버네티스 기본값(RollingUpdate)이 쓰인다 — 새 파드가 Ready 가 된 뒤에
#   옛 파드가 내려가므로 배포 중에도 요청이 끊기지 않는다. 대부분의 앱은 이쪽이 맞다.
#   같은 스키마에 동시에 손대면 안 되는 앱은 인스턴스에서 Recreate 로 덮는다.
strategy: {}

# 이미지는 세 부분이 서로 다른 축에 속한다. 축마다 사는 자리와 소유자가 다르다.
#   registry    이 환경이 어디서 받아오나  argocd/applicationsets/apps.yaml 환경 목록  사람
#   repository  이 서비스가 무엇인가       charts/apps/<서비스>/values.yaml            사람
#   tag         어느 빌드인가              envs/<env>/<서비스>.yaml                    argocd-image-updater
# 셋을 한 문자열로 두면 서비스 축과 환경 축이 한 값에 뭉쳐, 환경이 늘 때마다
#   전체 주소가 복제되고 어느 쪽이 진실인지 알 수 없게 된다.
# registry 만 값 파일이 아니라 AppSet 환경 목록에 있는 이유 = image-updater 가 폴링할 주소를
#   ApplicationSet 이 애노테이션을 만들 때 정하는데, 그 시점에 Helm 값 파일은 아직 안 읽힌다.
#   한 곳에 두려고 그쪽을 정본으로 삼고 helm.parameters 로 렌더에 내려보낸다.
image:
  registry: ""              # AppSet 환경 목록이 helm.parameters 로 준다
  repository: ""            # 서비스가 지정 (예: cgv/cgv-onprem/queue-go — 레지스트리 주소 없이)
  tag: ""                   # image-updater가 환경 값 파일에 쓴다
  pullPolicy: IfNotPresent

# GitLab 레지스트리는 프로젝트 가시성을 따라 private이라 pull에도 자격이 필요하다.
#   SealedSecret(gitlab-registry, app ns, kubernetes.io/dockerconfigjson)이 배달한다.
#   자격은 read_registry만 가진 deploy token — 노드는 받아오기만 한다.
#   Secret은 파드와 같은 네임스페이스에 있어야 kubelet이 읽는다.
imagePullSecrets:
  - name: gitlab-registry

# 앱 리슨 포트. 프로브·Service가 이름 http로 참조.
containerPort: 8080

service:
  enabled: true
  type: ClusterIP
  port: 80                  # 인스턴스가 앱 포트로 지정
  # Service 에 붙는 애노테이션. 비어 있으면 필드 자체가 렌더되지 않는다.
  #   ALB Controller 는 대상그룹 설정(헬스체크 경로 등)을 여기서 읽고, Ingress 의 같은 애노테이션보다 우선한다.
  annotations: {}

# 메트릭 스크레이프 (ServiceMonitor/PodMonitor + Alloy).
#  kind=ServiceMonitor : 본 앱 포트의 path를 긁음 (booking /actuator/prometheus).
#  kind=PodMonitor     : 별도 컨테이너 포트를 긁음 (queue 9091, Service 안 물림).
metrics:
  enabled: false
  kind: ServiceMonitor
  containerPort: 0          # PodMonitor일 때 노출할 별도 포트 (0=미노출)
  path: /metrics
  interval: 15s

serviceAccount:
  create: true
  name: ""

# queue·booking·frontend 셋 다 쿠버네티스 API를 호출하지 않는다.
# 기본값(true)이면 파드마다 /var/run/secrets/kubernetes.io/serviceaccount/token 이 마운트돼,
# 컨테이너가 뚫렸을 때 그 토큰으로 API 서버에 인증할 수 있는 발판이 생긴다.
# 쓰지 않는 자격증명은 얹지 않는다.
automountServiceAccountToken: false

# PodSecurity restricted 충족.
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  capabilities:
    drop: ["ALL"]
  # runAsUser 는 인스턴스가 지정 (이미지별 uid)

resources: {}             # env가 requests/limits 지정

livenessProbe:
  httpGet: { path: /healthz, port: http }
  initialDelaySeconds: 5
  periodSeconds: 10
readinessProbe:
  httpGet: { path: /ready, port: http }
  initialDelaySeconds: 5
  periodSeconds: 5

startupProbe: {}          # 느린 기동(JVM)용. 인스턴스가 지정하면 liveness/readiness는 기동 후 시작.

terminationGracePeriodSeconds: null   # k8s 기본 30. graceful 긴 앱(booking)이 늘림.

lifecycle: {}             # 인스턴스가 지정 (예: preStop sleep)

env: {}                   # 이름->값 맵 (env 파일에서 채움)
envFrom: []               # secretRef/configMapRef 리스트 (SealedSecret 등)
                          # 규약: envFrom은 identity(apps/<name>) 레이어에서만 정의. env 레이어에서 정의 금지 —
                          #   배열은 deep merge가 아니라 통째 교체라, env가 정의하면 identity의 secretRef가 소실된다.

extraContainers: []       # 사이드카 리스트 (예: frontend nginx-exporter). 컨테이너 스펙 그대로 렌더

volumes: []               # readOnlyRootFilesystem 쓰기 경로용 emptyDir 등
volumeMounts: []

# 배치·가용성. 인스턴스가 지정.
nodeSelector: {}                    # 데이터 싱글턴 핀 (예: {cgv.io/data: obj})
tolerations: []                     # taint 가 있는 전용 노드에 서는 앱만 지정 (예: stg booking → workload=booking)
affinity: {}
topologySpreadConstraints: []       # replica를 노드에 분산(maxSkew/hostname)
priorityClassName: ""
podDisruptionBudget:
  enabled: false                    # HA 앱(replica≥2)만 켜기
  minAvailable: 1

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70   # threshold는 실측 후 확정

ingress:
  enabled: false
  className: traefik
  annotations: {}
  host: ""                # env가 지정 (dev는 비워 path-only, prd는 도메인). 스칼라라 배열 함정 없음.
  paths: []               # identity가 지정 [{path, pathType, service, port}]
  tls: []

migration:
  # 마이그레이션을 앱과 따로 PreSync Job 으로 돌리는 자리. booking 은 Flyway 를 앱 기동 때 돌려서 쓰지 않는다.
  #   DDL 권한을 앱 계정(데이터 읽기 · 쓰기)과 나누게 되면(prd) 여기로 옮긴다 — 그때 DDL 권한은 Job 만 갖는다.
  enabled: false
  command: []

partOf: cgv
