{{/*
app 네임스페이스로 들어오는 접속의 출처를 제한한다.

NetworkPolicy 는 정책이 고른 파드만 판정 대상으로 삼는다. 고르는 순간 그 파드로 들어오는
  접속이 전부 막히고 ingress 에 적은 것만 통과한다. 거부 규칙은 문법에 없다.
여러 정책이 같은 파드를 고르면 허용의 합집합이 된다.

kubelet 의 httpGet 프로브는 ipBlock 으로 적지 않는다. 정책이 강제되는 상태에서 프로브가
  통과하는 것을 확인했다(frontend 에 이 규칙만 걸고 70초 관찰 — 재시작·NotReady 없음,
  같은 시점에 data 네임스페이스 파드에서 frontend:8080 접속은 차단됨). CNI 가 Calico 다.
  ★ stg 는 VPC CNI 라 같은지 확인해야 한다 — 프로브가 막히면 파드가 Ready 로 안 올라오고
    ALB 대상그룹에서 빠진다.

밖에서 들어오는 출처(ingressSource)만 환경이 준다. dev 는 Traefik 파드라 라벨로 지목되고,
  stg 는 ALB 가 VPC 안의 ENI 라 라벨이 없어 ipBlock 으로 적는다.
*/}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: app
spec:
  podSelector: {}          # app 의 모든 파드를 판정 대상으로 만든다
  policyTypes: [Ingress]
  ingress: []              # 규칙 0개 = 이 정책만 놓고 보면 통과할 조건이 없다
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: frontend-ingress
  namespace: app
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: frontend
  policyTypes: [Ingress]
  ingress:
    # Ingress "frontend" 의 규칙 `/` 와 `/api/movies` 가 이 포트로 온다.
    - from:
      {{- toYaml .Values.ingressSource | nindent 8 }}
      ports:
        - port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: booking-ingress
  namespace: app
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: booking
  policyTypes: [Ingress]
  ingress:
    # 8091 은 앱 트래픽과 지표 노출이 같은 포트다. 스프링 액추에이터가 별도 포트를 열지 않는다.
    #   입구       — Ingress "frontend" 의 규칙 `/api` 가 이 서비스로 온다.
    #   frontend  — Ingress 가 `/api/movies` 를 frontend 로 보내고, frontend 의 nginx 가 그 응답을
    #               캐시하며 booking 으로 되보낸다(nginx.conf 의 location /api/movies).
    #   alloy     — ServiceMonitor "booking" 이 /actuator/prometheus 를 15초 간격으로 긁는다.
    #   demo-reset— CronJob 이 /api/admin/reset 을 불러 예매 기록을 비운다.
    - from:                                               # 원소가 여럿 = OR
      {{- toYaml .Values.ingressSource | nindent 8 }}
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: app}
          podSelector:
            matchLabels: {app.kubernetes.io/name: frontend}
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: observability}
          podSelector:
            matchLabels: {app.kubernetes.io/name: alloy}
        {{- if .Values.demoReset }}
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: app}
          podSelector:
            matchLabels: {app.kubernetes.io/name: demo-reset}
        {{- end }}
      ports:
        - port: 8091
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: queue-ingress
  namespace: app
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: queue
  policyTypes: [Ingress]
  ingress:
    # 8090 은 앱 트래픽. Ingress "frontend" 의 규칙 `/api/admission` 이 이 서비스로 온다.
    # frontend 는 여기 없다. nginx.conf 에 location /api/admission/ 이 있지만 Ingress 가 그 경로를
    #   queue 로 직접 보내므로 frontend 를 거치지 않는다. Ingress 규칙에서 `/api/admission` 을
    #   빼면 이 경로가 frontend 를 타게 되고, 그때는 여기에 frontend 를 추가해야 한다.
    # demo-reset 은 CronJob 이다. /api/admission/reset 을 불러 대기열을 비운다 —
    #   예매 기록보다 대기열을 먼저 비워야 지우는 동안 승격된 관객이 좌석을 잡지 않는다.
    - from:
      {{- toYaml .Values.ingressSource | nindent 8 }}
        {{- if .Values.demoReset }}
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: app}
          podSelector:
            matchLabels: {app.kubernetes.io/name: demo-reset}
        {{- end }}
      ports:
        - port: 8090
    # 9091 은 지표 전용 포트다. PodMonitor "queue" 가 파드에 직접 붙어 /metrics 를 긁는다.
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: observability}
          podSelector:
            matchLabels: {app.kubernetes.io/name: alloy}
      ports:
        - port: 9091
