{{/*
app 네임스페이스에서 나가는 접속의 목적지를 제한한다.

ingress 는 "누가 나에게 닿나" 를 정한다. 파드가 침해됐을 때 그 파드가 어디로 나가는지는
  막지 못한다. 이 파일이 그쪽이다.

ports 에 적는 것은 목적지 파드가 여는 포트다. Service 포트가 아니다 —
  kube-proxy 가 Service 주소를 파드 주소로 바꾼 뒤에 정책이 판정한다.

DNS 를 먼저 연다. 안 열면 이름 해석이 막혀 나머지 규칙이 전부 무의미해진다.
  frontend 의 nginx 는 업스트림을 요청 시점에 해석하고, stg 에서는 RDS·ElastiCache 엔드포인트도
  이름이라 더 그렇다. CoreDNS 는 두 환경 모두 파드라 이 규칙은 안 갈린다.

MySQL·Redis 의 목적지(mysql.peers · redis.peers)만 환경이 준다.
  dev  data 네임스페이스의 파드라 라벨로 지목된다
  stg  RDS·ElastiCache 는 VPC 안의 ENI 라 라벨이 없다. 셀렉터는 매칭된 파드의 IP 목록으로
       바뀌는데 그 목록이 비어 아무것도 안 열린다 → ipBlock 으로 적는다.
       증상이 조용하다. 파드는 Running 으로 뜨고 DB 연결에서만 멈춘다.
Kafka 는 두 환경 다 파드라 안 갈린다.
*/}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-egress
  namespace: app
spec:
  podSelector: {}          # app 의 모든 파드를 판정 대상으로 만든다
  policyTypes: [Egress]
  egress: []               # 규칙 0개 = 이 정책만 놓고 보면 나갈 조건이 없다
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: app
spec:
  podSelector: {}          # 세 앱 모두 이름 해석이 필요하다
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector:
            matchLabels: {k8s-app: kube-dns}
      ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}      # 응답이 512바이트를 넘으면 TCP 로 재질의한다
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: frontend-egress
  namespace: app
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: frontend
  policyTypes: [Egress]
  egress:
    # nginx.conf 의 location /api/movies 가 응답을 캐시하며 booking 으로 되보낸다.
    # queue 는 여기 없다. nginx.conf 에 location /api/admission/ 이 있지만 입구가 그 경로를
    #   queue 로 직접 보내 frontend 를 거치지 않는다.
    - to:
        - podSelector:                                    # ns 지정 없음 = 같은 ns(app) 안
            matchLabels: {app.kubernetes.io/name: booking}
      ports:
        - port: 8091
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: booking-egress
  namespace: app
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: booking
  policyTypes: [Egress]
  egress:
    - to:
      {{- toYaml .Values.mysql.peers | nindent 8 }}
      ports:
        {{- range .Values.mysql.ports }}
        - port: {{ . }}
        {{- end }}
    - to:
      {{- toYaml .Values.redis.peers | nindent 8 }}
      ports:
        {{- range .Values.redis.ports }}
        - port: {{ . }}
        {{- end }}
    # bootstrap 으로 붙은 뒤 개별 브로커 주소를 받아 다시 붙는다. 이 한 줄이 bootstrap 과 브로커를 함께 덮는다.
    # ★ podSelector 는 bootstrap Service 의 selector 와 같은 라벨 넷이어야 한다(app.kubernetes.io/name=kafka 가 아니라).
    #   VPC CNI 의 정책 컨트롤러는 규칙의 podSelector 가 Service 의 selector 와 맞는 Service 의 ClusterIP 만
    #   허용 목록에 넣는다 — 안 맞으면 브로커 파드 IP 는 통하고 bootstrap ClusterIP 는 버려져 클라이언트가
    #   첫 연결(i/o timeout)에서 멈춘다(2026-09-12 stg). Calico 는 DNAT 뒤 파드 IP 로 평가해 이 차이가 안 보인다.
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: data}
          podSelector:
            matchLabels: {strimzi.io/cluster: cgv, strimzi.io/kind: Kafka, strimzi.io/name: cgv-kafka, strimzi.io/broker-role: "true"}
      ports:
        - port: 9092
    # OTEL_EXPORTER_OTLP_ENDPOINT = http://alloy.observability...:4318/v1/traces (HTTP)
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: observability}
          podSelector:
            matchLabels: {app.kubernetes.io/name: alloy}
      ports:
        - port: 4318
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: queue-egress
  namespace: app
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: queue
  policyTypes: [Egress]
  egress:
    - to:
      {{- toYaml .Values.redis.peers | nindent 8 }}
      ports:
        {{- range .Values.redis.ports }}
        - port: {{ . }}
        {{- end }}
    # 라벨 넷을 쓰는 이유는 위 booking-egress 의 kafka 규칙 주석.
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: data}
          podSelector:
            matchLabels: {strimzi.io/cluster: cgv, strimzi.io/kind: Kafka, strimzi.io/name: cgv-kafka, strimzi.io/broker-role: "true"}
      ports:
        - port: 9092
    # OTLP_GRPC_ENDPOINT = alloy.observability...:4317 (gRPC)
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: observability}
          podSelector:
            matchLabels: {app.kubernetes.io/name: alloy}
      ports:
        - port: 4317
{{- if .Values.demoReset }}
---
# demo-reset CronJob — 데모 데이터를 주기적으로 비운다.
# 두 서비스를 순서대로 부른다: 대기열(queue 8090)을 먼저, 그다음 예매 기록(booking 8091).
#   반대로 하면 예매를 지우는 동안 승격된 관객이 좌석을 잡아 잔재가 남는다.
# DNS 는 위 allow-dns-egress 가 모든 파드에 걸려 있어 여기 다시 적지 않는다.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: demo-reset-egress
  namespace: app
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: demo-reset
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:                                    # ns 지정 없음 = 같은 ns(app) 안
            matchLabels: {app.kubernetes.io/name: queue}
      ports:
        - port: 8090
    - to:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: booking}
      ports:
        - port: 8091
{{- end }}
