{{/*
observability 네임스페이스로 들어오는 접속의 출처를 제한한다.

여기에는 Mimir(지표)·Loki(로그)·Tempo(트레이스)와 그 셋의 오브젝트 원본이 있다.
  정책이 없으면 클러스터 안 어느 파드에서든 읽고 쓸 수 있다.

범위 — 네임스페이스 안은 열고, 밖에서 들어오는 것만 좁힌다.
  Mimir 는 마이크로서비스 여덟 종이고 gossip(7946)·gRPC(9095)·HTTP(8080)·오브젝트 저장(9000)으로
  서로 얽혀 있다. 그 그래프를 규칙으로 옮기다 틀리면 관측이 멈추고, 관측이 멈춰서 원인 추적도
  막힌다. 반면 좁혀서 얻는 것은 같은 네임스페이스 안의 격리뿐이라 비용이 이득보다 크다.

node-exporter 는 여기에 없다. hostNetwork 를 써서 파드 네트워크를 안 쓰므로 판정 대상이 아니다.

Grafana 로 들어오는 출처(grafanaSource)만 환경이 준다.
  dev  Traefik 파드 · stg  Grafana 전용 Ingress 가 만든 ALB 의 서브넷 대역
*/}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: observability
spec:
  podSelector: {}          # observability 의 모든 파드를 판정 대상으로 만든다
  policyTypes: [Ingress]
  ingress: []              # 규칙 0개 = 이 정책만 놓고 보면 통과할 조건이 없다
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-same-namespace
  namespace: observability
spec:
  {{- if .Values.imageRenderer }}
  # grafana-image-renderer 만 뺀다. 그 파드는 grafana 에서만 닿게 하는 정책
  #   grafana-image-renderer-ingress(차트 생성분)가 이미 있고, 여기서 전체를 허용하면
  #   합집합이 되어 그 정책이 무의미해진다.
  # NotIn 은 그 라벨이 아예 없는 파드도 고른다 — 오브젝트 저장이 그 경우다.
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: NotIn
        values: [grafana-image-renderer]
  {{- else }}
  podSelector: {}          # 뺄 대상이 없다 — 이 환경에는 렌더러를 안 띄운다
  {{- end }}
  policyTypes: [Ingress]
  ingress:
    # namespaceSelector 없이 podSelector 만 = 이 정책이 있는 네임스페이스 안
    - from:
        - podSelector: {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: grafana-ingress
  namespace: observability
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: grafana
  policyTypes: [Ingress]
  ingress:
    - from:
      {{- toYaml .Values.grafanaSource | nindent 8 }}
      ports:
        - port: 3000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: alloy-otlp-ingress
  namespace: observability
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: alloy
  policyTypes: [Ingress]
  ingress:
    # booking 이 HTTP(4318), queue 가 gRPC(4317)로 트레이스를 보낸다. 둘 다 두 환경에서 파드다.
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: app}
          podSelector:
            matchLabels: {app.kubernetes.io/name: booking}
      ports:
        - port: 4318
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: app}
          podSelector:
            matchLabels: {app.kubernetes.io/name: queue}
      ports:
        - port: 4317
