# Traefik — Ingress 컨트롤러(k3s 번들은 disable, 자체 설치). MetalLB LB로 노출. GitOps로 관리.
deployment:
  replicas: 3                         # 진입점 HA + 사용자 10,000명 메모리 용량(아래 근거)
# 롤링 방식 — 새 파드를 먼저 띄우는 차트 기본값(maxSurge 1 / maxUnavailable 0)은
#   이 구성에서 배포가 영구 정지한다.
#   replicas 3 = 노드 3대이고 아래 podAntiAffinity가 required라 노드마다 정확히 하나가 앉는다.
#   그 상태에서 "새 파드를 먼저 띄운다"는 앉을 노드가 없어 Pending에 걸리고, maxUnavailable 0이라
#   옛 파드를 지우지도 못한다. 실제로 replicas 2→3 배포에서 그렇게 멈췄다(2026-08-18).
#   순서를 뒤집는다 — 옛 파드를 먼저 지우고 그 자리에 새 파드를 띄운다.
#   배포 중 잠깐 2대로 도는데, 아래 PDB minAvailable 1이 최소선을 지키고
#   관문은 2대로도 선다(5,000명 판까지 2대로 돌았다).
updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 0
    maxUnavailable: 1
podDisruptionBudget:
  enabled: true
  minAvailable: 1                     # drain 시 최소 1 파드 유지
# 배치: 두 파드를 서로 다른 노드에 강제한다.
#   두 파드가 한 노드에 앉으면 그 노드가 죽을 때 MetalLB LB IP는 살아 있는데 백엔드가 0이 되어
#   frontend·queue·booking Ingress가 전부 502가 된다. PDB(위 minAvailable 1)는 자발적 드레인만
#   막고 노드 장애는 못 막으므로, 이건 배치로만 막을 수 있다.
#   차트 기본은 배치 강제가 없어(스케줄러 재량) 재기동·드레인 순서에 따라 실제로 몰릴 수 있다.
# required로 두면 노드마다 정확히 하나가 앉는다. 파드 2개일 때는 여유 노드가 한 대 있어
#   노드 하나가 빠져도 재배치됐지만, 3개로 가면 그 여유가 없어져 빠진 노드의 파드가 Pending에 남는다.
#   그래도 남은 2대가 10,000명분(파드당 1,320MiB)을 아래 limit 안에서 받으므로 서비스는 선다.
#   즉 노드 장애 시 "3대 중 2대로 운영"이 되고, limit이 그 상태를 감당하도록 잡혀 있다.
affinity:
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      - topologyKey: kubernetes.io/hostname
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: traefik
            app.kubernetes.io/instance: traefik-traefik
# 메모리는 동시 연결 수에 비례한다. Traefik은 사용자 연결 하나를 그대로 받고(앞) 백엔드로
# 나가는 연결을 따로 든다(뒤). 폴링하는 사용자는 요청을 안 보내는 순간에도 연결을 쥐고 있어서,
# 이 값은 초당 요청 수가 아니라 동시 접속자 수가 정한다.
#
# 파드별로 잰다. 합으로 보면 여유였는데(1,533MiB / 1,536Mi = 100%가 아니라 66%로 읽힘)
#   OOMKill은 파드마다 걸리므로 파드 하나의 값이 판정선이다.
#   실측 2026-08-18, 사용자 5,000명·2파드: working_set 파드별 660 · 633MiB = limit 768Mi의 86% · 82%.
#   통과선(limit의 80%)을 이미 넘는다.
#
# 10,000명 산정 — 파드별 최댓값을 인원과 대수로 민다.
#   5,000명 2파드   파드당   660MiB
#   10,000명 3파드  파드당   880MiB
#   그중 한 대가 빠짐 파드당 1,320MiB   ← limit은 이 상태를 견뎌야 한다
#   1,320 ÷ 0.8(통과선) = 1,650MiB → 2Gi
# 대수로 나눈 값(3파드 정상 운영 기준 1,100MiB)을 쓰지 않는 이유: 한 대가 빠졌을 때 남은 대가
#   못 받으면 뒤따라 죽어 관문이 통째로 사라진다.
#
# 봉우리 계수는 판마다 흔들린다. 같은 5,000명을 다섯 번 재서 합이 735 ~ 1,533MiB로 두 배 갈렸다.
#   Go가 부하 뒤에 OS로 메모리를 바로 안 돌려주고 다음 판에서 그 위에 쌓기 때문이다.
#   limit은 그 흔들림의 큰 쪽으로 잡는다 — 작은 쪽으로 잡으면 판마다 죽는다.
#
# 노드 실사용 여유가 1,375 ~ 2,464MiB라 파드당 1,320MiB는 들어간다.
#   limit은 스케줄러 예산(requests)에 안 들어가므로 올려도 다른 파드 자리를 안 뺏는다.
#
# 아직 이 산정에 안 들어간 것: 프론트 정적 파일(방문당 7건 118KB)이 같은 traefik을 지나는데
#   부하 판에 안 넣었다. 넣으면 사람당 계수가 커진다.
#
# CPU limit 500m → 1500m.
#   같은 판에서 CPU는 limit의 15%였는데 스로틀이 11.3% 걸렸다. 커널은 limit을 100ms 창마다
#   50ms 배급으로 바꾸는데, 폴링이 3초 주기로 정렬돼 한 덩어리로 몰리면 그 창에서 배급을
#   다 쓰고 세워진다. 평균은 여유로운데 특정 창만 꽉 찬 모양이라 사용률로는 안 보인다.
#   잘린 시간은 그대로 사용자 지연이 된다 — 같은 판에서 traefik p99 174ms, 앱 p99 1-4ms였다.
#   limit은 스케줄러 예산(requests)에 안 들어가서 올려도 다른 파드 자리를 안 뺏는다.
#   1500m인 근거: 노드 allocatable 3,300m에 traefik이 노드당 1대라 그 절반 아래를 약속하는 선.
#   실측 5,000명: 파드당 봉우리 0.609 코어(limit의 41%)·스로틀 7.42%, 지연은 통과선 안이었다.
#   10,000명이면 사람당 0.207mCPU로 밀어 합 2.07 코어 — 3대면 파드당 0.69(46%)다.
# memory request 128Mi → 320Mi. 성능이 아니라 퇴거 순위 때문이다.
#   Burstable 파드의 퇴거 순위는 (실사용 − request)가 큰 순이다. request 128Mi 로 두면
#   봉우리에 1,320MiB 를 쓰는 순간 초과분이 1,192MiB 가 되어 노드에서 가장 먼저 쫓겨난다.
#   traefik 이 죽으면 frontend·queue·booking Ingress 가 전부 502 다 — 관문이 제일 먼저
#   죽는 순서가 된다.
#   320Mi 는 10,000명 정상 구간 외삽값(파드당 약 300MiB)에 여유를 붙인 값이다.
#   3파드면 960Mi 를 예약하는데, 앞선 request 재조정으로 만든 노드 여유(821-1,115MiB) 안에 든다.
resources:
  requests: { cpu: 100m, memory: 320Mi }
  limits:   { cpu: 1500m, memory: 2Gi }
# GOMEMLIMIT은 따로 넣지 않는다. 이 차트가 memory limit의 90%를 계산해 자동으로 넣는다
# (2Gi → 1843MiB). 직접 적으면 env가 두 벌이 되고, limit을 바꿔도 따라가지 않는다.
#
# GOGC는 기본값 100으로 둔다. 50으로 한 판(2026-08-18, 사용자 5,000명 8분)을 돌렸는데
#   메모리가 안 줄고 CPU만 늘었다.
#     GOGC 50   traefik 파드별 봉우리 689MiB · 스로틀 12.51%
#     GOGC 100  같은 조건에서 다시 잰다 — 이 커밋이 그 판을 위한 것이다
#   힙이 GOMEMLIMIT 691MiB의 절반에도 안 닿아 GC가 쫓기지 않는 상태였고,
#   GOGC를 낮춰 GC를 앞당겨도 봉우리 RSS가 줄지 않았다. 대가인 CPU만 확인됐다.
# 앞뒤 연결 수를 직접 세려면 Traefik 자신의 메트릭이 필요하다. cAdvisor는 컨테이너 메모리만
# 알려 주고 그 메모리가 몇 개의 연결에서 왔는지는 모른다(traefik_open_connections).
#   addRoutersLabels는 기본 false로 둔다 — 라우터마다 시리즈가 갈려 개수가 크게 는다.
metrics:
  prometheus:
    service:
      enabled: true        # ServiceMonitor가 가리킬 대상
    # 차트는 ServiceMonitor를 만들기 전에 monitoring.coreos.com/v1 이 API 목록에 있는지 확인한다.
    # 클러스터에는 CRD가 있지만 helm template 단독 실행에는 API 목록이 없어 렌더가 그 자리에서 멈춘다.
    # 끄면 로컬에서도 렌더 결과를 확인할 수 있다.
    disableAPICheck: true
    serviceMonitor:
      enabled: true
      interval: 15s
    # 지연 히스토그램 버킷. 차트 기본값은 0.1·0.3·1.2·5.0 네 개다.
    #   queue 폴링 응답이 2-5ms라 네 버킷으로는 전부 첫 칸(le=0.1)에 들어가고,
    #   histogram_quantile은 첫 칸 안에서 선형보간을 하므로 p99가 실제 지연과 무관하게
    #   항상 0.099로 고정된다(실측: 3시간 70스텝 전부 0.0990).
    # 앱과 같은 눈금으로 맞춘다 — queue는 Go 클라이언트 기본 버킷(0.005부터 10까지 11개)을 쓴다.
    #   같은 눈금이라야 관문 p99와 앱 p99를 빼서 관문이 더한 지연을 읽을 수 있다.
    # 시리즈 증가: 버킷 4→11이라 traefik_*_request_duration_seconds_bucket이 약 2.4배가 된다
    #   (실측 135 → 약 324). 저장 시리즈 약 9만·상한 30만이라 여유 안에 든다.
    buckets: "0.005,0.01,0.025,0.05,0.1,0.25,0.5,1,2.5,5,10"
service:
  type: LoadBalancer
ingressClass:
  enabled: true
  isDefaultClass: true               # ingressClassName: traefik 를 기본으로
providers:
  kubernetesIngress:
    enabled: true
