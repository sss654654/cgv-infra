# argocd-image-updater 값 — 봇의 신원과 레지스트리 접속.
# 감시 대상·전략·되쓰기 방식은 여기가 아니라 applicationsets/apps.yaml의 annotation에 있다
# — 무엇을 감시할지는 각 App의 속성이라 App 정의 옆에 둔다.
config:
  log.level: info
  # 봇 커밋의 작성자. git 이력에서 사람 커밋과 작성자로 갈려 보인다 — 감사(audit)의 최소 단위.
  git.user: argocd-image-updater
  git.email: image-updater@cgv.lan
  registries:
    - name: gitlab
      prefix: 192.168.0.167:5050            # 이미지 이름의 앞부분과 글자까지 같아야 이 설정이 매칭된다
      api_url: http://192.168.0.167:5050
      # 평문 레지스트리 — 노드 registries.yaml·데스크탑 insecure-registries와 같은 결정의 세 번째 자리.
      # TLS는 이름(DNS)이 생기는 네트워크 재구성 편에서 셋을 함께 걷는다.
      insecure: true
      # read_registry 전용 deploy token(dockerconfigjson 봉인본). 노드 pull 자격과 주체가 달라 가른다.
      credentials: pullsecret:argocd/image-updater-registry

    # stg(EKS)가 이미지를 받아오는 곳. 이 항목은 stg Application이 생기기 전까지 아무도 부르지 않는다.
    - name: ecr
      prefix: 527170477076.dkr.ecr.ap-northeast-2.amazonaws.com
      api_url: https://527170477076.dkr.ecr.ap-northeast-2.amazonaws.com
      # ECR의 비밀번호는 12시간짜리 토큰이라 미리 만들어 둔 자격 파일로는 안 된다(위 gitlab과 갈리는 지점).
      # ext는 스크립트를 실행해 그 출력을 자격으로 쓴다 — 스크립트가 매번 새 토큰을 받아 온다.
      credentials: ext:/scripts/ecr-login.sh
      # 토큰 만료(12h) 전에 스크립트를 다시 부르게 하는 값. 여유를 두 시간 둔다.
      credsexpire: 10h

# 자원. 없으면 BestEffort 라 노드 메모리 압박 때 가장 먼저 쫓겨난다 — 그러면 새 이미지가 git 에
#   안 쓰여 배포 사이클이 조용히 멈춘다(ArgoCD 쪽은 Synced 그대로라 증상이 안 보인다).
#   14일 최대 working set 96-118Mi(파드 셋, 2026-09-11 Mimir 조회).
#   stg 를 켜면 폴링하는 레지스트리가 1 → 2(ECR), 대상 Application 이 3 → 6 이 되고,
#   ECR 토큰을 받는 aws CLI 가 이 컨테이너 안에서 10시간마다 뜬다. 그 몫을 limit 이 받는다.
resources:
  requests: { cpu: 10m, memory: 128Mi }
  limits:   { cpu: 200m, memory: 384Mi }

# ECR 자격. 액세스 키를 파드 환경변수로 넣는다 — 키 이름이 곧 환경변수 이름이라
# aws CLI가 그대로 집어 간다. 이 Secret은 SealedSecret(manifests/secrets/image-updater-ecr.yaml)에서 온다.
extraEnvFrom:
  - secretRef:
      name: image-updater-ecr

# 위 registries의 ext가 실행하는 스크립트. 차트가 ConfigMap으로 만들어 /scripts에 0777로 마운트한다.
# aws CLI는 이미지에 들어 있다(aws-cli 2.x). image-updater는 stdout의 "아이디:비밀번호" 한 줄을 읽는다.
# ECR은 아이디가 늘 AWS 고정이고 비밀번호 자리에 토큰이 들어간다.
authScripts:
  enabled: true
  scripts:
    ecr-login.sh: |
      #!/bin/sh
      set -e
      echo "AWS:$(aws ecr get-login-password --region ap-northeast-2)"

# 이 버전(v1.2)은 컨트롤러 방식이다 — ImageUpdater CR이 있어야 일을 시작한다.
# CR 없이는 annotation이 붙어 있어도 아무것도 처리하지 않는다(로그: "No ImageUpdater CRs to process").
# useAnnotations: 처리 대상 선정만 CR이 하고, 무엇을 어떻게 갱신할지는
#   각 Application의 argocd-image-updater.argoproj.io/* annotation에서 읽는다
#   (applicationsets/apps.yaml 템플릿에 있는 그것).
extraObjects:
  - apiVersion: argocd-image-updater.argoproj.io/v1alpha1
    kind: ImageUpdater
    metadata:
      name: dev-apps
      namespace: argocd
    spec:
      # namePattern 은 glob 이고 Application 이름과 맞춰야 한다.
      # 이름은 apps ApplicationSet 이 '{{.name}}-{{.env}}' 로 만든다 — 환경 접미사가 붙는다.
      # queue-* 로 넓히지 않는 이유: allow-tags 가 환경과 무관하게 같은 태그를 후보로 보므로,
      #   넓히면 stg Application 이 생기는 순간 봇이 dev 태그를 envs/stg 에도 써 넣는다.
      #   환경을 대상에 넣는 것이 사람이 한 줄 더하는 일로 남아야 승격이 걸음으로 성립한다.
      applicationRefs:
        - namePattern: queue-dev
          useAnnotations: true
        - namePattern: booking-dev
          useAnnotations: true
        - namePattern: frontend-dev
          useAnnotations: true
